<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-label="Fischer esterification: acetic acid + ethanol · Ethanol addition"><title>Fischer esterification: acetic acid + ethanol · Ethanol addition</title><desc>Exact selected teaching stage extracted from the complete original mechanism sheet.</desc><rect width="1200" height="360" fill="#fffefa"/><defs><marker id="pair" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L10 6L1 11" fill="none" stroke="#aa6a4e" stroke-width="1.7"/></marker></defs><g font-family="DejaVu Sans,Arial,sans-serif"><text x="32" y="43" font-size="25" fill="#203c43" font-weight="bold">Fischer esterification: acetic acid + ethanol · stage 2</text><text x="32" y="77" font-size="17" fill="#203c43" font-weight="normal">Focused stage from the complete pathway; see overview for continuity.</text><g transform="translate(0,-225)"><rect x="25" y="340" width="1150" height="216" rx="12" fill="#faf8f2"/><text x="45" y="371" font-size="19" fill="#203c43" font-weight="bold">02  Ethanol addition</text><text x="45" y="416" font-size="19" fill="#203c43" font-weight="normal">CH₃C(=OH⁺)OH + HOCH₂CH₃</text><text x="605" y="416" font-size="19" fill="#203c43" font-weight="normal">→  CH₃C(OH)(OH)(O⁺HCH₂CH₃)</text><text x="45" y="447" font-size="15" fill="#203c43" font-weight="normal">Tetrahedral oxonium: the incoming ethanol O now has three bonds and +1.</text><text x="51.0" y="483" font-size="13" fill="#203c43" font-weight="normal">n(ethanol O)</text><path d="M66.0 493 C95.0 504 141.0 505 159.0 520" fill="none" stroke="#aa6a4e" stroke-width="2.8" marker-end="url(#pair)"/><text x="139.0" y="542" font-size="13" fill="#203c43" font-weight="normal">acyl C</text><text x="596.0" y="483" font-size="13" fill="#203c43" font-weight="normal">π(C=O)</text><path d="M611.0 493 C640.0 504 686.0 505 704.0 520" fill="none" stroke="#aa6a4e" stroke-width="2.8" marker-end="url(#pair)"/><text x="684.0" y="542" font-size="13" fill="#203c43" font-weight="normal">original carbonyl O</text></g></g></svg>