<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 310" role="img" aria-label="proton-transfer"><rect width="100%" height="100%" fill="#fffefa"/><defs><marker id="pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e" stroke-width="1.5"/></marker><marker id="fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e" stroke-width="1.5"/></marker></defs><g font-family="DejaVu Sans,sans-serif" fill="#203c43"><text x="28" y="34" font-size="21">Acetic acid + cyanide: direct proton-transfer model</text><text x="62" y="130" font-size="24">⁻:C≡N</text><text x="285" y="130" font-size="24">H</text><text x="405" y="130" font-size="24">O</text><text x="486" y="130" font-size="24">C(=O)CH₃</text><path d="M310 121H399" fill="none" stroke="#203c43" stroke-width="2.3"/><path d="M430 121H481" fill="none" stroke="#203c43" stroke-width="2.3"/><path d="M84 108 C115 47 232 49 285 106" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#pair)"/><path d="M353 119 C369 67 410 72 418 104" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#pair)"/><text x="200" y="205" font-size="26">⇌  HCN + CH₃CO₂⁻</text><text x="28" y="272" font-size="17">Two electron pairs move. Charge: −1 on each side. Solvent relays are omitted.</text></g></svg>