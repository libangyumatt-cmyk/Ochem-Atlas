<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1310" role="img" aria-label="Fischer esterification: acetic acid + ethanol"><title>Fischer esterification: acetic acid + ethanol</title><desc>Complete teaching pathway, with charges and individual electron-pair moves explicitly traced in each row.</desc><rect width="1200" height="1310" fill="#fffefa"/><defs><marker id="pair" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L10 6L1 11" fill="none" stroke="#aa6a4e" stroke-width="1.7"/></marker></defs><g font-family="DejaVu Sans,Arial,sans-serif"><text x="32" y="43" font-size="26" fill="#203c43" font-weight="bold">Fischer esterification: acetic acid + ethanol</text><text x="32" y="77" font-size="21" fill="#203c43" font-weight="normal">CH₃CO₂H + HOCH₂CH₃ ⇌ CH₃CO₂CH₂CH₃ + H₂O  (H₃O⁺ catalyst)</text><rect x="25" y="115" width="1150" height="216" rx="12" fill="#f5f5ee"/><text x="45" y="146" font-size="19" fill="#203c43" font-weight="bold">01  Carbonyl O protonation</text><text x="45" y="191" font-size="19" fill="#203c43" font-weight="normal">CH₃C(=O)OH + H₃O⁺</text><text x="605" y="191" font-size="19" fill="#203c43" font-weight="normal">→  CH₃C(=OH⁺)OH + H₂O</text><text x="45" y="222" font-size="15" fill="#203c43" font-weight="normal">O of the original carbonyl carries +1; catalyst is temporarily consumed.</text><text x="51.0" y="258" font-size="13" fill="#203c43" font-weight="normal">n(carbonyl O)</text><path d="M66.0 268 C95.0 279 141.0 280 159.0 295" fill="none" stroke="#aa6a4e" stroke-width="2.8" marker-end="url(#pair)"/><text x="139.0" y="317" font-size="13" fill="#203c43" font-weight="normal">H of H₃O⁺</text><text x="596.0" y="258" font-size="13" fill="#203c43" font-weight="normal">O–H bond of H₃O⁺</text><path d="M611.0 268 C640.0 279 686.0 280 704.0 295" fill="none" stroke="#aa6a4e" stroke-width="2.8" marker-end="url(#pair)"/><text x="684.0" y="317" font-size="13" fill="#203c43" font-weight="normal">water O</text><rect x="25" y="340" width="1150" height="216" rx="12" fill="#faf8f2"/><text x="45" y="371" font-size="19" fill="#203c43" font-weight="bold">02  Ethanol addition</text><text x="45" y="416" font-size="19" fill="#203c43" font-weight="normal">CH₃C(=OH⁺)OH + HOCH₂CH₃</text><text x="605" y="416" font-size="19" fill="#203c43" font-weight="normal">→  CH₃C(OH)(OH)(O⁺HCH₂CH₃)</text><text x="45" y="447" font-size="15" fill="#203c43" font-weight="normal">Tetrahedral oxonium: the incoming ethanol O now has three bonds and +1.</text><text x="51.0" y="483" font-size="13" fill="#203c43" font-weight="normal">n(ethanol O)</text><path d="M66.0 493 C95.0 504 141.0 505 159.0 520" fill="none" stroke="#aa6a4e" stroke-width="2.8" marker-end="url(#pair)"/><text x="139.0" y="542" font-size="13" fill="#203c43" font-weight="normal">acyl C</text><text x="596.0" y="483" font-size="13" fill="#203c43" font-weight="normal">π(C=O)</text><path d="M611.0 493 C640.0 504 686.0 505 704.0 520" fill="none" stroke="#aa6a4e" stroke-width="2.8" marker-end="url(#pair)"/><text x="684.0" y="542" font-size="13" fill="#203c43" font-weight="normal">original carbonyl O</text><rect x="25" y="565" width="1150" height="216" rx="12" fill="#f5f5ee"/><text x="45" y="596" font-size="19" fill="#203c43" font-weight="bold">03  Solvent-mediated proton relay</text><text x="45" y="641" font-size="19" fill="#203c43" font-weight="normal">CH₃C(OH)(OH)(O⁺HCH₂CH₃)</text><text x="605" y="641" font-size="19" fill="#203c43" font-weight="normal">→  CH₃C(OH)(OH₂⁺)(OCH₂CH₃)</text><text x="45" y="672" font-size="15" fill="#203c43" font-weight="normal">Via CH₃C(OH)(OH)(OCH₂CH₃) + H₃O⁺; two transfers, net catalyst-neutral.</text><text x="51.0" y="708" font-size="13" fill="#203c43" font-weight="normal">n(H₂O)</text><path d="M66.0 718 C95.0 729 141.0 730 159.0 745" fill="none" stroke="#aa6a4e" stroke-width="2.8" marker-end="url(#pair)"/><text x="139.0" y="767" font-size="13" fill="#203c43" font-weight="normal">H on ethoxy O⁺</text><text x="323.5" y="708" font-size="13" fill="#203c43" font-weight="normal">O–H on ethoxy O⁺</text><path d="M338.5 718 C367.5 729 413.5 730 431.5 745" fill="none" stroke="#aa6a4e" stroke-width="2.8" marker-end="url(#pair)"/><text x="411.5" y="767" font-size="13" fill="#203c43" font-weight="normal">ethoxy O</text><text x="596.0" y="708" font-size="13" fill="#203c43" font-weight="normal">n(original acid OH)</text><path d="M611.0 718 C640.0 729 686.0 730 704.0 745" fill="none" stroke="#aa6a4e" stroke-width="2.8" marker-end="url(#pair)"/><text x="684.0" y="767" font-size="13" fill="#203c43" font-weight="normal">H of H₃O⁺</text><text x="868.5" y="708" font-size="13" fill="#203c43" font-weight="normal">O–H of H₃O⁺</text><path d="M883.5 718 C912.5 729 958.5 730 976.5 745" fill="none" stroke="#aa6a4e" stroke-width="2.8" marker-end="url(#pair)"/><text x="956.5" y="767" font-size="13" fill="#203c43" font-weight="normal">water O</text><rect x="25" y="790" width="1150" height="216" rx="12" fill="#faf8f2"/><text x="45" y="821" font-size="19" fill="#203c43" font-weight="bold">04  Tetrahedral collapse</text><text x="45" y="866" font-size="19" fill="#203c43" font-weight="normal">CH₃C(OH)(OH₂⁺)(OCH₂CH₃)</text><text x="605" y="866" font-size="19" fill="#203c43" font-weight="normal">→  CH₃C(=OH⁺)OCH₂CH₃ + H₂O</text><text x="45" y="897" font-size="15" fill="#203c43" font-weight="normal">Water leaves; the original carbonyl O forms the protonated ester carbonyl.</text><text x="51.0" y="933" font-size="13" fill="#203c43" font-weight="normal">n(original carbonyl OH)</text><path d="M66.0 943 C95.0 954 141.0 955 159.0 970" fill="none" stroke="#aa6a4e" stroke-width="2.8" marker-end="url(#pair)"/><text x="139.0" y="992" font-size="13" fill="#203c43" font-weight="normal">π(C=O)</text><text x="596.0" y="933" font-size="13" fill="#203c43" font-weight="normal">C–OH₂⁺ bond</text><path d="M611.0 943 C640.0 954 686.0 955 704.0 970" fill="none" stroke="#aa6a4e" stroke-width="2.8" marker-end="url(#pair)"/><text x="684.0" y="992" font-size="13" fill="#203c43" font-weight="normal">departing H₂O O</text><rect x="25" y="1015" width="1150" height="216" rx="12" fill="#f5f5ee"/><text x="45" y="1046" font-size="19" fill="#203c43" font-weight="bold">05  Deprotonation</text><text x="45" y="1091" font-size="19" fill="#203c43" font-weight="normal">CH₃C(=OH⁺)OCH₂CH₃ + H₂O</text><text x="605" y="1091" font-size="19" fill="#203c43" font-weight="normal">→  CH₃CO₂CH₂CH₃ + H₃O⁺</text><text x="45" y="1122" font-size="15" fill="#203c43" font-weight="normal">Hydronium is regenerated; net reaction loses one water molecule.</text><text x="51.0" y="1158" font-size="13" fill="#203c43" font-weight="normal">n(H₂O)</text><path d="M66.0 1168 C95.0 1179 141.0 1180 159.0 1195" fill="none" stroke="#aa6a4e" stroke-width="2.8" marker-end="url(#pair)"/><text x="139.0" y="1217" font-size="13" fill="#203c43" font-weight="normal">H on carbonyl O⁺</text><text x="596.0" y="1158" font-size="13" fill="#203c43" font-weight="normal">O–H on carbonyl O⁺</text><path d="M611.0 1168 C640.0 1179 686.0 1180 704.0 1195" fill="none" stroke="#aa6a4e" stroke-width="2.8" marker-end="url(#pair)"/><text x="684.0" y="1217" font-size="13" fill="#203c43" font-weight="normal">ester O</text><text x="39" y="1271" font-size="17" fill="#203c43" font-weight="normal">No stereogenic product center. The relay is grouped in the card, not a verified single elementary event.</text></g></svg>