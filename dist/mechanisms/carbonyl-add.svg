<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 455" role="img" aria-label="Exact generic carbonyl nucleophilic-addition event"><title>Exact generic carbonyl nucleophilic-addition event</title><desc>The local event ends at the alkoxide. Protonation is not part of this reaction equation.</desc><rect width="1200" height="455" fill="#fffefa"/><defs><marker id="pair" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L10 6L1 11" fill="none" stroke="#aa6a4e" stroke-width="1.7"/></marker></defs><g font-family="DejaVu Sans,Arial,sans-serif"><text x="36" y="44" font-size="26" fill="#203c43" font-weight="bold">Carbonyl addition: R₂C=O + Nu⁻ → R₂C(O⁻)Nu</text><text x="48" y="105" font-size="26" fill="#203c43" font-weight="normal">R</text><text x="48" y="292" font-size="26" fill="#203c43" font-weight="normal">R</text><text x="230" y="184" font-size="32" fill="#203c43" font-weight="normal">C</text><text x="248" y="73" font-size="30" fill="#203c43" font-weight="normal">O</text><path d="M73 114L222 169" stroke="#203c43" stroke-width="2.7" fill="none"/><path d="M72 279L222 190" stroke="#203c43" stroke-width="2.7" fill="none"/><path d="M245 158L259 89" stroke="#203c43" stroke-width="2.7" fill="none"/><path d="M255 159L269 90" stroke="#203c43" stroke-width="2.7" fill="none"/><text x="30" y="189" font-size="28" fill="#203c43" font-weight="normal">:Nu⁻</text><path d="M125 178 C142 99 194 112 228 159" fill="none" stroke="#aa6a4e" stroke-width="2.8" marker-end="url(#pair)"/><path d="M251 125 C191 67 200 42 244 63" fill="none" stroke="#aa6a4e" stroke-width="2.8" marker-end="url(#pair)"/><text x="437" y="184" font-size="42" fill="#203c43" font-weight="normal">→</text><text x="663" y="91" font-size="27" fill="#203c43" font-weight="normal">O⁻</text><text x="641" y="193" font-size="30" fill="#203c43" font-weight="normal">C</text><text x="489" y="155" font-size="25" fill="#203c43" font-weight="normal">R</text><text x="504" y="290" font-size="25" fill="#203c43" font-weight="normal">R</text><text x="771" y="178" font-size="27" fill="#203c43" font-weight="normal">Nu</text><path d="M656 162L668 107" stroke="#203c43" stroke-width="2.7" fill="none"/><path d="M634 177L519 153" stroke="#203c43" stroke-width="2.7" fill="none"/><path d="M636 207L531 270" stroke="#203c43" stroke-width="2.7" fill="none" stroke-dasharray="6 6"/><path d="M673 182L760 170" stroke="#203c43" stroke-width="5" fill="none"/><text x="45" y="358" font-size="20" fill="#203c43" font-weight="normal">Lone pair on Nu⁻ → carbonyl C; C=O π pair → O. Net charge stays −1.</text><text x="45" y="394" font-size="18" fill="#203c43" font-weight="normal">The carbonyl is planar; the new tetrahedral alkoxide has an unspecified face of attack.</text><text x="45" y="424" font-size="17" fill="#203c43" font-weight="normal">Solid wedge / dashed bond indicate depth; identical R groups make this schematic center achiral.</text></g></svg>