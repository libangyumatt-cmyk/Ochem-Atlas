<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" role="img"><title>Swern oxidation: Ylide-assisted carbonyl formation</title><desc>Ph–CH(O–S+(Me)–CH2−)–H → PhCHO + Me2S. The ylide carbon takes the carbinol H through a cyclic arrangement as C=O forms and O–S cleaves.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="swern-oxidation-5-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="swern-oxidation-5-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Swern oxidation · 5</text><text x="24" y="65" font-size="17">Ylide-assisted carbonyl formation</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">Ph–</text><text x="68.64" y="155" font-size="24.00">CH</text><text x="98.40" y="155" font-size="24.00">(</text><text x="113.28" y="155" font-size="24.00">O</text><text x="128.16" y="155" font-size="24.00">–</text><text x="143.04" y="155" font-size="24.00">S+</text><text x="172.80" y="155" font-size="24.00">(Me)–</text><text x="247.20" y="155" font-size="24.00">CH2−</text><text x="306.72" y="155" font-size="24.00">)–</text><text x="336.48" y="155" font-size="24.00">H</text><text x="665.00" y="155" font-size="24.00">PhCHO + Me2S</text><path data-electrons="2" d="M276.96,141.60 Q310.44,98.60 343.92,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#swern-oxidation-5-pair)"/><path data-electrons="2" d="M213.72,141.60 Q157.92,203.60 102.12,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#swern-oxidation-5-pair)"/><path data-electrons="2" d="M139.32,141.60 Q148.62,80.60 157.92,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#swern-oxidation-5-pair)"/><text x="24" y="235" font-size="16">The ylide carbon takes the carbinol H through a cyclic arrangement as C=O forms and O–S cleaves.</text></g></svg>