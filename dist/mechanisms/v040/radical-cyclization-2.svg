<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" role="img"><title>5-Hexenyl radical cyclization: Radical atom transfer</title><desc>Initiator R• + Bu3Sn–H → RH + Bu3Sn•. A radical abstracts H from the tin hydride to generate the tin-radical chain carrier.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="radical-cyclization-2-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="radical-cyclization-2-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">5-Hexenyl radical cyclization · 2</text><text x="24" y="65" font-size="17">Radical atom transfer</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">Initiator </text><text x="172.80" y="155" font-size="24.00">R•</text><text x="202.56" y="155" font-size="24.00"> + Bu3</text><text x="291.84" y="155" font-size="24.00">Sn</text><text x="321.60" y="155" font-size="24.00">–</text><text x="336.48" y="155" font-size="24.00">H</text><text x="665.00" y="155" font-size="24.00">RH + Bu3Sn•</text><path data-electrons="1" d="M187.68,141.60 Q226.74,98.60 265.80,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#radical-cyclization-2-fish)"/><path data-electrons="1" d="M325.32,141.60 Q295.56,203.60 265.80,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#radical-cyclization-2-fish)"/><path data-electrons="1" d="M325.32,141.60 Q316.02,80.60 306.72,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#radical-cyclization-2-fish)"/><text x="24" y="235" font-size="16">A radical abstracts H from the tin hydride to generate the tin-radical chain carrier.</text></g></svg>