<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" role="img"><title>Benzyne elimination–addition substitution: Proton transfer</title><desc>ring C(Br)=C(H)–CH=CH–CH=CH–(back) + :NH2− → ortho-bromophenyl anion + NH3. Amide removes an ortho proton in the elimination model.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="benzyne-substitution-1-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="benzyne-substitution-1-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Benzyne elimination–addition substitution · 1</text><text x="24" y="65" font-size="17">Proton transfer</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="19.97">ring C(Br)=</text><text x="160.19" y="155" font-size="19.97">C</text><text x="172.57" y="155" font-size="19.97">(</text><text x="184.95" y="155" font-size="19.97">H</text><text x="197.33" y="155" font-size="19.97">)–CH=CH–CH=CH–(back) + </text><text x="482.10" y="155" font-size="19.97">:NH2−</text><text x="665.00" y="155" font-size="24.00">ortho-bromophenyl anion + NH3</text><path data-electrons="2" d="M513.05,143.01 Q352.10,100.01 191.14,139.01" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#benzyne-substitution-1-pair)"/><path data-electrons="2" d="M178.76,143.01 Q172.57,205.01 166.38,139.01" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#benzyne-substitution-1-pair)"/><text x="24" y="235" font-size="16">Amide removes an ortho proton in the elimination model.</text></g></svg>