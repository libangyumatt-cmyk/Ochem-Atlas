<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1160"><title>Benzylic side-chain oxidation: complete teaching sequence</title><g transform="translate(0,0)"><title>Benzylic side-chain oxidation: Mechanistic boundary / grouped stage</title><desc>PhCH3 + manganese oxidant → Benzylic oxygenated/metal-bound intermediates. Benzylic C–H oxidation initiates a multistep redox network. No universally established free-radical-only sequence is asserted.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="benzylic-oxidation-1-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="benzylic-oxidation-1-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Benzylic side-chain oxidation · 1</text><text x="24" y="65" font-size="17">Mechanistic boundary / grouped stage</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">PhCH3 + manganese oxidant</text><text x="665.00" y="155" font-size="18.28">Benzylic oxygenated/metal-bound intermediates</text><text x="30" y="202" font-size="16">Process model: no unique microscopic electron-arrow sequence asserted.</text><text x="24" y="235" font-size="16">Benzylic C–H oxidation initiates a multistep redox network. No universally established free-radical-only sequence is asserted.</text></g></g><g transform="translate(0,290)"><title>Benzylic side-chain oxidation: Mechanistic boundary / grouped stage</title><desc>Benzylic oxygenated intermediates + oxidant → PhCHO / hydrated aldehyde-derived species. Successive oxidation raises the benzylic oxidation level; alcohol/aldehyde drawings denote functional-group stages rather than mandatory isolable intermediates.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="benzylic-oxidation-2-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="benzylic-oxidation-2-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Benzylic side-chain oxidation · 2</text><text x="24" y="65" font-size="17">Mechanistic boundary / grouped stage</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="19.50">Benzylic oxygenated intermediates + oxidant</text><text x="665.00" y="155" font-size="20.06">PhCHO / hydrated aldehyde-derived species</text><text x="30" y="202" font-size="16">Process model: no unique microscopic electron-arrow sequence asserted.</text><text x="24" y="235" font-size="16">Successive oxidation raises the benzylic oxidation level; alcohol/aldehyde drawings denote functional-group stages rather than</text><text x="24" y="258" font-size="16">mandatory isolable intermediates.</text></g></g><g transform="translate(0,580)"><title>Benzylic side-chain oxidation: Mechanistic boundary / grouped stage</title><desc>PhCHO-derived species + oxidant / water → PhCO2−. Further oxidation under basic conditions yields benzoate.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="benzylic-oxidation-3-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="benzylic-oxidation-3-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Benzylic side-chain oxidation · 3</text><text x="24" y="65" font-size="17">Mechanistic boundary / grouped stage</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="21.51">PhCHO-derived species + oxidant / water</text><text x="665.00" y="155" font-size="24.00">PhCO2−</text><text x="30" y="202" font-size="16">Process model: no unique microscopic electron-arrow sequence asserted.</text><text x="24" y="235" font-size="16">Further oxidation under basic conditions yields benzoate.</text></g></g><g transform="translate(0,870)"><title>Benzylic side-chain oxidation: Proton transfer</title><desc>PhCO2:− + H–OH2+ → PhCO2H + H2O. Acidic work-up protonates benzoate.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="benzylic-oxidation-4-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="benzylic-oxidation-4-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Benzylic side-chain oxidation · 4</text><text x="24" y="65" font-size="17">Proton transfer</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">PhCO2</text><text x="98.40" y="155" font-size="24.00">:−</text><text x="128.16" y="155" font-size="24.00"> + </text><text x="172.80" y="155" font-size="24.00">H</text><text x="187.68" y="155" font-size="24.00">–</text><text x="202.56" y="155" font-size="24.00">OH2+</text><text x="665.00" y="155" font-size="24.00">PhCO2H + H2O</text><path data-electrons="2" d="M113.28,141.60 Q146.76,98.60 180.24,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#benzylic-oxidation-4-pair)"/><path data-electrons="2" d="M206.28,141.60 Q219.30,203.60 232.32,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#benzylic-oxidation-4-pair)"/><text x="24" y="235" font-size="16">Acidic work-up protonates benzoate.</text></g></g></svg>