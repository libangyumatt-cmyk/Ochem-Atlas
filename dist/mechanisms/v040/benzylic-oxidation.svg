.22" y="266.40" font-size="16" text-anchor="middle" fill="#203c43">CH</text><rect x="154.12" y="220.34" width="20" height="20" fill="#fffefa"/><text x="164.12" y="235.34" font-size="16" text-anchor="middle" fill="#203c43">CH</text><rect x="143.34" y="138.51" width="20" height="20" fill="#fffefa"/><text x="153.34" y="153.51" font-size="16" text-anchor="middle" fill="#203c43">CH</text><rect x="209.51" y="89.60" width="20" height="20" fill="#fffefa"/><text x="219.51" y="104.60" font-size="16" text-anchor="middle" fill="#203c43">CH</text><rect x="282.66" y="127.97" width="20" height="20" fill="#fffefa"/><text x="292.66" y="142.97" font-size="16" text-anchor="middle" fill="#203c43">CH</text><path d="M1008.38,213.63 L954.41,228.36" stroke="#203c43" stroke-width="2" fill="none"/><path d="M1006.80,207.84 L952.83,222.58" stroke="#203c43" stroke-width="2" fill="none"/><path d="M953.62,225.47 L946.34,280.50" stroke="#203c43" stroke-width="2" fill="none"/><path d="M953.62,225.47 L908.98,187.20" stroke="#203c43" stroke-width="2" fill="none"/><path d="M908.58,190.18 L851.06,182.32" stroke="#203c43" stroke-width="2" fill="none"/><path d="M909.39,184.23 L851.88,176.37" stroke="#203c43" stroke-width="2" fill="none" stroke-dasharray="4 3"/><path d="M848.90,180.90 L819.84,132.85" stroke="#203c43" stroke-width="2" fill="none"/><path d="M854.04,177.79 L824.98,129.74" stroke="#203c43" stroke-width="2" fill="none" stroke-dasharray="4 3"/><path d="M819.78,129.85 L846.64,81.06" stroke="#203c43" stroke-width="2" fill="none"/><path d="M825.04,132.74 L851.90,83.95" stroke="#203c43" stroke-width="2" fill="none" stroke-dasharray="4 3"/><path d="M849.16,79.51 L904.42,77.50" stroke="#203c43" stroke-width="2" fill="none"/><path d="M849.38,85.50 L904.64,83.50" stroke="#203c43" stroke-width="2" fill="none" stroke-dasharray="4 3"/><path d="M907.32,79.40 L927.70,131.14" stroke="#203c43" stroke-width="2" fill="none"/><path d="M901.74,81.60 L922.12,133.33" stroke="#203c43" stroke-width="2" fill="none" stroke-dasharray="4 3"/><path d="M906.10,186.37 L922.03,131.40" stroke="#203c43" stroke-width="2" fill="none"/><path d="M911.87,188.04 L927.79,133.07" stroke="#203c43" stroke-width="2" fill="none" stroke-dasharray="4 3"/><rect x="1002.59" y="200.74" width="10" height="20" fill="#fffefa"/><text x="1007.59" y="215.74" font-size="16" text-anchor="middle" fill="#203c43">O</text><rect x="948.62" y="215.47" width="10" height="20" fill="#fffefa"/><text x="953.62" y="230.47" font-size="16" text-anchor="middle" fill="#203c43">C</text><rect x="936.34" y="270.50" width="20" height="20" fill="#fffefa"/><text x="946.34" y="285.50" font-size="16" text-anchor="middle" fill="#203c43">OH</text><rect x="903.98" y="177.20" width="10" height="20" fill="#fffefa"/><text x="908.98" y="192.20" font-size="16" text-anchor="middle" fill="#203c43">C</text><rect x="841.47" y="169.34" width="20" height="20" fill="#fffefa"/><text x="851.47" y="184.34" font-size="16" text-anchor="middle" fill="#203c43">CH</text><rect x="812.41" y="121.30" width="20" height="20" fill="#fffefa"/><text x="822.41" y="136.30" font-size="16" text-anchor="middle" fill="#203c43">CH</text><rect x="839.27" y="72.51" width="20" height="20" fill="#fffefa"/><text x="849.27" y="87.51" font-size="16" text-anchor="middle" fill="#203c43">CH</text><rect x="894.53" y="70.50" width="20" height="20" fill="#fffefa"/><text x="904.53" y="85.50" font-size="16" text-anchor="middle" fill="#203c43">CH</text><rect x="914.91" y="122.24" width="20" height="20" fill="#fffefa"/><text x="924.91" y="137.24" font-size="16" text-anchor="middle" fill="#203c43">CH</text><text x="580" y="180" font-size="32" fill="#203c43">→</text><text x="25" y="330" font-size="15" fill="#203c43">Representative substrate/product connectivity; other reagents/byproducts are in the equation. No computed geometry.</text></g><g transform="translate(0,350)"><title>Benzylic side-chain oxidation: Mechanistic boundary / grouped stage</title><desc>PhCH3 + manganese oxidant → Benzylic oxygenated/metal-bound intermediates. Benzylic C–H oxidation initiates a multistep redox network. No universally established free-radical-only sequence is asserted.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="benzylic-oxidation-1-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="benzylic-oxidation-1-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Benzylic side-chain oxidation · 1</text><text x="24" y="65" font-size="17">Mechanistic boundary / grouped stage</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">PhCH3 + manganese oxidant</text><text x="665.00" y="155" font-size="18.28">Benzylic oxygenated/metal-bound intermediates</text><text x="30" y="202" font-size="16">Process model: no unique microscopic electron-arrow sequence asserted.</text><text x="24" y="235" font-size="16">Benzylic C–H oxidation initiates a multistep redox network. No universally established free-radical-only</text><text x="24" y="258" font-size="16">sequence is asserted.</text></g></g><g transform="translate(0,640)"><title>Benzylic side-chain oxidation: Mechanistic boundary / grouped stage</title><desc>Benzylic oxygenated intermediates + oxidant → PhCHO / hydrated aldehyde-derived species. Successive oxidation raises the benzylic oxidation level; alcohol/aldehyde drawings denote functional-group stages rather than mandatory isolable intermediates.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="benzylic-oxidation-2-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="benzylic-oxidation-2-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Benzylic side-chain oxidation · 2</text><text x="24" y="65" font-size="17">Mechanistic boundary / grouped stage</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="19.50">Benzylic oxygenated intermediates + oxidant</text><text x="665.00" y="155" font-size="20.06">PhCHO / hydrated aldehyde-derived species</text><text x="30" y="202" font-size="16">Process model: no unique microscopic electron-arrow sequence asserted.</text><text x="24" y="235" font-size="16">Successive oxidation raises the benzylic oxidation level; alcohol/aldehyde drawings denote functional-group</text><text x="24" y="258" font-size="16">stages rather than mandatory isolable intermediates.</text></g></g><g transform="translate(0,930)"><title>Benzylic side-chain oxidation: Mechanistic boundary / grouped stage</title><desc>PhCHO-derived species + oxidant / water → PhCO2−. Further oxidation under basic conditions yields benzoate.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="benzylic-oxidation-3-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="benzylic-oxidation-3-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Benzylic side-chain oxidation · 3</text><text x="24" y="65" font-size="17">Mechanistic boundary / grouped stage</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="21.51">PhCHO-derived species + oxidant / water</text><text x="665.00" y="155" font-size="24.00">PhCO2−</text><text x="30" y="202" font-size="16">Process model: no unique microscopic electron-arrow sequence asserted.</text><text x="24" y="235" font-size="16">Further oxidation under basic conditions yields benzoate.</text></g></g><g transform="translate(0,1220)"><title>Benzylic side-chain oxidation: Proton transfer</title><desc>PhCO2:− + H–OH2+ → PhCO2H + H2O. Acidic work-up protonates benzoate.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="benzylic-oxidation-4-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="benzylic-oxidation-4-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Benzylic side-chain oxidation · 4</text><text x="24" y="65" font-size="17">Proton transfer</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">PhCO2</text><text x="98.40" y="155" font-size="24.00">:−</text><text x="128.16" y="155" font-size="24.00"> + </text><text x="172.80" y="155" font-size="24.00">H</text><text x="187.68" y="155" font-size="24.00">–</text><text x="202.56" y="155" font-size="24.00">OH2+</text><text x="665.00" y="155" font-size="24.00">PhCO2H + H2O</text><path data-electrons="2" d="M113.28,141.60 Q146.76,98.60 180.24,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#benzylic-oxidation-4-pair)"/><path data-electrons="2" d="M206.28,141.60 Q219.30,203.60 232.32,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#benzylic-oxidation-4-pair)"/><text x="24" y="235" font-size="16">Acidic work-up protonates benzoate.</text></g></g></svg>