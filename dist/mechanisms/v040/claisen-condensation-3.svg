<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" role="img"><title>Claisen ester condensation: Tetrahedral intermediate collapse</title><desc>EtO2CCH2–C(O−)(CH3)–OEt → EtO2CCH2COCH3 + EtO−. Tetrahedral collapse expels ethoxide and forms the beta-keto ester.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="claisen-condensation-3-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="claisen-condensation-3-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Claisen ester condensation · 3</text><text x="24" y="65" font-size="17">Tetrahedral intermediate collapse</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">EtO2CCH2–</text><text x="157.92" y="155" font-size="24.00">C</text><text x="172.80" y="155" font-size="24.00">(</text><text x="187.68" y="155" font-size="24.00">O−</text><text x="217.44" y="155" font-size="24.00">)(CH3)–</text><text x="321.60" y="155" font-size="24.00">OEt</text><text x="665.00" y="155" font-size="24.00">EtO2CCH2COCH3 + EtO−</text><path data-electrons="2" d="M202.56,141.60 Q193.26,98.60 183.96,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#claisen-condensation-3-pair)"/><path data-electrons="2" d="M254.64,141.60 Q299.28,203.60 343.92,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#claisen-condensation-3-pair)"/><text x="24" y="235" font-size="16">Tetrahedral collapse expels ethoxide and forms the beta-keto ester.</text></g></svg>