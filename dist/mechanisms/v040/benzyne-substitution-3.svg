<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" role="img"><title>Benzyne elimination–addition substitution: Coupled polar bond reorganization</title><desc>Benzyne C≡C + :NH2− → Aminophenyl carbanion. Amide adds to one aryne carbon; the in-plane pi pair moves to the neighboring carbon.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="benzyne-substitution-3-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="benzyne-substitution-3-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Benzyne elimination–addition substitution · 3</text><text x="24" y="65" font-size="17">Coupled polar bond reorganization</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">Benzyne </text><text x="143.04" y="155" font-size="24.00">C</text><text x="157.92" y="155" font-size="24.00">≡</text><text x="172.80" y="155" font-size="24.00">C</text><text x="187.68" y="155" font-size="24.00"> + </text><text x="232.32" y="155" font-size="24.00">:NH2−</text><text x="665.00" y="155" font-size="24.00">Aminophenyl carbanion</text><path data-electrons="2" d="M269.52,141.60 Q210.00,98.60 150.48,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#benzyne-substitution-3-pair)"/><path data-electrons="2" d="M165.36,141.60 Q172.80,203.60 180.24,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#benzyne-substitution-3-pair)"/><text x="24" y="235" font-size="16">Amide adds to one aryne carbon; the in-plane pi pair moves to the neighboring carbon.</text></g></svg>