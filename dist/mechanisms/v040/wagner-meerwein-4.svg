<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" role="img"><title>Wagner–Meerwein skeletal rearrangement: Coupled polar bond reorganization</title><desc>Me2C(H)–C+Me2 + :OH2 → Me2C=CMe2 + H3O+. Loss of the remaining adjacent H creates the most substituted alkene model.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="wagner-meerwein-4-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="wagner-meerwein-4-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Wagner–Meerwein skeletal rearrangement · 4</text><text x="24" y="65" font-size="17">Coupled polar bond reorganization</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">Me2</text><text x="68.64" y="155" font-size="24.00">C</text><text x="83.52" y="155" font-size="24.00">(</text><text x="98.40" y="155" font-size="24.00">H</text><text x="113.28" y="155" font-size="24.00">)–</text><text x="143.04" y="155" font-size="24.00">C+</text><text x="172.80" y="155" font-size="24.00">Me2 + </text><text x="262.08" y="155" font-size="24.00">:OH2</text><text x="665.00" y="155" font-size="24.00">Me2C=CMe2 + H3O+</text><path data-electrons="2" d="M291.84,141.60 Q198.84,98.60 105.84,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#wagner-meerwein-4-pair)"/><path data-electrons="2" d="M90.96,141.60 Q103.98,203.60 117.00,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#wagner-meerwein-4-pair)"/><text x="24" y="235" font-size="16">Loss of the remaining adjacent H creates the most substituted alkene model.</text></g></svg>