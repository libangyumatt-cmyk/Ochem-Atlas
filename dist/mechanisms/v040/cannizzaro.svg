ht="20" fill="#fffefa"/><text x="831.07" y="158.78" font-size="16" text-anchor="middle" fill="#203c43">OH</text><rect x="847.79" y="132.14" width="30" height="20" fill="#fffefa"/><text x="862.79" y="147.14" font-size="16" text-anchor="middle" fill="#203c43">CH2</text><rect x="891.70" y="121.16" width="10" height="20" fill="#fffefa"/><text x="896.70" y="136.16" font-size="16" text-anchor="middle" fill="#203c43">C</text><rect x="890.17" y="87.02" width="20" height="20" fill="#fffefa"/><text x="900.17" y="102.02" font-size="16" text-anchor="middle" fill="#203c43">CH</text><rect x="919.87" y="70.50" width="20" height="20" fill="#fffefa"/><text x="929.87" y="85.50" font-size="16" text-anchor="middle" fill="#203c43">CH</text><rect x="951.81" y="81.89" width="20" height="20" fill="#fffefa"/><text x="961.81" y="96.89" font-size="16" text-anchor="middle" fill="#203c43">CH</text><rect x="954.50" y="115.19" width="20" height="20" fill="#fffefa"/><text x="964.50" y="130.19" font-size="16" text-anchor="middle" fill="#203c43">CH</text><rect x="922.06" y="127.31" width="20" height="20" fill="#fffefa"/><text x="932.06" y="142.31" font-size="16" text-anchor="middle" fill="#203c43">CH</text><text x="580" y="180" font-size="32" fill="#203c43">→</text><text x="25" y="330" font-size="15" fill="#203c43">Representative substrate/product connectivity; other reagents/byproducts are in the equation. No computed geometry.</text></g><g transform="translate(0,350)"><title>Cannizzaro disproportionation: Nucleophilic carbonyl addition</title><desc>Ph–CH=O + :OH− → PhCH(OH)O−. Hydroxide adds to one aldehyde.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="cannizzaro-1-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="cannizzaro-1-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Cannizzaro disproportionation · 1</text><text x="24" y="65" font-size="17">Nucleophilic carbonyl addition</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">Ph–</text><text x="68.64" y="155" font-size="24.00">CH</text><text x="98.40" y="155" font-size="24.00">=</text><text x="113.28" y="155" font-size="24.00">O</text><text x="128.16" y="155" font-size="24.00"> + </text><text x="172.80" y="155" font-size="24.00">:OH−</text><text x="665.00" y="155" font-size="24.00">PhCH(OH)O−</text><path data-electrons="2" d="M202.56,141.60 Q143.04,98.60 83.52,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#cannizzaro-1-pair)"/><path data-electrons="2" d="M102.12,141.60 Q111.42,203.60 120.72,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#cannizzaro-1-pair)"/><text x="24" y="235" font-size="16">Hydroxide adds to one aldehyde.</text></g></g><g transform="translate(0,640)"><title>Cannizzaro disproportionation: Intermolecular hydride transfer</title><desc>Ph–C(O−)(OH)–H + Ph–CH=O → PhCO2H + PhCH2O−. Hydride transfers directly from the tetrahedral donor carbon to a second carbonyl as donor O reforms C=O and acceptor pi electrons move to O. Free H− is not released.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="cannizzaro-2-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="cannizzaro-2-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Cannizzaro disproportionation · 2</text><text x="24" y="65" font-size="17">Intermolecular hydride transfer</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">Ph–</text><text x="68.64" y="155" font-size="24.00">C</text><text x="83.52" y="155" font-size="24.00">(</text><text x="98.40" y="155" font-size="24.00">O−</text><text x="128.16" y="155" font-size="24.00">)(OH)–</text><text x="217.44" y="155" font-size="24.00">H</text><text x="232.32" y="155" font-size="24.00"> + Ph–</text><text x="321.60" y="155" font-size="24.00">CH</text><text x="351.36" y="155" font-size="24.00">=</text><text x="366.24" y="155" font-size="24.00">O</text><text x="665.00" y="155" font-size="24.00">PhCO2H + PhCH2O−</text><path data-electrons="2" d="M113.28,141.60 Q103.98,98.60 94.68,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#cannizzaro-2-pair)"/><path data-electrons="2" d="M150.48,141.60 Q243.48,203.60 336.48,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#cannizzaro-2-pair)"/><path data-electrons="2" d="M355.08,141.60 Q364.38,80.60 373.68,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#cannizzaro-2-pair)"/><text x="24" y="235" font-size="16">Hydride transfers directly from the tetrahedral donor carbon to a second carbonyl as donor O reforms C=O and</text><text x="24" y="258" font-size="16">acceptor pi electrons move to O. Free H− is not released.</text></g></g><g transform="translate(0,930)"><title>Cannizzaro disproportionation: Proton transfer</title><desc>PhCO2–H + PhCH2O− → PhCO2− + PhCH2OH. Acid–base transfer gives the carboxylate and alcohol under the basic conditions.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="cannizzaro-3-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="cannizzaro-3-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Cannizzaro disproportionation · 3</text><text x="24" y="65" font-size="17">Proton transfer</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">PhCO2–</text><text x="113.28" y="155" font-size="24.00">H</text><text x="128.16" y="155" font-size="24.00"> + PhCH2</text><text x="247.20" y="155" font-size="24.00">O−</text><text x="665.00" y="155" font-size="24.00">PhCO2− + PhCH2OH</text><path data-electrons="2" d="M262.08,141.60 Q191.40,98.60 120.72,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#cannizzaro-3-pair)"/><text x="24" y="235" font-size="16">Acid–base transfer gives the carboxylate and alcohol under the basic conditions.</text></g></g></svg>