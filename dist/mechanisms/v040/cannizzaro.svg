<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 870"><title>Cannizzaro disproportionation: complete teaching sequence</title><g transform="translate(0,0)"><title>Cannizzaro disproportionation: Nucleophilic carbonyl addition</title><desc>Ph–CH=O + :OH− → PhCH(OH)O−. Hydroxide adds to one aldehyde.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="cannizzaro-1-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="cannizzaro-1-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Cannizzaro disproportionation · 1</text><text x="24" y="65" font-size="17">Nucleophilic carbonyl addition</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">Ph–</text><text x="68.64" y="155" font-size="24.00">CH</text><text x="98.40" y="155" font-size="24.00">=</text><text x="113.28" y="155" font-size="24.00">O</text><text x="128.16" y="155" font-size="24.00"> + </text><text x="172.80" y="155" font-size="24.00">:OH−</text><text x="665.00" y="155" font-size="24.00">PhCH(OH)O−</text><path data-electrons="2" d="M202.56,141.60 Q143.04,98.60 83.52,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#cannizzaro-1-pair)"/><path data-electrons="2" d="M102.12,141.60 Q111.42,203.60 120.72,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#cannizzaro-1-pair)"/><text x="24" y="235" font-size="16">Hydroxide adds to one aldehyde.</text></g></g><g transform="translate(0,290)"><title>Cannizzaro disproportionation: Intermolecular hydride transfer</title><desc>Ph–C(O−)(OH)–H + Ph–CH=O → PhCO2H + PhCH2O−. Hydride transfers directly from the tetrahedral donor carbon to a second carbonyl as donor O reforms C=O and acceptor pi electrons move to O. Free H− is not released.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="cannizzaro-2-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="cannizzaro-2-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Cannizzaro disproportionation · 2</text><text x="24" y="65" font-size="17">Intermolecular hydride transfer</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">Ph–</text><text x="68.64" y="155" font-size="24.00">C</text><text x="83.52" y="155" font-size="24.00">(</text><text x="98.40" y="155" font-size="24.00">O−</text><text x="128.16" y="155" font-size="24.00">)(OH)–</text><text x="217.44" y="155" font-size="24.00">H</text><text x="232.32" y="155" font-size="24.00"> + Ph–</text><text x="321.60" y="155" font-size="24.00">CH</text><text x="351.36" y="155" font-size="24.00">=</text><text x="366.24" y="155" font-size="24.00">O</text><text x="665.00" y="155" font-size="24.00">PhCO2H + PhCH2O−</text><path data-electrons="2" d="M113.28,141.60 Q103.98,98.60 94.68,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#cannizzaro-2-pair)"/><path data-electrons="2" d="M150.48,141.60 Q243.48,203.60 336.48,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#cannizzaro-2-pair)"/><path data-electrons="2" d="M355.08,141.60 Q364.38,80.60 373.68,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#cannizzaro-2-pair)"/><text x="24" y="235" font-size="16">Hydride transfers directly from the tetrahedral donor carbon to a second carbonyl as donor O reforms C=O and acceptor pi electrons</text><text x="24" y="258" font-size="16">move to O. Free H− is not released.</text></g></g><g transform="translate(0,580)"><title>Cannizzaro disproportionation: Proton transfer</title><desc>PhCO2–H + PhCH2O− → PhCO2− + PhCH2OH. Acid–base transfer gives the carboxylate and alcohol under the basic conditions.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="cannizzaro-3-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="cannizzaro-3-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Cannizzaro disproportionation · 3</text><text x="24" y="65" font-size="17">Proton transfer</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">PhCO2–</text><text x="113.28" y="155" font-size="24.00">H</text><text x="128.16" y="155" font-size="24.00"> + PhCH2</text><text x="247.20" y="155" font-size="24.00">O−</text><text x="665.00" y="155" font-size="24.00">PhCO2− + PhCH2OH</text><path data-electrons="2" d="M262.08,141.60 Q191.40,98.60 120.72,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#cannizzaro-3-pair)"/><text x="24" y="235" font-size="16">Acid–base transfer gives the carboxylate and alcohol under the basic conditions.</text></g></g></svg>