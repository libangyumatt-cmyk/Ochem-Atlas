3c43">CH2</text><rect x="789.72" y="82.72" width="30" height="20" fill="#fffefa"/><text x="804.72" y="97.72" font-size="16" text-anchor="middle" fill="#203c43">CH2</text><rect x="844.61" y="70.50" width="30" height="20" fill="#fffefa"/><text x="859.61" y="85.50" font-size="16" text-anchor="middle" fill="#203c43">CH2</text><rect x="886.16" y="119.18" width="10" height="20" fill="#fffefa"/><text x="891.16" y="134.18" font-size="16" text-anchor="middle" fill="#203c43">C</text><rect x="939.99" y="97.54" width="10" height="20" fill="#fffefa"/><text x="944.99" y="112.54" font-size="16" text-anchor="middle" fill="#203c43">O</text><text x="580" y="180" font-size="32" fill="#203c43">→</text><text x="25" y="330" font-size="15" fill="#203c43">Representative substrate/product connectivity; other reagents/byproducts are in the equation. No computed geometry.</text></g><g transform="translate(0,350)"><title>Dieckmann cyclization: Proton transfer</title><desc>EtO2C–CH(H)–(CH2)3–CO2Et + :OEt− → Diester carbon enolate + EtOH. Base removes an alpha proton from one ester end; the remaining chain is retained.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="dieckmann-1-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="dieckmann-1-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Dieckmann cyclization · 1</text><text x="24" y="65" font-size="17">Proton transfer</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">EtO2C–</text><text x="113.28" y="155" font-size="24.00">CH</text><text x="143.04" y="155" font-size="24.00">(</text><text x="157.92" y="155" font-size="24.00">H</text><text x="172.80" y="155" font-size="24.00">)–(CH2)3–CO2Et + </text><text x="425.76" y="155" font-size="24.00">:OEt−</text><text x="665.00" y="155" font-size="24.00">Diester carbon enolate + EtOH</text><path data-electrons="2" d="M462.96,141.60 Q314.16,98.60 165.36,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#dieckmann-1-pair)"/><path data-electrons="2" d="M146.76,141.60 Q137.46,203.60 128.16,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#dieckmann-1-pair)"/><text x="24" y="235" font-size="16">Base removes an alpha proton from one ester end; the remaining chain is retained.</text></g></g><g transform="translate(0,640)"><title>Dieckmann cyclization: Nucleophilic carbonyl addition</title><desc>EtO2C–CH−–(CH2)3–C(=O)OEt → Ring C(O−)(OEt)–CH(CO2Et)–CH2–CH2–CH2–(back). Intramolecular enolate attack on the other ester closes a five-membered ring.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="dieckmann-2-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="dieckmann-2-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Dieckmann cyclization · 2</text><text x="24" y="65" font-size="17">Nucleophilic carbonyl addition</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">EtO2C–</text><text x="113.28" y="155" font-size="24.00">CH−</text><text x="157.92" y="155" font-size="24.00">–(CH2)3–</text><text x="276.96" y="155" font-size="24.00">C</text><text x="291.84" y="155" font-size="24.00">(=</text><text x="321.60" y="155" font-size="24.00">O</text><text x="336.48" y="155" font-size="24.00">)OEt</text><text x="665.00" y="155" font-size="18.70">Ring C(O−)(OEt)–CH(CO2Et)–CH2–CH2–CH2–(back)</text><path data-electrons="2" d="M135.60,141.60 Q210.00,98.60 284.40,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#dieckmann-2-pair)"/><path data-electrons="2" d="M306.72,141.60 Q317.88,203.60 329.04,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#dieckmann-2-pair)"/><text x="24" y="235" font-size="16">Intramolecular enolate attack on the other ester closes a five-membered ring.</text></g></g><g transform="translate(0,930)"><title>Dieckmann cyclization: Tetrahedral intermediate collapse</title><desc>Ring C(O−)(OEt)–CH(CO2Et)–(CH2)3–(back) → Ring C(=O)–CH(CO2Et)–(CH2)3–(back) + EtO−. O reforms carbonyl and ethoxide departs.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="dieckmann-3-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="dieckmann-3-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Dieckmann cyclization · 3</text><text x="24" y="65" font-size="17">Tetrahedral intermediate collapse</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="21.51">Ring </text><text x="90.67" y="155" font-size="21.51">C</text><text x="104.00" y="155" font-size="21.51">(</text><text x="117.33" y="155" font-size="21.51">O−</text><text x="144.00" y="155" font-size="21.51">)(</text><text x="170.67" y="155" font-size="21.51">OEt</text><text x="210.67" y="155" font-size="21.51">)–CH(CO2Et)–(CH2)3–(back)</text><text x="665.00" y="155" font-size="20.06">Ring C(=O)–CH(CO2Et)–(CH2)3–(back) + EtO−</text><path data-electrons="2" d="M130.67,142.47 Q122.33,99.47 114.00,138.47" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#dieckmann-3-pair)"/><path data-electrons="2" d="M144.00,142.47 Q167.33,204.47 190.67,138.47" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#dieckmann-3-pair)"/><text x="24" y="235" font-size="16">O reforms carbonyl and ethoxide departs.</text></g></g><g transform="translate(0,1220)"><title>Dieckmann cyclization: Proton transfer</title><desc>Cyclic beta-keto ester + EtO− → Cyclic beta-keto-ester enolate + EtOH. Deprotonation between the two carbonyl groups drives condensation.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="dieckmann-4-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="dieckmann-4-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Dieckmann cyclization · 4</text><text x="24" y="65" font-size="17">Proton transfer</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">Cyclic beta-keto ester + EtO−</text><text x="665.00" y="155" font-size="22.23">Cyclic beta-keto-ester enolate + EtOH</text><text x="30" y="202" font-size="16">Condensed structural stage; electron changes are specified below.</text><text x="24" y="235" font-size="16">Deprotonation between the two carbonyl groups drives condensation.</text></g></g><g transform="translate(0,1510)"><title>Dieckmann cyclization: Proton transfer</title><desc>Cyclic enolate + H3O+ → Ethyl 2-oxocyclopentane-1-carboxylate + H2O. Acidic work-up releases the neutral beta-keto ester.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="dieckmann-5-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="dieckmann-5-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Dieckmann cyclization · 5</text><text x="24" y="65" font-size="17">Proton transfer</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">Cyclic enolate + H3O+</text><text x="665.00" y="155" font-size="19.13">Ethyl 2-oxocyclopentane-1-carboxylate + H2O</text><text x="30" y="202" font-size="16">Condensed structural stage; electron changes are specified below.</text><text x="24" y="235" font-size="16">Acidic work-up releases the neutral beta-keto ester.</text></g></g></svg>