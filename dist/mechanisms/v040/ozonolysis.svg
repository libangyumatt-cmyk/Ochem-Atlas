<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1510"><title>Reductive ozonolysis: complete teaching sequence</title><g font-family="DejaVu Sans,sans-serif"><rect width="1200" height="350" fill="#fffefa"/><text x="25" y="32" font-size="21" fill="#203c43">Reductive ozonolysis · representative molecular graphs</text><path d="M346.07,251.57 L266.46,246.18" stroke="#203c43" stroke-width="2" fill="none"/><path d="M264.34,248.30 L207.20,191.16" stroke="#203c43" stroke-width="2" fill="none"/><path d="M268.59,244.05 L211.45,186.91" stroke="#203c43" stroke-width="2" fill="none"/><path d="M209.32,189.04 L203.93,109.43" stroke="#203c43" stroke-width="2" fill="none"/><rect x="331.07" y="241.57" width="30" height="20" fill="#fffefa"/><text x="346.07" y="256.57" font-size="16" text-anchor="middle" fill="#203c43">CH3</text><rect x="256.46" y="236.18" width="20" height="20" fill="#fffefa"/><text x="266.46" y="251.18" font-size="16" text-anchor="middle" fill="#203c43">CH</text><rect x="199.32" y="179.04" width="20" height="20" fill="#fffefa"/><text x="209.32" y="194.04" font-size="16" text-anchor="middle" fill="#203c43">CH</text><rect x="188.93" y="99.43" width="30" height="20" fill="#fffefa"/><text x="203.93" y="114.43" font-size="16" text-anchor="middle" fill="#203c43">CH3</text><path d="M1006.20,222.54 L958.77,256.32" stroke="#203c43" stroke-width="2" fill="none"/><path d="M960.02,259.05 L907.05,283.23" stroke="#203c43" stroke-width="2" fill="none"/><path d="M957.53,253.59 L904.56,277.77" stroke="#203c43" stroke-width="2" fill="none"/><path d="M823.80,138.46 L871.23,104.68" stroke="#203c43" stroke-width="2" fill="none"/><path d="M869.98,101.95 L922.95,77.77" stroke="#203c43" stroke-width="2" fill="none"/><path d="M872.47,107.41 L925.44,83.23" stroke="#203c43" stroke-width="2" fill="none"/><rect x="991.20" y="212.54" width="30" height="20" fill="#fffefa"/><text x="1006.20" y="227.54" font-size="16" text-anchor="middle" fill="#203c43">CH3</text><rect x="948.77" y="246.32" width="20" height="20" fill="#fffefa"/><text x="958.77" y="261.32" font-size="16" text-anchor="middle" fill="#203c43">CH</text><rect x="900.81" y="270.50" width="10" height="20" fill="#fffefa"/><text x="905.81" y="285.50" font-size="16" text-anchor="middle" fill="#203c43">O</text><rect x="808.80" y="128.46" width="30" height="20" fill="#fffefa"/><text x="823.80" y="143.46" font-size="16" text-anchor="middle" fill="#203c43">CH3</text><rect x="861.23" y="94.68" width="20" height="20" fill="#fffefa"/><text x="871.23" y="109.68" font-size="16" text-anchor="middle" fill="#203c43">CH</text><rect x="919.19" y="70.50" width="10" height="20" fill="#fffefa"/><text x="924.19" y="85.50" font-size="16" text-anchor="middle" fill="#203c43">O</text><text x="580" y="180" font-size="32" fill="#203c43">→</text><text x="25" y="330" font-size="15" fill="#203c43">Representative substrate/product connectivity; other reagents/byproducts are in the equation. No computed geometry.</text></g><g transform="translate(0,350)"><title>Reductive ozonolysis: Primary ozonide formation</title><desc>CH3–CH=CH–CH3 + O=O+–O− → Five-membered primary ozonide (molozonide). A concerted 1,3-dipolar addition joins ozone to both alkene carbons; ozone resonance forms are not separate species.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="ozonolysis-1-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="ozonolysis-1-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Reductive ozonolysis · 1</text><text x="24" y="65" font-size="17">Primary ozonide formation</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">CH3–</text><text x="83.52" y="155" font-size="24.00">CH</text><text x="113.28" y="155" font-size="24.00">=</text><text x="128.16" y="155" font-size="24.00">CH</text><text x="157.92" y="155" font-size="24.00">–CH3 + </text><text x="262.08" y="155" font-size="24.00">O</text><text x="276.96" y="155" font-size="24.00">=</text><text x="291.84" y="155" font-size="24.00">O+</text><text x="321.60" y="155" font-size="24.00">–</text><text x="336.48" y="155" font-size="24.00">O−</text><text x="665.00" y="155" font-size="19.59">Five-membered primary ozonide (molozonide)</text><path data-electrons="2" d="M120.72,141.60 Q152.34,98.60 183.96,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#ozonolysis-1-pair)"/><path data-electrons="2" d="M288.12,141.60 Q297.42,203.60 306.72,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#ozonolysis-1-pair)"/><path data-electrons="2" d="M351.36,141.60 Q247.20,80.60 143.04,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#ozonolysis-1-pair)"/><text x="24" y="235" font-size="16">A concerted 1,3-dipolar addition joins ozone to both alkene carbons; ozone resonance forms are not separate</text><text x="24" y="258" font-size="16">species.</text></g></g><g transform="translate(0,640)"><title>Reductive ozonolysis: Molozonide cycloreversion</title><desc>ring Me–CH–CH(Me)–O–O–O–(back to a) → MeCH=O + MeCH=O+–O−. Cycloreversion fragments the unstable primary ozonide into a carbonyl compound and a carbonyl oxide; no free alkene-carbon cation is proposed.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="ozonolysis-2-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="ozonolysis-2-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Reductive ozonolysis · 2</text><text x="24" y="65" font-size="17">Molozonide cycloreversion</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="23.96">ring Me–</text><text x="142.86" y="155" font-size="23.96">CH</text><text x="172.57" y="155" font-size="23.96">–</text><text x="187.43" y="155" font-size="23.96">CH</text><text x="217.14" y="155" font-size="23.96">(Me)–</text><text x="291.43" y="155" font-size="23.96">O</text><text x="306.29" y="155" font-size="23.96">–</text><text x="321.14" y="155" font-size="23.96">O</text><text x="336.00" y="155" font-size="23.96">–</text><text x="350.86" y="155" font-size="23.96">O</text><text x="365.71" y="155" font-size="23.96">–(back to a)</text><text x="665.00" y="155" font-size="24.00">MeCH=O + MeCH=O+–O−</text><path data-electrons="2" d="M180.00,141.61 Q219.00,98.61 258.00,137.61" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#ozonolysis-2-pair)"/><path data-electrons="2" d="M343.43,141.61 Q336.00,203.61 328.57,137.61" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#ozonolysis-2-pair)"/><path data-electrons="2" d="M298.86,141.61 Q274.71,80.61 250.57,137.61" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#ozonolysis-2-pair)"/><text x="24" y="235" font-size="16">Cycloreversion fragments the unstable primary ozonide into a carbonyl compound and a carbonyl oxide; no free</text><text x="24" y="258" font-size="16">alkene-carbon cation is proposed.</text></g></g><g transform="translate(0,930)"><title>Reductive ozonolysis: Secondary ozonide formation</title><desc>Me–CH=O + Me–CH=O+–O− → Secondary ozonide: ring MeCH–O–CH(Me)–O–O–(back). Carbonyl oxide and carbonyl recombine by a cycloaddition model to the secondary ozonide.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="ozonolysis-3-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="ozonolysis-3-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Reductive ozonolysis · 3</text><text x="24" y="65" font-size="17">Secondary ozonide formation</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">Me–</text><text x="68.64" y="155" font-size="24.00">CH</text><text x="98.40" y="155" font-size="24.00">=</text><text x="113.28" y="155" font-size="24.00">O</text><text x="128.16" y="155" font-size="24.00"> + Me–</text><text x="217.44" y="155" font-size="24.00">CH</text><text x="247.20" y="155" font-size="24.00">=</text><text x="262.08" y="155" font-size="24.00">O+</text><text x="291.84" y="155" font-size="24.00">–</text><text x="306.72" y="155" font-size="24.00">O−</text><text x="665.00" y="155" font-size="17.14">Secondary ozonide: ring MeCH–O–CH(Me)–O–O–(back)</text><path data-electrons="2" d="M321.60,141.60 Q202.56,98.60 83.52,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#ozonolysis-3-pair)"/><path data-electrons="2" d="M102.12,141.60 Q139.32,203.60 176.52,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#ozonolysis-3-pair)"/><path data-electrons="2" d="M254.64,141.60 Q265.80,80.60 276.96,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#ozonolysis-3-pair)"/><text x="24" y="235" font-size="16">Carbonyl oxide and carbonyl recombine by a cycloaddition model to the secondary ozonide.</text></g></g><g transform="translate(0,1220)"><title>Reductive ozonolysis: Mechanistic boundary / grouped stage</title><desc>Secondary ozonide + Me2S → 2 CH3CHO + Me2SO. Reductive peroxide-bond cleavage and fragmentation release carbonyl products. The reagent-specific reduction is a grouped work-up, not a pericyclic elementary event.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="ozonolysis-4-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="ozonolysis-4-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Reductive ozonolysis · 4</text><text x="24" y="65" font-size="17">Mechanistic boundary / grouped stage</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">Secondary ozonide + Me2S</text><text x="665.00" y="155" font-size="24.00">2 CH3CHO + Me2SO</text><text x="30" y="202" font-size="16">Process model: no unique microscopic electron-arrow sequence asserted.</text><text x="24" y="235" font-size="16">Reductive peroxide-bond cleavage and fragmentation release carbonyl products. The reagent-specific reduction</text><text x="24" y="258" font-size="16">is a grouped work-up, not a pericyclic elementary event.</text></g></g></svg>