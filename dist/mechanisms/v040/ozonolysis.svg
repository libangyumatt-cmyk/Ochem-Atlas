<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1160"><title>Reductive ozonolysis: complete teaching sequence</title><g transform="translate(0,0)"><title>Reductive ozonolysis: Primary ozonide formation</title><desc>CH3–CH=CH–CH3 + O–O+–O− → Five-membered primary ozonide (molozonide). A concerted 1,3-dipolar addition joins ozone to both alkene carbons; ozone resonance forms are not separate species.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="ozonolysis-1-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="ozonolysis-1-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Reductive ozonolysis · 1</text><text x="24" y="65" font-size="17">Primary ozonide formation</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">CH3–</text><text x="83.52" y="155" font-size="24.00">CH</text><text x="113.28" y="155" font-size="24.00">=</text><text x="128.16" y="155" font-size="24.00">CH</text><text x="157.92" y="155" font-size="24.00">–CH3 + </text><text x="262.08" y="155" font-size="24.00">O</text><text x="276.96" y="155" font-size="24.00">–</text><text x="291.84" y="155" font-size="24.00">O+</text><text x="321.60" y="155" font-size="24.00">–</text><text x="336.48" y="155" font-size="24.00">O−</text><text x="665.00" y="155" font-size="19.59">Five-membered primary ozonide (molozonide)</text><path data-electrons="2" d="M120.72,141.60 Q195.12,98.60 269.52,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#ozonolysis-1-pair)"/><path data-electrons="2" d="M351.36,141.60 Q247.20,203.60 143.04,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#ozonolysis-1-pair)"/><text x="24" y="235" font-size="16">A concerted 1,3-dipolar addition joins ozone to both alkene carbons; ozone resonance forms are not separate species.</text></g></g><g transform="translate(0,290)"><title>Reductive ozonolysis: Molozonide cycloreversion</title><desc>Molozonide: C–C–O–O–O ring → CH3CHO + CH3CHOO (carbonyl oxide). Cycloreversion fragments the unstable primary ozonide into a carbonyl compound and a carbonyl oxide; no free alkene-carbon cation is proposed.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="ozonolysis-2-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="ozonolysis-2-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Reductive ozonolysis · 2</text><text x="24" y="65" font-size="17">Molozonide cycloreversion</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">Molozonide: C–C–O–O–O ring</text><text x="665.00" y="155" font-size="24.00">CH3CHO + CH3CHOO (carbonyl oxide)</text><text x="30" y="202" font-size="16">Process model: no unique microscopic electron-arrow sequence asserted.</text><text x="24" y="235" font-size="16">Cycloreversion fragments the unstable primary ozonide into a carbonyl compound and a carbonyl oxide; no free alkene-carbon cation is</text><text x="24" y="258" font-size="16">proposed.</text></g></g><g transform="translate(0,580)"><title>Reductive ozonolysis: Secondary ozonide formation</title><desc>CH3CHO + CH3CHOO → Secondary ozonide: C–O–C–O–O ring. Carbonyl oxide and carbonyl recombine by a cycloaddition model to the secondary ozonide.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="ozonolysis-3-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="ozonolysis-3-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Reductive ozonolysis · 3</text><text x="24" y="65" font-size="17">Secondary ozonide formation</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">CH3CHO + CH3CHOO</text><text x="665.00" y="155" font-size="24.00">Secondary ozonide: C–O–C–O–O ring</text><text x="30" y="202" font-size="16">Process model: no unique microscopic electron-arrow sequence asserted.</text><text x="24" y="235" font-size="16">Carbonyl oxide and carbonyl recombine by a cycloaddition model to the secondary ozonide.</text></g></g><g transform="translate(0,870)"><title>Reductive ozonolysis: Mechanistic boundary / grouped stage</title><desc>Secondary ozonide + Me2S → 2 CH3CHO + Me2SO. Reductive peroxide-bond cleavage and fragmentation release carbonyl products. The reagent-specific reduction is a grouped work-up, not a pericyclic elementary event.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="ozonolysis-4-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="ozonolysis-4-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Reductive ozonolysis · 4</text><text x="24" y="65" font-size="17">Mechanistic boundary / grouped stage</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">Secondary ozonide + Me2S</text><text x="665.00" y="155" font-size="24.00">2 CH3CHO + Me2SO</text><text x="30" y="202" font-size="16">Process model: no unique microscopic electron-arrow sequence asserted.</text><text x="24" y="235" font-size="16">Reductive peroxide-bond cleavage and fragmentation release carbonyl products. The reagent-specific reduction is a grouped work-up,</text><text x="24" y="258" font-size="16">not a pericyclic elementary event.</text></g></g></svg>