<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" role="img"><title>Neighboring sulfur participation: Bond-replacing displacement</title><desc>Me–S:–CH2–CH2–Cl → [Me–S+(CH2CH2 ring)] + Cl−. S donates to the carbon bearing Cl; C–Cl electrons leave on chloride. A three-membered episulfonium ion forms.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="neighboring-sulfur-1-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="neighboring-sulfur-1-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Neighboring sulfur participation · 1</text><text x="24" y="65" font-size="17">Bond-replacing displacement</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">Me–</text><text x="68.64" y="155" font-size="24.00">S:</text><text x="98.40" y="155" font-size="24.00">–</text><text x="113.28" y="155" font-size="24.00">CH2</text><text x="157.92" y="155" font-size="24.00">–</text><text x="172.80" y="155" font-size="24.00">CH2</text><text x="217.44" y="155" font-size="24.00">–</text><text x="232.32" y="155" font-size="24.00">Cl</text><text x="665.00" y="155" font-size="24.00">[Me–S+(CH2CH2 ring)] + Cl−</text><path data-electrons="2" d="M83.52,141.60 Q139.32,98.60 195.12,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#neighboring-sulfur-1-pair)"/><path data-electrons="2" d="M221.16,141.60 Q234.18,203.60 247.20,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#neighboring-sulfur-1-pair)"/><text x="24" y="235" font-size="16">S donates to the carbon bearing Cl; C–Cl electrons leave on chloride. A three-membered episulfonium ion forms.</text></g></svg>