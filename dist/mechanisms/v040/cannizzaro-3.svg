<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" role="img"><title>Cannizzaro disproportionation: Proton transfer</title><desc>PhCO2–H + PhCH2O− → PhCO2− + PhCH2OH. Acid–base transfer gives the carboxylate and alcohol under the basic conditions.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="cannizzaro-3-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="cannizzaro-3-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Cannizzaro disproportionation · 3</text><text x="24" y="65" font-size="17">Proton transfer</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">PhCO2–</text><text x="113.28" y="155" font-size="24.00">H</text><text x="128.16" y="155" font-size="24.00"> + PhCH2</text><text x="247.20" y="155" font-size="24.00">O−</text><text x="665.00" y="155" font-size="24.00">PhCO2− + PhCH2OH</text><path data-electrons="2" d="M262.08,141.60 Q191.40,98.60 120.72,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#cannizzaro-3-pair)"/><text x="24" y="235" font-size="16">Acid–base transfer gives the carboxylate and alcohol under the basic conditions.</text></g></svg>