<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" role="img"><title>Mizoroki–Heck coupling: Migratory insertion</title><desc>Pd–Ph with coordinated CH2=CHCO2Et → PhCH2–CH(PdBrLn)CO2Et. Syn migratory insertion makes C–C and a new Pd–C bond. It is not free phenyl-anion attack.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="heck-3-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="heck-3-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Mizoroki–Heck coupling · 3</text><text x="24" y="65" font-size="17">Migratory insertion</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">Pd–Ph with coordinated CH2=CHCO2Et</text><text x="665.00" y="155" font-size="24.00">PhCH2–CH(PdBrLn)CO2Et</text><text x="30" y="202" font-size="16">Process model: no unique microscopic electron-arrow sequence asserted.</text><text x="24" y="235" font-size="16">Syn migratory insertion makes C–C and a new Pd–C bond. It is not free phenyl-anion attack.</text></g></svg>