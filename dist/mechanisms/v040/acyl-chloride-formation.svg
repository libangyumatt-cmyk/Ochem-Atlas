<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1800"><title>Carboxylic acid conversion to acyl chloride: complete teaching sequence</title><g font-family="DejaVu Sans,sans-serif"><rect width="1200" height="350" fill="#fffefa"/><text x="25" y="32" font-size="21" fill="#203c43">Carboxylic acid conversion to acyl chloride · representative molecular graphs</text><path d="M351.33,234.89 L275.00,206.90" stroke="#203c43" stroke-width="2" fill="none"/><path d="M276.03,209.72 L199.70,237.71" stroke="#203c43" stroke-width="2" fill="none"/><path d="M273.97,204.09 L197.64,232.08" stroke="#203c43" stroke-width="2" fill="none"/><path d="M275.00,206.90 L275.00,126.11" stroke="#203c43" stroke-width="2" fill="none"/><rect x="336.33" y="224.89" width="30" height="20" fill="#fffefa"/><text x="351.33" y="239.89" font-size="16" text-anchor="middle" fill="#203c43">CH3</text><rect x="270.00" y="196.90" width="10" height="20" fill="#fffefa"/><text x="275.00" y="211.90" font-size="16" text-anchor="middle" fill="#203c43">C</text><rect x="193.67" y="224.89" width="10" height="20" fill="#fffefa"/><text x="198.67" y="239.89" font-size="16" text-anchor="middle" fill="#203c43">O</text><rect x="265.00" y="116.11" width="20" height="20" fill="#fffefa"/><text x="275.00" y="131.11" font-size="16" text-anchor="middle" fill="#203c43">OH</text><path d="M991.33,234.89 L915.00,206.90" stroke="#203c43" stroke-width="2" fill="none"/><path d="M916.03,209.72 L839.70,237.71" stroke="#203c43" stroke-width="2" fill="none"/><path d="M913.97,204.09 L837.64,232.08" stroke="#203c43" stroke-width="2" fill="none"/><path d="M915.00,206.90 L915.00,126.11" stroke="#203c43" stroke-width="2" fill="none"/><rect x="976.33" y="224.89" width="30" height="20" fill="#fffefa"/><text x="991.33" y="239.89" font-size="16" text-anchor="middle" fill="#203c43">CH3</text><rect x="910.00" y="196.90" width="10" height="20" fill="#fffefa"/><text x="915.00" y="211.90" font-size="16" text-anchor="middle" fill="#203c43">C</text><rect x="833.67" y="224.89" width="10" height="20" fill="#fffefa"/><text x="838.67" y="239.89" font-size="16" text-anchor="middle" fill="#203c43">O</text><rect x="905.00" y="116.11" width="20" height="20" fill="#fffefa"/><text x="915.00" y="131.11" font-size="16" text-anchor="middle" fill="#203c43">Cl</text><text x="580" y="180" font-size="32" fill="#203c43">→</text><text x="25" y="330" font-size="15" fill="#203c43">Representative substrate/product connectivity; other reagents/byproducts are in the equation. No computed geometry.</text></g><g transform="translate(0,350)"><title>Carboxylic acid conversion to acyl chloride: Bond-replacing displacement</title><desc>CH3C(=O)–O:H + S(=O)(Cl)–Cl → [CH3CO2(H)SOCl]+ + Cl−. Carboxylic OH oxygen attacks sulfur, replacing chloride in the activation model.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="acyl-chloride-formation-1-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="acyl-chloride-formation-1-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Carboxylic acid conversion to acyl chloride · 1</text><text x="24" y="65" font-size="17">Bond-replacing displacement</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">CH3C(=O)–</text><text x="157.92" y="155" font-size="24.00">O:H</text><text x="202.56" y="155" font-size="24.00"> + </text><text x="247.20" y="155" font-size="24.00">S</text><text x="262.08" y="155" font-size="24.00">(=O)(Cl)–</text><text x="396.00" y="155" font-size="24.00">Cl</text><text x="665.00" y="155" font-size="24.00">[CH3CO2(H)SOCl]+ + Cl−</text><path data-electrons="2" d="M180.24,141.60 Q217.44,98.60 254.64,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#acyl-chloride-formation-1-pair)"/><path data-electrons="2" d="M332.76,141.60 Q371.82,203.60 410.88,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#acyl-chloride-formation-1-pair)"/><text x="24" y="235" font-size="16">Carboxylic OH oxygen attacks sulfur, replacing chloride in the activation model.</text></g></g><g transform="translate(0,640)"><title>Carboxylic acid conversion to acyl chloride: Proton transfer</title><desc>CH3C(=O)–O+(SOCl)–H + :Cl− → CH3C(=O)–O–SOCl + HCl. Chloride removes the acidic O proton to give acyl chlorosulfite.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="acyl-chloride-formation-2-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="acyl-chloride-formation-2-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Carboxylic acid conversion to acyl chloride · 2</text><text x="24" y="65" font-size="17">Proton transfer</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">CH3C(=O)–</text><text x="157.92" y="155" font-size="24.00">O+</text><text x="187.68" y="155" font-size="24.00">(SOCl)–</text><text x="291.84" y="155" font-size="24.00">H</text><text x="306.72" y="155" font-size="24.00"> + </text><text x="351.36" y="155" font-size="24.00">:Cl−</text><text x="665.00" y="155" font-size="24.00">CH3C(=O)–O–SOCl + HCl</text><path data-electrons="2" d="M381.12,141.60 Q340.20,98.60 299.28,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#acyl-chloride-formation-2-pair)"/><path data-electrons="2" d="M236.04,141.60 Q204.42,203.60 172.80,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#acyl-chloride-formation-2-pair)"/><text x="24" y="235" font-size="16">Chloride removes the acidic O proton to give acyl chlorosulfite.</text></g></g><g transform="translate(0,930)"><title>Carboxylic acid conversion to acyl chloride: Nucleophilic carbonyl addition</title><desc>CH3–C(=O)OSOCl + :Cl− → CH3C(O−)(Cl)OSOCl. Chloride attacks activated acyl carbon.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="acyl-chloride-formation-3-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="acyl-chloride-formation-3-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Carboxylic acid conversion to acyl chloride · 3</text><text x="24" y="65" font-size="17">Nucleophilic carbonyl addition</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">CH3–</text><text x="83.52" y="155" font-size="24.00">C</text><text x="98.40" y="155" font-size="24.00">(=</text><text x="128.16" y="155" font-size="24.00">O</text><text x="143.04" y="155" font-size="24.00">)OSOCl + </text><text x="276.96" y="155" font-size="24.00">:Cl−</text><text x="665.00" y="155" font-size="24.00">CH3C(O−)(Cl)OSOCl</text><path data-electrons="2" d="M306.72,141.60 Q198.84,98.60 90.96,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#acyl-chloride-formation-3-pair)"/><path data-electrons="2" d="M113.28,141.60 Q124.44,203.60 135.60,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#acyl-chloride-formation-3-pair)"/><text x="24" y="235" font-size="16">Chloride attacks activated acyl carbon.</text></g></g><g transform="translate(0,1220)"><title>Carboxylic acid conversion to acyl chloride: Tetrahedral intermediate collapse</title><desc>CH3–C(O−)(Cl)–OSOCl → CH3COCl + chlorosulfite-derived anion. Carbonyl reformation expels the activated oxygen leaving group.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="acyl-chloride-formation-4-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="acyl-chloride-formation-4-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Carboxylic acid conversion to acyl chloride · 4</text><text x="24" y="65" font-size="17">Tetrahedral intermediate collapse</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">CH3–</text><text x="83.52" y="155" font-size="24.00">C</text><text x="98.40" y="155" font-size="24.00">(</text><text x="113.28" y="155" font-size="24.00">O−</text><text x="143.04" y="155" font-size="24.00">)(Cl)–</text><text x="232.32" y="155" font-size="24.00">OSOCl</text><text x="665.00" y="155" font-size="22.23">CH3COCl + chlorosulfite-derived anion</text><path data-electrons="2" d="M128.16,141.60 Q118.86,98.60 109.56,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#acyl-chloride-formation-4-pair)"/><path data-electrons="2" d="M180.24,141.60 Q224.88,203.60 269.52,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#acyl-chloride-formation-4-pair)"/><text x="24" y="235" font-size="16">Carbonyl reformation expels the activated oxygen leaving group.</text></g></g><g transform="translate(0,1510)"><title>Carboxylic acid conversion to acyl chloride: Mechanistic boundary / grouped stage</title><desc>Chlorosulfite-derived leaving group → SO2 + Cl−. Fragmentation of the leaving group supplies SO2 and chloride; counterion/proton inventory is stated in the net equation.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="acyl-chloride-formation-5-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="acyl-chloride-formation-5-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Carboxylic acid conversion to acyl chloride · 5</text><text x="24" y="65" font-size="17">Mechanistic boundary / grouped stage</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="23.96">Chlorosulfite-derived leaving group</text><text x="665.00" y="155" font-size="24.00">SO2 + Cl−</text><text x="30" y="202" font-size="16">Process model: no unique microscopic electron-arrow sequence asserted.</text><text x="24" y="235" font-size="16">Fragmentation of the leaving group supplies SO2 and chloride; counterion/proton inventory is stated in the</text><text x="24" y="258" font-size="16">net equation.</text></g></g></svg>