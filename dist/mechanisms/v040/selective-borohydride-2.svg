<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" role="img"><title>Chemoselective borohydride ketone reduction: Proton transfer</title><desc>EtO2C–C6H4–CH(O−)Me + MeO–H → EtO2C–C6H4–CH(OH)Me + MeO−. Alcohol solvent protonates the alkoxide; borate hydrolysis during work-up completes release.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="selective-borohydride-2-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="selective-borohydride-2-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Chemoselective borohydride ketone reduction · 2</text><text x="24" y="65" font-size="17">Proton transfer</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">EtO2C–C6H4–CH(</text><text x="232.32" y="155" font-size="24.00">O−</text><text x="262.08" y="155" font-size="24.00">)Me + Me</text><text x="381.12" y="155" font-size="24.00">O</text><text x="396.00" y="155" font-size="24.00">–</text><text x="410.88" y="155" font-size="24.00">H</text><text x="665.00" y="155" font-size="24.00">EtO2C–C6H4–CH(OH)Me + MeO−</text><path data-electrons="2" d="M247.20,141.60 Q332.76,98.60 418.32,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#selective-borohydride-2-pair)"/><path data-electrons="2" d="M403.44,141.60 Q396.00,203.60 388.56,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#selective-borohydride-2-pair)"/><text x="24" y="235" font-size="16">Alcohol solvent protonates the alkoxide; borate hydrolysis during work-up completes release.</text></g></svg>