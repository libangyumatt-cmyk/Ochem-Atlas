<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" role="img"><title>Triplet-sensitized enone [2+2] cycloaddition: Radical bond formation</title><desc>Enone alpha-C•–beta-C• + CH2=CH2 → Ring O=C–CH•–CH(CH2CH2•)–CH2–CH2–(back). One enone radical center adds to ethene, giving a triplet1,4-diradical; another radical remains at enone alpha carbon.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="photochemical-cycloaddition-2-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="photochemical-cycloaddition-2-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Triplet-sensitized enone [2+2] cycloaddition · 2</text><text x="24" y="65" font-size="17">Radical bond formation</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">Enone alpha-C•–</text><text x="247.20" y="155" font-size="24.00">beta-C•</text><text x="351.36" y="155" font-size="24.00"> + </text><text x="396.00" y="155" font-size="24.00">CH2</text><text x="440.64" y="155" font-size="24.00">=</text><text x="455.52" y="155" font-size="24.00">CH2</text><text x="665.00" y="155" font-size="21.09">Ring O=C–CH•–CH(CH2CH2•)–CH2–CH2–(back)</text><path data-electrons="1" d="M299.28,141.60 Q329.04,98.60 358.80,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#photochemical-cycloaddition-2-fish)"/><path data-electrons="1" d="M448.08,141.60 Q403.44,203.60 358.80,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#photochemical-cycloaddition-2-fish)"/><path data-electrons="1" d="M448.08,141.60 Q462.96,80.60 477.84,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#photochemical-cycloaddition-2-fish)"/><text x="24" y="235" font-size="16">One enone radical center adds to ethene, giving a triplet1,4-diradical; another radical remains at enone</text><text x="24" y="258" font-size="16">alpha carbon.</text></g></svg>