<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" role="img"><title>Sandmeyer chlorination: Mechanistic boundary / grouped stage</title><desc>PhN2+ + Cu(I) → Ph• + N2 + Cu(II) species. Single-electron transfer and nitrogen extrusion generate an aryl-radical/copper-ion-pair model.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="sandmeyer-5-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="sandmeyer-5-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Sandmeyer chlorination · 5</text><text x="24" y="65" font-size="17">Mechanistic boundary / grouped stage</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">PhN2+ + Cu(I)</text><text x="665.00" y="155" font-size="24.00">Ph• + N2 + Cu(II) species</text><text x="30" y="202" font-size="16">Process model: no unique microscopic electron-arrow sequence asserted.</text><text x="24" y="235" font-size="16">Single-electron transfer and nitrogen extrusion generate an aryl-radical/copper-ion-pair model.</text></g></svg>