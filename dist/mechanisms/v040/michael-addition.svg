<text x="890.98" y="231.35" font-size="16" text-anchor="middle" fill="#203c43">CH2</text><rect x="842.23" y="188.58" width="30" height="20" fill="#fffefa"/><text x="857.23" y="203.58" font-size="16" text-anchor="middle" fill="#203c43">CH2</text><rect x="843.56" y="145.03" width="30" height="20" fill="#fffefa"/><text x="858.56" y="160.03" font-size="16" text-anchor="middle" fill="#203c43">CH2</text><rect x="883.23" y="111.97" width="10" height="20" fill="#fffefa"/><text x="888.23" y="126.97" font-size="16" text-anchor="middle" fill="#203c43">C</text><rect x="883.19" y="70.50" width="30" height="20" fill="#fffefa"/><text x="898.19" y="85.50" font-size="16" text-anchor="middle" fill="#203c43">CH3</text><rect x="925.66" y="116.86" width="10" height="20" fill="#fffefa"/><text x="930.66" y="131.86" font-size="16" text-anchor="middle" fill="#203c43">O</text><text x="580" y="180" font-size="32" fill="#203c43">→</text><text x="25" y="330" font-size="15" fill="#203c43">Representative substrate/product connectivity; other reagents/byproducts are in the equation. No computed geometry.</text></g><g transform="translate(0,350)"><title>Michael conjugate addition: Proton transfer</title><desc>CH3CO–CH2–H + :OH− → CH3COCH2− + H2O. Base forms the acetone enolate contributor.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="michael-addition-1-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="michael-addition-1-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Michael conjugate addition · 1</text><text x="24" y="65" font-size="17">Proton transfer</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">CH3CO–</text><text x="113.28" y="155" font-size="24.00">CH2</text><text x="157.92" y="155" font-size="24.00">–</text><text x="172.80" y="155" font-size="24.00">H</text><text x="187.68" y="155" font-size="24.00"> + </text><text x="232.32" y="155" font-size="24.00">:OH−</text><text x="665.00" y="155" font-size="24.00">CH3COCH2− + H2O</text><path data-electrons="2" d="M262.08,141.60 Q221.16,98.60 180.24,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#michael-addition-1-pair)"/><path data-electrons="2" d="M157.92,141.60 Q146.76,203.60 135.60,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#michael-addition-1-pair)"/><text x="24" y="235" font-size="16">Base forms the acetone enolate contributor.</text></g></g><g transform="translate(0,640)"><title>Michael conjugate addition: Conjugate C–C bond formation</title><desc>CH3CO–CH2− + CH2=CH–COCH3 → CH3COCH2CH2CH−COCH3. Enolate carbon attacks the enone beta carbon; the enone pi pair shifts to alpha carbon in the C-anion contributor.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="michael-addition-2-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="michael-addition-2-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Michael conjugate addition · 2</text><text x="24" y="65" font-size="17">Conjugate C–C bond formation</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">CH3CO–</text><text x="113.28" y="155" font-size="24.00">CH2−</text><text x="172.80" y="155" font-size="24.00"> + </text><text x="217.44" y="155" font-size="24.00">CH2</text><text x="262.08" y="155" font-size="24.00">=</text><text x="276.96" y="155" font-size="24.00">CH</text><text x="306.72" y="155" font-size="24.00">–COCH3</text><text x="665.00" y="155" font-size="24.00">CH3COCH2CH2CH−COCH3</text><path data-electrons="2" d="M143.04,141.60 Q191.40,98.60 239.76,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#michael-addition-2-pair)"/><path data-electrons="2" d="M265.80,141.60 Q278.82,203.60 291.84,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#michael-addition-2-pair)"/><text x="24" y="235" font-size="16">Enolate carbon attacks the enone beta carbon; the enone pi pair shifts to alpha carbon in the C-anion</text><text x="24" y="258" font-size="16">contributor.</text></g></g><g transform="translate(0,930)"><title>Michael conjugate addition: Proton transfer</title><desc>CH3COCH2CH2–CH−–COCH3 + H–OH → CH3COCH2CH2CH2COCH3 + OH−. Water protonates the acceptor enolate carbon, giving the1,5-dicarbonyl.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="michael-addition-3-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="michael-addition-3-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Michael conjugate addition · 3</text><text x="24" y="65" font-size="17">Proton transfer</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">CH3COCH2CH2–</text><text x="202.56" y="155" font-size="24.00">CH−</text><text x="247.20" y="155" font-size="24.00">–COCH3 + </text><text x="381.12" y="155" font-size="24.00">H</text><text x="396.00" y="155" font-size="24.00">–</text><text x="410.88" y="155" font-size="24.00">OH</text><text x="665.00" y="155" font-size="24.00">CH3COCH2CH2CH2COCH3 + OH−</text><path data-electrons="2" d="M224.88,141.60 Q306.72,98.60 388.56,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#michael-addition-3-pair)"/><path data-electrons="2" d="M407.16,141.60 Q416.46,203.60 425.76,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#michael-addition-3-pair)"/><text x="24" y="235" font-size="16">Water protonates the acceptor enolate carbon, giving the1,5-dicarbonyl.</text></g></g></svg>