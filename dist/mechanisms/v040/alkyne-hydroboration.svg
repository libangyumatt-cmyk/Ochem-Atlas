<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 2090"><title>Alkyne hydroboration–oxidation: complete teaching sequence</title><g font-family="DejaVu Sans,sans-serif"><rect width="1200" height="350" fill="#fffefa"/><text x="25" y="32" font-size="21" fill="#203c43">Alkyne hydroboration–oxidation · representative molecular graphs</text><path d="M339.95,219.45 L262.88,200.71" stroke="#203c43" stroke-width="2" fill="none"/><path d="M259.75,203.50 L206.92,144.34" stroke="#203c43" stroke-width="2" fill="none"/><path d="M262.88,200.71 L210.05,141.55" stroke="#203c43" stroke-width="2" fill="none"/><path d="M266.01,197.91 L213.18,138.75" stroke="#203c43" stroke-width="2" fill="none"/><rect x="324.95" y="209.45" width="30" height="20" fill="#fffefa"/><text x="339.95" y="224.45" font-size="16" text-anchor="middle" fill="#203c43">CH3</text><rect x="257.88" y="190.71" width="10" height="20" fill="#fffefa"/><text x="262.88" y="205.71" font-size="16" text-anchor="middle" fill="#203c43">C</text><rect x="200.05" y="131.55" width="20" height="20" fill="#fffefa"/><text x="210.05" y="146.55" font-size="16" text-anchor="middle" fill="#203c43">CH</text><path d="M986.07,251.57 L906.46,246.18" stroke="#203c43" stroke-width="2" fill="none"/><path d="M906.46,246.18 L849.32,189.04" stroke="#203c43" stroke-width="2" fill="none"/><path d="M846.33,189.24 L840.93,109.63" stroke="#203c43" stroke-width="2" fill="none"/><path d="M852.32,188.83 L846.92,109.22" stroke="#203c43" stroke-width="2" fill="none"/><rect x="971.07" y="241.57" width="30" height="20" fill="#fffefa"/><text x="986.07" y="256.57" font-size="16" text-anchor="middle" fill="#203c43">CH3</text><rect x="891.46" y="236.18" width="30" height="20" fill="#fffefa"/><text x="906.46" y="251.18" font-size="16" text-anchor="middle" fill="#203c43">CH2</text><rect x="839.32" y="179.04" width="20" height="20" fill="#fffefa"/><text x="849.32" y="194.04" font-size="16" text-anchor="middle" fill="#203c43">CH</text><rect x="838.93" y="99.43" width="10" height="20" fill="#fffefa"/><text x="843.93" y="114.43" font-size="16" text-anchor="middle" fill="#203c43">O</text><text x="580" y="180" font-size="32" fill="#203c43">→</text><text x="25" y="330" font-size="15" fill="#203c43">Representative substrate/product connectivity; other reagents/byproducts are in the equation. No computed geometry.</text></g><g transform="translate(0,350)"><title>Alkyne hydroboration–oxidation: Vinylborane formation</title><desc>CH3–C≡CH + R2B–H → CH3CH=CHBR2. Alkyne pi donation to B and B–H transfer place B mainly at the terminal carbon.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="alkyne-hydroboration-1-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="alkyne-hydroboration-1-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Alkyne hydroboration–oxidation · 1</text><text x="24" y="65" font-size="17">Vinylborane formation</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">CH3–</text><text x="83.52" y="155" font-size="24.00">C</text><text x="98.40" y="155" font-size="24.00">≡</text><text x="113.28" y="155" font-size="24.00">CH</text><text x="143.04" y="155" font-size="24.00"> + R2</text><text x="217.44" y="155" font-size="24.00">B</text><text x="232.32" y="155" font-size="24.00">–</text><text x="247.20" y="155" font-size="24.00">H</text><text x="665.00" y="155" font-size="24.00">CH3CH=CHBR2</text><path data-electrons="2" d="M109.56,141.60 Q167.22,98.60 224.88,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#alkyne-hydroboration-1-pair)"/><path data-electrons="2" d="M239.76,141.60 Q165.36,203.60 90.96,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#alkyne-hydroboration-1-pair)"/><text x="24" y="235" font-size="16">Alkyne pi donation to B and B–H transfer place B mainly at the terminal carbon.</text></g></g><g transform="translate(0,640)"><title>Alkyne hydroboration–oxidation: Lone-pair capture</title><desc>CH3CH=CH–BR2 + :O−–OH → [R2B(CH=CHCH3)(OOH)]−. Hydroperoxide adds to boron.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="alkyne-hydroboration-2-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="alkyne-hydroboration-2-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Alkyne hydroboration–oxidation · 2</text><text x="24" y="65" font-size="17">Lone-pair capture</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">CH3CH=CH–</text><text x="157.92" y="155" font-size="24.00">BR2</text><text x="202.56" y="155" font-size="24.00"> + </text><text x="247.20" y="155" font-size="24.00">:O−</text><text x="291.84" y="155" font-size="24.00">–OH</text><text x="665.00" y="155" font-size="24.00">[R2B(CH=CHCH3)(OOH)]−</text><path data-electrons="2" d="M269.52,141.60 Q224.88,98.60 180.24,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#alkyne-hydroboration-2-pair)"/><text x="24" y="235" font-size="16">Hydroperoxide adds to boron.</text></g></g><g transform="translate(0,930)"><title>Alkyne hydroboration–oxidation: Coupled polar bond reorganization</title><desc>[R2B(CH=CHCH3)–O–OH]− → R2B–O–CH=CHCH3 + OH−. Vinyl migration from boron to oxygen accompanies O–O cleavage, retaining the migrating vinyl connectivity.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="alkyne-hydroboration-3-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="alkyne-hydroboration-3-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Alkyne hydroboration–oxidation · 3</text><text x="24" y="65" font-size="17">Coupled polar bond reorganization</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">[R2</text><text x="68.64" y="155" font-size="24.00">B</text><text x="83.52" y="155" font-size="24.00">(</text><text x="98.40" y="155" font-size="24.00">CH=CHCH3</text><text x="217.44" y="155" font-size="24.00">)–</text><text x="247.20" y="155" font-size="24.00">O</text><text x="262.08" y="155" font-size="24.00">–</text><text x="276.96" y="155" font-size="24.00">OH</text><text x="306.72" y="155" font-size="24.00">]−</text><text x="665.00" y="155" font-size="24.00">R2B–O–CH=CHCH3 + OH−</text><path data-electrons="2" d="M117.00,141.60 Q185.82,98.60 254.64,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#alkyne-hydroboration-3-pair)"/><path data-electrons="2" d="M273.24,141.60 Q282.54,203.60 291.84,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#alkyne-hydroboration-3-pair)"/><text x="24" y="235" font-size="16">Vinyl migration from boron to oxygen accompanies O–O cleavage, retaining the migrating vinyl connectivity.</text></g></g><g transform="translate(0,1220)"><title>Alkyne hydroboration–oxidation: Mechanistic boundary / grouped stage</title><desc>R2B–O–CH=CHCH3 + water → HO–CH=CHCH3 + borate-derived products. Hydrolytic B–O cleavage/proton transfers release the enol.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="alkyne-hydroboration-4-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="alkyne-hydroboration-4-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Alkyne hydroboration–oxidation · 4</text><text x="24" y="65" font-size="17">Mechanistic boundary / grouped stage</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">R2B–O–CH=CHCH3 + water</text><text x="665.00" y="155" font-size="22.23">HO–CH=CHCH3 + borate-derived products</text><text x="30" y="202" font-size="16">Process model: no unique microscopic electron-arrow sequence asserted.</text><text x="24" y="235" font-size="16">Hydrolytic B–O cleavage/proton transfers release the enol.</text></g></g><g transform="translate(0,1510)"><title>Alkyne hydroboration–oxidation: Enolate-mediated tautomerization</title><desc>HO–CH=CHCH3 + :OH− → −O–CH=CHCH3 + H2O. Base removes the enol O–H proton; the resulting enolate is resonance delocalized.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="alkyne-hydroboration-5-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="alkyne-hydroboration-5-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Alkyne hydroboration–oxidation · 5</text><text x="24" y="65" font-size="17">Enolate-mediated tautomerization</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">HO–CH=CHCH3 + </text><text x="232.32" y="155" font-size="24.00">:OH−</text><text x="665.00" y="155" font-size="24.00">−O–CH=CHCH3 + H2O</text><text x="30" y="202" font-size="16">Condensed structural stage; electron changes are specified below.</text><text x="24" y="235" font-size="16">Base removes the enol O–H proton; the resulting enolate is resonance delocalized.</text></g></g><g transform="translate(0,1800)"><title>Alkyne hydroboration–oxidation: Carbon protonation gives propanal</title><desc>−O–CH=CHCH3 + H–OH → O=CH–CH2CH3 + OH−. Enolate oxygen forms C=O as alpha carbon receives a proton from water; solvent relays can resolve this bookkeeping into microscopic transfers.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="alkyne-hydroboration-6-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="alkyne-hydroboration-6-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Alkyne hydroboration–oxidation · 6</text><text x="24" y="65" font-size="17">Carbon protonation gives propanal</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">−O</text><text x="53.76" y="155" font-size="24.00">–</text><text x="68.64" y="155" font-size="24.00">CH</text><text x="98.40" y="155" font-size="24.00">=</text><text x="113.28" y="155" font-size="24.00">CH</text><text x="143.04" y="155" font-size="24.00">CH3 + H–OH</text><text x="665.00" y="155" font-size="24.00">O=CH–CH2CH3 + OH−</text><path data-electrons="2" d="M38.88,141.60 Q50.04,98.60 61.20,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#alkyne-hydroboration-6-pair)"/><text x="24" y="235" font-size="16">Enolate oxygen forms C=O as alpha carbon receives a proton from water; solvent relays can resolve this</text><text x="24" y="258" font-size="16">bookkeeping into microscopic transfers.</text></g></g></svg>