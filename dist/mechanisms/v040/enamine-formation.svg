<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 2090"><title>Enamine formation: complete teaching sequence</title><g font-family="DejaVu Sans,sans-serif"><rect width="1200" height="350" fill="#fffefa"/><text x="25" y="32" font-size="21" fill="#203c43">Enamine formation · representative molecular graphs</text><path d="M351.33,234.89 L275.00,206.90" stroke="#203c43" stroke-width="2" fill="none"/><path d="M276.03,209.72 L199.70,237.71" stroke="#203c43" stroke-width="2" fill="none"/><path d="M273.97,204.09 L197.64,232.08" stroke="#203c43" stroke-width="2" fill="none"/><path d="M275.00,206.90 L275.00,126.11" stroke="#203c43" stroke-width="2" fill="none"/><rect x="336.33" y="224.89" width="30" height="20" fill="#fffefa"/><text x="351.33" y="239.89" font-size="16" text-anchor="middle" fill="#203c43">CH3</text><rect x="270.00" y="196.90" width="10" height="20" fill="#fffefa"/><text x="275.00" y="211.90" font-size="16" text-anchor="middle" fill="#203c43">C</text><rect x="193.67" y="224.89" width="10" height="20" fill="#fffefa"/><text x="198.67" y="239.89" font-size="16" text-anchor="middle" fill="#203c43">O</text><rect x="260.00" y="116.11" width="30" height="20" fill="#fffefa"/><text x="275.00" y="131.11" font-size="16" text-anchor="middle" fill="#203c43">CH3</text><path d="M1000.44,225.67 L924.90,216.24" stroke="#203c43" stroke-width="2" fill="none"/><path d="M1001.18,219.72 L925.64,210.29" stroke="#203c43" stroke-width="2" fill="none"/><path d="M925.27,213.26 L889.78,280.50" stroke="#203c43" stroke-width="2" fill="none"/><path d="M925.27,213.26 L893.23,140.56" stroke="#203c43" stroke-width="2" fill="none"/><path d="M893.23,140.56 L829.19,99.34" stroke="#203c43" stroke-width="2" fill="none"/><path d="M893.23,140.56 L938.88,80.50" stroke="#203c43" stroke-width="2" fill="none"/><rect x="985.81" y="212.70" width="30" height="20" fill="#fffefa"/><text x="1000.81" y="227.70" font-size="16" text-anchor="middle" fill="#203c43">CH2</text><rect x="920.27" y="203.26" width="10" height="20" fill="#fffefa"/><text x="925.27" y="218.26" font-size="16" text-anchor="middle" fill="#203c43">C</text><rect x="874.78" y="270.50" width="30" height="20" fill="#fffefa"/><text x="889.78" y="285.50" font-size="16" text-anchor="middle" fill="#203c43">CH3</text><rect x="888.23" y="130.56" width="10" height="20" fill="#fffefa"/><text x="893.23" y="145.56" font-size="16" text-anchor="middle" fill="#203c43">N</text><rect x="814.19" y="89.34" width="30" height="20" fill="#fffefa"/><text x="829.19" y="104.34" font-size="16" text-anchor="middle" fill="#203c43">CH3</text><rect x="923.88" y="70.50" width="30" height="20" fill="#fffefa"/><text x="938.88" y="85.50" font-size="16" text-anchor="middle" fill="#203c43">CH3</text><text x="580" y="180" font-size="32" fill="#203c43">→</text><text x="25" y="330" font-size="15" fill="#203c43">Representative substrate/product connectivity; other reagents/byproducts are in the equation. No computed geometry.</text></g><g transform="translate(0,350)"><title>Enamine formation: Proton transfer</title><desc>Me2C=O: + H–OH2+ → Me2C=OH+ + H2O. Carbonyl oxygen accepts a proton.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="enamine-formation-1-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="enamine-formation-1-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Enamine formation · 1</text><text x="24" y="65" font-size="17">Proton transfer</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">Me2C=</text><text x="98.40" y="155" font-size="24.00">O:</text><text x="128.16" y="155" font-size="24.00"> + </text><text x="172.80" y="155" font-size="24.00">H</text><text x="187.68" y="155" font-size="24.00">–</text><text x="202.56" y="155" font-size="24.00">OH2+</text><text x="665.00" y="155" font-size="24.00">Me2C=OH+ + H2O</text><path data-electrons="2" d="M113.28,141.60 Q146.76,98.60 180.24,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#enamine-formation-1-pair)"/><path data-electrons="2" d="M206.28,141.60 Q219.30,203.60 232.32,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#enamine-formation-1-pair)"/><text x="24" y="235" font-size="16">Carbonyl oxygen accepts a proton.</text></g></g><g transform="translate(0,640)"><title>Enamine formation: Nucleophilic carbonyl addition</title><desc>Me2C=OH+ + :HNMe2 → Me2C(OH)(NH+Me2). Nitrogen attacks carbonyl carbon; the C=O pi pair returns to O, giving the carbinolammonium form.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="enamine-formation-2-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="enamine-formation-2-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Enamine formation · 2</text><text x="24" y="65" font-size="17">Nucleophilic carbonyl addition</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">Me2</text><text x="68.64" y="155" font-size="24.00">C</text><text x="83.52" y="155" font-size="24.00">=</text><text x="98.40" y="155" font-size="24.00">OH+</text><text x="143.04" y="155" font-size="24.00"> + </text><text x="187.68" y="155" font-size="24.00">:HNMe2</text><text x="665.00" y="155" font-size="24.00">Me2C(OH)(NH+Me2)</text><path data-electrons="2" d="M232.32,141.60 Q154.20,98.60 76.08,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#enamine-formation-2-pair)"/><path data-electrons="2" d="M98.40,141.60 Q109.56,203.60 120.72,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#enamine-formation-2-pair)"/><text x="24" y="235" font-size="16">Nitrogen attacks carbonyl carbon; the C=O pi pair returns to O, giving the carbinolammonium form.</text></g></g><g transform="translate(0,930)"><title>Enamine formation: Proton transfer</title><desc>Me2C(OH)–N+(Me)(Me)–H + :OH2 → Me2C(OH)(NMe2) + H3O+. Water removes one N-bound proton.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="enamine-formation-3-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="enamine-formation-3-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Enamine formation · 3</text><text x="24" y="65" font-size="17">Proton transfer</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">Me2C(OH)–</text><text x="157.92" y="155" font-size="24.00">N+</text><text x="187.68" y="155" font-size="24.00">(Me)(Me)–</text><text x="321.60" y="155" font-size="24.00">H</text><text x="336.48" y="155" font-size="24.00"> + </text><text x="381.12" y="155" font-size="24.00">:OH2</text><text x="665.00" y="155" font-size="24.00">Me2C(OH)(NMe2) + H3O+</text><path data-electrons="2" d="M410.88,141.60 Q369.96,98.60 329.04,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#enamine-formation-3-pair)"/><path data-electrons="2" d="M250.92,141.60 Q211.86,203.60 172.80,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#enamine-formation-3-pair)"/><text x="24" y="235" font-size="16">Water removes one N-bound proton.</text></g></g><g transform="translate(0,1220)"><title>Enamine formation: Proton transfer</title><desc>Me2C(O:H)(NMe2) + H–OH2+ → Me2C(OH2+)(NMe2) + H2O. Protonation makes the hydroxyl group a water leaving group.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="enamine-formation-4-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="enamine-formation-4-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Enamine formation · 4</text><text x="24" y="65" font-size="17">Proton transfer</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">Me2C(</text><text x="98.40" y="155" font-size="24.00">O:H</text><text x="143.04" y="155" font-size="24.00">)(NMe2) + </text><text x="291.84" y="155" font-size="24.00">H</text><text x="306.72" y="155" font-size="24.00">–</text><text x="321.60" y="155" font-size="24.00">OH2+</text><text x="665.00" y="155" font-size="24.00">Me2C(OH2+)(NMe2) + H2O</text><path data-electrons="2" d="M120.72,141.60 Q210.00,98.60 299.28,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#enamine-formation-4-pair)"/><path data-electrons="2" d="M325.32,141.60 Q338.34,203.60 351.36,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#enamine-formation-4-pair)"/><text x="24" y="235" font-size="16">Protonation makes the hydroxyl group a water leaving group.</text></g></g><g transform="translate(0,1510)"><title>Enamine formation: Tetrahedral intermediate collapse</title><desc>Me2C(OH2+)–N:(Me)Me → Me2C=N+Me2 + H2O. Nitrogen lone-pair donation forms C=N as water leaves.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="enamine-formation-5-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="enamine-formation-5-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Enamine formation · 5</text><text x="24" y="65" font-size="17">Tetrahedral intermediate collapse</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">Me2</text><text x="68.64" y="155" font-size="24.00">C</text><text x="83.52" y="155" font-size="24.00">(</text><text x="98.40" y="155" font-size="24.00">OH2+</text><text x="157.92" y="155" font-size="24.00">)–</text><text x="187.68" y="155" font-size="24.00">N:</text><text x="217.44" y="155" font-size="24.00">(Me)Me</text><text x="665.00" y="155" font-size="24.00">Me2C=N+Me2 + H2O</text><path data-electrons="2" d="M202.56,141.60 Q170.94,98.60 139.32,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#enamine-formation-5-pair)"/><path data-electrons="2" d="M102.12,141.60 Q115.14,203.60 128.16,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#enamine-formation-5-pair)"/><text x="24" y="235" font-size="16">Nitrogen lone-pair donation forms C=N as water leaves.</text></g></g><g transform="translate(0,1800)"><title>Enamine formation: Alpha deprotonation</title><desc>CH2(H)–C(=N+Me2)–CH3 + :OH2 → CH2=C(CH3)NMe2 + H3O+. Water removes alpha H; the C–H pair forms C=C and C=N pi electrons return to N.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="enamine-formation-6-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="enamine-formation-6-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Enamine formation · 6</text><text x="24" y="65" font-size="17">Alpha deprotonation</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">CH2</text><text x="68.64" y="155" font-size="24.00">(</text><text x="83.52" y="155" font-size="24.00">H</text><text x="98.40" y="155" font-size="24.00">)–</text><text x="128.16" y="155" font-size="24.00">C</text><text x="143.04" y="155" font-size="24.00">(=</text><text x="172.80" y="155" font-size="24.00">N+Me2</text><text x="247.20" y="155" font-size="24.00">)–CH3 + </text><text x="366.24" y="155" font-size="24.00">:OH2</text><text x="665.00" y="155" font-size="24.00">CH2=C(CH3)NMe2 + H3O+</text><path data-electrons="2" d="M396.00,141.60 Q243.48,98.60 90.96,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#enamine-formation-6-pair)"/><path data-electrons="2" d="M68.64,141.60 Q79.80,203.60 90.96,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#enamine-formation-6-pair)"/><path data-electrons="2" d="M172.80,141.60 Q191.40,80.60 210.00,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#enamine-formation-6-pair)"/><text x="24" y="235" font-size="16">Water removes alpha H; the C–H pair forms C=C and C=N pi electrons return to N.</text></g></g></svg>