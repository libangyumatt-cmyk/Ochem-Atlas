<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1740"><title>Enamine formation: complete teaching sequence</title><g transform="translate(0,0)"><title>Enamine formation: Proton transfer</title><desc>Me2C=O: + H–OH2+ → Me2C=OH+ + H2O. Carbonyl oxygen accepts a proton.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="enamine-formation-1-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="enamine-formation-1-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Enamine formation · 1</text><text x="24" y="65" font-size="17">Proton transfer</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">Me2C=</text><text x="98.40" y="155" font-size="24.00">O:</text><text x="128.16" y="155" font-size="24.00"> + </text><text x="172.80" y="155" font-size="24.00">H</text><text x="187.68" y="155" font-size="24.00">–</text><text x="202.56" y="155" font-size="24.00">OH2+</text><text x="665.00" y="155" font-size="24.00">Me2C=OH+ + H2O</text><path data-electrons="2" d="M113.28,141.60 Q146.76,98.60 180.24,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#enamine-formation-1-pair)"/><path data-electrons="2" d="M206.28,141.60 Q219.30,203.60 232.32,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#enamine-formation-1-pair)"/><text x="24" y="235" font-size="16">Carbonyl oxygen accepts a proton.</text></g></g><g transform="translate(0,290)"><title>Enamine formation: Nucleophilic carbonyl addition</title><desc>Me2C=OH+ + :HNMe2 → Me2C(OH)(NH+Me2). Nitrogen attacks carbonyl carbon; the C=O pi pair returns to O, giving the carbinolammonium form.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="enamine-formation-2-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="enamine-formation-2-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Enamine formation · 2</text><text x="24" y="65" font-size="17">Nucleophilic carbonyl addition</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">Me2</text><text x="68.64" y="155" font-size="24.00">C</text><text x="83.52" y="155" font-size="24.00">=</text><text x="98.40" y="155" font-size="24.00">OH+</text><text x="143.04" y="155" font-size="24.00"> + </text><text x="187.68" y="155" font-size="24.00">:HNMe2</text><text x="665.00" y="155" font-size="24.00">Me2C(OH)(NH+Me2)</text><path data-electrons="2" d="M232.32,141.60 Q154.20,98.60 76.08,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#enamine-formation-2-pair)"/><path data-electrons="2" d="M98.40,141.60 Q109.56,203.60 120.72,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#enamine-formation-2-pair)"/><text x="24" y="235" font-size="16">Nitrogen attacks carbonyl carbon; the C=O pi pair returns to O, giving the carbinolammonium form.</text></g></g><g transform="translate(0,580)"><title>Enamine formation: Proton transfer</title><desc>Me2C(OH)–N+(Me)(Me)–H + :OH2 → Me2C(OH)(NMe2) + H3O+. Water removes one N-bound proton.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="enamine-formation-3-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="enamine-formation-3-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Enamine formation · 3</text><text x="24" y="65" font-size="17">Proton transfer</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">Me2C(OH)–</text><text x="157.92" y="155" font-size="24.00">N+</text><text x="187.68" y="155" font-size="24.00">(Me)(Me)–</text><text x="321.60" y="155" font-size="24.00">H</text><text x="336.48" y="155" font-size="24.00"> + </text><text x="381.12" y="155" font-size="24.00">:OH2</text><text x="665.00" y="155" font-size="24.00">Me2C(OH)(NMe2) + H3O+</text><path data-electrons="2" d="M410.88,141.60 Q369.96,98.60 329.04,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#enamine-formation-3-pair)"/><path data-electrons="2" d="M250.92,141.60 Q211.86,203.60 172.80,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#enamine-formation-3-pair)"/><text x="24" y="235" font-size="16">Water removes one N-bound proton.</text></g></g><g transform="translate(0,870)"><title>Enamine formation: Proton transfer</title><desc>Me2C(O:H)(NMe2) + H–OH2+ → Me2C(OH2+)(NMe2) + H2O. Protonation makes the hydroxyl group a water leaving group.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="enamine-formation-4-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="enamine-formation-4-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Enamine formation · 4</text><text x="24" y="65" font-size="17">Proton transfer</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">Me2C(</text><text x="98.40" y="155" font-size="24.00">O:H</text><text x="143.04" y="155" font-size="24.00">)(NMe2) + </text><text x="291.84" y="155" font-size="24.00">H</text><text x="306.72" y="155" font-size="24.00">–</text><text x="321.60" y="155" font-size="24.00">OH2+</text><text x="665.00" y="155" font-size="24.00">Me2C(OH2+)(NMe2) + H2O</text><path data-electrons="2" d="M120.72,141.60 Q210.00,98.60 299.28,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#enamine-formation-4-pair)"/><path data-electrons="2" d="M325.32,141.60 Q338.34,203.60 351.36,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#enamine-formation-4-pair)"/><text x="24" y="235" font-size="16">Protonation makes the hydroxyl group a water leaving group.</text></g></g><g transform="translate(0,1160)"><title>Enamine formation: Tetrahedral intermediate collapse</title><desc>Me2C(OH2+)–N:(Me)Me → Me2C=N+Me2 + H2O. Nitrogen lone-pair donation forms C=N as water leaves.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="enamine-formation-5-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="enamine-formation-5-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Enamine formation · 5</text><text x="24" y="65" font-size="17">Tetrahedral intermediate collapse</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">Me2</text><text x="68.64" y="155" font-size="24.00">C</text><text x="83.52" y="155" font-size="24.00">(</text><text x="98.40" y="155" font-size="24.00">OH2+</text><text x="157.92" y="155" font-size="24.00">)–</text><text x="187.68" y="155" font-size="24.00">N:</text><text x="217.44" y="155" font-size="24.00">(Me)Me</text><text x="665.00" y="155" font-size="24.00">Me2C=N+Me2 + H2O</text><path data-electrons="2" d="M202.56,141.60 Q170.94,98.60 139.32,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#enamine-formation-5-pair)"/><path data-electrons="2" d="M102.12,141.60 Q115.14,203.60 128.16,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#enamine-formation-5-pair)"/><text x="24" y="235" font-size="16">Nitrogen lone-pair donation forms C=N as water leaves.</text></g></g><g transform="translate(0,1450)"><title>Enamine formation: Alpha deprotonation</title><desc>CH2(H)–C(=N+Me2)–CH3 + :OH2 → CH2=C(CH3)NMe2 + H3O+. Water removes alpha H; the C–H pair forms C=C and C=N pi electrons return to N.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="enamine-formation-6-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="enamine-formation-6-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Enamine formation · 6</text><text x="24" y="65" font-size="17">Alpha deprotonation</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">CH2</text><text x="68.64" y="155" font-size="24.00">(</text><text x="83.52" y="155" font-size="24.00">H</text><text x="98.40" y="155" font-size="24.00">)–</text><text x="128.16" y="155" font-size="24.00">C</text><text x="143.04" y="155" font-size="24.00">(=</text><text x="172.80" y="155" font-size="24.00">N+Me2</text><text x="247.20" y="155" font-size="24.00">)–CH3 + </text><text x="366.24" y="155" font-size="24.00">:OH2</text><text x="665.00" y="155" font-size="24.00">CH2=C(CH3)NMe2 + H3O+</text><path data-electrons="2" d="M396.00,141.60 Q243.48,98.60 90.96,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#enamine-formation-6-pair)"/><path data-electrons="2" d="M68.64,141.60 Q79.80,203.60 90.96,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#enamine-formation-6-pair)"/><path data-electrons="2" d="M172.80,141.60 Q191.40,80.60 210.00,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#enamine-formation-6-pair)"/><text x="24" y="235" font-size="16">Water removes alpha H; the C–H pair forms C=C and C=N pi electrons return to N.</text></g></g></svg>