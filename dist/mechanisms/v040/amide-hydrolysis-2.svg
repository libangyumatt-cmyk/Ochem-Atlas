<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" role="img"><title>Acid-catalyzed amide hydrolysis: Nucleophilic carbonyl addition</title><desc>CH3–C(=OH+)NH2 + :OH2 → CH3C(OH)(OH2+)NH2. Water adds to activated acyl carbon.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="amide-hydrolysis-2-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="amide-hydrolysis-2-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Acid-catalyzed amide hydrolysis · 2</text><text x="24" y="65" font-size="17">Nucleophilic carbonyl addition</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">CH3–</text><text x="83.52" y="155" font-size="24.00">C</text><text x="98.40" y="155" font-size="24.00">(=</text><text x="128.16" y="155" font-size="24.00">OH+</text><text x="172.80" y="155" font-size="24.00">)NH2 + </text><text x="276.96" y="155" font-size="24.00">:OH2</text><text x="665.00" y="155" font-size="24.00">CH3C(OH)(OH2+)NH2</text><path data-electrons="2" d="M306.72,141.60 Q198.84,98.60 90.96,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#amide-hydrolysis-2-pair)"/><path data-electrons="2" d="M120.72,141.60 Q135.60,203.60 150.48,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#amide-hydrolysis-2-pair)"/><text x="24" y="235" font-size="16">Water adds to activated acyl carbon.</text></g></svg>