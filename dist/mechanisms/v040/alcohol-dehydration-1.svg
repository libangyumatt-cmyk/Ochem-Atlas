<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" role="img"><title>Acid-catalyzed alcohol dehydration: Proton transfer</title><desc>(CH3)3C–O:H + H–OH2+ → (CH3)3COH2+ + H2O. Alcohol oxygen accepts a hydronium proton; the acid O–H pair returns to water.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="alcohol-dehydration-1-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="alcohol-dehydration-1-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Acid-catalyzed alcohol dehydration · 1</text><text x="24" y="65" font-size="17">Proton transfer</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">(CH3)3C–</text><text x="143.04" y="155" font-size="24.00">O:H</text><text x="187.68" y="155" font-size="24.00"> + </text><text x="232.32" y="155" font-size="24.00">H</text><text x="247.20" y="155" font-size="24.00">–</text><text x="262.08" y="155" font-size="24.00">OH2+</text><text x="665.00" y="155" font-size="24.00">(CH3)3COH2+ + H2O</text><path data-electrons="2" d="M165.36,141.60 Q202.56,98.60 239.76,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#alcohol-dehydration-1-pair)"/><path data-electrons="2" d="M265.80,141.60 Q278.82,203.60 291.84,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#alcohol-dehydration-1-pair)"/><text x="24" y="235" font-size="16">Alcohol oxygen accepts a hydronium proton; the acid O–H pair returns to water.</text></g></svg>