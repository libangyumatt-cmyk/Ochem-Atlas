<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1800"><title>Malonic ester synthesis: complete teaching sequence</title><g font-family="DejaVu Sans,sans-serif"><rect width="1200" height="350" fill="#fffefa"/><text x="25" y="32" font-size="21" fill="#203c43">Malonic ester synthesis · representative molecular graphs</text><path d="M383.51,213.91 L341.57,245.38" stroke="#203c43" stroke-width="2" fill="none"/><path d="M341.57,245.38 L288.30,256.55" stroke="#203c43" stroke-width="2" fill="none"/><path d="M288.30,256.55 L233.56,244.41" stroke="#203c43" stroke-width="2" fill="none"/><path d="M235.59,246.63 L196.18,282.71" stroke="#203c43" stroke-width="2" fill="none"/><path d="M231.53,242.20 L192.13,278.29" stroke="#203c43" stroke-width="2" fill="none"/><path d="M233.56,244.41 L211.18,192.69" stroke="#203c43" stroke-width="2" fill="none"/><path d="M211.18,192.69 L205.42,136.50" stroke="#203c43" stroke-width="2" fill="none"/><path d="M203.36,138.68 L164.43,102.01" stroke="#203c43" stroke-width="2" fill="none"/><path d="M207.47,134.31 L168.54,97.64" stroke="#203c43" stroke-width="2" fill="none"/><path d="M205.42,136.50 L248.25,101.92" stroke="#203c43" stroke-width="2" fill="none"/><path d="M248.25,101.92 L297.54,80.50" stroke="#203c43" stroke-width="2" fill="none"/><path d="M297.54,80.50 L349.55,82.00" stroke="#203c43" stroke-width="2" fill="none"/><rect x="368.51" y="203.91" width="30" height="20" fill="#fffefa"/><text x="383.51" y="218.91" font-size="16" text-anchor="middle" fill="#203c43">CH3</text><rect x="326.57" y="235.38" width="30" height="20" fill="#fffefa"/><text x="341.57" y="250.38" font-size="16" text-anchor="middle" fill="#203c43">CH2</text><rect x="283.30" y="246.55" width="10" height="20" fill="#fffefa"/><text x="288.30" y="261.55" font-size="16" text-anchor="middle" fill="#203c43">O</text><rect x="228.56" y="234.41" width="10" height="20" fill="#fffefa"/><text x="233.56" y="249.41" font-size="16" text-anchor="middle" fill="#203c43">C</text><rect x="189.15" y="270.50" width="10" height="20" fill="#fffefa"/><text x="194.15" y="285.50" font-size="16" text-anchor="middle" fill="#203c43">O</text><rect x="196.18" y="182.69" width="30" height="20" fill="#fffefa"/><text x="211.18" y="197.69" font-size="16" text-anchor="middle" fill="#203c43">CH2</text><rect x="200.42" y="126.50" width="10" height="20" fill="#fffefa"/><text x="205.42" y="141.50" font-size="16" text-anchor="middle" fill="#203c43">C</text><rect x="161.49" y="89.83" width="10" height="20" fill="#fffefa"/><text x="166.49" y="104.83" font-size="16" text-anchor="middle" fill="#203c43">O</text><rect x="243.25" y="91.92" width="10" height="20" fill="#fffefa"/><text x="248.25" y="106.92" font-size="16" text-anchor="middle" fill="#203c43">O</text><rect x="282.54" y="70.50" width="30" height="20" fill="#fffefa"/><text x="297.54" y="85.50" font-size="16" text-anchor="middle" fill="#203c43">CH2</text><rect x="334.55" y="72.00" width="30" height="20" fill="#fffefa"/><text x="349.55" y="87.00" font-size="16" text-anchor="middle" fill="#203c43">CH3</text><path d="M1034.33,249.12 L955.81,267.37" stroke="#203c43" stroke-width="2" fill="none"/><path d="M955.81,267.37 L882.42,229.80" stroke="#203c43" stroke-width="2" fill="none"/><path d="M882.42,229.80 L854.47,150.50" stroke="#203c43" stroke-width="2" fill="none"/><path d="M852.38,152.65 L793.59,95.79" stroke="#203c43" stroke-width="2" fill="none"/><path d="M856.56,148.34 L797.76,91.48" stroke="#203c43" stroke-width="2" fill="none"/><path d="M854.47,150.50 L914.04,94.96" stroke="#203c43" stroke-width="2" fill="none"/><rect x="1019.33" y="239.12" width="30" height="20" fill="#fffefa"/><text x="1034.33" y="254.12" font-size="16" text-anchor="middle" fill="#203c43">CH3</text><rect x="940.81" y="257.37" width="30" height="20" fill="#fffefa"/><text x="955.81" y="272.37" font-size="16" text-anchor="middle" fill="#203c43">CH2</text><rect x="867.42" y="219.80" width="30" height="20" fill="#fffefa"/><text x="882.42" y="234.80" font-size="16" text-anchor="middle" fill="#203c43">CH2</text><rect x="849.47" y="140.50" width="10" height="20" fill="#fffefa"/><text x="854.47" y="155.50" font-size="16" text-anchor="middle" fill="#203c43">C</text><rect x="790.67" y="83.63" width="10" height="20" fill="#fffefa"/><text x="795.67" y="98.63" font-size="16" text-anchor="middle" fill="#203c43">O</text><rect x="904.04" y="84.96" width="20" height="20" fill="#fffefa"/><text x="914.04" y="99.96" font-size="16" text-anchor="middle" fill="#203c43">OH</text><text x="580" y="180" font-size="32" fill="#203c43">→</text><text x="25" y="330" font-size="15" fill="#203c43">Representative substrate/product connectivity; other reagents/byproducts are in the equation. No computed geometry.</text></g><g transform="translate(0,350)"><title>Malonic ester synthesis: Proton transfer</title><desc>EtO2C–CH(H)–CO2Et + :OEt− → [EtO2CCHCO2Et]− + EtOH. Ethoxide removes a methylene proton; both ester groups stabilize the enolate.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="malonic-ester-synthesis-1-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="malonic-ester-synthesis-1-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Malonic ester synthesis · 1</text><text x="24" y="65" font-size="17">Proton transfer</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">EtO2C–</text><text x="113.28" y="155" font-size="24.00">CH</text><text x="143.04" y="155" font-size="24.00">(</text><text x="157.92" y="155" font-size="24.00">H</text><text x="172.80" y="155" font-size="24.00">)–CO2Et + </text><text x="321.60" y="155" font-size="24.00">:OEt−</text><text x="665.00" y="155" font-size="24.00">[EtO2CCHCO2Et]− + EtOH</text><path data-electrons="2" d="M358.80,141.60 Q262.08,98.60 165.36,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#malonic-ester-synthesis-1-pair)"/><path data-electrons="2" d="M146.76,141.60 Q137.46,203.60 128.16,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#malonic-ester-synthesis-1-pair)"/><text x="24" y="235" font-size="16">Ethoxide removes a methylene proton; both ester groups stabilize the enolate.</text></g></g><g transform="translate(0,640)"><title>Malonic ester synthesis: Bond-replacing displacement</title><desc>EtO2C–CH−–CO2Et + CH3–CH2–Br → EtO2CCH(Et)CO2Et + Br−. Carbon enolate attacks primary ethyl carbon; bromide leaves.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="malonic-ester-synthesis-2-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="malonic-ester-synthesis-2-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Malonic ester synthesis · 2</text><text x="24" y="65" font-size="17">Bond-replacing displacement</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">EtO2C–</text><text x="113.28" y="155" font-size="24.00">CH−</text><text x="157.92" y="155" font-size="24.00">–CO2Et + CH3–</text><text x="351.36" y="155" font-size="24.00">CH2</text><text x="396.00" y="155" font-size="24.00">–</text><text x="410.88" y="155" font-size="24.00">Br</text><text x="665.00" y="155" font-size="24.00">EtO2CCH(Et)CO2Et + Br−</text><path data-electrons="2" d="M135.60,141.60 Q254.64,98.60 373.68,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#malonic-ester-synthesis-2-pair)"/><path data-electrons="2" d="M399.72,141.60 Q412.74,203.60 425.76,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#malonic-ester-synthesis-2-pair)"/><text x="24" y="235" font-size="16">Carbon enolate attacks primary ethyl carbon; bromide leaves.</text></g></g><g transform="translate(0,930)"><title>Malonic ester synthesis: Mechanistic boundary / grouped stage</title><desc>EtO2CCH(Et)CO2Et + hydrolysis / acidification → HO2CCH(Et)CO2H + 2 EtOH. Each ester undergoes addition–elimination hydrolysis and protonation. The individual saponification stages are detailed in the ester-hydrolysis entry.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="malonic-ester-synthesis-3-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="malonic-ester-synthesis-3-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Malonic ester synthesis · 3</text><text x="24" y="65" font-size="17">Mechanistic boundary / grouped stage</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="18.64">EtO2CCH(Et)CO2Et + hydrolysis / acidification</text><text x="665.00" y="155" font-size="24.00">HO2CCH(Et)CO2H + 2 EtOH</text><text x="30" y="202" font-size="16">Process model: no unique microscopic electron-arrow sequence asserted.</text><text x="24" y="235" font-size="16">Each ester undergoes addition–elimination hydrolysis and protonation. The individual saponification stages</text><text x="24" y="258" font-size="16">are detailed in the ester-hydrolysis entry.</text></g></g><g transform="translate(0,1220)"><title>Malonic ester synthesis: Thermal malonic-acid decarboxylation</title><desc>HO2C–CH(Et)–CO2H → EtCH=C(OH)2 + CO2. A cyclic proton-transfer/bond-reorganization model loses CO2 and gives the acid enol.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="malonic-ester-synthesis-4-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="malonic-ester-synthesis-4-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Malonic ester synthesis · 4</text><text x="24" y="65" font-size="17">Thermal malonic-acid decarboxylation</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">HO2C–CH(Et)–CO2H</text><text x="665.00" y="155" font-size="24.00">EtCH=C(OH)2 + CO2</text><text x="30" y="202" font-size="16">Condensed structural stage; electron changes are specified below.</text><text x="24" y="235" font-size="16">A cyclic proton-transfer/bond-reorganization model loses CO2 and gives the acid enol.</text></g></g><g transform="translate(0,1510)"><title>Malonic ester synthesis: Mechanistic boundary / grouped stage</title><desc>EtCH=C(OH)2 + acid/base proton relays → EtCH2CO2H. Solvent-mediated tautomerization yields butanoic acid; no uncatalyzed1,3 hydrogen shift is asserted.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="malonic-ester-synthesis-5-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="malonic-ester-synthesis-5-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Malonic ester synthesis · 5</text><text x="24" y="65" font-size="17">Mechanistic boundary / grouped stage</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="22.67">EtCH=C(OH)2 + acid/base proton relays</text><text x="665.00" y="155" font-size="24.00">EtCH2CO2H</text><text x="30" y="202" font-size="16">Process model: no unique microscopic electron-arrow sequence asserted.</text><text x="24" y="235" font-size="16">Solvent-mediated tautomerization yields butanoic acid; no uncatalyzed1,3 hydrogen shift is asserted.</text></g></g></svg>