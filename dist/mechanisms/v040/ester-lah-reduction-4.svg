<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" role="img"><title>Lithium aluminum hydride ester reduction: Nucleophilic carbonyl addition</title><desc>CH3–CH=O + Al–H → CH3CH2O− (Al-bound). A second hydride reduces the aldehyde to primary alkoxide.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="ester-lah-reduction-4-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="ester-lah-reduction-4-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Lithium aluminum hydride ester reduction · 4</text><text x="24" y="65" font-size="17">Nucleophilic carbonyl addition</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">CH3–</text><text x="83.52" y="155" font-size="24.00">CH</text><text x="113.28" y="155" font-size="24.00">=</text><text x="128.16" y="155" font-size="24.00">O</text><text x="143.04" y="155" font-size="24.00"> + </text><text x="187.68" y="155" font-size="24.00">Al</text><text x="217.44" y="155" font-size="24.00">–</text><text x="232.32" y="155" font-size="24.00">H</text><text x="665.00" y="155" font-size="24.00">CH3CH2O− (Al-bound)</text><path data-electrons="2" d="M221.16,141.60 Q159.78,98.60 98.40,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#ester-lah-reduction-4-pair)"/><path data-electrons="2" d="M117.00,141.60 Q126.30,203.60 135.60,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#ester-lah-reduction-4-pair)"/><text x="24" y="235" font-size="16">A second hydride reduces the aldehyde to primary alkoxide.</text></g></svg>