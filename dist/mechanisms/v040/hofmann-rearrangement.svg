</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="hofmann-rearrangement-1-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="hofmann-rearrangement-1-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Hofmann amide rearrangement · 1</text><text x="24" y="65" font-size="17">Proton transfer</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">PhCO–</text><text x="98.40" y="155" font-size="24.00">NH</text><text x="128.16" y="155" font-size="24.00">–</text><text x="143.04" y="155" font-size="24.00">H</text><text x="157.92" y="155" font-size="24.00"> + </text><text x="202.56" y="155" font-size="24.00">:OH−</text><text x="665.00" y="155" font-size="24.00">PhCONH− + H2O</text><path data-electrons="2" d="M232.32,141.60 Q191.40,98.60 150.48,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#hofmann-rearrangement-1-pair)"/><path data-electrons="2" d="M131.88,141.60 Q122.58,203.60 113.28,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#hofmann-rearrangement-1-pair)"/><text x="24" y="235" font-size="16">Deprotonate amide nitrogen.</text></g></g><g transform="translate(0,640)"><title>Hofmann amide rearrangement: Bond-replacing displacement</title><desc>PhCO–NH:− + Br–Br → PhCONHBr + Br−. Nitrogen attacks bromine and Br–Br cleavage gives N-bromoamide.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="hofmann-rearrangement-2-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="hofmann-rearrangement-2-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Hofmann amide rearrangement · 2</text><text x="24" y="65" font-size="17">Bond-replacing displacement</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">PhCO–</text><text x="98.40" y="155" font-size="24.00">NH:−</text><text x="157.92" y="155" font-size="24.00"> + </text><text x="202.56" y="155" font-size="24.00">Br</text><text x="232.32" y="155" font-size="24.00">–</text><text x="247.20" y="155" font-size="24.00">Br</text><text x="665.00" y="155" font-size="24.00">PhCONHBr + Br−</text><path data-electrons="2" d="M128.16,141.60 Q172.80,98.60 217.44,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#hofmann-rearrangement-2-pair)"/><path data-electrons="2" d="M239.76,141.60 Q250.92,203.60 262.08,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#hofmann-rearrangement-2-pair)"/><text x="24" y="235" font-size="16">Nitrogen attacks bromine and Br–Br cleavage gives N-bromoamide.</text></g></g><g transform="translate(0,930)"><title>Hofmann amide rearrangement: Proton transfer</title><desc>PhCO–N(Br)–H + :OH− → PhCON−Br + H2O. Remove the remaining N proton.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="hofmann-rearrangement-3-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="hofmann-rearrangement-3-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Hofmann amide rearrangement · 3</text><text x="24" y="65" font-size="17">Proton transfer</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">PhCO–</text><text x="98.40" y="155" font-size="24.00">N</text><text x="113.28" y="155" font-size="24.00">(Br)–</text><text x="187.68" y="155" font-size="24.00">H</text><text x="202.56" y="155" font-size="24.00"> + </text><text x="247.20" y="155" font-size="24.00">:OH−</text><text x="665.00" y="155" font-size="24.00">PhCON−Br + H2O</text><path data-electrons="2" d="M276.96,141.60 Q236.04,98.60 195.12,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#hofmann-rearrangement-3-pair)"/><path data-electrons="2" d="M150.48,141.60 Q128.16,203.60 105.84,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#hofmann-rearrangement-3-pair)"/><text x="24" y="235" font-size="16">Remove the remaining N proton.</text></g></g><g transform="translate(0,1220)"><title>Hofmann amide rearrangement: Coupled polar bond reorganization</title><desc>Ph–C(=O)–N−–Br → PhN=C=O + Br−. Phenyl migrates from acyl C to N as bromide leaves and C=N forms; a free nitrene is not inserted.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="hofmann-rearrangement-4-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="hofmann-rearrangement-4-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Hofmann amide rearrangement · 4</text><text x="24" y="65" font-size="17">Coupled polar bond reorganization</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">Ph</text><text x="53.76" y="155" font-size="24.00">–</text><text x="68.64" y="155" font-size="24.00">C</text><text x="83.52" y="155" font-size="24.00">(=O)–</text><text x="157.92" y="155" font-size="24.00">N−</text><text x="187.68" y="155" font-size="24.00">–</text><text x="202.56" y="155" font-size="24.00">Br</text><text x="665.00" y="155" font-size="24.00">PhN=C=O + Br−</text><path data-electrons="2" d="M57.48,141.60 Q115.14,98.60 172.80,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#hofmann-rearrangement-4-pair)"/><path data-electrons="2" d="M195.12,141.60 Q206.28,203.60 217.44,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#hofmann-rearrangement-4-pair)"/><path data-electrons="2" d="M172.80,141.60 Q148.62,80.60 124.44,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#hofmann-rearrangement-4-pair)"/><text x="24" y="235" font-size="16">Phenyl migrates from acyl C to N as bromide leaves and C=N forms; a free nitrene is not inserted.</text></g></g><g transform="translate(0,1510)"><title>Hofmann amide rearrangement: Mechanistic boundary / grouped stage</title><desc>PhN=C=O + H2O → PhNHCO2H. Water addition and proton transfers convert isocyanate into carbamic acid.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="hofmann-rearrangement-5-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="hofmann-rearrangement-5-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Hofmann amide rearrangement · 5</text><text x="24" y="65" font-size="17">Mechanistic boundary / grouped stage</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">PhN=C=O + H2O</text><text x="665.00" y="155" font-size="24.00">PhNHCO2H</text><text x="30" y="202" font-size="16">Process model: no unique microscopic electron-arrow sequence asserted.</text><text x="24" y="235" font-size="16">Water addition and proton transfers convert isocyanate into carbamic acid.</text></g></g><g transform="translate(0,1800)"><title>Hofmann amide rearrangement: Mechanistic boundary / grouped stage</title><desc>PhNHCO2H → PhNH2 + CO2. Proton transfer and decarboxylation release aniline; exact solvent relays are grouped.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="hofmann-rearrangement-6-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="hofmann-rearrangement-6-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Hofmann amide rearrangement · 6</text><text x="24" y="65" font-size="17">Mechanistic boundary / grouped stage</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">PhNHCO2H</text><text x="665.00" y="155" font-size="24.00">PhNH2 + CO2</text><text x="30" y="202" font-size="16">Process model: no unique microscopic electron-arrow sequence asserted.</text><text x="24" y="235" font-size="16">Proton transfer and decarboxylation release aniline; exact solvent relays are grouped.</text></g></g></svg>