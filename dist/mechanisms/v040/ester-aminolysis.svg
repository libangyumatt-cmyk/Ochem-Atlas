<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1160"><title>Ester aminolysis: complete teaching sequence</title><g transform="translate(0,0)"><title>Ester aminolysis: Nucleophilic carbonyl addition</title><desc>CH3–C(=O)OEt + :NH3 → CH3C(O−)(OEt)(NH3+). Ammonia adds to acyl carbon, giving a zwitterionic tetrahedral form.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="ester-aminolysis-1-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="ester-aminolysis-1-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Ester aminolysis · 1</text><text x="24" y="65" font-size="17">Nucleophilic carbonyl addition</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">CH3–</text><text x="83.52" y="155" font-size="24.00">C</text><text x="98.40" y="155" font-size="24.00">(=</text><text x="128.16" y="155" font-size="24.00">O</text><text x="143.04" y="155" font-size="24.00">)OEt + </text><text x="247.20" y="155" font-size="24.00">:NH3</text><text x="665.00" y="155" font-size="24.00">CH3C(O−)(OEt)(NH3+)</text><path data-electrons="2" d="M276.96,141.60 Q183.96,98.60 90.96,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#ester-aminolysis-1-pair)"/><path data-electrons="2" d="M113.28,141.60 Q124.44,203.60 135.60,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#ester-aminolysis-1-pair)"/><text x="24" y="235" font-size="16">Ammonia adds to acyl carbon, giving a zwitterionic tetrahedral form.</text></g></g><g transform="translate(0,290)"><title>Ester aminolysis: Proton transfer</title><desc>CH3C(O−)(OEt)–NH2+–H + :NH3 → CH3C(O−)(OEt)NH2 + NH4+. A second ammonia removes the N proton.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="ester-aminolysis-2-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="ester-aminolysis-2-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Ester aminolysis · 2</text><text x="24" y="65" font-size="17">Proton transfer</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">CH3C(O−)(OEt)–</text><text x="232.32" y="155" font-size="24.00">NH2+</text><text x="291.84" y="155" font-size="24.00">–</text><text x="306.72" y="155" font-size="24.00">H</text><text x="321.60" y="155" font-size="24.00"> + </text><text x="366.24" y="155" font-size="24.00">:NH3</text><text x="665.00" y="155" font-size="24.00">CH3C(O−)(OEt)NH2 + NH4+</text><path data-electrons="2" d="M396.00,141.60 Q355.08,98.60 314.16,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#ester-aminolysis-2-pair)"/><path data-electrons="2" d="M288.12,141.60 Q275.10,203.60 262.08,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#ester-aminolysis-2-pair)"/><text x="24" y="235" font-size="16">A second ammonia removes the N proton.</text></g></g><g transform="translate(0,580)"><title>Ester aminolysis: Tetrahedral intermediate collapse</title><desc>CH3–C(O−)(NH2)–OEt → CH3CONH2 + EtO−. Carbonyl reformation expels ethoxide.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="ester-aminolysis-3-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="ester-aminolysis-3-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Ester aminolysis · 3</text><text x="24" y="65" font-size="17">Tetrahedral intermediate collapse</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">CH3–</text><text x="83.52" y="155" font-size="24.00">C</text><text x="98.40" y="155" font-size="24.00">(</text><text x="113.28" y="155" font-size="24.00">O−</text><text x="143.04" y="155" font-size="24.00">)(NH2)–</text><text x="247.20" y="155" font-size="24.00">OEt</text><text x="665.00" y="155" font-size="24.00">CH3CONH2 + EtO−</text><path data-electrons="2" d="M128.16,141.60 Q118.86,98.60 109.56,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#ester-aminolysis-3-pair)"/><path data-electrons="2" d="M180.24,141.60 Q224.88,203.60 269.52,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#ester-aminolysis-3-pair)"/><text x="24" y="235" font-size="16">Carbonyl reformation expels ethoxide.</text></g></g><g transform="translate(0,870)"><title>Ester aminolysis: Proton transfer</title><desc>EtO− + H–NH3+ → EtOH + NH3. Ethoxide takes an ammonium proton, completing the proton inventory.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="ester-aminolysis-4-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="ester-aminolysis-4-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Ester aminolysis · 4</text><text x="24" y="65" font-size="17">Proton transfer</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">Et</text><text x="53.76" y="155" font-size="24.00">O−</text><text x="83.52" y="155" font-size="24.00"> + </text><text x="128.16" y="155" font-size="24.00">H</text><text x="143.04" y="155" font-size="24.00">–</text><text x="157.92" y="155" font-size="24.00">NH3+</text><text x="665.00" y="155" font-size="24.00">EtOH + NH3</text><path data-electrons="2" d="M68.64,141.60 Q102.12,98.60 135.60,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#ester-aminolysis-4-pair)"/><path data-electrons="2" d="M161.64,141.60 Q174.66,203.60 187.68,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#ester-aminolysis-4-pair)"/><text x="24" y="235" font-size="16">Ethoxide takes an ammonium proton, completing the proton inventory.</text></g></g></svg>