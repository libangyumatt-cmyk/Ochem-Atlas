<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1510"><title>Alkene hydroboration–oxidation: complete teaching sequence</title><g font-family="DejaVu Sans,sans-serif"><rect width="1200" height="350" fill="#fffefa"/><text x="25" y="32" font-size="21" fill="#203c43">Alkene hydroboration–oxidation · representative molecular graphs</text><path d="M339.95,219.45 L262.88,200.71" stroke="#203c43" stroke-width="2" fill="none"/><path d="M260.64,202.70 L207.81,143.54" stroke="#203c43" stroke-width="2" fill="none"/><path d="M265.12,198.71 L212.29,139.55" stroke="#203c43" stroke-width="2" fill="none"/><rect x="324.95" y="209.45" width="30" height="20" fill="#fffefa"/><text x="339.95" y="224.45" font-size="16" text-anchor="middle" fill="#203c43">CH3</text><rect x="252.88" y="190.71" width="20" height="20" fill="#fffefa"/><text x="262.88" y="205.71" font-size="16" text-anchor="middle" fill="#203c43">CH</text><rect x="195.05" y="131.55" width="30" height="20" fill="#fffefa"/><text x="210.05" y="146.55" font-size="16" text-anchor="middle" fill="#203c43">CH2</text><path d="M986.07,251.57 L906.46,246.18" stroke="#203c43" stroke-width="2" fill="none"/><path d="M906.46,246.18 L849.32,189.04" stroke="#203c43" stroke-width="2" fill="none"/><path d="M849.32,189.04 L843.93,109.43" stroke="#203c43" stroke-width="2" fill="none"/><rect x="971.07" y="241.57" width="30" height="20" fill="#fffefa"/><text x="986.07" y="256.57" font-size="16" text-anchor="middle" fill="#203c43">CH3</text><rect x="891.46" y="236.18" width="30" height="20" fill="#fffefa"/><text x="906.46" y="251.18" font-size="16" text-anchor="middle" fill="#203c43">CH2</text><rect x="834.32" y="179.04" width="30" height="20" fill="#fffefa"/><text x="849.32" y="194.04" font-size="16" text-anchor="middle" fill="#203c43">CH2</text><rect x="833.93" y="99.43" width="20" height="20" fill="#fffefa"/><text x="843.93" y="114.43" font-size="16" text-anchor="middle" fill="#203c43">OH</text><text x="580" y="180" font-size="32" fill="#203c43">→</text><text x="25" y="330" font-size="15" fill="#203c43">Representative substrate/product connectivity; other reagents/byproducts are in the equation. No computed geometry.</text></g><g transform="translate(0,350)"><title>Alkene hydroboration–oxidation: Concerted hydroboration</title><desc>CH3–CH=CH2 + R2B–H → CH3CH2CH2–BR2. The alkene pi pair donates to B while B–H donates to the other alkene carbon in a concerted four-center model.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="hydroboration-oxidation-1-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="hydroboration-oxidation-1-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Alkene hydroboration–oxidation · 1</text><text x="24" y="65" font-size="17">Concerted hydroboration</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">CH3–</text><text x="83.52" y="155" font-size="24.00">CH</text><text x="113.28" y="155" font-size="24.00">=</text><text x="128.16" y="155" font-size="24.00">CH2</text><text x="172.80" y="155" font-size="24.00"> + R2</text><text x="247.20" y="155" font-size="24.00">B</text><text x="262.08" y="155" font-size="24.00">–</text><text x="276.96" y="155" font-size="24.00">H</text><text x="665.00" y="155" font-size="24.00">CH3CH2CH2–BR2</text><path data-electrons="2" d="M124.44,141.60 Q189.54,98.60 254.64,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#hydroboration-oxidation-1-pair)"/><path data-electrons="2" d="M269.52,141.60 Q183.96,203.60 98.40,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#hydroboration-oxidation-1-pair)"/><text x="24" y="235" font-size="16">The alkene pi pair donates to B while B–H donates to the other alkene carbon in a concerted four-center</text><text x="24" y="258" font-size="16">model.</text></g></g><g transform="translate(0,640)"><title>Alkene hydroboration–oxidation: Lone-pair capture</title><desc>R2B–Pr + :O−–OH → [R2B(Pr)(OOH)]−. Hydroperoxide anion attacks electron-deficient boron; no carbon cation is formed.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="hydroboration-oxidation-2-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="hydroboration-oxidation-2-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Alkene hydroboration–oxidation · 2</text><text x="24" y="65" font-size="17">Lone-pair capture</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">R2</text><text x="53.76" y="155" font-size="24.00">B</text><text x="68.64" y="155" font-size="24.00">–Pr + </text><text x="157.92" y="155" font-size="24.00">:O−</text><text x="202.56" y="155" font-size="24.00">–OH</text><text x="665.00" y="155" font-size="24.00">[R2B(Pr)(OOH)]−</text><path data-electrons="2" d="M180.24,141.60 Q120.72,98.60 61.20,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#hydroboration-oxidation-2-pair)"/><text x="24" y="235" font-size="16">Hydroperoxide anion attacks electron-deficient boron; no carbon cation is formed.</text></g></g><g transform="translate(0,930)"><title>Alkene hydroboration–oxidation: Coupled polar bond reorganization</title><desc>[R2B(Pr)–O–OH]− → R2B–OPr + OH−. The C–B bond migrates to adjacent oxygen as O–O cleaves to hydroxide. This is intramolecular migration, not free propyl anion.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="hydroboration-oxidation-3-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="hydroboration-oxidation-3-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Alkene hydroboration–oxidation · 3</text><text x="24" y="65" font-size="17">Coupled polar bond reorganization</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">[R2</text><text x="68.64" y="155" font-size="24.00">B</text><text x="83.52" y="155" font-size="24.00">(</text><text x="98.40" y="155" font-size="24.00">Pr</text><text x="128.16" y="155" font-size="24.00">)–</text><text x="157.92" y="155" font-size="24.00">O</text><text x="172.80" y="155" font-size="24.00">–</text><text x="187.68" y="155" font-size="24.00">OH</text><text x="217.44" y="155" font-size="24.00">]−</text><text x="665.00" y="155" font-size="24.00">R2B–OPr + OH−</text><path data-electrons="2" d="M94.68,141.60 Q130.02,98.60 165.36,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#hydroboration-oxidation-3-pair)"/><path data-electrons="2" d="M183.96,141.60 Q193.26,203.60 202.56,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#hydroboration-oxidation-3-pair)"/><text x="24" y="235" font-size="16">The C–B bond migrates to adjacent oxygen as O–O cleaves to hydroxide. This is intramolecular migration, not</text><text x="24" y="258" font-size="16">free propyl anion.</text></g></g><g transform="translate(0,1220)"><title>Alkene hydroboration–oxidation: Mechanistic boundary / grouped stage</title><desc>R2B–OPr + H2O / OH− → PrOH + borate-derived products. Hydrolysis/proton transfers release 1-propanol. Borate speciation and repeated oxidation of the 9-BBN framework are grouped.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="hydroboration-oxidation-4-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="hydroboration-oxidation-4-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Alkene hydroboration–oxidation · 4</text><text x="24" y="65" font-size="17">Mechanistic boundary / grouped stage</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">R2B–OPr + H2O / OH−</text><text x="665.00" y="155" font-size="24.00">PrOH + borate-derived products</text><text x="30" y="202" font-size="16">Process model: no unique microscopic electron-arrow sequence asserted.</text><text x="24" y="235" font-size="16">Hydrolysis/proton transfers release 1-propanol. Borate speciation and repeated oxidation of the 9-BBN</text><text x="24" y="258" font-size="16">framework are grouped.</text></g></g></svg>