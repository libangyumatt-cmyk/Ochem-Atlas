<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" role="img"><title>Alkene hydroboration–oxidation: Coupled polar bond reorganization</title><desc>[R2B(Pr)–O–OH]− → R2B–OPr + OH−. The C–B bond migrates to adjacent oxygen as O–O cleaves to hydroxide. This is intramolecular migration, not free propyl anion.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="hydroboration-oxidation-3-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="hydroboration-oxidation-3-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Alkene hydroboration–oxidation · 3</text><text x="24" y="65" font-size="17">Coupled polar bond reorganization</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">[R2</text><text x="68.64" y="155" font-size="24.00">B</text><text x="83.52" y="155" font-size="24.00">(</text><text x="98.40" y="155" font-size="24.00">Pr</text><text x="128.16" y="155" font-size="24.00">)–</text><text x="157.92" y="155" font-size="24.00">O</text><text x="172.80" y="155" font-size="24.00">–</text><text x="187.68" y="155" font-size="24.00">OH</text><text x="217.44" y="155" font-size="24.00">]−</text><text x="665.00" y="155" font-size="24.00">R2B–OPr + OH−</text><path data-electrons="2" d="M94.68,141.60 Q130.02,98.60 165.36,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#hydroboration-oxidation-3-pair)"/><path data-electrons="2" d="M183.96,141.60 Q193.26,203.60 202.56,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#hydroboration-oxidation-3-pair)"/><text x="24" y="235" font-size="16">The C–B bond migrates to adjacent oxygen as O–O cleaves to hydroxide. This is intramolecular migration, not free propyl anion.</text></g></svg>