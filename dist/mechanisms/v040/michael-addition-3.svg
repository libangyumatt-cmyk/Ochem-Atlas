<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" role="img"><title>Michael conjugate addition: Proton transfer</title><desc>CH3COCH2CH2–CH−–COCH3 + H–OH → CH3COCH2CH2CH2COCH3 + OH−. Water protonates the acceptor enolate carbon, giving the1,5-dicarbonyl.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="michael-addition-3-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="michael-addition-3-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Michael conjugate addition · 3</text><text x="24" y="65" font-size="17">Proton transfer</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">CH3COCH2CH2–</text><text x="202.56" y="155" font-size="24.00">CH−</text><text x="247.20" y="155" font-size="24.00">–COCH3 + </text><text x="381.12" y="155" font-size="24.00">H</text><text x="396.00" y="155" font-size="24.00">–</text><text x="410.88" y="155" font-size="24.00">OH</text><text x="665.00" y="155" font-size="24.00">CH3COCH2CH2CH2COCH3 + OH−</text><path data-electrons="2" d="M224.88,141.60 Q306.72,98.60 388.56,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#michael-addition-3-pair)"/><path data-electrons="2" d="M407.16,141.60 Q416.46,203.60 425.76,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#michael-addition-3-pair)"/><text x="24" y="235" font-size="16">Water protonates the acceptor enolate carbon, giving the1,5-dicarbonyl.</text></g></svg>