dth="2" fill="none"/><path d="M910.86,189.78 L933.99,142.01" stroke="#203c43" stroke-width="2" fill="none" stroke-dasharray="4 3"/><rect x="984.18" y="209.70" width="10" height="20" fill="#fffefa"/><text x="989.18" y="224.70" font-size="16" text-anchor="middle" fill="#203c43">O</text><rect x="934.31" y="225.33" width="10" height="20" fill="#fffefa"/><text x="939.31" y="240.33" font-size="16" text-anchor="middle" fill="#203c43">S</text><rect x="960.64" y="270.50" width="10" height="20" fill="#fffefa"/><text x="965.64" y="285.50" font-size="16" text-anchor="middle" fill="#203c43">O</text><rect x="891.64" y="260.87" width="20" height="20" fill="#fffefa"/><text x="901.64" y="275.87" font-size="16" text-anchor="middle" fill="#203c43">OH</text><rect x="903.16" y="178.47" width="10" height="20" fill="#fffefa"/><text x="908.16" y="193.47" font-size="16" text-anchor="middle" fill="#203c43">C</text><rect x="848.33" y="157.56" width="20" height="20" fill="#fffefa"/><text x="858.33" y="172.56" font-size="16" text-anchor="middle" fill="#203c43">CH</text><rect x="830.82" y="108.84" width="20" height="20" fill="#fffefa"/><text x="840.82" y="123.84" font-size="16" text-anchor="middle" fill="#203c43">CH</text><rect x="864.70" y="70.50" width="20" height="20" fill="#fffefa"/><text x="874.70" y="85.50" font-size="16" text-anchor="middle" fill="#203c43">CH</text><rect x="914.61" y="79.89" width="20" height="20" fill="#fffefa"/><text x="924.61" y="94.89" font-size="16" text-anchor="middle" fill="#203c43">CH</text><rect x="921.29" y="130.70" width="20" height="20" fill="#fffefa"/><text x="931.29" y="145.70" font-size="16" text-anchor="middle" fill="#203c43">CH</text><text x="580" y="180" font-size="32" fill="#203c43">→</text><text x="25" y="330" font-size="15" fill="#203c43">Representative substrate/product connectivity; other reagents/byproducts are in the equation. No computed geometry.</text></g><g transform="translate(0,350)"><title>Aromatic sulfonation: Coupled polar bond reorganization</title><desc>ring CH=CH–CH=CH–CH=CH–(back) + S(=O)(=O)=O → [C6H6–SO3] zwitterionic sigma complex. Arene pi electrons attack sulfur; one S=O bond polarizes to oxygen, giving an arenium/sulfonate description.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="aromatic-sulfonation-1-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="aromatic-sulfonation-1-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Aromatic sulfonation · 1</text><text x="24" y="65" font-size="17">Coupled polar bond reorganization</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="19.50">ring </text><text x="84.47" y="155" font-size="19.50">CH</text><text x="108.65" y="155" font-size="19.50">=</text><text x="120.74" y="155" font-size="19.50">CH</text><text x="144.93" y="155" font-size="19.50">–CH=CH–CH=CH–(back) + </text><text x="410.98" y="155" font-size="19.50">S</text><text x="423.07" y="155" font-size="19.50">(=</text><text x="447.26" y="155" font-size="19.50">O</text><text x="459.35" y="155" font-size="19.50">)(=O)=O</text><text x="665.00" y="155" font-size="22.23">[C6H6–SO3] zwitterionic sigma complex</text><path data-electrons="2" d="M114.70,143.17 Q265.86,100.17 417.02,139.17" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#aromatic-sulfonation-1-pair)"/><path data-electrons="2" d="M435.16,143.17 Q444.23,205.17 453.30,139.17" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#aromatic-sulfonation-1-pair)"/><text x="24" y="235" font-size="16">Arene pi electrons attack sulfur; one S=O bond polarizes to oxygen, giving an arenium/sulfonate description.</text></g></g><g transform="translate(0,640)"><title>Aromatic sulfonation: Coupled polar bond reorganization</title><desc>ring C(H)(SO3−)–CH+–CH=CH–CH=CH–(back) + :solvent → C6H5SO3H + solvent. Solvent-mediated loss of ring H restores aromaticity; protonation of sulfonate gives the sulfonic acid. Proton relays are grouped.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="aromatic-sulfonation-2-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="aromatic-sulfonation-2-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Aromatic sulfonation · 2</text><text x="24" y="65" font-size="17">Coupled polar bond reorganization</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="17.12">ring </text><text x="77.06" y="155" font-size="17.12">C</text><text x="87.67" y="155" font-size="17.12">(</text><text x="98.29" y="155" font-size="17.12">H</text><text x="108.90" y="155" font-size="17.12">)(SO3−)–</text><text x="193.80" y="155" font-size="17.12">CH+</text><text x="225.63" y="155" font-size="17.12">–CH=CH–CH=CH–(back) + </text><text x="459.10" y="155" font-size="17.12">:solvent</text><text x="665.00" y="155" font-size="24.00">C6H5SO3H + solvent</text><path data-electrons="2" d="M501.55,144.01 Q302.57,101.01 103.59,140.01" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#aromatic-sulfonation-2-pair)"/><path data-electrons="2" d="M92.98,144.01 Q119.51,206.01 146.04,140.01" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#aromatic-sulfonation-2-pair)"/><text x="24" y="235" font-size="16">Solvent-mediated loss of ring H restores aromaticity; protonation of sulfonate gives the sulfonic acid.</text><text x="24" y="258" font-size="16">Proton relays are grouped.</text></g></g></svg>