<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" role="img"><title>Baeyer–Villiger oxidation: Nucleophilic carbonyl addition</title><desc>Ph–C(=OH+)Me + ArCO2–O:H → PhC(OH)(Me)–O+H–OCOAr. The terminal peracid oxygen adds to carbonyl carbon; Ar=3-chlorophenyl.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="baeyer-villiger-2-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="baeyer-villiger-2-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Baeyer–Villiger oxidation · 2</text><text x="24" y="65" font-size="17">Nucleophilic carbonyl addition</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">Ph–</text><text x="68.64" y="155" font-size="24.00">C</text><text x="83.52" y="155" font-size="24.00">(=</text><text x="113.28" y="155" font-size="24.00">OH+</text><text x="157.92" y="155" font-size="24.00">)Me + ArCO2–</text><text x="336.48" y="155" font-size="24.00">O:H</text><text x="665.00" y="155" font-size="24.00">PhC(OH)(Me)–O+H–OCOAr</text><path data-electrons="2" d="M358.80,141.60 Q217.44,98.60 76.08,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#baeyer-villiger-2-pair)"/><path data-electrons="2" d="M105.84,141.60 Q120.72,203.60 135.60,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#baeyer-villiger-2-pair)"/><text x="24" y="235" font-size="16">The terminal peracid oxygen adds to carbonyl carbon; Ar=3-chlorophenyl.</text></g></svg>