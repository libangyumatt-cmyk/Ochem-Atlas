<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" role="img"><title>Neighboring sulfur participation: Bond-replacing displacement</title><desc>[Me–S+(CH2–CH2 ring)] + :OH2 → MeS–CH2CH2–OH2+. Water opens the episulfonium from behind a C–S bond; that pair returns to sulfur.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="neighboring-sulfur-2-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="neighboring-sulfur-2-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Neighboring sulfur participation · 2</text><text x="24" y="65" font-size="17">Bond-replacing displacement</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">[Me–</text><text x="83.52" y="155" font-size="24.00">S+</text><text x="113.28" y="155" font-size="24.00">(</text><text x="128.16" y="155" font-size="24.00">CH2</text><text x="172.80" y="155" font-size="24.00">–</text><text x="187.68" y="155" font-size="24.00">CH2</text><text x="232.32" y="155" font-size="24.00"> ring)] + </text><text x="381.12" y="155" font-size="24.00">:OH2</text><text x="665.00" y="155" font-size="24.00">MeS–CH2CH2–OH2+</text><path data-electrons="2" d="M410.88,141.60 Q310.44,98.60 210.00,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#neighboring-sulfur-2-pair)"/><path data-electrons="2" d="M154.20,141.60 Q126.30,203.60 98.40,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#neighboring-sulfur-2-pair)"/><text x="24" y="235" font-size="16">Water opens the episulfonium from behind a C–S bond; that pair returns to sulfur.</text></g></svg>