<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" role="img"><title>Electrophilic aromatic bromination: Lone-pair capture</title><desc>Br–Br: + FeBr3 → Br2·FeBr3. Bromine coordinates to the Lewis acid, polarizing Br–Br. A freely solvated Br+ is not required.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="aromatic-bromination-1-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="aromatic-bromination-1-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Electrophilic aromatic bromination · 1</text><text x="24" y="65" font-size="17">Lone-pair capture</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">Br</text><text x="53.76" y="155" font-size="24.00">–</text><text x="68.64" y="155" font-size="24.00">Br:</text><text x="113.28" y="155" font-size="24.00"> + </text><text x="157.92" y="155" font-size="24.00">FeBr3</text><text x="665.00" y="155" font-size="24.00">Br2·FeBr3</text><path data-electrons="2" d="M90.96,141.60 Q143.04,98.60 195.12,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#aromatic-bromination-1-pair)"/><text x="24" y="235" font-size="16">Bromine coordinates to the Lewis acid, polarizing Br–Br. A freely solvated Br+ is not required.</text></g></svg>