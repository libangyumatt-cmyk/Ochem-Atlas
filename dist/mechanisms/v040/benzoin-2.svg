<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" role="img"><title>Benzoin condensation: Alkoxide protonation</title><desc>PhCH(O−)CN + H–solvent → PhCH(OH)CN + solvent−. The cyanohydrin alkoxide is protonated by the protic medium.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="benzoin-2-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="benzoin-2-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Benzoin condensation · 2</text><text x="24" y="65" font-size="17">Alkoxide protonation</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">PhCH(</text><text x="98.40" y="155" font-size="24.00">O−</text><text x="128.16" y="155" font-size="24.00">)CN + H–solvent</text><text x="665.00" y="155" font-size="24.00">PhCH(OH)CN + solvent−</text><text x="30" y="202" font-size="16">Process model: no unique microscopic electron-arrow sequence asserted.</text><text x="24" y="235" font-size="16">The cyanohydrin alkoxide is protonated by the protic medium.</text></g></svg>