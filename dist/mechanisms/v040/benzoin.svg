<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1740"><title>Benzoin condensation: complete teaching sequence</title><g transform="translate(0,0)"><title>Benzoin condensation: Nucleophilic carbonyl addition</title><desc>Ph–CH=O + :CN− → PhCH(O−)CN. Cyanide carbon adds to aldehyde carbon; C=O pi electrons move to O.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="benzoin-1-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="benzoin-1-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Benzoin condensation · 1</text><text x="24" y="65" font-size="17">Nucleophilic carbonyl addition</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">Ph–</text><text x="68.64" y="155" font-size="24.00">CH</text><text x="98.40" y="155" font-size="24.00">=</text><text x="113.28" y="155" font-size="24.00">O</text><text x="128.16" y="155" font-size="24.00"> + </text><text x="172.80" y="155" font-size="24.00">:CN−</text><text x="665.00" y="155" font-size="24.00">PhCH(O−)CN</text><path data-electrons="2" d="M202.56,141.60 Q143.04,98.60 83.52,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#benzoin-1-pair)"/><path data-electrons="2" d="M102.12,141.60 Q111.42,203.60 120.72,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#benzoin-1-pair)"/><text x="24" y="235" font-size="16">Cyanide carbon adds to aldehyde carbon; C=O pi electrons move to O.</text></g></g><g transform="translate(0,290)"><title>Benzoin condensation: Alkoxide protonation</title><desc>PhCH(O−)CN + H–solvent → PhCH(OH)CN + solvent−. The cyanohydrin alkoxide is protonated by the protic medium.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="benzoin-2-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="benzoin-2-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Benzoin condensation · 2</text><text x="24" y="65" font-size="17">Alkoxide protonation</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">PhCH(</text><text x="98.40" y="155" font-size="24.00">O−</text><text x="128.16" y="155" font-size="24.00">)CN + H–solvent</text><text x="665.00" y="155" font-size="24.00">PhCH(OH)CN + solvent−</text><text x="30" y="202" font-size="16">Process model: no unique microscopic electron-arrow sequence asserted.</text><text x="24" y="235" font-size="16">The cyanohydrin alkoxide is protonated by the protic medium.</text></g></g><g transform="translate(0,580)"><title>Benzoin condensation: Proton transfer</title><desc>Ph–C(OH)(CN)–H + :base → Ph–C−(OH)CN + H–base+. Deprotonation at the former aldehyde carbon forms the resonance-stabilized acyl-anion equivalent.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="benzoin-3-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="benzoin-3-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Benzoin condensation · 3</text><text x="24" y="65" font-size="17">Proton transfer</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">Ph–</text><text x="68.64" y="155" font-size="24.00">C</text><text x="83.52" y="155" font-size="24.00">(OH)(CN)–</text><text x="217.44" y="155" font-size="24.00">H</text><text x="232.32" y="155" font-size="24.00"> + </text><text x="276.96" y="155" font-size="24.00">:base</text><text x="665.00" y="155" font-size="24.00">Ph–C−(OH)CN + H–base+</text><path data-electrons="2" d="M314.16,141.60 Q269.52,98.60 224.88,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#benzoin-3-pair)"/><path data-electrons="2" d="M150.48,141.60 Q113.28,203.60 76.08,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#benzoin-3-pair)"/><text x="24" y="235" font-size="16">Deprotonation at the former aldehyde carbon forms the resonance-stabilized acyl-anion equivalent.</text></g></g><g transform="translate(0,870)"><title>Benzoin condensation: Nucleophilic carbonyl addition</title><desc>Ph–C−(OH)CN + Ph–CH=O → PhC(OH)(CN)–CH(O−)Ph. The carbon nucleophile attacks a second benzaldehyde carbon.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="benzoin-4-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="benzoin-4-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Benzoin condensation · 4</text><text x="24" y="65" font-size="17">Nucleophilic carbonyl addition</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">Ph–</text><text x="68.64" y="155" font-size="24.00">C−</text><text x="98.40" y="155" font-size="24.00">(OH)CN + Ph–</text><text x="276.96" y="155" font-size="24.00">CH</text><text x="306.72" y="155" font-size="24.00">=</text><text x="321.60" y="155" font-size="24.00">O</text><text x="665.00" y="155" font-size="24.00">PhC(OH)(CN)–CH(O−)Ph</text><path data-electrons="2" d="M83.52,141.60 Q187.68,98.60 291.84,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#benzoin-4-pair)"/><path data-electrons="2" d="M310.44,141.60 Q319.74,203.60 329.04,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#benzoin-4-pair)"/><text x="24" y="235" font-size="16">The carbon nucleophile attacks a second benzaldehyde carbon.</text></g></g><g transform="translate(0,1160)"><title>Benzoin condensation: Internal proton inventory redistribution</title><desc>PhC(O–H)(CN)–CH(O−)Ph → PhC(O−)(CN)–CH(OH)Ph. A solvent-mediated proton relay transfers the original OH proton to the newly formed alkoxide; no free proton is implied.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="benzoin-5-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="benzoin-5-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Benzoin condensation · 5</text><text x="24" y="65" font-size="17">Internal proton inventory redistribution</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">PhC(O–H)(CN)–CH(O−)Ph</text><text x="665.00" y="155" font-size="24.00">PhC(O−)(CN)–CH(OH)Ph</text><text x="30" y="202" font-size="16">Process model: no unique microscopic electron-arrow sequence asserted.</text><text x="24" y="235" font-size="16">A solvent-mediated proton relay transfers the original OH proton to the newly formed alkoxide; no free proton is implied.</text></g></g><g transform="translate(0,1450)"><title>Benzoin condensation: Tetrahedral intermediate collapse</title><desc>Ph–C(O−)–CN attached to CH(OH)Ph → PhCOCH(OH)Ph + CN−. O forms C=O as the C–CN bond returns its pair to cyanide, regenerating catalyst.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="benzoin-6-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="benzoin-6-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Benzoin condensation · 6</text><text x="24" y="65" font-size="17">Tetrahedral intermediate collapse</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">Ph–</text><text x="68.64" y="155" font-size="24.00">C</text><text x="83.52" y="155" font-size="24.00">(</text><text x="98.40" y="155" font-size="24.00">O−</text><text x="128.16" y="155" font-size="24.00">)–</text><text x="157.92" y="155" font-size="24.00">CN</text><text x="187.68" y="155" font-size="24.00"> attached to CH(OH)Ph</text><text x="665.00" y="155" font-size="24.00">PhCOCH(OH)Ph + CN−</text><path data-electrons="2" d="M113.28,141.60 Q103.98,98.60 94.68,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#benzoin-6-pair)"/><path data-electrons="2" d="M124.44,141.60 Q148.62,203.60 172.80,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#benzoin-6-pair)"/><text x="24" y="235" font-size="16">O forms C=O as the C–CN bond returns its pair to cyanide, regenerating catalyst.</text></g></g></svg>