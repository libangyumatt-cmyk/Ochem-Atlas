<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" role="img"><title>Wittig olefination: Oxaphosphetane formation</title><desc>Ph–CH=O + Ph3P+–CH2− → Oxaphosphetane: PhCH–O–PPh3–CH2 four-membered ring. Polar bond formation joins ylide C to carbonyl C and O to P. A salt-free unstabilized-ylide model can form oxaphosphetane without a stable betaine.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="wittig-2-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="wittig-2-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Wittig olefination · 2</text><text x="24" y="65" font-size="17">Oxaphosphetane formation</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">Ph–</text><text x="68.64" y="155" font-size="24.00">CH</text><text x="98.40" y="155" font-size="24.00">=</text><text x="113.28" y="155" font-size="24.00">O</text><text x="128.16" y="155" font-size="24.00"> + Ph3</text><text x="217.44" y="155" font-size="24.00">P+</text><text x="247.20" y="155" font-size="24.00">–</text><text x="262.08" y="155" font-size="24.00">CH2−</text><text x="665.00" y="155" font-size="16.45">Oxaphosphetane: PhCH–O–PPh3–CH2 four-membered ring</text><path data-electrons="2" d="M291.84,141.60 Q187.68,98.60 83.52,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#wittig-2-pair)"/><path data-electrons="2" d="M102.12,141.60 Q111.42,203.60 120.72,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#wittig-2-pair)"/><path data-electrons="2" d="M120.72,141.60 Q176.52,80.60 232.32,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#wittig-2-pair)"/><text x="24" y="235" font-size="16">Polar bond formation joins ylide C to carbonyl C and O to P. A salt-free unstabilized-ylide model can form oxaphosphetane without a</text><text x="24" y="258" font-size="16">stable betaine.</text></g></svg>