roke="#203c43" stroke-width="2" fill="none"/><path d="M858.49,151.18 L889.20,166.74" stroke="#203c43" stroke-width="2" fill="none" stroke-dasharray="4 3"/><path d="M893.44,163.22 L902.98,195.57" stroke="#203c43" stroke-width="2" fill="none"/><path d="M887.68,164.92 L897.22,197.27" stroke="#203c43" stroke-width="2" fill="none" stroke-dasharray="4 3"/><path d="M880.48,225.03 L897.49,194.94" stroke="#203c43" stroke-width="2" fill="none"/><path d="M885.70,227.98 L902.71,197.90" stroke="#203c43" stroke-width="2" fill="none" stroke-dasharray="4 3"/><rect x="975.31" y="187.05" width="30" height="20" fill="#fffefa"/><text x="990.31" y="202.05" font-size="16" text-anchor="middle" fill="#203c43">CH3</text><rect x="957.45" y="215.89" width="30" height="20" fill="#fffefa"/><text x="972.45" y="230.89" font-size="16" text-anchor="middle" fill="#203c43">CH2</text><rect x="938.84" y="236.72" width="10" height="20" fill="#fffefa"/><text x="943.84" y="251.72" font-size="16" text-anchor="middle" fill="#203c43">O</text><rect x="902.93" y="243.17" width="10" height="20" fill="#fffefa"/><text x="907.93" y="258.17" font-size="16" text-anchor="middle" fill="#203c43">C</text><rect x="881.89" y="270.50" width="10" height="20" fill="#fffefa"/><text x="886.89" y="285.50" font-size="16" text-anchor="middle" fill="#203c43">O</text><rect x="878.09" y="216.51" width="10" height="20" fill="#fffefa"/><text x="883.09" y="231.51" font-size="16" text-anchor="middle" fill="#203c43">C</text><rect x="840.06" y="202.08" width="20" height="20" fill="#fffefa"/><text x="850.06" y="217.08" font-size="16" text-anchor="middle" fill="#203c43">CH</text><rect x="829.69" y="168.45" width="20" height="20" fill="#fffefa"/><text x="839.69" y="183.45" font-size="16" text-anchor="middle" fill="#203c43">CH</text><rect x="854.85" y="138.51" width="10" height="20" fill="#fffefa"/><text x="859.85" y="153.51" font-size="16" text-anchor="middle" fill="#203c43">C</text><rect x="861.13" y="103.92" width="20" height="20" fill="#fffefa"/><text x="871.13" y="118.92" font-size="16" text-anchor="middle" fill="#203c43">CH</text><rect x="855.04" y="70.50" width="20" height="20" fill="#fffefa"/><text x="865.04" y="85.50" font-size="16" text-anchor="middle" fill="#203c43">OH</text><rect x="888.81" y="93.90" width="30" height="20" fill="#fffefa"/><text x="903.81" y="108.90" font-size="16" text-anchor="middle" fill="#203c43">CH3</text><rect x="880.56" y="154.07" width="20" height="20" fill="#fffefa"/><text x="890.56" y="169.07" font-size="16" text-anchor="middle" fill="#203c43">CH</text><rect x="890.10" y="186.42" width="20" height="20" fill="#fffefa"/><text x="900.10" y="201.42" font-size="16" text-anchor="middle" fill="#203c43">CH</text><text x="580" y="180" font-size="32" fill="#203c43">→</text><text x="25" y="330" font-size="15" fill="#203c43">Representative substrate/product connectivity; other reagents/byproducts are in the equation. No computed geometry.</text></g><g transform="translate(0,350)"><title>Chemoselective borohydride ketone reduction: Nucleophilic carbonyl addition</title><desc>EtO2C–C6H4–C(=O)Me + B–H → EtO2C–C6H4–CH(O−)Me + boron species. A B–H pair donates to ketone carbon; ketone pi electrons move to oxygen. The remote ester is retained.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="selective-borohydride-1-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="selective-borohydride-1-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Chemoselective borohydride ketone reduction · 1</text><text x="24" y="65" font-size="17">Nucleophilic carbonyl addition</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">EtO2C–C6H4–</text><text x="187.68" y="155" font-size="24.00">C</text><text x="202.56" y="155" font-size="24.00">(=</text><text x="232.32" y="155" font-size="24.00">O</text><text x="247.20" y="155" font-size="24.00">)Me + </text><text x="336.48" y="155" font-size="24.00">B</text><text x="351.36" y="155" font-size="24.00">–</text><text x="366.24" y="155" font-size="24.00">H</text><text x="665.00" y="155" font-size="23.50">EtO2C–C6H4–CH(O−)Me + boron species</text><path data-electrons="2" d="M358.80,141.60 Q276.96,98.60 195.12,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#selective-borohydride-1-pair)"/><path data-electrons="2" d="M217.44,141.60 Q228.60,203.60 239.76,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#selective-borohydride-1-pair)"/><text x="24" y="235" font-size="16">A B–H pair donates to ketone carbon; ketone pi electrons move to oxygen. The remote ester is retained.</text></g></g><g transform="translate(0,640)"><title>Chemoselective borohydride ketone reduction: Proton transfer</title><desc>EtO2C–C6H4–CH(O−)Me + MeO–H → EtO2C–C6H4–CH(OH)Me + MeO−. Alcohol solvent protonates the alkoxide; borate hydrolysis during work-up completes release.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="selective-borohydride-2-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="selective-borohydride-2-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Chemoselective borohydride ketone reduction · 2</text><text x="24" y="65" font-size="17">Proton transfer</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">EtO2C–C6H4–CH(</text><text x="232.32" y="155" font-size="24.00">O−</text><text x="262.08" y="155" font-size="24.00">)Me + Me</text><text x="381.12" y="155" font-size="24.00">O</text><text x="396.00" y="155" font-size="24.00">–</text><text x="410.88" y="155" font-size="24.00">H</text><text x="665.00" y="155" font-size="24.00">EtO2C–C6H4–CH(OH)Me + MeO−</text><path data-electrons="2" d="M247.20,141.60 Q332.76,98.60 418.32,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#selective-borohydride-2-pair)"/><path data-electrons="2" d="M403.44,141.60 Q396.00,203.60 388.56,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#selective-borohydride-2-pair)"/><text x="24" y="235" font-size="16">Alcohol solvent protonates the alkoxide; borate hydrolysis during work-up completes release.</text></g></g></svg>