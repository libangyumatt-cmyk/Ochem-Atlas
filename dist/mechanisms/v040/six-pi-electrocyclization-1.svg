<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" role="img"><title>Thermal 6π electrocyclic closure: Disrotatory six-electron closure</title><desc>CH2=CH–CH=CH–CH=CH2 → Ring CH2–CH=CH–CH=CH–CH2–(back). Terminal p orbitals rotate in opposite senses; three electron pairs form a terminal sigma bond and move the two retained double bonds in one event.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="six-pi-electrocyclization-1-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="six-pi-electrocyclization-1-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Thermal 6π electrocyclic closure · 1</text><text x="24" y="65" font-size="17">Disrotatory six-electron closure</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">CH2</text><text x="68.64" y="155" font-size="24.00">=</text><text x="83.52" y="155" font-size="24.00">CH</text><text x="113.28" y="155" font-size="24.00">–</text><text x="128.16" y="155" font-size="24.00">CH</text><text x="157.92" y="155" font-size="24.00">=</text><text x="172.80" y="155" font-size="24.00">CH</text><text x="202.56" y="155" font-size="24.00">–</text><text x="217.44" y="155" font-size="24.00">CH</text><text x="247.20" y="155" font-size="24.00">=</text><text x="262.08" y="155" font-size="24.00">CH2</text><text x="665.00" y="155" font-size="24.00">Ring CH2–CH=CH–CH=CH–CH2–(back)</text><path data-electrons="2" d="M72.36,141.60 Q118.86,98.60 165.36,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#six-pi-electrocyclization-1-pair)"/><path data-electrons="2" d="M165.36,141.60 Q143.04,203.60 120.72,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#six-pi-electrocyclization-1-pair)"/><path data-electrons="2" d="M258.36,141.60 Q234.18,80.60 210.00,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#six-pi-electrocyclization-1-pair)"/><text x="24" y="235" font-size="16">Terminal p orbitals rotate in opposite senses; three electron pairs form a terminal sigma bond and move the</text><text x="24" y="258" font-size="16">two retained double bonds in one event.</text></g></svg>