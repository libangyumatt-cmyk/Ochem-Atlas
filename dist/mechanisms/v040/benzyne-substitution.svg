"#fffefa"/><text x="241.22" y="266.40" font-size="16" text-anchor="middle" fill="#203c43">CH</text><rect x="154.12" y="220.34" width="20" height="20" fill="#fffefa"/><text x="164.12" y="235.34" font-size="16" text-anchor="middle" fill="#203c43">CH</text><rect x="143.34" y="138.51" width="20" height="20" fill="#fffefa"/><text x="153.34" y="153.51" font-size="16" text-anchor="middle" fill="#203c43">CH</text><rect x="209.51" y="89.60" width="20" height="20" fill="#fffefa"/><text x="219.51" y="104.60" font-size="16" text-anchor="middle" fill="#203c43">CH</text><rect x="282.66" y="127.97" width="20" height="20" fill="#fffefa"/><text x="292.66" y="142.97" font-size="16" text-anchor="middle" fill="#203c43">CH</text><path d="M1036.66,228.24 L954.78,219.08" stroke="#203c43" stroke-width="2" fill="none"/><path d="M956.27,221.68 L882.71,264.00" stroke="#203c43" stroke-width="2" fill="none"/><path d="M953.28,216.48 L879.72,258.80" stroke="#203c43" stroke-width="2" fill="none" stroke-dasharray="4 3"/><path d="M880.09,264.19 L803.00,233.12" stroke="#203c43" stroke-width="2" fill="none"/><path d="M882.34,258.62 L805.24,227.55" stroke="#203c43" stroke-width="2" fill="none" stroke-dasharray="4 3"/><path d="M801.15,230.73 L790.37,148.90" stroke="#203c43" stroke-width="2" fill="none"/><path d="M807.10,229.94 L796.32,148.12" stroke="#203c43" stroke-width="2" fill="none" stroke-dasharray="4 3"/><path d="M791.56,146.10 L857.73,97.18" stroke="#203c43" stroke-width="2" fill="none"/><path d="M795.13,150.92 L861.30,102.01" stroke="#203c43" stroke-width="2" fill="none" stroke-dasharray="4 3"/><path d="M860.91,96.94 L934.06,135.31" stroke="#203c43" stroke-width="2" fill="none"/><path d="M858.12,102.25 L931.27,140.62" stroke="#203c43" stroke-width="2" fill="none" stroke-dasharray="4 3"/><path d="M951.88,219.87 L929.77,138.76" stroke="#203c43" stroke-width="2" fill="none"/><path d="M957.67,218.29 L935.56,137.18" stroke="#203c43" stroke-width="2" fill="none" stroke-dasharray="4 3"/><rect x="1021.66" y="218.24" width="30" height="20" fill="#fffefa"/><text x="1036.66" y="233.24" font-size="16" text-anchor="middle" fill="#203c43">NH2</text><rect x="949.78" y="209.08" width="10" height="20" fill="#fffefa"/><text x="954.78" y="224.08" font-size="16" text-anchor="middle" fill="#203c43">C</text><rect x="871.22" y="251.40" width="20" height="20" fill="#fffefa"/><text x="881.22" y="266.40" font-size="16" text-anchor="middle" fill="#203c43">CH</text><rect x="794.12" y="220.34" width="20" height="20" fill="#fffefa"/><text x="804.12" y="235.34" font-size="16" text-anchor="middle" fill="#203c43">CH</text><rect x="783.34" y="138.51" width="20" height="20" fill="#fffefa"/><text x="793.34" y="153.51" font-size="16" text-anchor="middle" fill="#203c43">CH</text><rect x="849.51" y="89.60" width="20" height="20" fill="#fffefa"/><text x="859.51" y="104.60" font-size="16" text-anchor="middle" fill="#203c43">CH</text><rect x="922.66" y="127.97" width="20" height="20" fill="#fffefa"/><text x="932.66" y="142.97" font-size="16" text-anchor="middle" fill="#203c43">CH</text><text x="580" y="180" font-size="32" fill="#203c43">→</text><text x="25" y="330" font-size="15" fill="#203c43">Representative substrate/product connectivity; other reagents/byproducts are in the equation. No computed geometry.</text></g><g transform="translate(0,350)"><title>Benzyne elimination–addition substitution: Proton transfer</title><desc>ring C(Br)=C(H)–CH=CH–CH=CH–(back) + :NH2− → ortho-bromophenyl anion + NH3. Amide removes an ortho proton in the elimination model.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="benzyne-substitution-1-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="benzyne-substitution-1-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Benzyne elimination–addition substitution · 1</text><text x="24" y="65" font-size="17">Proton transfer</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="19.97">ring C(Br)=</text><text x="160.19" y="155" font-size="19.97">C</text><text x="172.57" y="155" font-size="19.97">(</text><text x="184.95" y="155" font-size="19.97">H</text><text x="197.33" y="155" font-size="19.97">)–CH=CH–CH=CH–(back) + </text><text x="482.10" y="155" font-size="19.97">:NH2−</text><text x="665.00" y="155" font-size="24.00">ortho-bromophenyl anion + NH3</text><path data-electrons="2" d="M513.05,143.01 Q352.10,100.01 191.14,139.01" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#benzyne-substitution-1-pair)"/><path data-electrons="2" d="M178.76,143.01 Q172.57,205.01 166.38,139.01" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#benzyne-substitution-1-pair)"/><text x="24" y="235" font-size="16">Amide removes an ortho proton in the elimination model.</text></g></g><g transform="translate(0,640)"><title>Benzyne elimination–addition substitution: Coupled polar bond reorganization</title><desc>ortho-C:−–C–Br within arene → Benzyne + Br−. The aryl-anion pair forms the extra in-plane pi bond as bromide leaves.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="benzyne-substitution-2-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="benzyne-substitution-2-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Benzyne elimination–addition substitution · 2</text><text x="24" y="65" font-size="17">Coupled polar bond reorganization</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">ortho-</text><text x="113.28" y="155" font-size="24.00">C:−</text><text x="157.92" y="155" font-size="24.00">–</text><text x="172.80" y="155" font-size="24.00">C</text><text x="187.68" y="155" font-size="24.00">–</text><text x="202.56" y="155" font-size="24.00">Br</text><text x="232.32" y="155" font-size="24.00"> within arene</text><text x="665.00" y="155" font-size="24.00">Benzyne + Br−</text><path data-electrons="2" d="M135.60,141.60 Q146.76,98.60 157.92,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#benzyne-substitution-2-pair)"/><path data-electrons="2" d="M198.84,141.60 Q208.14,203.60 217.44,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#benzyne-substitution-2-pair)"/><text x="24" y="235" font-size="16">The aryl-anion pair forms the extra in-plane pi bond as bromide leaves.</text></g></g><g transform="translate(0,930)"><title>Benzyne elimination–addition substitution: Coupled polar bond reorganization</title><desc>Benzyne C≡C + :NH2− → Aminophenyl carbanion. Amide adds to one aryne carbon; the in-plane pi pair moves to the neighboring carbon.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="benzyne-substitution-3-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="benzyne-substitution-3-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Benzyne elimination–addition substitution · 3</text><text x="24" y="65" font-size="17">Coupled polar bond reorganization</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">Benzyne </text><text x="143.04" y="155" font-size="24.00">C</text><text x="157.92" y="155" font-size="24.00">≡</text><text x="172.80" y="155" font-size="24.00">C</text><text x="187.68" y="155" font-size="24.00"> + </text><text x="232.32" y="155" font-size="24.00">:NH2−</text><text x="665.00" y="155" font-size="24.00">Aminophenyl carbanion</text><path data-electrons="2" d="M269.52,141.60 Q210.00,98.60 150.48,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#benzyne-substitution-3-pair)"/><path data-electrons="2" d="M165.36,141.60 Q172.80,203.60 180.24,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#benzyne-substitution-3-pair)"/><text x="24" y="235" font-size="16">Amide adds to one aryne carbon; the in-plane pi pair moves to the neighboring carbon.</text></g></g><g transform="translate(0,1220)"><title>Benzyne elimination–addition substitution: Proton transfer</title><desc>ring C(NH2)=CH–CH=CH–CH=C:−–(back) + H–NH2 → C6H5NH2 + NH2−. The aryl carbanion takes a proton from ammonia, furnishing aniline.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="benzyne-substitution-4-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="benzyne-substitution-4-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Benzyne elimination–addition substitution · 4</text><text x="24" y="65" font-size="17">Proton transfer</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="19.97">ring C(NH2)=CH–CH=CH–CH=</text><text x="321.14" y="155" font-size="19.97">C:−</text><text x="358.29" y="155" font-size="19.97">–(back) + </text><text x="482.10" y="155" font-size="19.97">H</text><text x="494.48" y="155" font-size="19.97">–</text><text x="506.86" y="155" font-size="19.97">NH2</text><text x="665.00" y="155" font-size="24.00">C6H5NH2 + NH2−</text><path data-electrons="2" d="M339.71,143.01 Q414.00,100.01 488.29,139.01" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#benzyne-substitution-4-pair)"/><path data-electrons="2" d="M506.86,143.01 Q516.14,205.01 525.43,139.01" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#benzyne-substitution-4-pair)"/><text x="24" y="235" font-size="16">The aryl carbanion takes a proton from ammonia, furnishing aniline.</text></g></g></svg>