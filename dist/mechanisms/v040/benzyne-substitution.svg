<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1160"><title>Benzyne elimination–addition substitution: complete teaching sequence</title><g transform="translate(0,0)"><title>Benzyne elimination–addition substitution: Proton transfer</title><desc>ring C(Br)=C(H)–CH=CH–CH=CH–(back) + :NH2− → ortho-bromophenyl anion + NH3. Amide removes an ortho proton in the elimination model.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="benzyne-substitution-1-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="benzyne-substitution-1-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Benzyne elimination–addition substitution · 1</text><text x="24" y="65" font-size="17">Proton transfer</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="19.97">ring C(Br)=</text><text x="160.19" y="155" font-size="19.97">C</text><text x="172.57" y="155" font-size="19.97">(</text><text x="184.95" y="155" font-size="19.97">H</text><text x="197.33" y="155" font-size="19.97">)–CH=CH–CH=CH–(back) + </text><text x="482.10" y="155" font-size="19.97">:NH2−</text><text x="665.00" y="155" font-size="24.00">ortho-bromophenyl anion + NH3</text><path data-electrons="2" d="M513.05,143.01 Q352.10,100.01 191.14,139.01" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#benzyne-substitution-1-pair)"/><path data-electrons="2" d="M178.76,143.01 Q172.57,205.01 166.38,139.01" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#benzyne-substitution-1-pair)"/><text x="24" y="235" font-size="16">Amide removes an ortho proton in the elimination model.</text></g></g><g transform="translate(0,290)"><title>Benzyne elimination–addition substitution: Coupled polar bond reorganization</title><desc>ortho-C:−–C–Br within arene → Benzyne + Br−. The aryl-anion pair forms the extra in-plane pi bond as bromide leaves.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="benzyne-substitution-2-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="benzyne-substitution-2-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Benzyne elimination–addition substitution · 2</text><text x="24" y="65" font-size="17">Coupled polar bond reorganization</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">ortho-</text><text x="113.28" y="155" font-size="24.00">C:−</text><text x="157.92" y="155" font-size="24.00">–</text><text x="172.80" y="155" font-size="24.00">C</text><text x="187.68" y="155" font-size="24.00">–</text><text x="202.56" y="155" font-size="24.00">Br</text><text x="232.32" y="155" font-size="24.00"> within arene</text><text x="665.00" y="155" font-size="24.00">Benzyne + Br−</text><path data-electrons="2" d="M135.60,141.60 Q146.76,98.60 157.92,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#benzyne-substitution-2-pair)"/><path data-electrons="2" d="M198.84,141.60 Q208.14,203.60 217.44,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#benzyne-substitution-2-pair)"/><text x="24" y="235" font-size="16">The aryl-anion pair forms the extra in-plane pi bond as bromide leaves.</text></g></g><g transform="translate(0,580)"><title>Benzyne elimination–addition substitution: Coupled polar bond reorganization</title><desc>Benzyne C≡C + :NH2− → Aminophenyl carbanion. Amide adds to one aryne carbon; the in-plane pi pair moves to the neighboring carbon.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="benzyne-substitution-3-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="benzyne-substitution-3-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Benzyne elimination–addition substitution · 3</text><text x="24" y="65" font-size="17">Coupled polar bond reorganization</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">Benzyne </text><text x="143.04" y="155" font-size="24.00">C</text><text x="157.92" y="155" font-size="24.00">≡</text><text x="172.80" y="155" font-size="24.00">C</text><text x="187.68" y="155" font-size="24.00"> + </text><text x="232.32" y="155" font-size="24.00">:NH2−</text><text x="665.00" y="155" font-size="24.00">Aminophenyl carbanion</text><path data-electrons="2" d="M269.52,141.60 Q210.00,98.60 150.48,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#benzyne-substitution-3-pair)"/><path data-electrons="2" d="M165.36,141.60 Q172.80,203.60 180.24,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#benzyne-substitution-3-pair)"/><text x="24" y="235" font-size="16">Amide adds to one aryne carbon; the in-plane pi pair moves to the neighboring carbon.</text></g></g><g transform="translate(0,870)"><title>Benzyne elimination–addition substitution: Proton transfer</title><desc>H2N–C6H4–C:− + H–NH2 → C6H5NH2 + NH2−. The aryl carbanion takes a proton from ammonia, furnishing aniline.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="benzyne-substitution-4-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="benzyne-substitution-4-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Benzyne elimination–addition substitution · 4</text><text x="24" y="65" font-size="17">Proton transfer</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">H2N–C6H4–</text><text x="157.92" y="155" font-size="24.00">C:−</text><text x="202.56" y="155" font-size="24.00"> + </text><text x="247.20" y="155" font-size="24.00">H</text><text x="262.08" y="155" font-size="24.00">–</text><text x="276.96" y="155" font-size="24.00">NH2</text><text x="665.00" y="155" font-size="24.00">C6H5NH2 + NH2−</text><path data-electrons="2" d="M180.24,141.60 Q217.44,98.60 254.64,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#benzyne-substitution-4-pair)"/><path data-electrons="2" d="M276.96,141.60 Q288.12,203.60 299.28,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#benzyne-substitution-4-pair)"/><text x="24" y="235" font-size="16">The aryl carbanion takes a proton from ammonia, furnishing aniline.</text></g></g></svg>