<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580"><title>Acetylide alkylation: complete teaching sequence</title><g transform="translate(0,0)"><title>Acetylide alkylation: Proton transfer</title><desc>H–C≡C–H + :NH2− → HC≡C− + NH3. Amide deprotonates the terminal alkyne, producing an acetylide.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="acetylide-alkylation-1-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="acetylide-alkylation-1-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Acetylide alkylation · 1</text><text x="24" y="65" font-size="17">Proton transfer</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">H–C≡</text><text x="83.52" y="155" font-size="24.00">C</text><text x="98.40" y="155" font-size="24.00">–</text><text x="113.28" y="155" font-size="24.00">H</text><text x="128.16" y="155" font-size="24.00"> + </text><text x="172.80" y="155" font-size="24.00">:NH2−</text><text x="665.00" y="155" font-size="24.00">HC≡C− + NH3</text><path data-electrons="2" d="M210.00,141.60 Q165.36,98.60 120.72,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#acetylide-alkylation-1-pair)"/><path data-electrons="2" d="M105.84,141.60 Q98.40,203.60 90.96,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#acetylide-alkylation-1-pair)"/><text x="24" y="235" font-size="16">Amide deprotonates the terminal alkyne, producing an acetylide.</text></g></g><g transform="translate(0,290)"><title>Acetylide alkylation: Bond-replacing displacement</title><desc>HC≡C:− + CH3–CH2–Br → HC≡CCH2CH3 + Br−. Acetylide carbon attacks ethyl carbon from the backside; bromide takes the departing bond pair.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="acetylide-alkylation-2-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="acetylide-alkylation-2-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Acetylide alkylation · 2</text><text x="24" y="65" font-size="17">Bond-replacing displacement</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">HC≡</text><text x="68.64" y="155" font-size="24.00">C:−</text><text x="113.28" y="155" font-size="24.00"> + CH3–</text><text x="217.44" y="155" font-size="24.00">CH2</text><text x="262.08" y="155" font-size="24.00">–</text><text x="276.96" y="155" font-size="24.00">Br</text><text x="665.00" y="155" font-size="24.00">HC≡CCH2CH3 + Br−</text><path data-electrons="2" d="M90.96,141.60 Q165.36,98.60 239.76,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#acetylide-alkylation-2-pair)"/><path data-electrons="2" d="M265.80,141.60 Q278.82,203.60 291.84,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#acetylide-alkylation-2-pair)"/><text x="24" y="235" font-size="16">Acetylide carbon attacks ethyl carbon from the backside; bromide takes the departing bond pair.</text></g></g></svg>