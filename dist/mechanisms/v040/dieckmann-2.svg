<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" role="img"><title>Dieckmann cyclization: Nucleophilic carbonyl addition</title><desc>EtO2C–CH−–(CH2)3–C(=O)OEt → Ring C(O−)(OEt)–CH(CO2Et)–CH2–CH2–CH2–(back). Intramolecular enolate attack on the other ester closes a five-membered ring.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="dieckmann-2-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="dieckmann-2-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Dieckmann cyclization · 2</text><text x="24" y="65" font-size="17">Nucleophilic carbonyl addition</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">EtO2C–</text><text x="113.28" y="155" font-size="24.00">CH−</text><text x="157.92" y="155" font-size="24.00">–(CH2)3–</text><text x="276.96" y="155" font-size="24.00">C</text><text x="291.84" y="155" font-size="24.00">(=</text><text x="321.60" y="155" font-size="24.00">O</text><text x="336.48" y="155" font-size="24.00">)OEt</text><text x="665.00" y="155" font-size="18.70">Ring C(O−)(OEt)–CH(CO2Et)–CH2–CH2–CH2–(back)</text><path data-electrons="2" d="M135.60,141.60 Q210.00,98.60 284.40,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#dieckmann-2-pair)"/><path data-electrons="2" d="M306.72,141.60 Q317.88,203.60 329.04,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#dieckmann-2-pair)"/><text x="24" y="235" font-size="16">Intramolecular enolate attack on the other ester closes a five-membered ring.</text></g></svg>