ne" stroke-dasharray="4 3"/><path d="M878.42,140.59 L917.12,134.73" stroke="#203c43" stroke-width="2" fill="none"/><path d="M879.32,146.52 L918.02,140.66" stroke="#203c43" stroke-width="2" fill="none" stroke-dasharray="4 3"/><rect x="926.72" y="209.05" width="20" height="20" fill="#fffefa"/><text x="936.72" y="224.05" font-size="16" text-anchor="middle" fill="#203c43">CH</text><rect x="963.75" y="216.13" width="20" height="20" fill="#fffefa"/><text x="973.75" y="231.13" font-size="16" text-anchor="middle" fill="#203c43">CH</text><rect x="963.35" y="252.82" width="20" height="20" fill="#fffefa"/><text x="973.35" y="267.82" font-size="16" text-anchor="middle" fill="#203c43">CH</text><rect x="930.46" y="270.50" width="20" height="20" fill="#fffefa"/><text x="940.46" y="285.50" font-size="16" text-anchor="middle" fill="#203c43">CH</text><rect x="895.45" y="257.51" width="20" height="20" fill="#fffefa"/><text x="905.45" y="272.51" font-size="16" text-anchor="middle" fill="#203c43">CH</text><rect x="894.18" y="220.25" width="10" height="20" fill="#fffefa"/><text x="899.18" y="235.25" font-size="16" text-anchor="middle" fill="#203c43">C</text><rect x="860.01" y="201.81" width="10" height="20" fill="#fffefa"/><text x="865.01" y="216.81" font-size="16" text-anchor="middle" fill="#203c43">C</text><rect x="851.25" y="165.10" width="10" height="20" fill="#fffefa"/><text x="856.25" y="180.10" font-size="16" text-anchor="middle" fill="#203c43">C</text><rect x="873.87" y="133.56" width="10" height="20" fill="#fffefa"/><text x="878.87" y="148.56" font-size="16" text-anchor="middle" fill="#203c43">C</text><rect x="858.92" y="97.09" width="20" height="20" fill="#fffefa"/><text x="868.92" y="112.09" font-size="16" text-anchor="middle" fill="#203c43">CH</text><rect x="885.16" y="70.50" width="20" height="20" fill="#fffefa"/><text x="895.16" y="85.50" font-size="16" text-anchor="middle" fill="#203c43">CH</text><rect x="922.45" y="72.52" width="20" height="20" fill="#fffefa"/><text x="932.45" y="87.52" font-size="16" text-anchor="middle" fill="#203c43">CH</text><rect x="938.16" y="105.66" width="20" height="20" fill="#fffefa"/><text x="948.16" y="120.66" font-size="16" text-anchor="middle" fill="#203c43">CH</text><rect x="907.57" y="127.70" width="20" height="20" fill="#fffefa"/><text x="917.57" y="142.70" font-size="16" text-anchor="middle" fill="#203c43">CH</text><text x="580" y="180" font-size="32" fill="#203c43">→</text><text x="25" y="330" font-size="15" fill="#203c43">Representative substrate/product connectivity; other reagents/byproducts are in the equation. No computed geometry.</text></g><g transform="translate(0,350)"><title>Sonogashira coupling: Copper-assisted alkyne activation</title><desc>HC≡CPh + Cu(I) halide + amine → Copper phenylacetylide ensemble + ammonium halide. Copper-assisted deprotonation/aggregation activates the terminal alkyne. An amine alone is not asserted to quantitatively generate free acetylide.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="sonogashira-1-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="sonogashira-1-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Sonogashira coupling · 1</text><text x="24" y="65" font-size="17">Copper-assisted alkyne activation</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">HC≡CPh + Cu(I) halide + amine</text><text x="665.00" y="155" font-size="16.79">Copper phenylacetylide ensemble + ammonium halide</text><text x="30" y="202" font-size="16">Process model: no unique microscopic electron-arrow sequence asserted.</text><text x="24" y="235" font-size="16">Copper-assisted deprotonation/aggregation activates the terminal alkyne. An amine alone is not asserted to</text><text x="24" y="258" font-size="16">quantitatively generate free acetylide.</text></g></g><g transform="translate(0,640)"><title>Sonogashira coupling: Oxidative addition</title><desc>LnPd(0) + Ph–Br → LnPd(II)(Ph)(Br). Oxidative addition makes Pd–C/Pd–Br bonds and raises formal Pd oxidation state. Ligand dissociation/association and spin/speciation are not reduced to a molecular SN2 code.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="sonogashira-2-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="sonogashira-2-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Sonogashira coupling · 2</text><text x="24" y="65" font-size="17">Oxidative addition</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">LnPd(0) + Ph–Br</text><text x="665.00" y="155" font-size="24.00">LnPd(II)(Ph)(Br)</text><text x="30" y="202" font-size="16">Process model: no unique microscopic electron-arrow sequence asserted.</text><text x="24" y="235" font-size="16">Oxidative addition makes Pd–C/Pd–Br bonds and raises formal Pd oxidation state. Ligand</text><text x="24" y="258" font-size="16">dissociation/association and spin/speciation are not reduced to a molecular SN2 code.</text></g></g><g transform="translate(0,930)"><title>Sonogashira coupling: Alkynyl transmetalation</title><desc>LnPd(II)(Ph)(Br) + Cu–C≡CPh → LnPd(II)(Ph)(C≡CPh) + CuBr. Transmetalation transfers alkynyl carbon from the copper ensemble to Pd; Cu(I) halide remains in its cocatalytic pool.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="sonogashira-3-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="sonogashira-3-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Sonogashira coupling · 3</text><text x="24" y="65" font-size="17">Alkynyl transmetalation</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">LnPd(II)(Ph)(Br) + Cu–C≡CPh</text><text x="665.00" y="155" font-size="24.00">LnPd(II)(Ph)(C≡CPh) + CuBr</text><text x="30" y="202" font-size="16">Process model: no unique microscopic electron-arrow sequence asserted.</text><text x="24" y="235" font-size="16">Transmetalation transfers alkynyl carbon from the copper ensemble to Pd; Cu(I) halide remains in its</text><text x="24" y="258" font-size="16">cocatalytic pool.</text></g></g><g transform="translate(0,1220)"><title>Sonogashira coupling: Reductive elimination</title><desc>cis-LnPd(II)(Ph)(C≡CPh) → PhC≡CPh + LnPd(0). Cis ligand reductive elimination forms diphenylacetylene and regenerates Pd(0).</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="sonogashira-4-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="sonogashira-4-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Sonogashira coupling · 4</text><text x="24" y="65" font-size="17">Reductive elimination</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">cis-LnPd(II)(Ph)(C≡CPh)</text><text x="665.00" y="155" font-size="24.00">PhC≡CPh + LnPd(0)</text><text x="30" y="202" font-size="16">Process model: no unique microscopic electron-arrow sequence asserted.</text><text x="24" y="235" font-size="16">Cis ligand reductive elimination forms diphenylacetylene and regenerates Pd(0).</text></g></g></svg>