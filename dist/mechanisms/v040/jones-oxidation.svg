64,83.50" stroke="#203c43" stroke-width="2" fill="none" stroke-dasharray="4 3"/><path d="M907.32,79.40 L927.70,131.14" stroke="#203c43" stroke-width="2" fill="none"/><path d="M901.74,81.60 L922.12,133.33" stroke="#203c43" stroke-width="2" fill="none" stroke-dasharray="4 3"/><path d="M906.10,186.37 L922.03,131.40" stroke="#203c43" stroke-width="2" fill="none"/><path d="M911.87,188.04 L927.79,133.07" stroke="#203c43" stroke-width="2" fill="none" stroke-dasharray="4 3"/><rect x="1002.59" y="200.74" width="10" height="20" fill="#fffefa"/><text x="1007.59" y="215.74" font-size="16" text-anchor="middle" fill="#203c43">O</text><rect x="948.62" y="215.47" width="10" height="20" fill="#fffefa"/><text x="953.62" y="230.47" font-size="16" text-anchor="middle" fill="#203c43">C</text><rect x="936.34" y="270.50" width="20" height="20" fill="#fffefa"/><text x="946.34" y="285.50" font-size="16" text-anchor="middle" fill="#203c43">OH</text><rect x="903.98" y="177.20" width="10" height="20" fill="#fffefa"/><text x="908.98" y="192.20" font-size="16" text-anchor="middle" fill="#203c43">C</text><rect x="841.47" y="169.34" width="20" height="20" fill="#fffefa"/><text x="851.47" y="184.34" font-size="16" text-anchor="middle" fill="#203c43">CH</text><rect x="812.41" y="121.30" width="20" height="20" fill="#fffefa"/><text x="822.41" y="136.30" font-size="16" text-anchor="middle" fill="#203c43">CH</text><rect x="839.27" y="72.51" width="20" height="20" fill="#fffefa"/><text x="849.27" y="87.51" font-size="16" text-anchor="middle" fill="#203c43">CH</text><rect x="894.53" y="70.50" width="20" height="20" fill="#fffefa"/><text x="904.53" y="85.50" font-size="16" text-anchor="middle" fill="#203c43">CH</text><rect x="914.91" y="122.24" width="20" height="20" fill="#fffefa"/><text x="924.91" y="137.24" font-size="16" text-anchor="middle" fill="#203c43">CH</text><text x="580" y="180" font-size="32" fill="#203c43">→</text><text x="25" y="330" font-size="15" fill="#203c43">Representative substrate/product connectivity; other reagents/byproducts are in the equation. No computed geometry.</text></g><g transform="translate(0,350)"><title>Jones oxidation of a primary alcohol: Mechanistic boundary / grouped stage</title><desc>PhCH2OH + Cr(VI) → PhCH2O–Cr(VI) ester. Ligand exchange and proton transfer generate a chromate ester.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="jones-oxidation-1-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="jones-oxidation-1-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Jones oxidation of a primary alcohol · 1</text><text x="24" y="65" font-size="17">Mechanistic boundary / grouped stage</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">PhCH2OH + Cr(VI)</text><text x="665.00" y="155" font-size="24.00">PhCH2O–Cr(VI) ester</text><text x="30" y="202" font-size="16">Process model: no unique microscopic electron-arrow sequence asserted.</text><text x="24" y="235" font-size="16">Ligand exchange and proton transfer generate a chromate ester.</text></g></g><g transform="translate(0,640)"><title>Jones oxidation of a primary alcohol: Mechanistic boundary / grouped stage</title><desc>PhCH2O–Cr(VI) + base → PhCHO + reduced chromium species. Base-assisted carbonyl formation cleaves O–Cr; the chromium redox network is grouped.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="jones-oxidation-2-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="jones-oxidation-2-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Jones oxidation of a primary alcohol · 2</text><text x="24" y="65" font-size="17">Mechanistic boundary / grouped stage</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">PhCH2O–Cr(VI) + base</text><text x="665.00" y="155" font-size="24.00">PhCHO + reduced chromium species</text><text x="30" y="202" font-size="16">Process model: no unique microscopic electron-arrow sequence asserted.</text><text x="24" y="235" font-size="16">Base-assisted carbonyl formation cleaves O–Cr; the chromium redox network is grouped.</text></g></g><g transform="translate(0,930)"><title>Jones oxidation of a primary alcohol: Mechanistic boundary / grouped stage</title><desc>PhCHO + H2O / acid → PhCH(OH)2. Carbonyl protonation, water addition and deprotonation establish the gem-diol equilibrium. These are grouped, not a new measured elementary event.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="jones-oxidation-3-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="jones-oxidation-3-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Jones oxidation of a primary alcohol · 3</text><text x="24" y="65" font-size="17">Mechanistic boundary / grouped stage</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">PhCHO + H2O / acid</text><text x="665.00" y="155" font-size="24.00">PhCH(OH)2</text><text x="30" y="202" font-size="16">Process model: no unique microscopic electron-arrow sequence asserted.</text><text x="24" y="235" font-size="16">Carbonyl protonation, water addition and deprotonation establish the gem-diol equilibrium. These are</text><text x="24" y="258" font-size="16">grouped, not a new measured elementary event.</text></g></g><g transform="translate(0,1220)"><title>Jones oxidation of a primary alcohol: Mechanistic boundary / grouped stage</title><desc>PhCH(OH)2 + Cr(VI) → PhCH(OH)O–Cr(VI) ester. A hydrate hydroxyl forms another chromate ester.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="jones-oxidation-4-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="jones-oxidation-4-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Jones oxidation of a primary alcohol · 4</text><text x="24" y="65" font-size="17">Mechanistic boundary / grouped stage</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">PhCH(OH)2 + Cr(VI)</text><text x="665.00" y="155" font-size="24.00">PhCH(OH)O–Cr(VI) ester</text><text x="30" y="202" font-size="16">Process model: no unique microscopic electron-arrow sequence asserted.</text><text x="24" y="235" font-size="16">A hydrate hydroxyl forms another chromate ester.</text></g></g><g transform="translate(0,1510)"><title>Jones oxidation of a primary alcohol: Mechanistic boundary / grouped stage</title><desc>Hydrate chromate ester + base → PhCO2H + reduced chromium species. Removal of the remaining carbon H forms the acid carbonyl. Further chromium disproportionation/speciation is not assigned unique SORG digits.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="jones-oxidation-5-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="jones-oxidation-5-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Jones oxidation of a primary alcohol · 5</text><text x="24" y="65" font-size="17">Mechanistic boundary / grouped stage</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">Hydrate chromate ester + base</text><text x="665.00" y="155" font-size="24.00">PhCO2H + reduced chromium species</text><text x="30" y="202" font-size="16">Process model: no unique microscopic electron-arrow sequence asserted.</text><text x="24" y="235" font-size="16">Removal of the remaining carbon H forms the acid carbonyl. Further chromium disproportionation/speciation is</text><text x="24" y="258" font-size="16">not assigned unique SORG digits.</text></g></g></svg>