<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" role="img"><title>Malonic ester synthesis: Bond-replacing displacement</title><desc>EtO2C–CH−–CO2Et + CH3–CH2–Br → EtO2CCH(Et)CO2Et + Br−. Carbon enolate attacks primary ethyl carbon; bromide leaves.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="malonic-ester-synthesis-2-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="malonic-ester-synthesis-2-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Malonic ester synthesis · 2</text><text x="24" y="65" font-size="17">Bond-replacing displacement</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">EtO2C–</text><text x="113.28" y="155" font-size="24.00">CH−</text><text x="157.92" y="155" font-size="24.00">–CO2Et + CH3–</text><text x="351.36" y="155" font-size="24.00">CH2</text><text x="396.00" y="155" font-size="24.00">–</text><text x="410.88" y="155" font-size="24.00">Br</text><text x="665.00" y="155" font-size="24.00">EtO2CCH(Et)CO2Et + Br−</text><path data-electrons="2" d="M135.60,141.60 Q254.64,98.60 373.68,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#malonic-ester-synthesis-2-pair)"/><path data-electrons="2" d="M399.72,141.60 Q412.74,203.60 425.76,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#malonic-ester-synthesis-2-pair)"/><text x="24" y="235" font-size="16">Carbon enolate attacks primary ethyl carbon; bromide leaves.</text></g></svg>