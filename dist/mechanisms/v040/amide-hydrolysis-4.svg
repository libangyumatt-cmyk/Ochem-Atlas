<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" role="img"><title>Acid-catalyzed amide hydrolysis: Tetrahedral intermediate collapse</title><desc>CH3–C(O:H)(OH)–NH3+ → CH3C(=OH+)OH + NH3. O forms carbonyl while C–N cleavage expels ammonia.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="amide-hydrolysis-4-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="amide-hydrolysis-4-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Acid-catalyzed amide hydrolysis · 4</text><text x="24" y="65" font-size="17">Tetrahedral intermediate collapse</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">CH3–</text><text x="83.52" y="155" font-size="24.00">C</text><text x="98.40" y="155" font-size="24.00">(</text><text x="113.28" y="155" font-size="24.00">O:H</text><text x="157.92" y="155" font-size="24.00">)(OH)–</text><text x="247.20" y="155" font-size="24.00">NH3+</text><text x="665.00" y="155" font-size="24.00">CH3C(=OH+)OH + NH3</text><path data-electrons="2" d="M135.60,141.60 Q124.44,98.60 113.28,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#amide-hydrolysis-4-pair)"/><path data-electrons="2" d="M183.96,141.60 Q230.46,203.60 276.96,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#amide-hydrolysis-4-pair)"/><text x="24" y="235" font-size="16">O forms carbonyl while C–N cleavage expels ammonia.</text></g></svg>