efa"/><text x="859.51" y="104.60" font-size="16" text-anchor="middle" fill="#203c43">CH</text><rect x="922.66" y="127.97" width="20" height="20" fill="#fffefa"/><text x="932.66" y="142.97" font-size="16" text-anchor="middle" fill="#203c43">CH</text><text x="580" y="180" font-size="32" fill="#203c43">→</text><text x="25" y="330" font-size="15" fill="#203c43">Representative substrate/product connectivity; other reagents/byproducts are in the equation. No computed geometry.</text></g><g transform="translate(0,350)"><title>Curtius rearrangement: Concerted migration / nitrogen extrusion</title><desc>Ph–C(=O)–N–N2 → PhN=C=O + N2. C–Ph migration to the acyl-bound N is coupled to N2 extrusion and C=N formation in the thermal concerted model.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="curtius-1-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="curtius-1-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Curtius rearrangement · 1</text><text x="24" y="65" font-size="17">Concerted migration / nitrogen extrusion</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">Ph</text><text x="53.76" y="155" font-size="24.00">–</text><text x="68.64" y="155" font-size="24.00">C</text><text x="83.52" y="155" font-size="24.00">(=O)–</text><text x="157.92" y="155" font-size="24.00">N</text><text x="172.80" y="155" font-size="24.00">–</text><text x="187.68" y="155" font-size="24.00">N2</text><text x="665.00" y="155" font-size="24.00">PhN=C=O + N2</text><path data-electrons="2" d="M57.48,141.60 Q111.42,98.60 165.36,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#curtius-1-pair)"/><path data-electrons="2" d="M183.96,141.60 Q193.26,203.60 202.56,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#curtius-1-pair)"/><text x="24" y="235" font-size="16">C–Ph migration to the acyl-bound N is coupled to N2 extrusion and C=N formation in the thermal concerted</text><text x="24" y="258" font-size="16">model.</text></g></g><g transform="translate(0,640)"><title>Curtius rearrangement: Mechanistic boundary / grouped stage</title><desc>PhN=C=O + H2O → PhNHCO2H. Water adds to isocyanate carbon; proton relays yield carbamic acid.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="curtius-2-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="curtius-2-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Curtius rearrangement · 2</text><text x="24" y="65" font-size="17">Mechanistic boundary / grouped stage</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">PhN=C=O + H2O</text><text x="665.00" y="155" font-size="24.00">PhNHCO2H</text><text x="30" y="202" font-size="16">Process model: no unique microscopic electron-arrow sequence asserted.</text><text x="24" y="235" font-size="16">Water adds to isocyanate carbon; proton relays yield carbamic acid.</text></g></g><g transform="translate(0,930)"><title>Curtius rearrangement: Mechanistic boundary / grouped stage</title><desc>PhNHCO2H → PhNH2 + CO2. Carbamic-acid decomposition gives aniline and carbon dioxide.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="curtius-3-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="curtius-3-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Curtius rearrangement · 3</text><text x="24" y="65" font-size="17">Mechanistic boundary / grouped stage</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">PhNHCO2H</text><text x="665.00" y="155" font-size="24.00">PhNH2 + CO2</text><text x="30" y="202" font-size="16">Process model: no unique microscopic electron-arrow sequence asserted.</text><text x="24" y="235" font-size="16">Carbamic-acid decomposition gives aniline and carbon dioxide.</text></g></g></svg>