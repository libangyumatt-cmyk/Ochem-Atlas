<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" role="img"><title>Peroxide-initiated radical HBr addition: Radical atom transfer</title><desc>RO• + H–Br → ROH + Br•. Alkoxy radical abstracts H from HBr to create the chain carrier.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="radical-hbr-2-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="radical-hbr-2-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Peroxide-initiated radical HBr addition · 2</text><text x="24" y="65" font-size="17">Radical atom transfer</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">RO•</text><text x="68.64" y="155" font-size="24.00"> + </text><text x="113.28" y="155" font-size="24.00">H</text><text x="128.16" y="155" font-size="24.00">–</text><text x="143.04" y="155" font-size="24.00">Br</text><text x="665.00" y="155" font-size="24.00">ROH + Br•</text><path data-electrons="1" d="M46.32,141.60 Q64.92,98.60 83.52,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#radical-hbr-2-fish)"/><path data-electrons="1" d="M139.32,141.60 Q111.42,203.60 83.52,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#radical-hbr-2-fish)"/><path data-electrons="1" d="M139.32,141.60 Q148.62,80.60 157.92,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#radical-hbr-2-fish)"/><text x="24" y="235" font-size="16">Alkoxy radical abstracts H from HBr to create the chain carrier.</text></g></svg>