<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" role="img"><title>Alkene hydroboration–oxidation: Concerted hydroboration</title><desc>CH3–CH=CH2 + R2B–H → CH3CH2CH2–BR2. The alkene pi pair donates to B while B–H donates to the other alkene carbon in a concerted four-center model.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="hydroboration-oxidation-1-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="hydroboration-oxidation-1-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Alkene hydroboration–oxidation · 1</text><text x="24" y="65" font-size="17">Concerted hydroboration</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">CH3–</text><text x="83.52" y="155" font-size="24.00">CH</text><text x="113.28" y="155" font-size="24.00">=</text><text x="128.16" y="155" font-size="24.00">CH2</text><text x="172.80" y="155" font-size="24.00"> + R2</text><text x="247.20" y="155" font-size="24.00">B</text><text x="262.08" y="155" font-size="24.00">–</text><text x="276.96" y="155" font-size="24.00">H</text><text x="665.00" y="155" font-size="24.00">CH3CH2CH2–BR2</text><path data-electrons="2" d="M124.44,141.60 Q189.54,98.60 254.64,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#hydroboration-oxidation-1-pair)"/><path data-electrons="2" d="M269.52,141.60 Q183.96,203.60 98.40,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#hydroboration-oxidation-1-pair)"/><text x="24" y="235" font-size="16">The alkene pi pair donates to B while B–H donates to the other alkene carbon in a concerted four-center model.</text></g></svg>