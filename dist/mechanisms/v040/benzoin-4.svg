<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" role="img"><title>Benzoin condensation: Nucleophilic carbonyl addition</title><desc>Ph–C−(OH)CN + Ph–CH=O → PhC(OH)(CN)–CH(O−)Ph. The carbon nucleophile attacks a second benzaldehyde carbon.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="benzoin-4-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="benzoin-4-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Benzoin condensation · 4</text><text x="24" y="65" font-size="17">Nucleophilic carbonyl addition</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">Ph–</text><text x="68.64" y="155" font-size="24.00">C−</text><text x="98.40" y="155" font-size="24.00">(OH)CN + Ph–</text><text x="276.96" y="155" font-size="24.00">CH</text><text x="306.72" y="155" font-size="24.00">=</text><text x="321.60" y="155" font-size="24.00">O</text><text x="665.00" y="155" font-size="24.00">PhC(OH)(CN)–CH(O−)Ph</text><path data-electrons="2" d="M83.52,141.60 Q187.68,98.60 291.84,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#benzoin-4-pair)"/><path data-electrons="2" d="M310.44,141.60 Q319.74,203.60 329.04,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#benzoin-4-pair)"/><text x="24" y="235" font-size="16">The carbon nucleophile attacks a second benzaldehyde carbon.</text></g></svg>