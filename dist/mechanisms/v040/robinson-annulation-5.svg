<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" role="img"><title>Robinson annulation: Nucleophilic carbonyl addition</title><desc>Side-chain C:− approaching original ring C=O → Fused6/6 bicyclic beta-alkoxide ketone. Intramolecular aldol attack forms the second C–C bond and opens the original ring carbonyl pi bond.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="robinson-annulation-5-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="robinson-annulation-5-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Robinson annulation · 5</text><text x="24" y="65" font-size="17">Nucleophilic carbonyl addition</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="19.06">Side-chain </text><text x="154.00" y="155" font-size="19.06">C:−</text><text x="189.45" y="155" font-size="19.06"> approaching original ring </text><text x="508.55" y="155" font-size="19.06">C</text><text x="520.36" y="155" font-size="19.06">=</text><text x="532.18" y="155" font-size="19.06">O</text><text x="665.00" y="155" font-size="21.65">Fused6/6 bicyclic beta-alkoxide ketone</text><path data-electrons="2" d="M171.73,143.33 Q343.09,100.33 514.45,139.33" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#robinson-annulation-5-pair)"/><path data-electrons="2" d="M526.27,143.33 Q532.18,205.33 538.09,139.33" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#robinson-annulation-5-pair)"/><text x="24" y="235" font-size="16">Intramolecular aldol attack forms the second C–C bond and opens the original ring carbonyl pi bond.</text></g></svg>