<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1220"><title>Ester saponification: complete teaching sequence</title><g font-family="DejaVu Sans,sans-serif"><rect width="1200" height="350" fill="#fffefa"/><text x="25" y="32" font-size="21" fill="#203c43">Ester saponification · representative molecular graphs</text><path d="M394.33,249.12 L315.81,267.37" stroke="#203c43" stroke-width="2" fill="none"/><path d="M315.81,267.37 L242.42,229.80" stroke="#203c43" stroke-width="2" fill="none"/><path d="M242.42,229.80 L214.47,150.50" stroke="#203c43" stroke-width="2" fill="none"/><path d="M214.47,150.50 L155.67,93.63" stroke="#203c43" stroke-width="2" fill="none"/><path d="M212.42,148.30 L272.00,92.77" stroke="#203c43" stroke-width="2" fill="none"/><path d="M216.52,152.69 L276.09,97.15" stroke="#203c43" stroke-width="2" fill="none"/><rect x="379.33" y="239.12" width="30" height="20" fill="#fffefa"/><text x="394.33" y="254.12" font-size="16" text-anchor="middle" fill="#203c43">CH3</text><rect x="300.81" y="257.37" width="30" height="20" fill="#fffefa"/><text x="315.81" y="272.37" font-size="16" text-anchor="middle" fill="#203c43">CH2</text><rect x="237.42" y="219.80" width="10" height="20" fill="#fffefa"/><text x="242.42" y="234.80" font-size="16" text-anchor="middle" fill="#203c43">O</text><rect x="209.47" y="140.50" width="10" height="20" fill="#fffefa"/><text x="214.47" y="155.50" font-size="16" text-anchor="middle" fill="#203c43">C</text><rect x="140.67" y="83.63" width="30" height="20" fill="#fffefa"/><text x="155.67" y="98.63" font-size="16" text-anchor="middle" fill="#203c43">CH3</text><rect x="269.04" y="84.96" width="10" height="20" fill="#fffefa"/><text x="274.04" y="99.96" font-size="16" text-anchor="middle" fill="#203c43">O</text><path d="M991.33,234.89 L915.00,206.90" stroke="#203c43" stroke-width="2" fill="none"/><path d="M916.03,209.72 L839.70,237.71" stroke="#203c43" stroke-width="2" fill="none"/><path d="M913.97,204.09 L837.64,232.08" stroke="#203c43" stroke-width="2" fill="none"/><path d="M915.00,206.90 L915.00,126.11" stroke="#203c43" stroke-width="2" fill="none"/><rect x="976.33" y="224.89" width="30" height="20" fill="#fffefa"/><text x="991.33" y="239.89" font-size="16" text-anchor="middle" fill="#203c43">CH3</text><rect x="910.00" y="196.90" width="10" height="20" fill="#fffefa"/><text x="915.00" y="211.90" font-size="16" text-anchor="middle" fill="#203c43">C</text><rect x="833.67" y="224.89" width="10" height="20" fill="#fffefa"/><text x="838.67" y="239.89" font-size="16" text-anchor="middle" fill="#203c43">O</text><rect x="905.00" y="116.11" width="20" height="20" fill="#fffefa"/><text x="915.00" y="131.11" font-size="16" text-anchor="middle" fill="#203c43">O−</text><text x="580" y="180" font-size="32" fill="#203c43">→</text><text x="25" y="330" font-size="15" fill="#203c43">Representative substrate/product connectivity; other reagents/byproducts are in the equation. No computed geometry.</text></g><g transform="translate(0,350)"><title>Ester saponification: Nucleophilic carbonyl addition</title><desc>CH3–C(=O)OEt + :OH− → CH3C(O−)(OH)OEt. Hydroxide attacks acyl carbon and C=O pi electrons move to O.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="ester-saponification-1-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="ester-saponification-1-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Ester saponification · 1</text><text x="24" y="65" font-size="17">Nucleophilic carbonyl addition</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">CH3–</text><text x="83.52" y="155" font-size="24.00">C</text><text x="98.40" y="155" font-size="24.00">(=</text><text x="128.16" y="155" font-size="24.00">O</text><text x="143.04" y="155" font-size="24.00">)OEt + </text><text x="247.20" y="155" font-size="24.00">:OH−</text><text x="665.00" y="155" font-size="24.00">CH3C(O−)(OH)OEt</text><path data-electrons="2" d="M276.96,141.60 Q183.96,98.60 90.96,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#ester-saponification-1-pair)"/><path data-electrons="2" d="M113.28,141.60 Q124.44,203.60 135.60,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#ester-saponification-1-pair)"/><text x="24" y="235" font-size="16">Hydroxide attacks acyl carbon and C=O pi electrons move to O.</text></g></g><g transform="translate(0,640)"><title>Ester saponification: Tetrahedral intermediate collapse</title><desc>CH3–C(O−)(OH)–OEt → CH3CO2H + EtO−. O reforms carbonyl as ethoxide leaves.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="ester-saponification-2-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="ester-saponification-2-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Ester saponification · 2</text><text x="24" y="65" font-size="17">Tetrahedral intermediate collapse</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">CH3–</text><text x="83.52" y="155" font-size="24.00">C</text><text x="98.40" y="155" font-size="24.00">(</text><text x="113.28" y="155" font-size="24.00">O−</text><text x="143.04" y="155" font-size="24.00">)(OH)–</text><text x="232.32" y="155" font-size="24.00">OEt</text><text x="665.00" y="155" font-size="24.00">CH3CO2H + EtO−</text><path data-electrons="2" d="M128.16,141.60 Q118.86,98.60 109.56,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#ester-saponification-2-pair)"/><path data-electrons="2" d="M172.80,141.60 Q213.72,203.60 254.64,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#ester-saponification-2-pair)"/><text x="24" y="235" font-size="16">O reforms carbonyl as ethoxide leaves.</text></g></g><g transform="translate(0,930)"><title>Ester saponification: Proton transfer</title><desc>CH3CO2–H + EtO− → CH3CO2− + EtOH. Ethoxide deprotonates the carboxylic acid; acid work-up, if desired, reverses only this protonation state.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="ester-saponification-3-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="ester-saponification-3-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Ester saponification · 3</text><text x="24" y="65" font-size="17">Proton transfer</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">CH3CO2–</text><text x="128.16" y="155" font-size="24.00">H</text><text x="143.04" y="155" font-size="24.00"> + Et</text><text x="217.44" y="155" font-size="24.00">O−</text><text x="665.00" y="155" font-size="24.00">CH3CO2− + EtOH</text><path data-electrons="2" d="M232.32,141.60 Q183.96,98.60 135.60,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#ester-saponification-3-pair)"/><text x="24" y="235" font-size="16">Ethoxide deprotonates the carboxylic acid; acid work-up, if desired, reverses only this protonation state.</text></g></g></svg>