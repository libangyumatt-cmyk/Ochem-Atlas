<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" role="img"><title>Cope rearrangement: Thermal [3,3] carbon-skeleton rearrangement</title><desc>CH2=CH–CH(Me)–CH2–CH=CH2 → CH2=CH–CH2–CH2–CH=CH–CH3. The1,5-diene rearranges by a concerted[3,3] shift: break the central sigma bond, make a terminal C–C bond and move both pi bonds. No discrete diradical is inserted.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="cope-rearrangement-1-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="cope-rearrangement-1-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Cope rearrangement · 1</text><text x="24" y="65" font-size="17">Thermal [3,3] carbon-skeleton rearrangement</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">CH2</text><text x="68.64" y="155" font-size="24.00">=</text><text x="83.52" y="155" font-size="24.00">CH</text><text x="113.28" y="155" font-size="24.00">–</text><text x="128.16" y="155" font-size="24.00">CH</text><text x="157.92" y="155" font-size="24.00">(Me)–</text><text x="232.32" y="155" font-size="24.00">CH2</text><text x="276.96" y="155" font-size="24.00">–</text><text x="291.84" y="155" font-size="24.00">CH</text><text x="321.60" y="155" font-size="24.00">=</text><text x="336.48" y="155" font-size="24.00">CH2</text><text x="665.00" y="155" font-size="24.00">CH2=CH–CH2–CH2–CH=CH–CH3</text><path data-electrons="2" d="M72.36,141.60 Q96.54,98.60 120.72,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#cope-rearrangement-1-pair)"/><path data-electrons="2" d="M198.84,141.60 Q239.76,203.60 280.68,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#cope-rearrangement-1-pair)"/><path data-electrons="2" d="M332.76,141.60 Q267.66,80.60 202.56,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#cope-rearrangement-1-pair)"/><text x="24" y="235" font-size="16">The1,5-diene rearranges by a concerted[3,3] shift: break the central sigma bond, make a terminal C–C bond</text><text x="24" y="258" font-size="16">and move both pi bonds. No discrete diradical is inserted.</text></g></svg>