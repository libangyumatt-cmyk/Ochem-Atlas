<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" role="img"><title>Robinson annulation: Proton transfer</title><desc>Ring–CH2CH2CO–CH2–H + :OH− → Terminal side-chain ketone enolate + H2O. Deprotonate the terminal methyl of the newly attached ketone; this donor closes a six-membered ring.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="robinson-annulation-4-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="robinson-annulation-4-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Robinson annulation · 4</text><text x="24" y="65" font-size="17">Proton transfer</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">Ring–CH2CH2CO–</text><text x="232.32" y="155" font-size="24.00">CH2</text><text x="276.96" y="155" font-size="24.00">–</text><text x="291.84" y="155" font-size="24.00">H</text><text x="306.72" y="155" font-size="24.00"> + </text><text x="351.36" y="155" font-size="24.00">:OH−</text><text x="665.00" y="155" font-size="20.56">Terminal side-chain ketone enolate + H2O</text><path data-electrons="2" d="M381.12,141.60 Q340.20,98.60 299.28,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#robinson-annulation-4-pair)"/><path data-electrons="2" d="M276.96,141.60 Q265.80,203.60 254.64,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#robinson-annulation-4-pair)"/><text x="24" y="235" font-size="16">Deprotonate the terminal methyl of the newly attached ketone; this donor closes a six-membered ring.</text></g></svg>