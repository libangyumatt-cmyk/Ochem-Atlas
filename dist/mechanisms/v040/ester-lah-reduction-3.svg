<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" role="img"><title>Lithium aluminum hydride ester reduction: Tetrahedral intermediate collapse</title><desc>CH3–CH(O−)–OEt → CH3CHO + EtO− (Al-bound forms). Carbonyl reformation expels alkoxide; aldehyde is more reactive and is not isolated under excess LAH.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="ester-lah-reduction-3-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="ester-lah-reduction-3-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Lithium aluminum hydride ester reduction · 3</text><text x="24" y="65" font-size="17">Tetrahedral intermediate collapse</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">CH3–</text><text x="83.52" y="155" font-size="24.00">CH</text><text x="113.28" y="155" font-size="24.00">(</text><text x="128.16" y="155" font-size="24.00">O−</text><text x="157.92" y="155" font-size="24.00">)–</text><text x="187.68" y="155" font-size="24.00">OEt</text><text x="665.00" y="155" font-size="24.00">CH3CHO + EtO− (Al-bound forms)</text><path data-electrons="2" d="M143.04,141.60 Q131.88,98.60 120.72,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#ester-lah-reduction-3-pair)"/><path data-electrons="2" d="M154.20,141.60 Q182.10,203.60 210.00,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#ester-lah-reduction-3-pair)"/><text x="24" y="235" font-size="16">Carbonyl reformation expels alkoxide; aldehyde is more reactive and is not isolated under excess LAH.</text></g></svg>