<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" role="img"><title>Pinacol rearrangement: Heterolytic ionization</title><desc>Me2C(OH2+)C(OH)Me2 → Me2C+–C(OH)Me2 + H2O. The C–O pair leaves with water in the limiting cation model.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="pinacol-2-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="pinacol-2-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Pinacol rearrangement · 2</text><text x="24" y="65" font-size="17">Heterolytic ionization</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">Me2</text><text x="68.64" y="155" font-size="24.00">C</text><text x="83.52" y="155" font-size="24.00">(</text><text x="98.40" y="155" font-size="24.00">OH2+</text><text x="157.92" y="155" font-size="24.00">)C(OH)Me2</text><text x="665.00" y="155" font-size="24.00">Me2C+–C(OH)Me2 + H2O</text><path data-electrons="2" d="M102.12,141.60 Q115.14,98.60 128.16,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#pinacol-2-pair)"/><text x="24" y="235" font-size="16">The C–O pair leaves with water in the limiting cation model.</text></g></svg>