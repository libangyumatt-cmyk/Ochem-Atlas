<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 2670"><title>Robinson annulation: complete teaching sequence</title><g font-family="DejaVu Sans,sans-serif"><rect width="1200" height="350" fill="#fffefa"/><text x="25" y="32" font-size="21" fill="#203c43">Robinson annulation · representative molecular graphs</text><path d="M342.10,209.74 L305.42,223.26" stroke="#203c43" stroke-width="2" fill="none"/><path d="M340.02,204.11 L303.34,217.63" stroke="#203c43" stroke-width="2" fill="none"/><path d="M304.38,220.44 L305.38,259.44" stroke="#203c43" stroke-width="2" fill="none"/><path d="M305.38,259.44 L272.84,280.50" stroke="#203c43" stroke-width="2" fill="none"/><path d="M272.84,280.50 L235.90,268.57" stroke="#203c43" stroke-width="2" fill="none"/><path d="M235.90,268.57 L229.19,230.79" stroke="#203c43" stroke-width="2" fill="none"/><path d="M229.19,230.79 L264.52,213.72" stroke="#203c43" stroke-width="2" fill="none"/><path d="M304.38,220.44 L264.52,213.72" stroke="#203c43" stroke-width="2" fill="none"/><path d="M208.07,119.20 L244.87,107.98" stroke="#203c43" stroke-width="2" fill="none"/><path d="M209.81,124.94 L246.62,113.72" stroke="#203c43" stroke-width="2" fill="none"/><path d="M245.75,110.85 L285.50,105.85" stroke="#203c43" stroke-width="2" fill="none"/><path d="M285.50,105.85 L314.46,80.50" stroke="#203c43" stroke-width="2" fill="none"/><path d="M287.30,103.45 L318.03,126.52" stroke="#203c43" stroke-width="2" fill="none"/><path d="M283.70,108.25 L314.43,131.32" stroke="#203c43" stroke-width="2" fill="none"/><rect x="336.06" y="196.92" width="10" height="20" fill="#fffefa"/><text x="341.06" y="211.92" font-size="16" text-anchor="middle" fill="#203c43">O</text><rect x="299.38" y="210.44" width="10" height="20" fill="#fffefa"/><text x="304.38" y="225.44" font-size="16" text-anchor="middle" fill="#203c43">C</text><rect x="290.38" y="249.44" width="30" height="20" fill="#fffefa"/><text x="305.38" y="264.44" font-size="16" text-anchor="middle" fill="#203c43">CH2</text><rect x="257.84" y="270.50" width="30" height="20" fill="#fffefa"/><text x="272.84" y="285.50" font-size="16" text-anchor="middle" fill="#203c43">CH2</text><rect x="220.90" y="258.57" width="30" height="20" fill="#fffefa"/><text x="235.90" y="273.57" font-size="16" text-anchor="middle" fill="#203c43">CH2</text><rect x="214.19" y="220.79" width="30" height="20" fill="#fffefa"/><text x="229.19" y="235.79" font-size="16" text-anchor="middle" fill="#203c43">CH2</text><rect x="249.52" y="203.72" width="30" height="20" fill="#fffefa"/><text x="264.52" y="218.72" font-size="16" text-anchor="middle" fill="#203c43">CH2</text><rect x="193.94" y="112.07" width="30" height="20" fill="#fffefa"/><text x="208.94" y="127.07" font-size="16" text-anchor="middle" fill="#203c43">CH2</text><rect x="235.75" y="100.85" width="20" height="20" fill="#fffefa"/><text x="245.75" y="115.85" font-size="16" text-anchor="middle" fill="#203c43">CH</text><rect x="280.50" y="95.85" width="10" height="20" fill="#fffefa"/><text x="285.50" y="110.85" font-size="16" text-anchor="middle" fill="#203c43">C</text><rect x="299.46" y="70.50" width="30" height="20" fill="#fffefa"/><text x="314.46" y="85.50" font-size="16" text-anchor="middle" fill="#203c43">CH3</text><rect x="311.23" y="118.92" width="10" height="20" fill="#fffefa"/><text x="316.23" y="133.92" font-size="16" text-anchor="middle" fill="#203c43">O</text><path d="M1074.41,207.60 L1008.68,227.75" stroke="#203c43" stroke-width="2" fill="none"/><path d="M1072.65,201.87 L1006.92,222.02" stroke="#203c43" stroke-width="2" fill="none"/><path d="M1007.80,224.88 L963.55,280.50" stroke="#203c43" stroke-width="2" fill="none"/><path d="M963.55,280.50 L893.79,275.84" stroke="#203c43" stroke-width="2" fill="none"/><path d="M893.79,275.84 L856.03,214.66" stroke="#203c43" stroke-width="2" fill="none"/><path d="M856.03,214.66 L785.98,200.68" stroke="#203c43" stroke-width="2" fill="none"/><path d="M785.98,200.68 L756.47,137.94" stroke="#203c43" stroke-width="2" fill="none"/><path d="M756.47,137.94 L794.59,80.50" stroke="#203c43" stroke-width="2" fill="none"/><path d="M794.59,80.50 L863.14,88.93" stroke="#203c43" stroke-width="2" fill="none"/><path d="M863.14,88.93 L896.14,152.62" stroke="#203c43" stroke-width="2" fill="none"/><path d="M856.03,214.66 L896.14,152.62" stroke="#203c43" stroke-width="2" fill="none"/><path d="M896.78,149.69 L966.64,165.02" stroke="#203c43" stroke-width="2" fill="none"/><path d="M895.49,155.55 L965.36,170.88" stroke="#203c43" stroke-width="2" fill="none"/><path d="M1007.80,224.88 L966.00,167.95" stroke="#203c43" stroke-width="2" fill="none"/><rect x="1068.53" y="194.73" width="10" height="20" fill="#fffefa"/><text x="1073.53" y="209.73" font-size="16" text-anchor="middle" fill="#203c43">O</text><rect x="1002.80" y="214.88" width="10" height="20" fill="#fffefa"/><text x="1007.80" y="229.88" font-size="16" text-anchor="middle" fill="#203c43">C</text><rect x="948.55" y="270.50" width="30" height="20" fill="#fffefa"/><text x="963.55" y="285.50" font-size="16" text-anchor="middle" fill="#203c43">CH2</text><rect x="878.79" y="265.84" width="30" height="20" fill="#fffefa"/><text x="893.79" y="280.84" font-size="16" text-anchor="middle" fill="#203c43">CH2</text><rect x="846.03" y="204.66" width="20" height="20" fill="#fffefa"/><text x="856.03" y="219.66" font-size="16" text-anchor="middle" fill="#203c43">CH</text><rect x="770.98" y="190.68" width="30" height="20" fill="#fffefa"/><text x="785.98" y="205.68" font-size="16" text-anchor="middle" fill="#203c43">CH2</text><rect x="741.47" y="127.94" width="30" height="20" fill="#fffefa"/><text x="756.47" y="142.94" font-size="16" text-anchor="middle" fill="#203c43">CH2</text><rect x="779.59" y="70.50" width="30" height="20" fill="#fffefa"/><text x="794.59" y="85.50" font-size="16" text-anchor="middle" fill="#203c43">CH2</text><rect x="848.14" y="78.93" width="30" height="20" fill="#fffefa"/><text x="863.14" y="93.93" font-size="16" text-anchor="middle" fill="#203c43">CH2</text><rect x="891.14" y="142.62" width="10" height="20" fill="#fffefa"/><text x="896.14" y="157.62" font-size="16" text-anchor="middle" fill="#203c43">C</text><rect x="956.00" y="157.95" width="20" height="20" fill="#fffefa"/><text x="966.00" y="172.95" font-size="16" text-anchor="middle" fill="#203c43">CH</text><text x="580" y="180" font-size="32" fill="#203c43">→</text><text x="25" y="330" font-size="15" fill="#203c43">Representative substrate/product connectivity; other reagents/byproducts are in the equation. No computed geometry.</text></g><g transform="translate(0,350)"><title>Robinson annulation: Proton transfer</title><desc>Cyclohexanone alpha-CH–H + :OH− → Cyclohexanone carbon enolate + H2O. Generate the donor enolate at the ring alpha carbon.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="robinson-annulation-1-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="robinson-annulation-1-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Robinson annulation · 1</text><text x="24" y="65" font-size="17">Proton transfer</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">Cyclohexanone alpha-</text><text x="321.60" y="155" font-size="24.00">CH</text><text x="351.36" y="155" font-size="24.00">–</text><text x="366.24" y="155" font-size="24.00">H</text><text x="381.12" y="155" font-size="24.00"> + </text><text x="425.76" y="155" font-size="24.00">:OH−</text><text x="665.00" y="155" font-size="24.00">Cyclohexanone carbon enolate + H2O</text><path data-electrons="2" d="M455.52,141.60 Q414.60,98.60 373.68,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#robinson-annulation-1-pair)"/><path data-electrons="2" d="M355.08,141.60 Q345.78,203.60 336.48,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#robinson-annulation-1-pair)"/><text x="24" y="235" font-size="16">Generate the donor enolate at the ring alpha carbon.</text></g></g><g transform="translate(0,640)"><title>Robinson annulation: Coupled polar bond reorganization</title><desc>Ring alpha-C:− + CH2=CH–COCH3 → Ring–CH2CH−COCH3 (acceptor enolate). The ring enolate makes a Michael bond to MVK beta carbon; pi electrons shift into the acceptor enolate.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="robinson-annulation-2-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="robinson-annulation-2-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Robinson annulation · 2</text><text x="24" y="65" font-size="17">Coupled polar bond reorganization</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">Ring alpha-</text><text x="187.68" y="155" font-size="24.00">C:−</text><text x="232.32" y="155" font-size="24.00"> + </text><text x="276.96" y="155" font-size="24.00">CH2</text><text x="321.60" y="155" font-size="24.00">=</text><text x="336.48" y="155" font-size="24.00">CH</text><text x="366.24" y="155" font-size="24.00">–COCH3</text><text x="665.00" y="155" font-size="23.50">Ring–CH2CH−COCH3 (acceptor enolate)</text><path data-electrons="2" d="M210.00,141.60 Q254.64,98.60 299.28,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#robinson-annulation-2-pair)"/><path data-electrons="2" d="M325.32,141.60 Q338.34,203.60 351.36,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#robinson-annulation-2-pair)"/><text x="24" y="235" font-size="16">The ring enolate makes a Michael bond to MVK beta carbon; pi electrons shift into the acceptor enolate.</text></g></g><g transform="translate(0,930)"><title>Robinson annulation: Proton transfer</title><desc>Acceptor enolate + H2O → 2-(3-Oxobutyl)cyclohexanone + OH−. Protonate the acceptor enolate to complete the Michael stage.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="robinson-annulation-3-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="robinson-annulation-3-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Robinson annulation · 3</text><text x="24" y="65" font-size="17">Proton transfer</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">Acceptor enolate + H2O</text><text x="665.00" y="155" font-size="24.00">2-(3-Oxobutyl)cyclohexanone + OH−</text><text x="30" y="202" font-size="16">Condensed structural stage; electron changes are specified below.</text><text x="24" y="235" font-size="16">Protonate the acceptor enolate to complete the Michael stage.</text></g></g><g transform="translate(0,1220)"><title>Robinson annulation: Proton transfer</title><desc>Ring–CH2CH2CO–CH2–H + :OH− → Terminal side-chain ketone enolate + H2O. Deprotonate the terminal methyl of the newly attached ketone; this donor closes a six-membered ring.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="robinson-annulation-4-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="robinson-annulation-4-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Robinson annulation · 4</text><text x="24" y="65" font-size="17">Proton transfer</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">Ring–CH2CH2CO–</text><text x="232.32" y="155" font-size="24.00">CH2</text><text x="276.96" y="155" font-size="24.00">–</text><text x="291.84" y="155" font-size="24.00">H</text><text x="306.72" y="155" font-size="24.00"> + </text><text x="351.36" y="155" font-size="24.00">:OH−</text><text x="665.00" y="155" font-size="20.56">Terminal side-chain ketone enolate + H2O</text><path data-electrons="2" d="M381.12,141.60 Q340.20,98.60 299.28,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#robinson-annulation-4-pair)"/><path data-electrons="2" d="M276.96,141.60 Q265.80,203.60 254.64,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#robinson-annulation-4-pair)"/><text x="24" y="235" font-size="16">Deprotonate the terminal methyl of the newly attached ketone; this donor closes a six-membered ring.</text></g></g><g transform="translate(0,1510)"><title>Robinson annulation: Nucleophilic carbonyl addition</title><desc>Side-chain C:− approaching original ring C=O → Fused6/6 bicyclic beta-alkoxide ketone. Intramolecular aldol attack forms the second C–C bond and opens the original ring carbonyl pi bond.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="robinson-annulation-5-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="robinson-annulation-5-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Robinson annulation · 5</text><text x="24" y="65" font-size="17">Nucleophilic carbonyl addition</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="19.06">Side-chain </text><text x="154.00" y="155" font-size="19.06">C:−</text><text x="189.45" y="155" font-size="19.06"> approaching original ring </text><text x="508.55" y="155" font-size="19.06">C</text><text x="520.36" y="155" font-size="19.06">=</text><text x="532.18" y="155" font-size="19.06">O</text><text x="665.00" y="155" font-size="21.65">Fused6/6 bicyclic beta-alkoxide ketone</text><path data-electrons="2" d="M171.73,143.33 Q343.09,100.33 514.45,139.33" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#robinson-annulation-5-pair)"/><path data-electrons="2" d="M526.27,143.33 Q532.18,205.33 538.09,139.33" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#robinson-annulation-5-pair)"/><text x="24" y="235" font-size="16">Intramolecular aldol attack forms the second C–C bond and opens the original ring carbonyl pi bond.</text></g></g><g transform="translate(0,1800)"><title>Robinson annulation: Proton transfer</title><desc>Bicyclic alkoxide + H2O → Bicyclic beta-hydroxy ketone + OH−. Protonate the aldol alkoxide.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="robinson-annulation-6-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="robinson-annulation-6-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Robinson annulation · 6</text><text x="24" y="65" font-size="17">Proton transfer</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">Bicyclic alkoxide + H2O</text><text x="665.00" y="155" font-size="24.00">Bicyclic beta-hydroxy ketone + OH−</text><text x="30" y="202" font-size="16">Condensed structural stage; electron changes are specified below.</text><text x="24" y="235" font-size="16">Protonate the aldol alkoxide.</text></g></g><g transform="translate(0,2090)"><title>Robinson annulation: Proton transfer</title><desc>Bicyclic beta-hydroxy ketone alpha-C–H + OH− → Bicyclic enolate + H2O. Remove the alpha proton of the retained ketone to form the E1cB precursor.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="robinson-annulation-7-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="robinson-annulation-7-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Robinson annulation · 7</text><text x="24" y="65" font-size="17">Proton transfer</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="19.06">Bicyclic beta-hydroxy ketone alpha-C–H + OH−</text><text x="665.00" y="155" font-size="24.00">Bicyclic enolate + H2O</text><text x="30" y="202" font-size="16">Condensed structural stage; electron changes are specified below.</text><text x="24" y="235" font-size="16">Remove the alpha proton of the retained ketone to form the E1cB precursor.</text></g></g><g transform="translate(0,2380)"><title>Robinson annulation: E1cB dehydration</title><desc>Bicyclic enolate bearing beta-OH → Fused bicyclic enone (octalone) + OH−. Enolate donation makes the alpha/beta alkene as C–OH cleaves. Original carbonyl oxygen leaves with hydroxide; the side-chain-derived ketone is retained.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="robinson-annulation-8-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="robinson-annulation-8-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Robinson annulation · 8</text><text x="24" y="65" font-size="17">E1cB dehydration</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">Bicyclic enolate bearing beta-OH</text><text x="665.00" y="155" font-size="22.23">Fused bicyclic enone (octalone) + OH−</text><text x="30" y="202" font-size="16">Condensed structural stage; electron changes are specified below.</text><text x="24" y="235" font-size="16">Enolate donation makes the alpha/beta alkene as C–OH cleaves. Original carbonyl oxygen leaves with</text><text x="24" y="258" font-size="16">hydroxide; the side-chain-derived ketone is retained.</text></g></g></svg>