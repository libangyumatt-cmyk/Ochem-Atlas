<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 2320"><title>Robinson annulation: complete teaching sequence</title><g transform="translate(0,0)"><title>Robinson annulation: Proton transfer</title><desc>Cyclohexanone alpha-CH–H + :OH− → Cyclohexanone carbon enolate + H2O. Generate the donor enolate at the ring alpha carbon.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="robinson-annulation-1-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="robinson-annulation-1-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Robinson annulation · 1</text><text x="24" y="65" font-size="17">Proton transfer</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">Cyclohexanone alpha-</text><text x="321.60" y="155" font-size="24.00">CH</text><text x="351.36" y="155" font-size="24.00">–</text><text x="366.24" y="155" font-size="24.00">H</text><text x="381.12" y="155" font-size="24.00"> + </text><text x="425.76" y="155" font-size="24.00">:OH−</text><text x="665.00" y="155" font-size="24.00">Cyclohexanone carbon enolate + H2O</text><path data-electrons="2" d="M455.52,141.60 Q414.60,98.60 373.68,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#robinson-annulation-1-pair)"/><path data-electrons="2" d="M355.08,141.60 Q345.78,203.60 336.48,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#robinson-annulation-1-pair)"/><text x="24" y="235" font-size="16">Generate the donor enolate at the ring alpha carbon.</text></g></g><g transform="translate(0,290)"><title>Robinson annulation: Coupled polar bond reorganization</title><desc>Ring alpha-C:− + CH2=CH–COCH3 → Ring–CH2CH−COCH3 (acceptor enolate). The ring enolate makes a Michael bond to MVK beta carbon; pi electrons shift into the acceptor enolate.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="robinson-annulation-2-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="robinson-annulation-2-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Robinson annulation · 2</text><text x="24" y="65" font-size="17">Coupled polar bond reorganization</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">Ring alpha-</text><text x="187.68" y="155" font-size="24.00">C:−</text><text x="232.32" y="155" font-size="24.00"> + </text><text x="276.96" y="155" font-size="24.00">CH2</text><text x="321.60" y="155" font-size="24.00">=</text><text x="336.48" y="155" font-size="24.00">CH</text><text x="366.24" y="155" font-size="24.00">–COCH3</text><text x="665.00" y="155" font-size="23.50">Ring–CH2CH−COCH3 (acceptor enolate)</text><path data-electrons="2" d="M210.00,141.60 Q254.64,98.60 299.28,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#robinson-annulation-2-pair)"/><path data-electrons="2" d="M325.32,141.60 Q338.34,203.60 351.36,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#robinson-annulation-2-pair)"/><text x="24" y="235" font-size="16">The ring enolate makes a Michael bond to MVK beta carbon; pi electrons shift into the acceptor enolate.</text></g></g><g transform="translate(0,580)"><title>Robinson annulation: Proton transfer</title><desc>Acceptor enolate + H2O → 2-(3-Oxobutyl)cyclohexanone + OH−. Protonate the acceptor enolate to complete the Michael stage.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="robinson-annulation-3-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="robinson-annulation-3-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Robinson annulation · 3</text><text x="24" y="65" font-size="17">Proton transfer</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">Acceptor enolate + H2O</text><text x="665.00" y="155" font-size="24.00">2-(3-Oxobutyl)cyclohexanone + OH−</text><text x="30" y="202" font-size="16">Process model: no unique microscopic electron-arrow sequence asserted.</text><text x="24" y="235" font-size="16">Protonate the acceptor enolate to complete the Michael stage.</text></g></g><g transform="translate(0,870)"><title>Robinson annulation: Proton transfer</title><desc>Ring–CH2CH2CO–CH2–H + :OH− → Terminal side-chain ketone enolate + H2O. Deprotonate the terminal methyl of the newly attached ketone; this donor closes a six-membered ring.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="robinson-annulation-4-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="robinson-annulation-4-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Robinson annulation · 4</text><text x="24" y="65" font-size="17">Proton transfer</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">Ring–CH2CH2CO–</text><text x="232.32" y="155" font-size="24.00">CH2</text><text x="276.96" y="155" font-size="24.00">–</text><text x="291.84" y="155" font-size="24.00">H</text><text x="306.72" y="155" font-size="24.00"> + </text><text x="351.36" y="155" font-size="24.00">:OH−</text><text x="665.00" y="155" font-size="20.56">Terminal side-chain ketone enolate + H2O</text><path data-electrons="2" d="M381.12,141.60 Q340.20,98.60 299.28,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#robinson-annulation-4-pair)"/><path data-electrons="2" d="M276.96,141.60 Q265.80,203.60 254.64,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#robinson-annulation-4-pair)"/><text x="24" y="235" font-size="16">Deprotonate the terminal methyl of the newly attached ketone; this donor closes a six-membered ring.</text></g></g><g transform="translate(0,1160)"><title>Robinson annulation: Nucleophilic carbonyl addition</title><desc>Side-chain C:− approaching original ring C=O → Fused6/6 bicyclic beta-alkoxide ketone. Intramolecular aldol attack forms the second C–C bond and opens the original ring carbonyl pi bond.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="robinson-annulation-5-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="robinson-annulation-5-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Robinson annulation · 5</text><text x="24" y="65" font-size="17">Nucleophilic carbonyl addition</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="19.06">Side-chain </text><text x="154.00" y="155" font-size="19.06">C:−</text><text x="189.45" y="155" font-size="19.06"> approaching original ring </text><text x="508.55" y="155" font-size="19.06">C</text><text x="520.36" y="155" font-size="19.06">=</text><text x="532.18" y="155" font-size="19.06">O</text><text x="665.00" y="155" font-size="21.65">Fused6/6 bicyclic beta-alkoxide ketone</text><path data-electrons="2" d="M171.73,143.33 Q343.09,100.33 514.45,139.33" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#robinson-annulation-5-pair)"/><path data-electrons="2" d="M526.27,143.33 Q532.18,205.33 538.09,139.33" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#robinson-annulation-5-pair)"/><text x="24" y="235" font-size="16">Intramolecular aldol attack forms the second C–C bond and opens the original ring carbonyl pi bond.</text></g></g><g transform="translate(0,1450)"><title>Robinson annulation: Proton transfer</title><desc>Bicyclic alkoxide + H2O → Bicyclic beta-hydroxy ketone + OH−. Protonate the aldol alkoxide.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="robinson-annulation-6-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="robinson-annulation-6-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Robinson annulation · 6</text><text x="24" y="65" font-size="17">Proton transfer</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">Bicyclic alkoxide + H2O</text><text x="665.00" y="155" font-size="24.00">Bicyclic beta-hydroxy ketone + OH−</text><text x="30" y="202" font-size="16">Process model: no unique microscopic electron-arrow sequence asserted.</text><text x="24" y="235" font-size="16">Protonate the aldol alkoxide.</text></g></g><g transform="translate(0,1740)"><title>Robinson annulation: Proton transfer</title><desc>Bicyclic beta-hydroxy ketone alpha-C–H + OH− → Bicyclic enolate + H2O. Remove the alpha proton of the retained ketone to form the E1cB precursor.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="robinson-annulation-7-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="robinson-annulation-7-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Robinson annulation · 7</text><text x="24" y="65" font-size="17">Proton transfer</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="19.06">Bicyclic beta-hydroxy ketone alpha-C–H + OH−</text><text x="665.00" y="155" font-size="24.00">Bicyclic enolate + H2O</text><text x="30" y="202" font-size="16">Process model: no unique microscopic electron-arrow sequence asserted.</text><text x="24" y="235" font-size="16">Remove the alpha proton of the retained ketone to form the E1cB precursor.</text></g></g><g transform="translate(0,2030)"><title>Robinson annulation: E1cB dehydration</title><desc>Bicyclic enolate bearing beta-OH → Fused bicyclic enone (octalone) + OH−. Enolate donation makes the alpha/beta alkene as C–OH cleaves. Original carbonyl oxygen leaves with hydroxide; the side-chain-derived ketone is retained.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="robinson-annulation-8-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="robinson-annulation-8-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Robinson annulation · 8</text><text x="24" y="65" font-size="17">E1cB dehydration</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">Bicyclic enolate bearing beta-OH</text><text x="665.00" y="155" font-size="22.23">Fused bicyclic enone (octalone) + OH−</text><text x="30" y="202" font-size="16">Process model: no unique microscopic electron-arrow sequence asserted.</text><text x="24" y="235" font-size="16">Enolate donation makes the alpha/beta alkene as C–OH cleaves. Original carbonyl oxygen leaves with hydroxide; the side-chain-derived</text><text x="24" y="258" font-size="16">ketone is retained.</text></g></g></svg>