<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" role="img"><title>Hofmann amide rearrangement: Bond-replacing displacement</title><desc>PhCO–NH:− + Br–Br → PhCONHBr + Br−. Nitrogen attacks bromine and Br–Br cleavage gives N-bromoamide.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="hofmann-rearrangement-2-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="hofmann-rearrangement-2-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Hofmann amide rearrangement · 2</text><text x="24" y="65" font-size="17">Bond-replacing displacement</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">PhCO–</text><text x="98.40" y="155" font-size="24.00">NH:−</text><text x="157.92" y="155" font-size="24.00"> + </text><text x="202.56" y="155" font-size="24.00">Br</text><text x="232.32" y="155" font-size="24.00">–</text><text x="247.20" y="155" font-size="24.00">Br</text><text x="665.00" y="155" font-size="24.00">PhCONHBr + Br−</text><path data-electrons="2" d="M128.16,141.60 Q172.80,98.60 217.44,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#hofmann-rearrangement-2-pair)"/><path data-electrons="2" d="M239.76,141.60 Q250.92,203.60 262.08,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#hofmann-rearrangement-2-pair)"/><text x="24" y="235" font-size="16">Nitrogen attacks bromine and Br–Br cleavage gives N-bromoamide.</text></g></svg>