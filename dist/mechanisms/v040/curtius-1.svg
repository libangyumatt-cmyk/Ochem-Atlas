<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" role="img"><title>Curtius rearrangement: Concerted migration / nitrogen extrusion</title><desc>Ph–C(=O)–N–N2 → PhN=C=O + N2. C–Ph migration to the acyl-bound N is coupled to N2 extrusion and C=N formation in the thermal concerted model.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="curtius-1-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="curtius-1-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Curtius rearrangement · 1</text><text x="24" y="65" font-size="17">Concerted migration / nitrogen extrusion</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">Ph</text><text x="53.76" y="155" font-size="24.00">–</text><text x="68.64" y="155" font-size="24.00">C</text><text x="83.52" y="155" font-size="24.00">(=O)–</text><text x="157.92" y="155" font-size="24.00">N</text><text x="172.80" y="155" font-size="24.00">–</text><text x="187.68" y="155" font-size="24.00">N2</text><text x="665.00" y="155" font-size="24.00">PhN=C=O + N2</text><path data-electrons="2" d="M57.48,141.60 Q111.42,98.60 165.36,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#curtius-1-pair)"/><path data-electrons="2" d="M183.96,141.60 Q193.26,203.60 202.56,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#curtius-1-pair)"/><text x="24" y="235" font-size="16">C–Ph migration to the acyl-bound N is coupled to N2 extrusion and C=N formation in the thermal concerted</text><text x="24" y="258" font-size="16">model.</text></g></svg>