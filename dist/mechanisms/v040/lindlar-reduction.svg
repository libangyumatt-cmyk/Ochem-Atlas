<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1160"><title>Lindlar partial alkyne hydrogenation: complete teaching sequence</title><g transform="translate(0,0)"><title>Lindlar partial alkyne hydrogenation: Mechanistic boundary / grouped stage</title><desc>H2 + 2* → 2 H–*. Hydrogen dissociatively adsorbs on the poisoned palladium surface.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="lindlar-reduction-1-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="lindlar-reduction-1-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Lindlar partial alkyne hydrogenation · 1</text><text x="24" y="65" font-size="17">Mechanistic boundary / grouped stage</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">H2 + 2*</text><text x="665.00" y="155" font-size="24.00">2 H–*</text><text x="30" y="202" font-size="16">Process model: no unique microscopic electron-arrow sequence asserted.</text><text x="24" y="235" font-size="16">Hydrogen dissociatively adsorbs on the poisoned palladium surface.</text></g></g><g transform="translate(0,290)"><title>Lindlar partial alkyne hydrogenation: Mechanistic boundary / grouped stage</title><desc>CH3C≡CCH3 + * → Adsorbed 2-butyne–*. Alkyne binds to the surface; catalyst coverage and poison affect residence time.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="lindlar-reduction-2-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="lindlar-reduction-2-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Lindlar partial alkyne hydrogenation · 2</text><text x="24" y="65" font-size="17">Mechanistic boundary / grouped stage</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">CH3C≡CCH3 + *</text><text x="665.00" y="155" font-size="24.00">Adsorbed 2-butyne–*</text><text x="30" y="202" font-size="16">Process model: no unique microscopic electron-arrow sequence asserted.</text><text x="24" y="235" font-size="16">Alkyne binds to the surface; catalyst coverage and poison affect residence time.</text></g></g><g transform="translate(0,580)"><title>Lindlar partial alkyne hydrogenation: Mechanistic boundary / grouped stage</title><desc>Adsorbed 2-butyne + H–* → Surface vinyl intermediate. First surface hydrogen transfer gives a vinyl-bound model.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="lindlar-reduction-3-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="lindlar-reduction-3-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Lindlar partial alkyne hydrogenation · 3</text><text x="24" y="65" font-size="17">Mechanistic boundary / grouped stage</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">Adsorbed 2-butyne + H–*</text><text x="665.00" y="155" font-size="24.00">Surface vinyl intermediate</text><text x="30" y="202" font-size="16">Process model: no unique microscopic electron-arrow sequence asserted.</text><text x="24" y="235" font-size="16">First surface hydrogen transfer gives a vinyl-bound model.</text></g></g><g transform="translate(0,870)"><title>Lindlar partial alkyne hydrogenation: Mechanistic boundary / grouped stage</title><desc>Surface vinyl + H–* → cis-(Z)-CH3CH=CHCH3 + sites. Second same-face hydrogen delivery and desorption give the Z alkene.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="lindlar-reduction-4-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="lindlar-reduction-4-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Lindlar partial alkyne hydrogenation · 4</text><text x="24" y="65" font-size="17">Mechanistic boundary / grouped stage</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">Surface vinyl + H–*</text><text x="665.00" y="155" font-size="24.00">cis-(Z)-CH3CH=CHCH3 + sites</text><text x="30" y="202" font-size="16">Process model: no unique microscopic electron-arrow sequence asserted.</text><text x="24" y="235" font-size="16">Second same-face hydrogen delivery and desorption give the Z alkene.</text></g></g></svg>