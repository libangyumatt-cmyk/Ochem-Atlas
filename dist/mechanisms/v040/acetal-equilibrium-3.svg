<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" role="img"><title>Acetal formation and hydrolysis: Proton transfer</title><desc>CH3CH(OH)(O+Me–H) + :MeOH → CH3CH(OH)(OMe) + MeOH2+. Solvent removes the incoming alcohol proton to form the hemiacetal.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="acetal-equilibrium-3-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="acetal-equilibrium-3-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Acetal formation and hydrolysis · 3</text><text x="24" y="65" font-size="17">Proton transfer</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">CH3CH(OH)(</text><text x="172.80" y="155" font-size="24.00">O+Me</text><text x="232.32" y="155" font-size="24.00">–</text><text x="247.20" y="155" font-size="24.00">H</text><text x="262.08" y="155" font-size="24.00">) + </text><text x="321.60" y="155" font-size="24.00">:MeOH</text><text x="665.00" y="155" font-size="24.00">CH3CH(OH)(OMe) + MeOH2+</text><path data-electrons="2" d="M358.80,141.60 Q306.72,98.60 254.64,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#acetal-equilibrium-3-pair)"/><path data-electrons="2" d="M228.60,141.60 Q215.58,203.60 202.56,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#acetal-equilibrium-3-pair)"/><text x="24" y="235" font-size="16">Solvent removes the incoming alcohol proton to form the hemiacetal.</text></g></svg>