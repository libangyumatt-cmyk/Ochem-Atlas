<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1220"><title>Negishi coupling: complete teaching sequence</title><g font-family="DejaVu Sans,sans-serif"><rect width="1200" height="350" fill="#fffefa"/><text x="25" y="32" font-size="21" fill="#203c43">Negishi coupling · representative molecular graphs</text><path d="M396.66,228.24 L314.78,219.08" stroke="#203c43" stroke-width="2" fill="none"/><path d="M316.27,221.68 L242.71,264.00" stroke="#203c43" stroke-width="2" fill="none"/><path d="M313.28,216.48 L239.72,258.80" stroke="#203c43" stroke-width="2" fill="none" stroke-dasharray="4 3"/><path d="M240.09,264.19 L163.00,233.12" stroke="#203c43" stroke-width="2" fill="none"/><path d="M242.34,258.62 L165.24,227.55" stroke="#203c43" stroke-width="2" fill="none" stroke-dasharray="4 3"/><path d="M161.15,230.73 L150.37,148.90" stroke="#203c43" stroke-width="2" fill="none"/><path d="M167.10,229.94 L156.32,148.12" stroke="#203c43" stroke-width="2" fill="none" stroke-dasharray="4 3"/><path d="M151.56,146.10 L217.73,97.18" stroke="#203c43" stroke-width="2" fill="none"/><path d="M155.13,150.92 L221.30,102.01" stroke="#203c43" stroke-width="2" fill="none" stroke-dasharray="4 3"/><path d="M220.91,96.94 L294.06,135.31" stroke="#203c43" stroke-width="2" fill="none"/><path d="M218.12,102.25 L291.27,140.62" stroke="#203c43" stroke-width="2" fill="none" stroke-dasharray="4 3"/><path d="M311.88,219.87 L289.77,138.76" stroke="#203c43" stroke-width="2" fill="none"/><path d="M317.67,218.29 L295.56,137.18" stroke="#203c43" stroke-width="2" fill="none" stroke-dasharray="4 3"/><rect x="386.66" y="218.24" width="20" height="20" fill="#fffefa"/><text x="396.66" y="233.24" font-size="16" text-anchor="middle" fill="#203c43">Br</text><rect x="309.78" y="209.08" width="10" height="20" fill="#fffefa"/><text x="314.78" y="224.08" font-size="16" text-anchor="middle" fill="#203c43">C</text><rect x="231.22" y="251.40" width="20" height="20" fill="#fffefa"/><text x="241.22" y="266.40" font-size="16" text-anchor="middle" fill="#203c43">CH</text><rect x="154.12" y="220.34" width="20" height="20" fill="#fffefa"/><text x="164.12" y="235.34" font-size="16" text-anchor="middle" fill="#203c43">CH</text><rect x="143.34" y="138.51" width="20" height="20" fill="#fffefa"/><text x="153.34" y="153.51" font-size="16" text-anchor="middle" fill="#203c43">CH</text><rect x="209.51" y="89.60" width="20" height="20" fill="#fffefa"/><text x="219.51" y="104.60" font-size="16" text-anchor="middle" fill="#203c43">CH</text><rect x="282.66" y="127.97" width="20" height="20" fill="#fffefa"/><text x="292.66" y="142.97" font-size="16" text-anchor="middle" fill="#203c43">CH</text><path d="M1064.59,246.43 L987.30,271.02" stroke="#203c43" stroke-width="2" fill="none"/><path d="M987.30,271.02 L907.88,241.58" stroke="#203c43" stroke-width="2" fill="none"/><path d="M908.24,244.56 L823.43,254.79" stroke="#203c43" stroke-width="2" fill="none"/><path d="M907.52,238.61 L822.71,248.84" stroke="#203c43" stroke-width="2" fill="none" stroke-dasharray="4 3"/><path d="M820.90,253.89 L763.24,193.63" stroke="#203c43" stroke-width="2" fill="none"/><path d="M825.24,249.74 L767.58,189.49" stroke="#203c43" stroke-width="2" fill="none" stroke-dasharray="4 3"/><path d="M762.50,190.83 L782.78,110.59" stroke="#203c43" stroke-width="2" fill="none"/><path d="M768.32,192.30 L788.59,112.06" stroke="#203c43" stroke-width="2" fill="none" stroke-dasharray="4 3"/><path d="M784.90,108.43 L864.17,87.08" stroke="#203c43" stroke-width="2" fill="none"/><path d="M786.46,114.23 L865.73,92.88" stroke="#203c43" stroke-width="2" fill="none" stroke-dasharray="4 3"/><path d="M867.39,88.24 L915.16,155.52" stroke="#203c43" stroke-width="2" fill="none"/><path d="M862.50,91.72 L910.27,158.99" stroke="#203c43" stroke-width="2" fill="none" stroke-dasharray="4 3"/><path d="M904.88,241.41 L909.72,157.09" stroke="#203c43" stroke-width="2" fill="none"/><path d="M910.87,241.76 L915.71,157.43" stroke="#203c43" stroke-width="2" fill="none" stroke-dasharray="4 3"/><rect x="1049.59" y="236.43" width="30" height="20" fill="#fffefa"/><text x="1064.59" y="251.43" font-size="16" text-anchor="middle" fill="#203c43">CH3</text><rect x="972.30" y="261.02" width="30" height="20" fill="#fffefa"/><text x="987.30" y="276.02" font-size="16" text-anchor="middle" fill="#203c43">CH2</text><rect x="902.88" y="231.58" width="10" height="20" fill="#fffefa"/><text x="907.88" y="246.58" font-size="16" text-anchor="middle" fill="#203c43">C</text><rect x="813.07" y="241.82" width="20" height="20" fill="#fffefa"/><text x="823.07" y="256.82" font-size="16" text-anchor="middle" fill="#203c43">CH</text><rect x="755.41" y="181.56" width="20" height="20" fill="#fffefa"/><text x="765.41" y="196.56" font-size="16" text-anchor="middle" fill="#203c43">CH</text><rect x="775.68" y="101.33" width="20" height="20" fill="#fffefa"/><text x="785.68" y="116.33" font-size="16" text-anchor="middle" fill="#203c43">CH</text><rect x="854.95" y="79.98" width="20" height="20" fill="#fffefa"/><text x="864.95" y="94.98" font-size="16" text-anchor="middle" fill="#203c43">CH</text><rect x="902.72" y="147.26" width="20" height="20" fill="#fffefa"/><text x="912.72" y="162.26" font-size="16" text-anchor="middle" fill="#203c43">CH</text><text x="580" y="180" font-size="32" fill="#203c43">→</text><text x="25" y="330" font-size="15" fill="#203c43">Representative substrate/product connectivity; other reagents/byproducts are in the equation. No computed geometry.</text></g><g transform="translate(0,350)"><title>Negishi coupling: Oxidative addition</title><desc>LnPd(0) + Ph–Br → LnPd(II)(Ph)(Br). Oxidative addition makes Pd–C/Pd–Br bonds and raises formal Pd oxidation state. Ligand dissociation/association and spin/speciation are not reduced to a molecular SN2 code.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="negishi-1-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="negishi-1-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Negishi coupling · 1</text><text x="24" y="65" font-size="17">Oxidative addition</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">LnPd(0) + Ph–Br</text><text x="665.00" y="155" font-size="24.00">LnPd(II)(Ph)(Br)</text><text x="30" y="202" font-size="16">Process model: no unique microscopic electron-arrow sequence asserted.</text><text x="24" y="235" font-size="16">Oxidative addition makes Pd–C/Pd–Br bonds and raises formal Pd oxidation state. Ligand</text><text x="24" y="258" font-size="16">dissociation/association and spin/speciation are not reduced to a molecular SN2 code.</text></g></g><g transform="translate(0,640)"><title>Negishi coupling: Organozinc transmetalation</title><desc>LnPd(II)(Ph)(Br) + EtZnBr → LnPd(II)(Ph)(Et) + ZnBr2. Transmetalation moves the ethyl group from zinc to Pd; aggregation and halide bridges can alter details.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="negishi-2-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="negishi-2-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Negishi coupling · 2</text><text x="24" y="65" font-size="17">Organozinc transmetalation</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">LnPd(II)(Ph)(Br) + EtZnBr</text><text x="665.00" y="155" font-size="24.00">LnPd(II)(Ph)(Et) + ZnBr2</text><text x="30" y="202" font-size="16">Process model: no unique microscopic electron-arrow sequence asserted.</text><text x="24" y="235" font-size="16">Transmetalation moves the ethyl group from zinc to Pd; aggregation and halide bridges can alter details.</text></g></g><g transform="translate(0,930)"><title>Negishi coupling: Reductive elimination</title><desc>cis-LnPd(II)(Ph)(Et) → PhCH2CH3 + LnPd(0). Reductive elimination forms the aryl–ethyl bond and restores Pd(0).</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="negishi-3-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="negishi-3-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Negishi coupling · 3</text><text x="24" y="65" font-size="17">Reductive elimination</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">cis-LnPd(II)(Ph)(Et)</text><text x="665.00" y="155" font-size="24.00">PhCH2CH3 + LnPd(0)</text><text x="30" y="202" font-size="16">Process model: no unique microscopic electron-arrow sequence asserted.</text><text x="24" y="235" font-size="16">Reductive elimination forms the aryl–ethyl bond and restores Pd(0).</text></g></g></svg>