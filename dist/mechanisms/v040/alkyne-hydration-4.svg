<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" role="img"><title>Mercury-catalyzed alkyne hydration: Coupled polar bond reorganization</title><desc>CH3–C(OH)=CH2 + H–OH2+ → CH3C(=OH+)CH3 + H2O. Enol pi electrons take a proton at terminal carbon while the oxygen lone pair forms C=O; this is coupled polar tautomerization, not hydride migration.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="alkyne-hydration-4-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="alkyne-hydration-4-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Mercury-catalyzed alkyne hydration · 4</text><text x="24" y="65" font-size="17">Coupled polar bond reorganization</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">CH3–</text><text x="83.52" y="155" font-size="24.00">C</text><text x="98.40" y="155" font-size="24.00">(OH)=</text><text x="172.80" y="155" font-size="24.00">CH2</text><text x="217.44" y="155" font-size="24.00"> + </text><text x="262.08" y="155" font-size="24.00">H</text><text x="276.96" y="155" font-size="24.00">–</text><text x="291.84" y="155" font-size="24.00">OH2+</text><text x="665.00" y="155" font-size="24.00">CH3C(=OH+)CH3 + H2O</text><path data-electrons="2" d="M143.04,141.60 Q206.28,98.60 269.52,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#alkyne-hydration-4-pair)"/><path data-electrons="2" d="M295.56,141.60 Q308.58,203.60 321.60,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#alkyne-hydration-4-pair)"/><text x="24" y="235" font-size="16">Enol pi electrons take a proton at terminal carbon while the oxygen lone pair forms C=O; this is coupled</text><text x="24" y="258" font-size="16">polar tautomerization, not hydride migration.</text></g></svg>