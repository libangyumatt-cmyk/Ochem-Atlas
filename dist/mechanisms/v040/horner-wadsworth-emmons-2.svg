<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" role="img"><title>Horner–Wadsworth–Emmons olefination: Nucleophilic carbonyl addition</title><desc>(EtO)2P(O)–C−HCO2Et + Ph–CH=O → PhCH(O−)–CH[P(O)(OEt)2]CO2Et. The phosphonate-stabilized carbon anion adds to benzaldehyde.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="horner-wadsworth-emmons-2-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="horner-wadsworth-emmons-2-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Horner–Wadsworth–Emmons olefination · 2</text><text x="24" y="65" font-size="17">Nucleophilic carbonyl addition</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">(EtO)2P(O)–</text><text x="187.68" y="155" font-size="24.00">C−H</text><text x="232.32" y="155" font-size="24.00">CO2Et + Ph–</text><text x="396.00" y="155" font-size="24.00">CH</text><text x="425.76" y="155" font-size="24.00">=</text><text x="440.64" y="155" font-size="24.00">O</text><text x="665.00" y="155" font-size="24.00">PhCH(O−)–CH[P(O)(OEt)2]CO2Et</text><path data-electrons="2" d="M210.00,141.60 Q310.44,98.60 410.88,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#horner-wadsworth-emmons-2-pair)"/><path data-electrons="2" d="M429.48,141.60 Q438.78,203.60 448.08,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#horner-wadsworth-emmons-2-pair)"/><text x="24" y="235" font-size="16">The phosphonate-stabilized carbon anion adds to benzaldehyde.</text></g></svg>