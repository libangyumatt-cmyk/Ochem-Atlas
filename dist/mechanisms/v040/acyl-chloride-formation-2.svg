<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" role="img"><title>Carboxylic acid conversion to acyl chloride: Proton transfer</title><desc>CH3C(=O)–O+(SOCl)–H + :Cl− → CH3C(=O)–O–SOCl + HCl. Chloride removes the acidic O proton to give acyl chlorosulfite.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="acyl-chloride-formation-2-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="acyl-chloride-formation-2-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Carboxylic acid conversion to acyl chloride · 2</text><text x="24" y="65" font-size="17">Proton transfer</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">CH3C(=O)–</text><text x="157.92" y="155" font-size="24.00">O+</text><text x="187.68" y="155" font-size="24.00">(SOCl)–</text><text x="291.84" y="155" font-size="24.00">H</text><text x="306.72" y="155" font-size="24.00"> + </text><text x="351.36" y="155" font-size="24.00">:Cl−</text><text x="665.00" y="155" font-size="24.00">CH3C(=O)–O–SOCl + HCl</text><path data-electrons="2" d="M381.12,141.60 Q340.20,98.60 299.28,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#acyl-chloride-formation-2-pair)"/><path data-electrons="2" d="M236.04,141.60 Q204.42,203.60 172.80,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#acyl-chloride-formation-2-pair)"/><text x="24" y="235" font-size="16">Chloride removes the acidic O proton to give acyl chlorosulfite.</text></g></svg>