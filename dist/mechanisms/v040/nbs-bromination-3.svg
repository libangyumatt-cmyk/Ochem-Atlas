<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" role="img"><title>NBS allylic bromination: Radical atom transfer</title><desc>Br• + ring CH=CH–CH(H)–(CH2)3–(back) → HBr + delocalized cyclohexenyl radical. Br radical removes an allylic H; resonance distributes the radical without a separate mechanistic event.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="nbs-bromination-3-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="nbs-bromination-3-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">NBS allylic bromination · 3</text><text x="24" y="65" font-size="17">Radical atom transfer</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="23.30">Br•</text><text x="67.33" y="155" font-size="23.30"> + ring CH=CH–</text><text x="269.56" y="155" font-size="23.30">CH</text><text x="298.44" y="155" font-size="23.30">(</text><text x="312.89" y="155" font-size="23.30">H</text><text x="327.33" y="155" font-size="23.30">)–(CH2)3–(back)</text><text x="665.00" y="155" font-size="21.65">HBr + delocalized cyclohexenyl radical</text><path data-electrons="1" d="M45.67,141.85 Q114.28,98.85 182.89,137.85" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#nbs-bromination-3-fish)"/><path data-electrons="1" d="M302.06,141.85 Q242.47,203.85 182.89,137.85" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#nbs-bromination-3-fish)"/><path data-electrons="1" d="M302.06,141.85 Q293.03,80.85 284.00,137.85" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#nbs-bromination-3-fish)"/><text x="24" y="235" font-size="16">Br radical removes an allylic H; resonance distributes the radical without a separate mechanistic event.</text></g></svg>