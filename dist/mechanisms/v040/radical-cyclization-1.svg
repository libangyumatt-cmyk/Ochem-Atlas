<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" role="img"><title>5-Hexenyl radical cyclization: Mechanistic boundary / grouped stage</title><desc>Initiator (e.g. AIBN) + heat → Initiator radicals + N2. Thermal initiator decomposition supplies radicals; the fragmentation is grouped and not assigned a closed-shell code.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="radical-cyclization-1-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="radical-cyclization-1-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">5-Hexenyl radical cyclization · 1</text><text x="24" y="65" font-size="17">Mechanistic boundary / grouped stage</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">Initiator (e.g. AIBN) + heat</text><text x="665.00" y="155" font-size="24.00">Initiator radicals + N2</text><text x="30" y="202" font-size="16">Process model: no unique microscopic electron-arrow sequence asserted.</text><text x="24" y="235" font-size="16">Thermal initiator decomposition supplies radicals; the fragmentation is grouped and not assigned a closed-</text><text x="24" y="258" font-size="16">shell code.</text></g></svg>