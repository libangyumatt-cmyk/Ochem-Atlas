<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" role="img"><title>DIBAL-H partial ester reduction: Tetrahedral intermediate collapse</title><desc>Ph–CH(O:H)–OEt + proton relays → PhCHO + EtOH. Solvent-assisted proton transfers and carbonyl reformation release ethanol and aldehyde.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="dibal-ester-reduction-4-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="dibal-ester-reduction-4-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">DIBAL-H partial ester reduction · 4</text><text x="24" y="65" font-size="17">Tetrahedral intermediate collapse</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">Ph–</text><text x="68.64" y="155" font-size="24.00">CH</text><text x="98.40" y="155" font-size="24.00">(</text><text x="113.28" y="155" font-size="24.00">O:H</text><text x="157.92" y="155" font-size="24.00">)–</text><text x="187.68" y="155" font-size="24.00">OEt</text><text x="232.32" y="155" font-size="24.00"> + proton relays</text><text x="665.00" y="155" font-size="24.00">PhCHO + EtOH</text><path data-electrons="2" d="M135.60,141.60 Q122.58,98.60 109.56,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#dibal-ester-reduction-4-pair)"/><path data-electrons="2" d="M146.76,141.60 Q178.38,203.60 210.00,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#dibal-ester-reduction-4-pair)"/><text x="24" y="235" font-size="16">Solvent-assisted proton transfers and carbonyl reformation release ethanol and aldehyde.</text></g></svg>