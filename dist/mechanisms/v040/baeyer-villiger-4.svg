<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" role="img"><title>Baeyer–Villiger oxidation: Coupled polar bond reorganization</title><desc>Ph–C(O:H)(Me)–O–OCOAr → MeC(=OH+)OPh + ArCO2−. C–Ph migrates to adjacent peroxide O; O–O cleaves and the original carbonyl O reforms C=O. Migration is not loss of a free phenyl anion.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="baeyer-villiger-4-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="baeyer-villiger-4-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Baeyer–Villiger oxidation · 4</text><text x="24" y="65" font-size="17">Coupled polar bond reorganization</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">Ph</text><text x="53.76" y="155" font-size="24.00">–</text><text x="68.64" y="155" font-size="24.00">C</text><text x="83.52" y="155" font-size="24.00">(</text><text x="98.40" y="155" font-size="24.00">O:H</text><text x="143.04" y="155" font-size="24.00">)(Me)–</text><text x="232.32" y="155" font-size="24.00">O</text><text x="247.20" y="155" font-size="24.00">–</text><text x="262.08" y="155" font-size="24.00">OCOAr</text><text x="665.00" y="155" font-size="24.00">MeC(=OH+)OPh + ArCO2−</text><path data-electrons="2" d="M57.48,141.60 Q148.62,98.60 239.76,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#baeyer-villiger-4-pair)"/><path data-electrons="2" d="M269.52,141.60 Q284.40,203.60 299.28,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#baeyer-villiger-4-pair)"/><path data-electrons="2" d="M120.72,141.60 Q109.56,80.60 98.40,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#baeyer-villiger-4-pair)"/><text x="24" y="235" font-size="16">C–Ph migrates to adjacent peroxide O; O–O cleaves and the original carbonyl O reforms C=O. Migration is not</text><text x="24" y="258" font-size="16">loss of a free phenyl anion.</text></g></svg>