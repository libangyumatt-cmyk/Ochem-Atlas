<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" role="img"><title>Enamine formation: Nucleophilic carbonyl addition</title><desc>Me2C=OH+ + :HNMe2 → Me2C(OH)(NH+Me2). Nitrogen attacks carbonyl carbon; the C=O pi pair returns to O, giving the carbinolammonium form.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="enamine-formation-2-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="enamine-formation-2-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Enamine formation · 2</text><text x="24" y="65" font-size="17">Nucleophilic carbonyl addition</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">Me2</text><text x="68.64" y="155" font-size="24.00">C</text><text x="83.52" y="155" font-size="24.00">=</text><text x="98.40" y="155" font-size="24.00">OH+</text><text x="143.04" y="155" font-size="24.00"> + </text><text x="187.68" y="155" font-size="24.00">:HNMe2</text><text x="665.00" y="155" font-size="24.00">Me2C(OH)(NH+Me2)</text><path data-electrons="2" d="M232.32,141.60 Q154.20,98.60 76.08,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#enamine-formation-2-pair)"/><path data-electrons="2" d="M98.40,141.60 Q109.56,203.60 120.72,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#enamine-formation-2-pair)"/><text x="24" y="235" font-size="16">Nitrogen attacks carbonyl carbon; the C=O pi pair returns to O, giving the carbinolammonium form.</text></g></svg>