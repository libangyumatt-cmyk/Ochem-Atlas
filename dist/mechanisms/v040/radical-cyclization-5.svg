<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" role="img"><title>5-Hexenyl radical cyclization: Radical atom transfer</title><desc>Cyclopentyl–CH2• + Bu3Sn–H → Methylcyclopentane + Bu3Sn•. H-atom transfer gives the methyl substituent and regenerates tin radical.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="radical-cyclization-5-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="radical-cyclization-5-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">5-Hexenyl radical cyclization · 5</text><text x="24" y="65" font-size="17">Radical atom transfer</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">Cyclopentyl–</text><text x="202.56" y="155" font-size="24.00">CH2•</text><text x="262.08" y="155" font-size="24.00"> + Bu3</text><text x="351.36" y="155" font-size="24.00">Sn</text><text x="381.12" y="155" font-size="24.00">–</text><text x="396.00" y="155" font-size="24.00">H</text><text x="665.00" y="155" font-size="24.00">Methylcyclopentane + Bu3Sn•</text><path data-electrons="1" d="M232.32,141.60 Q275.10,98.60 317.88,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#radical-cyclization-5-fish)"/><path data-electrons="1" d="M384.84,141.60 Q351.36,203.60 317.88,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#radical-cyclization-5-fish)"/><path data-electrons="1" d="M384.84,141.60 Q375.54,80.60 366.24,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#radical-cyclization-5-fish)"/><text x="24" y="235" font-size="16">H-atom transfer gives the methyl substituent and regenerates tin radical.</text></g></svg>