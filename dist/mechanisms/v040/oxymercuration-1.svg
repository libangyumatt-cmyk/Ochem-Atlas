<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" role="img"><title>Oxymercuration–demercuration: Coupled polar bond reorganization</title><desc>CH3–CH=CH2 + HgOAc+ → [CH3CH–CH2 bridged by HgOAc]+. Pi donation to mercury forms the bridged cation model; acetate dissociation/speciation is grouped with activation.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="oxymercuration-1-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="oxymercuration-1-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Oxymercuration–demercuration · 1</text><text x="24" y="65" font-size="17">Coupled polar bond reorganization</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">CH3–</text><text x="83.52" y="155" font-size="24.00">CH</text><text x="113.28" y="155" font-size="24.00">=</text><text x="128.16" y="155" font-size="24.00">CH2</text><text x="172.80" y="155" font-size="24.00"> + </text><text x="217.44" y="155" font-size="24.00">HgOAc+</text><text x="665.00" y="155" font-size="24.00">[CH3CH–CH2 bridged by HgOAc]+</text><path data-electrons="2" d="M124.44,141.60 Q193.26,98.60 262.08,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#oxymercuration-1-pair)"/><text x="24" y="235" font-size="16">Pi donation to mercury forms the bridged cation model; acetate dissociation/speciation is grouped with activation.</text></g></svg>