<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" role="img"><title>Carboxylic acid conversion to acyl chloride: Tetrahedral intermediate collapse</title><desc>CH3–C(O−)(Cl)–OSOCl → CH3COCl + chlorosulfite-derived anion. Carbonyl reformation expels the activated oxygen leaving group.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="acyl-chloride-formation-4-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="acyl-chloride-formation-4-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Carboxylic acid conversion to acyl chloride · 4</text><text x="24" y="65" font-size="17">Tetrahedral intermediate collapse</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">CH3–</text><text x="83.52" y="155" font-size="24.00">C</text><text x="98.40" y="155" font-size="24.00">(</text><text x="113.28" y="155" font-size="24.00">O−</text><text x="143.04" y="155" font-size="24.00">)(Cl)–</text><text x="232.32" y="155" font-size="24.00">OSOCl</text><text x="665.00" y="155" font-size="22.23">CH3COCl + chlorosulfite-derived anion</text><path data-electrons="2" d="M128.16,141.60 Q118.86,98.60 109.56,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#acyl-chloride-formation-4-pair)"/><path data-electrons="2" d="M180.24,141.60 Q224.88,203.60 269.52,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#acyl-chloride-formation-4-pair)"/><text x="24" y="235" font-size="16">Carbonyl reformation expels the activated oxygen leaving group.</text></g></svg>