<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1220"><title>Neighboring sulfur participation: complete teaching sequence</title><g font-family="DejaVu Sans,sans-serif"><rect width="1200" height="350" fill="#fffefa"/><text x="25" y="32" font-size="21" fill="#203c43">Neighboring sulfur participation · representative molecular graphs</text><path d="M358.52,265.93 L279.07,276.90" stroke="#203c43" stroke-width="2" fill="none"/><path d="M279.07,276.90 L208.58,235.97" stroke="#203c43" stroke-width="2" fill="none"/><path d="M208.58,235.97 L191.48,156.28" stroke="#203c43" stroke-width="2" fill="none"/><path d="M191.48,156.28 L226.47,84.10" stroke="#203c43" stroke-width="2" fill="none"/><rect x="343.52" y="255.93" width="30" height="20" fill="#fffefa"/><text x="358.52" y="270.93" font-size="16" text-anchor="middle" fill="#203c43">CH3</text><rect x="274.07" y="266.90" width="10" height="20" fill="#fffefa"/><text x="279.07" y="281.90" font-size="16" text-anchor="middle" fill="#203c43">S</text><rect x="193.58" y="225.97" width="30" height="20" fill="#fffefa"/><text x="208.58" y="240.97" font-size="16" text-anchor="middle" fill="#203c43">CH2</text><rect x="176.48" y="146.28" width="30" height="20" fill="#fffefa"/><text x="191.48" y="161.28" font-size="16" text-anchor="middle" fill="#203c43">CH2</text><rect x="216.47" y="74.10" width="20" height="20" fill="#fffefa"/><text x="226.47" y="89.10" font-size="16" text-anchor="middle" fill="#203c43">Cl</text><path d="M998.52,265.93 L919.07,276.90" stroke="#203c43" stroke-width="2" fill="none"/><path d="M919.07,276.90 L848.58,235.97" stroke="#203c43" stroke-width="2" fill="none"/><path d="M848.58,235.97 L831.48,156.28" stroke="#203c43" stroke-width="2" fill="none"/><path d="M831.48,156.28 L866.47,84.10" stroke="#203c43" stroke-width="2" fill="none"/><rect x="983.52" y="255.93" width="30" height="20" fill="#fffefa"/><text x="998.52" y="270.93" font-size="16" text-anchor="middle" fill="#203c43">CH3</text><rect x="914.07" y="266.90" width="10" height="20" fill="#fffefa"/><text x="919.07" y="281.90" font-size="16" text-anchor="middle" fill="#203c43">S</text><rect x="833.58" y="225.97" width="30" height="20" fill="#fffefa"/><text x="848.58" y="240.97" font-size="16" text-anchor="middle" fill="#203c43">CH2</text><rect x="816.48" y="146.28" width="30" height="20" fill="#fffefa"/><text x="831.48" y="161.28" font-size="16" text-anchor="middle" fill="#203c43">CH2</text><rect x="856.47" y="74.10" width="20" height="20" fill="#fffefa"/><text x="866.47" y="89.10" font-size="16" text-anchor="middle" fill="#203c43">OH</text><text x="580" y="180" font-size="32" fill="#203c43">→</text><text x="25" y="330" font-size="15" fill="#203c43">Representative substrate/product connectivity; other reagents/byproducts are in the equation. No computed geometry.</text></g><g transform="translate(0,350)"><title>Neighboring sulfur participation: Bond-replacing displacement</title><desc>Me–S:–CH2–CH2–Cl → [Me–S+(CH2CH2 ring)] + Cl−. S donates to the carbon bearing Cl; C–Cl electrons leave on chloride. A three-membered episulfonium ion forms.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="neighboring-sulfur-1-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="neighboring-sulfur-1-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Neighboring sulfur participation · 1</text><text x="24" y="65" font-size="17">Bond-replacing displacement</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">Me–</text><text x="68.64" y="155" font-size="24.00">S:</text><text x="98.40" y="155" font-size="24.00">–</text><text x="113.28" y="155" font-size="24.00">CH2</text><text x="157.92" y="155" font-size="24.00">–</text><text x="172.80" y="155" font-size="24.00">CH2</text><text x="217.44" y="155" font-size="24.00">–</text><text x="232.32" y="155" font-size="24.00">Cl</text><text x="665.00" y="155" font-size="24.00">[Me–S+(CH2CH2 ring)] + Cl−</text><path data-electrons="2" d="M83.52,141.60 Q139.32,98.60 195.12,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#neighboring-sulfur-1-pair)"/><path data-electrons="2" d="M221.16,141.60 Q234.18,203.60 247.20,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#neighboring-sulfur-1-pair)"/><text x="24" y="235" font-size="16">S donates to the carbon bearing Cl; C–Cl electrons leave on chloride. A three-membered episulfonium ion</text><text x="24" y="258" font-size="16">forms.</text></g></g><g transform="translate(0,640)"><title>Neighboring sulfur participation: Bond-replacing displacement</title><desc>[Me–S+(CH2–CH2 ring)] + :OH2 → MeS–CH2CH2–OH2+. Water opens the episulfonium from behind a C–S bond; that pair returns to sulfur.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="neighboring-sulfur-2-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="neighboring-sulfur-2-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Neighboring sulfur participation · 2</text><text x="24" y="65" font-size="17">Bond-replacing displacement</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">[Me–</text><text x="83.52" y="155" font-size="24.00">S+</text><text x="113.28" y="155" font-size="24.00">(</text><text x="128.16" y="155" font-size="24.00">CH2</text><text x="172.80" y="155" font-size="24.00">–</text><text x="187.68" y="155" font-size="24.00">CH2</text><text x="232.32" y="155" font-size="24.00"> ring)] + </text><text x="381.12" y="155" font-size="24.00">:OH2</text><text x="665.00" y="155" font-size="24.00">MeS–CH2CH2–OH2+</text><path data-electrons="2" d="M410.88,141.60 Q310.44,98.60 210.00,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#neighboring-sulfur-2-pair)"/><path data-electrons="2" d="M154.20,141.60 Q126.30,203.60 98.40,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#neighboring-sulfur-2-pair)"/><text x="24" y="235" font-size="16">Water opens the episulfonium from behind a C–S bond; that pair returns to sulfur.</text></g></g><g transform="translate(0,930)"><title>Neighboring sulfur participation: Proton transfer</title><desc>MeS–CH2CH2–O+H–H + :OH2 → MeS–CH2CH2OH + H3O+. Water removes an oxonium proton; oxygen retains the O–H pair.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="neighboring-sulfur-3-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="neighboring-sulfur-3-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Neighboring sulfur participation · 3</text><text x="24" y="65" font-size="17">Proton transfer</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">MeS–CH2CH2–</text><text x="187.68" y="155" font-size="24.00">O+H</text><text x="232.32" y="155" font-size="24.00">–</text><text x="247.20" y="155" font-size="24.00">H</text><text x="262.08" y="155" font-size="24.00"> + </text><text x="306.72" y="155" font-size="24.00">:OH2</text><text x="665.00" y="155" font-size="24.00">MeS–CH2CH2OH + H3O+</text><path data-electrons="2" d="M336.48,141.60 Q295.56,98.60 254.64,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#neighboring-sulfur-3-pair)"/><path data-electrons="2" d="M232.32,141.60 Q221.16,203.60 210.00,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#neighboring-sulfur-3-pair)"/><text x="24" y="235" font-size="16">Water removes an oxonium proton; oxygen retains the O–H pair.</text></g></g></svg>