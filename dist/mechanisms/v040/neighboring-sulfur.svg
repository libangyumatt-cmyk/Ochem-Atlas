<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 870"><title>Neighboring sulfur participation: complete teaching sequence</title><g transform="translate(0,0)"><title>Neighboring sulfur participation: Bond-replacing displacement</title><desc>Me–S:–CH2–CH2–Cl → [Me–S+(CH2CH2 ring)] + Cl−. S donates to the carbon bearing Cl; C–Cl electrons leave on chloride. A three-membered episulfonium ion forms.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="neighboring-sulfur-1-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="neighboring-sulfur-1-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Neighboring sulfur participation · 1</text><text x="24" y="65" font-size="17">Bond-replacing displacement</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">Me–</text><text x="68.64" y="155" font-size="24.00">S:</text><text x="98.40" y="155" font-size="24.00">–</text><text x="113.28" y="155" font-size="24.00">CH2</text><text x="157.92" y="155" font-size="24.00">–</text><text x="172.80" y="155" font-size="24.00">CH2</text><text x="217.44" y="155" font-size="24.00">–</text><text x="232.32" y="155" font-size="24.00">Cl</text><text x="665.00" y="155" font-size="24.00">[Me–S+(CH2CH2 ring)] + Cl−</text><path data-electrons="2" d="M83.52,141.60 Q139.32,98.60 195.12,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#neighboring-sulfur-1-pair)"/><path data-electrons="2" d="M221.16,141.60 Q234.18,203.60 247.20,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#neighboring-sulfur-1-pair)"/><text x="24" y="235" font-size="16">S donates to the carbon bearing Cl; C–Cl electrons leave on chloride. A three-membered episulfonium ion forms.</text></g></g><g transform="translate(0,290)"><title>Neighboring sulfur participation: Bond-replacing displacement</title><desc>[Me–S+(CH2–CH2 ring)] + :OH2 → MeS–CH2CH2–OH2+. Water opens the episulfonium from behind a C–S bond; that pair returns to sulfur.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="neighboring-sulfur-2-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="neighboring-sulfur-2-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Neighboring sulfur participation · 2</text><text x="24" y="65" font-size="17">Bond-replacing displacement</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">[Me–</text><text x="83.52" y="155" font-size="24.00">S+</text><text x="113.28" y="155" font-size="24.00">(</text><text x="128.16" y="155" font-size="24.00">CH2</text><text x="172.80" y="155" font-size="24.00">–</text><text x="187.68" y="155" font-size="24.00">CH2</text><text x="232.32" y="155" font-size="24.00"> ring)] + </text><text x="381.12" y="155" font-size="24.00">:OH2</text><text x="665.00" y="155" font-size="24.00">MeS–CH2CH2–OH2+</text><path data-electrons="2" d="M410.88,141.60 Q310.44,98.60 210.00,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#neighboring-sulfur-2-pair)"/><path data-electrons="2" d="M154.20,141.60 Q126.30,203.60 98.40,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#neighboring-sulfur-2-pair)"/><text x="24" y="235" font-size="16">Water opens the episulfonium from behind a C–S bond; that pair returns to sulfur.</text></g></g><g transform="translate(0,580)"><title>Neighboring sulfur participation: Proton transfer</title><desc>MeS–CH2CH2–O+H–H + :OH2 → MeS–CH2CH2OH + H3O+. Water removes an oxonium proton; oxygen retains the O–H pair.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="neighboring-sulfur-3-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="neighboring-sulfur-3-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Neighboring sulfur participation · 3</text><text x="24" y="65" font-size="17">Proton transfer</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">MeS–CH2CH2–</text><text x="187.68" y="155" font-size="24.00">O+H</text><text x="232.32" y="155" font-size="24.00">–</text><text x="247.20" y="155" font-size="24.00">H</text><text x="262.08" y="155" font-size="24.00"> + </text><text x="306.72" y="155" font-size="24.00">:OH2</text><text x="665.00" y="155" font-size="24.00">MeS–CH2CH2OH + H3O+</text><path data-electrons="2" d="M336.48,141.60 Q295.56,98.60 254.64,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#neighboring-sulfur-3-pair)"/><path data-electrons="2" d="M232.32,141.60 Q221.16,203.60 210.00,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#neighboring-sulfur-3-pair)"/><text x="24" y="235" font-size="16">Water removes an oxonium proton; oxygen retains the O–H pair.</text></g></g></svg>