03.90,168.13" stroke="#203c43" stroke-width="2" fill="none"/><path d="M880.89,185.03 L911.82,110.00" stroke="#203c43" stroke-width="2" fill="none"/><path d="M886.44,187.31 L917.36,112.29" stroke="#203c43" stroke-width="2" fill="none"/><rect x="1011.10" y="239.85" width="30" height="20" fill="#fffefa"/><text x="1026.10" y="254.85" font-size="16" text-anchor="middle" fill="#203c43">CH3</text><rect x="940.88" y="231.69" width="10" height="20" fill="#fffefa"/><text x="945.88" y="246.69" font-size="16" text-anchor="middle" fill="#203c43">O</text><rect x="878.67" y="176.17" width="10" height="20" fill="#fffefa"/><text x="883.67" y="191.17" font-size="16" text-anchor="middle" fill="#203c43">C</text><rect x="788.90" y="158.13" width="30" height="20" fill="#fffefa"/><text x="803.90" y="173.13" font-size="16" text-anchor="middle" fill="#203c43">CH3</text><rect x="909.59" y="101.15" width="10" height="20" fill="#fffefa"/><text x="914.59" y="116.15" font-size="16" text-anchor="middle" fill="#203c43">O</text><text x="580" y="180" font-size="32" fill="#203c43">→</text><text x="25" y="330" font-size="15" fill="#203c43">Representative substrate/product connectivity; other reagents/byproducts are in the equation. No computed geometry.</text></g><g transform="translate(0,350)"><title>Base-catalyzed transesterification: Nucleophilic carbonyl addition</title><desc>CH3–C(=O)OEt + :OMe− → CH3C(O−)(OEt)(OMe). Methoxide adds to ester carbonyl carbon.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="transesterification-1-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="transesterification-1-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Base-catalyzed transesterification · 1</text><text x="24" y="65" font-size="17">Nucleophilic carbonyl addition</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">CH3–</text><text x="83.52" y="155" font-size="24.00">C</text><text x="98.40" y="155" font-size="24.00">(=</text><text x="128.16" y="155" font-size="24.00">O</text><text x="143.04" y="155" font-size="24.00">)OEt + </text><text x="247.20" y="155" font-size="24.00">:OMe−</text><text x="665.00" y="155" font-size="24.00">CH3C(O−)(OEt)(OMe)</text><path data-electrons="2" d="M284.40,141.60 Q187.68,98.60 90.96,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#transesterification-1-pair)"/><path data-electrons="2" d="M113.28,141.60 Q124.44,203.60 135.60,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#transesterification-1-pair)"/><text x="24" y="235" font-size="16">Methoxide adds to ester carbonyl carbon.</text></g></g><g transform="translate(0,640)"><title>Base-catalyzed transesterification: Tetrahedral intermediate collapse</title><desc>CH3–C(O−)(OMe)–OEt → CH3CO2Me + EtO−. Carbonyl reformation expels ethoxide; reverse loss of methoxide also competes.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="transesterification-2-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="transesterification-2-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Base-catalyzed transesterification · 2</text><text x="24" y="65" font-size="17">Tetrahedral intermediate collapse</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">CH3–</text><text x="83.52" y="155" font-size="24.00">C</text><text x="98.40" y="155" font-size="24.00">(</text><text x="113.28" y="155" font-size="24.00">O−</text><text x="143.04" y="155" font-size="24.00">)(OMe)–</text><text x="247.20" y="155" font-size="24.00">OEt</text><text x="665.00" y="155" font-size="24.00">CH3CO2Me + EtO−</text><path data-electrons="2" d="M128.16,141.60 Q118.86,98.60 109.56,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#transesterification-2-pair)"/><path data-electrons="2" d="M180.24,141.60 Q224.88,203.60 269.52,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#transesterification-2-pair)"/><text x="24" y="235" font-size="16">Carbonyl reformation expels ethoxide; reverse loss of methoxide also competes.</text></g></g><g transform="translate(0,930)"><title>Base-catalyzed transesterification: Proton transfer</title><desc>EtO− + MeO–H → EtOH + MeO−. Solvent proton transfer interconverts alkoxides and closes the catalyst cycle.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="transesterification-3-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="transesterification-3-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Base-catalyzed transesterification · 3</text><text x="24" y="65" font-size="17">Proton transfer</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">Et</text><text x="53.76" y="155" font-size="24.00">O−</text><text x="83.52" y="155" font-size="24.00"> + Me</text><text x="157.92" y="155" font-size="24.00">O</text><text x="172.80" y="155" font-size="24.00">–</text><text x="187.68" y="155" font-size="24.00">H</text><text x="665.00" y="155" font-size="24.00">EtOH + MeO−</text><path data-electrons="2" d="M68.64,141.60 Q131.88,98.60 195.12,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#transesterification-3-pair)"/><path data-electrons="2" d="M180.24,141.60 Q172.80,203.60 165.36,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#transesterification-3-pair)"/><text x="24" y="235" font-size="16">Solvent proton transfer interconverts alkoxides and closes the catalyst cycle.</text></g></g></svg>