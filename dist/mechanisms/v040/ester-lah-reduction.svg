<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1800"><title>Lithium aluminum hydride ester reduction: complete teaching sequence</title><g font-family="DejaVu Sans,sans-serif"><rect width="1200" height="350" fill="#fffefa"/><text x="25" y="32" font-size="21" fill="#203c43">Lithium aluminum hydride ester reduction · representative molecular graphs</text><path d="M394.33,249.12 L315.81,267.37" stroke="#203c43" stroke-width="2" fill="none"/><path d="M315.81,267.37 L242.42,229.80" stroke="#203c43" stroke-width="2" fill="none"/><path d="M242.42,229.80 L214.47,150.50" stroke="#203c43" stroke-width="2" fill="none"/><path d="M214.47,150.50 L155.67,93.63" stroke="#203c43" stroke-width="2" fill="none"/><path d="M212.42,148.30 L272.00,92.77" stroke="#203c43" stroke-width="2" fill="none"/><path d="M216.52,152.69 L276.09,97.15" stroke="#203c43" stroke-width="2" fill="none"/><rect x="379.33" y="239.12" width="30" height="20" fill="#fffefa"/><text x="394.33" y="254.12" font-size="16" text-anchor="middle" fill="#203c43">CH3</text><rect x="300.81" y="257.37" width="30" height="20" fill="#fffefa"/><text x="315.81" y="272.37" font-size="16" text-anchor="middle" fill="#203c43">CH2</text><rect x="237.42" y="219.80" width="10" height="20" fill="#fffefa"/><text x="242.42" y="234.80" font-size="16" text-anchor="middle" fill="#203c43">O</text><rect x="209.47" y="140.50" width="10" height="20" fill="#fffefa"/><text x="214.47" y="155.50" font-size="16" text-anchor="middle" fill="#203c43">C</text><rect x="140.67" y="83.63" width="30" height="20" fill="#fffefa"/><text x="155.67" y="98.63" font-size="16" text-anchor="middle" fill="#203c43">CH3</text><rect x="269.04" y="84.96" width="10" height="20" fill="#fffefa"/><text x="274.04" y="99.96" font-size="16" text-anchor="middle" fill="#203c43">O</text><path d="M1006.20,222.54 L958.77,256.32" stroke="#203c43" stroke-width="2" fill="none"/><path d="M958.77,256.32 L905.81,280.50" stroke="#203c43" stroke-width="2" fill="none"/><path d="M823.80,138.46 L871.23,104.68" stroke="#203c43" stroke-width="2" fill="none"/><path d="M871.23,104.68 L924.19,80.50" stroke="#203c43" stroke-width="2" fill="none"/><rect x="991.20" y="212.54" width="30" height="20" fill="#fffefa"/><text x="1006.20" y="227.54" font-size="16" text-anchor="middle" fill="#203c43">CH3</text><rect x="943.77" y="246.32" width="30" height="20" fill="#fffefa"/><text x="958.77" y="261.32" font-size="16" text-anchor="middle" fill="#203c43">CH2</text><rect x="895.81" y="270.50" width="20" height="20" fill="#fffefa"/><text x="905.81" y="285.50" font-size="16" text-anchor="middle" fill="#203c43">OH</text><rect x="808.80" y="128.46" width="30" height="20" fill="#fffefa"/><text x="823.80" y="143.46" font-size="16" text-anchor="middle" fill="#203c43">CH3</text><rect x="856.23" y="94.68" width="30" height="20" fill="#fffefa"/><text x="871.23" y="109.68" font-size="16" text-anchor="middle" fill="#203c43">CH2</text><rect x="914.19" y="70.50" width="20" height="20" fill="#fffefa"/><text x="924.19" y="85.50" font-size="16" text-anchor="middle" fill="#203c43">OH</text><text x="580" y="180" font-size="32" fill="#203c43">→</text><text x="25" y="330" font-size="15" fill="#203c43">Representative substrate/product connectivity; other reagents/byproducts are in the equation. No computed geometry.</text></g><g transform="translate(0,350)"><title>Lithium aluminum hydride ester reduction: Mechanistic boundary / grouped stage</title><desc>CH3CO2Et + LiAlH4 → Ester–aluminum encounter ensemble. Carbonyl oxygen coordination/ion pairing organizes hydride delivery; no single aggregate is universally specified.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="ester-lah-reduction-1-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="ester-lah-reduction-1-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Lithium aluminum hydride ester reduction · 1</text><text x="24" y="65" font-size="17">Mechanistic boundary / grouped stage</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">CH3CO2Et + LiAlH4</text><text x="665.00" y="155" font-size="24.00">Ester–aluminum encounter ensemble</text><text x="30" y="202" font-size="16">Process model: no unique microscopic electron-arrow sequence asserted.</text><text x="24" y="235" font-size="16">Carbonyl oxygen coordination/ion pairing organizes hydride delivery; no single aggregate is universally</text><text x="24" y="258" font-size="16">specified.</text></g></g><g transform="translate(0,640)"><title>Lithium aluminum hydride ester reduction: Nucleophilic carbonyl addition</title><desc>CH3–C(=O)OEt + Al–H → CH3CH(O−)OEt (Al-bound). Al–H donation and carbonyl pi opening form a tetrahedral intermediate.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="ester-lah-reduction-2-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="ester-lah-reduction-2-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Lithium aluminum hydride ester reduction · 2</text><text x="24" y="65" font-size="17">Nucleophilic carbonyl addition</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">CH3–</text><text x="83.52" y="155" font-size="24.00">C</text><text x="98.40" y="155" font-size="24.00">(=</text><text x="128.16" y="155" font-size="24.00">O</text><text x="143.04" y="155" font-size="24.00">)OEt + </text><text x="247.20" y="155" font-size="24.00">Al</text><text x="276.96" y="155" font-size="24.00">–</text><text x="291.84" y="155" font-size="24.00">H</text><text x="665.00" y="155" font-size="24.00">CH3CH(O−)OEt (Al-bound)</text><path data-electrons="2" d="M280.68,141.60 Q185.82,98.60 90.96,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#ester-lah-reduction-2-pair)"/><path data-electrons="2" d="M113.28,141.60 Q124.44,203.60 135.60,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#ester-lah-reduction-2-pair)"/><text x="24" y="235" font-size="16">Al–H donation and carbonyl pi opening form a tetrahedral intermediate.</text></g></g><g transform="translate(0,930)"><title>Lithium aluminum hydride ester reduction: Tetrahedral intermediate collapse</title><desc>CH3–CH(O−)–OEt → CH3CHO + EtO− (Al-bound forms). Carbonyl reformation expels alkoxide; aldehyde is more reactive and is not isolated under excess LAH.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="ester-lah-reduction-3-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="ester-lah-reduction-3-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Lithium aluminum hydride ester reduction · 3</text><text x="24" y="65" font-size="17">Tetrahedral intermediate collapse</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">CH3–</text><text x="83.52" y="155" font-size="24.00">CH</text><text x="113.28" y="155" font-size="24.00">(</text><text x="128.16" y="155" font-size="24.00">O−</text><text x="157.92" y="155" font-size="24.00">)–</text><text x="187.68" y="155" font-size="24.00">OEt</text><text x="665.00" y="155" font-size="24.00">CH3CHO + EtO− (Al-bound forms)</text><path data-electrons="2" d="M143.04,141.60 Q131.88,98.60 120.72,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#ester-lah-reduction-3-pair)"/><path data-electrons="2" d="M154.20,141.60 Q182.10,203.60 210.00,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#ester-lah-reduction-3-pair)"/><text x="24" y="235" font-size="16">Carbonyl reformation expels alkoxide; aldehyde is more reactive and is not isolated under excess LAH.</text></g></g><g transform="translate(0,1220)"><title>Lithium aluminum hydride ester reduction: Nucleophilic carbonyl addition</title><desc>CH3–CH=O + Al–H → CH3CH2O− (Al-bound). A second hydride reduces the aldehyde to primary alkoxide.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="ester-lah-reduction-4-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="ester-lah-reduction-4-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Lithium aluminum hydride ester reduction · 4</text><text x="24" y="65" font-size="17">Nucleophilic carbonyl addition</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">CH3–</text><text x="83.52" y="155" font-size="24.00">CH</text><text x="113.28" y="155" font-size="24.00">=</text><text x="128.16" y="155" font-size="24.00">O</text><text x="143.04" y="155" font-size="24.00"> + </text><text x="187.68" y="155" font-size="24.00">Al</text><text x="217.44" y="155" font-size="24.00">–</text><text x="232.32" y="155" font-size="24.00">H</text><text x="665.00" y="155" font-size="24.00">CH3CH2O− (Al-bound)</text><path data-electrons="2" d="M221.16,141.60 Q159.78,98.60 98.40,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#ester-lah-reduction-4-pair)"/><path data-electrons="2" d="M117.00,141.60 Q126.30,203.60 135.60,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#ester-lah-reduction-4-pair)"/><text x="24" y="235" font-size="16">A second hydride reduces the aldehyde to primary alkoxide.</text></g></g><g transform="translate(0,1510)"><title>Lithium aluminum hydride ester reduction: Mechanistic boundary / grouped stage</title><desc>Aluminum-bound ethoxide products + aqueous work-up → 2 EtOH + hydrated aluminum/lithium species. Protonation/hydrolysis releases both alcohol fragments. The hydride-stage and water-stage operations are distinct.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="ester-lah-reduction-5-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="ester-lah-reduction-5-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Lithium aluminum hydride ester reduction · 5</text><text x="24" y="65" font-size="17">Mechanistic boundary / grouped stage</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="16.77">Aluminum-bound ethoxide products + aqueous work-up</text><text x="665.00" y="155" font-size="19.59">2 EtOH + hydrated aluminum/lithium species</text><text x="30" y="202" font-size="16">Process model: no unique microscopic electron-arrow sequence asserted.</text><text x="24" y="235" font-size="16">Protonation/hydrolysis releases both alcohol fragments. The hydride-stage and water-stage operations are</text><text x="24" y="258" font-size="16">distinct.</text></g></g></svg>