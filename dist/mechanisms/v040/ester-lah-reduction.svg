<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1450"><title>Lithium aluminum hydride ester reduction: complete teaching sequence</title><g transform="translate(0,0)"><title>Lithium aluminum hydride ester reduction: Mechanistic boundary / grouped stage</title><desc>CH3CO2Et + LiAlH4 → Ester–aluminum encounter ensemble. Carbonyl oxygen coordination/ion pairing organizes hydride delivery; no single aggregate is universally specified.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="ester-lah-reduction-1-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="ester-lah-reduction-1-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Lithium aluminum hydride ester reduction · 1</text><text x="24" y="65" font-size="17">Mechanistic boundary / grouped stage</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">CH3CO2Et + LiAlH4</text><text x="665.00" y="155" font-size="24.00">Ester–aluminum encounter ensemble</text><text x="30" y="202" font-size="16">Process model: no unique microscopic electron-arrow sequence asserted.</text><text x="24" y="235" font-size="16">Carbonyl oxygen coordination/ion pairing organizes hydride delivery; no single aggregate is universally specified.</text></g></g><g transform="translate(0,290)"><title>Lithium aluminum hydride ester reduction: Nucleophilic carbonyl addition</title><desc>CH3–C(=O)OEt + Al–H → CH3CH(O−)OEt (Al-bound). Al–H donation and carbonyl pi opening form a tetrahedral intermediate.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="ester-lah-reduction-2-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="ester-lah-reduction-2-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Lithium aluminum hydride ester reduction · 2</text><text x="24" y="65" font-size="17">Nucleophilic carbonyl addition</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">CH3–</text><text x="83.52" y="155" font-size="24.00">C</text><text x="98.40" y="155" font-size="24.00">(=</text><text x="128.16" y="155" font-size="24.00">O</text><text x="143.04" y="155" font-size="24.00">)OEt + </text><text x="247.20" y="155" font-size="24.00">Al</text><text x="276.96" y="155" font-size="24.00">–</text><text x="291.84" y="155" font-size="24.00">H</text><text x="665.00" y="155" font-size="24.00">CH3CH(O−)OEt (Al-bound)</text><path data-electrons="2" d="M280.68,141.60 Q185.82,98.60 90.96,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#ester-lah-reduction-2-pair)"/><path data-electrons="2" d="M113.28,141.60 Q124.44,203.60 135.60,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#ester-lah-reduction-2-pair)"/><text x="24" y="235" font-size="16">Al–H donation and carbonyl pi opening form a tetrahedral intermediate.</text></g></g><g transform="translate(0,580)"><title>Lithium aluminum hydride ester reduction: Tetrahedral intermediate collapse</title><desc>CH3–CH(O−)–OEt → CH3CHO + EtO− (Al-bound forms). Carbonyl reformation expels alkoxide; aldehyde is more reactive and is not isolated under excess LAH.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="ester-lah-reduction-3-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="ester-lah-reduction-3-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Lithium aluminum hydride ester reduction · 3</text><text x="24" y="65" font-size="17">Tetrahedral intermediate collapse</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">CH3–</text><text x="83.52" y="155" font-size="24.00">CH</text><text x="113.28" y="155" font-size="24.00">(</text><text x="128.16" y="155" font-size="24.00">O−</text><text x="157.92" y="155" font-size="24.00">)–</text><text x="187.68" y="155" font-size="24.00">OEt</text><text x="665.00" y="155" font-size="24.00">CH3CHO + EtO− (Al-bound forms)</text><path data-electrons="2" d="M143.04,141.60 Q131.88,98.60 120.72,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#ester-lah-reduction-3-pair)"/><path data-electrons="2" d="M154.20,141.60 Q182.10,203.60 210.00,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#ester-lah-reduction-3-pair)"/><text x="24" y="235" font-size="16">Carbonyl reformation expels alkoxide; aldehyde is more reactive and is not isolated under excess LAH.</text></g></g><g transform="translate(0,870)"><title>Lithium aluminum hydride ester reduction: Nucleophilic carbonyl addition</title><desc>CH3–CH=O + Al–H → CH3CH2O− (Al-bound). A second hydride reduces the aldehyde to primary alkoxide.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="ester-lah-reduction-4-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="ester-lah-reduction-4-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Lithium aluminum hydride ester reduction · 4</text><text x="24" y="65" font-size="17">Nucleophilic carbonyl addition</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">CH3–</text><text x="83.52" y="155" font-size="24.00">CH</text><text x="113.28" y="155" font-size="24.00">=</text><text x="128.16" y="155" font-size="24.00">O</text><text x="143.04" y="155" font-size="24.00"> + </text><text x="187.68" y="155" font-size="24.00">Al</text><text x="217.44" y="155" font-size="24.00">–</text><text x="232.32" y="155" font-size="24.00">H</text><text x="665.00" y="155" font-size="24.00">CH3CH2O− (Al-bound)</text><path data-electrons="2" d="M221.16,141.60 Q159.78,98.60 98.40,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#ester-lah-reduction-4-pair)"/><path data-electrons="2" d="M117.00,141.60 Q126.30,203.60 135.60,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#ester-lah-reduction-4-pair)"/><text x="24" y="235" font-size="16">A second hydride reduces the aldehyde to primary alkoxide.</text></g></g><g transform="translate(0,1160)"><title>Lithium aluminum hydride ester reduction: Mechanistic boundary / grouped stage</title><desc>Aluminum-bound ethoxide products + aqueous work-up → 2 EtOH + hydrated aluminum/lithium species. Protonation/hydrolysis releases both alcohol fragments. The hydride-stage and water-stage operations are distinct.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="ester-lah-reduction-5-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="ester-lah-reduction-5-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Lithium aluminum hydride ester reduction · 5</text><text x="24" y="65" font-size="17">Mechanistic boundary / grouped stage</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="16.77">Aluminum-bound ethoxide products + aqueous work-up</text><text x="665.00" y="155" font-size="19.59">2 EtOH + hydrated aluminum/lithium species</text><text x="30" y="202" font-size="16">Process model: no unique microscopic electron-arrow sequence asserted.</text><text x="24" y="235" font-size="16">Protonation/hydrolysis releases both alcohol fragments. The hydride-stage and water-stage operations are distinct.</text></g></g></svg>