96,195.33 L994.25,181.70" stroke="#203c43" stroke-width="2" fill="none" stroke-dasharray="4 3"/><path d="M1020.99,229.53 L990.97,180.35" stroke="#203c43" stroke-width="2" fill="none"/><path d="M1026.11,226.40 L996.09,177.22" stroke="#203c43" stroke-width="2" fill="none" stroke-dasharray="4 3"/><rect x="1058.96" y="190.82" width="30" height="20" fill="#fffefa"/><text x="1073.96" y="205.82" font-size="16" text-anchor="middle" fill="#203c43">CH3</text><rect x="1018.55" y="217.97" width="10" height="20" fill="#fffefa"/><text x="1023.55" y="232.97" font-size="16" text-anchor="middle" fill="#203c43">C</text><rect x="977.17" y="265.54" width="20" height="20" fill="#fffefa"/><text x="987.17" y="280.54" font-size="16" text-anchor="middle" fill="#203c43">CH</text><rect x="918.62" y="270.50" width="20" height="20" fill="#fffefa"/><text x="928.62" y="285.50" font-size="16" text-anchor="middle" fill="#203c43">CH</text><rect x="889.14" y="221.19" width="10" height="20" fill="#fffefa"/><text x="894.14" y="236.19" font-size="16" text-anchor="middle" fill="#203c43">C</text><rect x="839.51" y="184.66" width="10" height="20" fill="#fffefa"/><text x="844.51" y="199.66" font-size="16" text-anchor="middle" fill="#203c43">C</text><rect x="775.10" y="185.87" width="20" height="20" fill="#fffefa"/><text x="785.10" y="200.87" font-size="16" text-anchor="middle" fill="#203c43">CH</text><rect x="746.04" y="135.90" width="20" height="20" fill="#fffefa"/><text x="756.04" y="150.90" font-size="16" text-anchor="middle" fill="#203c43">CH</text><rect x="768.29" y="82.53" width="20" height="20" fill="#fffefa"/><text x="778.29" y="97.53" font-size="16" text-anchor="middle" fill="#203c43">CH</text><rect x="823.90" y="70.50" width="20" height="20" fill="#fffefa"/><text x="833.90" y="85.50" font-size="16" text-anchor="middle" fill="#203c43">CH</text><rect x="842.77" y="124.99" width="20" height="20" fill="#fffefa"/><text x="852.77" y="139.99" font-size="16" text-anchor="middle" fill="#203c43">CH</text><rect x="928.25" y="182.42" width="20" height="20" fill="#fffefa"/><text x="938.25" y="197.42" font-size="16" text-anchor="middle" fill="#203c43">CH</text><rect x="983.53" y="168.78" width="20" height="20" fill="#fffefa"/><text x="993.53" y="183.78" font-size="16" text-anchor="middle" fill="#203c43">CH</text><text x="580" y="180" font-size="32" fill="#203c43">→</text><text x="25" y="330" font-size="15" fill="#203c43">Representative substrate/product connectivity; other reagents/byproducts are in the equation. No computed geometry.</text></g><g transform="translate(0,350)"><title>Suzuki–Miyaura coupling: Oxidative addition</title><desc>LnPd(0) + Ph–Br → LnPd(II)(Ph)(Br). Oxidative addition makes Pd–C/Pd–Br bonds and raises formal Pd oxidation state. Ligand dissociation/association and spin/speciation are not reduced to a molecular SN2 code.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="suzuki-miyaura-1-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="suzuki-miyaura-1-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Suzuki–Miyaura coupling · 1</text><text x="24" y="65" font-size="17">Oxidative addition</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">LnPd(0) + Ph–Br</text><text x="665.00" y="155" font-size="24.00">LnPd(II)(Ph)(Br)</text><text x="30" y="202" font-size="16">Process model: no unique microscopic electron-arrow sequence asserted.</text><text x="24" y="235" font-size="16">Oxidative addition makes Pd–C/Pd–Br bonds and raises formal Pd oxidation state. Ligand</text><text x="24" y="258" font-size="16">dissociation/association and spin/speciation are not reduced to a molecular SN2 code.</text></g></g><g transform="translate(0,640)"><title>Suzuki–Miyaura coupling: Base-assisted ligand exchange</title><desc>LnPd(II)(Ph)(Br) + OH− → LnPd(II)(Ph)(OH) + Br−. A hydroxo-palladium pathway is shown; halide/hydroxide exchange precedes the selected transmetalation model.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="suzuki-miyaura-2-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="suzuki-miyaura-2-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Suzuki–Miyaura coupling · 2</text><text x="24" y="65" font-size="17">Base-assisted ligand exchange</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">LnPd(II)(Ph)(Br) + OH−</text><text x="665.00" y="155" font-size="24.00">LnPd(II)(Ph)(OH) + Br−</text><text x="30" y="202" font-size="16">Process model: no unique microscopic electron-arrow sequence asserted.</text><text x="24" y="235" font-size="16">A hydroxo-palladium pathway is shown; halide/hydroxide exchange precedes the selected transmetalation model.</text></g></g><g transform="translate(0,930)"><title>Suzuki–Miyaura coupling: Transmetalation</title><desc>LnPd(II)(Ph)(OH) + ArB(OH)2 → LnPd(II)(Ph)(Ar) + B(OH)3. Transmetalation transfers Ar to palladium through a Pd–O–B-linked model. Base-activated boronate alternatives are not excluded.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="suzuki-miyaura-3-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="suzuki-miyaura-3-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Suzuki–Miyaura coupling · 3</text><text x="24" y="65" font-size="17">Transmetalation</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">LnPd(II)(Ph)(OH) + ArB(OH)2</text><text x="665.00" y="155" font-size="24.00">LnPd(II)(Ph)(Ar) + B(OH)3</text><text x="30" y="202" font-size="16">Process model: no unique microscopic electron-arrow sequence asserted.</text><text x="24" y="235" font-size="16">Transmetalation transfers Ar to palladium through a Pd–O–B-linked model. Base-activated boronate</text><text x="24" y="258" font-size="16">alternatives are not excluded.</text></g></g><g transform="translate(0,1220)"><title>Suzuki–Miyaura coupling: Reductive elimination</title><desc>cis-LnPd(II)(Ph)(Ar) → Ph–Ar + LnPd(0). Reductive elimination couples the cis carbon ligands and regenerates Pd(0).</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="suzuki-miyaura-4-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="suzuki-miyaura-4-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Suzuki–Miyaura coupling · 4</text><text x="24" y="65" font-size="17">Reductive elimination</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">cis-LnPd(II)(Ph)(Ar)</text><text x="665.00" y="155" font-size="24.00">Ph–Ar + LnPd(0)</text><text x="30" y="202" font-size="16">Process model: no unique microscopic electron-arrow sequence asserted.</text><text x="24" y="235" font-size="16">Reductive elimination couples the cis carbon ligands and regenerates Pd(0).</text></g></g></svg>