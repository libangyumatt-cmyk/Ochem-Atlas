" stroke="#203c43" stroke-width="2" fill="none"/><path d="M964.30,239.56 L879.66,233.29" stroke="#203c43" stroke-width="2" fill="none"/><path d="M879.66,233.29 L809.61,276.67" stroke="#203c43" stroke-width="2" fill="none"/><path d="M879.66,233.29 L864.66,150.57" stroke="#203c43" stroke-width="2" fill="none"/><path d="M864.66,150.57 L914.00,84.33" stroke="#203c43" stroke-width="2" fill="none"/><path d="M914.00,84.33 L994.82,99.73" stroke="#203c43" stroke-width="2" fill="none"/><path d="M1020.39,178.20 L994.82,99.73" stroke="#203c43" stroke-width="2" fill="none"/><rect x="1010.39" y="168.20" width="20" height="20" fill="#fffefa"/><text x="1020.39" y="183.20" font-size="16" text-anchor="middle" fill="#203c43">CH</text><rect x="954.30" y="229.56" width="20" height="20" fill="#fffefa"/><text x="964.30" y="244.56" font-size="16" text-anchor="middle" fill="#203c43">CH</text><rect x="869.66" y="223.29" width="20" height="20" fill="#fffefa"/><text x="879.66" y="238.29" font-size="16" text-anchor="middle" fill="#203c43">CH</text><rect x="799.61" y="266.67" width="20" height="20" fill="#fffefa"/><text x="809.61" y="281.67" font-size="16" text-anchor="middle" fill="#203c43">Br</text><rect x="849.66" y="140.57" width="30" height="20" fill="#fffefa"/><text x="864.66" y="155.57" font-size="16" text-anchor="middle" fill="#203c43">CH2</text><rect x="899.00" y="74.33" width="30" height="20" fill="#fffefa"/><text x="914.00" y="89.33" font-size="16" text-anchor="middle" fill="#203c43">CH2</text><rect x="979.82" y="89.73" width="30" height="20" fill="#fffefa"/><text x="994.82" y="104.73" font-size="16" text-anchor="middle" fill="#203c43">CH2</text><text x="580" y="180" font-size="32" fill="#203c43">→</text><text x="25" y="330" font-size="15" fill="#203c43">Representative substrate/product connectivity; other reagents/byproducts are in the equation. No computed geometry.</text></g><g transform="translate(0,350)"><title>NBS allylic bromination: Mechanistic boundary / grouped stage</title><desc>NBS + HBr → Succinimide + Br2. NBS maintains low molecular bromine by consuming HBr; this buffer/speciation stage is not a radical H-atom transfer.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="nbs-bromination-1-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="nbs-bromination-1-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">NBS allylic bromination · 1</text><text x="24" y="65" font-size="17">Mechanistic boundary / grouped stage</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">NBS + HBr</text><text x="665.00" y="155" font-size="24.00">Succinimide + Br2</text><text x="30" y="202" font-size="16">Process model: no unique microscopic electron-arrow sequence asserted.</text><text x="24" y="235" font-size="16">NBS maintains low molecular bromine by consuming HBr; this buffer/speciation stage is not a radical H-atom</text><text x="24" y="258" font-size="16">transfer.</text></g></g><g transform="translate(0,640)"><title>NBS allylic bromination: Photochemical initiation</title><desc>Br–Br + light → 2 Br•. Br–Br homolysis creates chain carriers.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="nbs-bromination-2-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="nbs-bromination-2-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">NBS allylic bromination · 2</text><text x="24" y="65" font-size="17">Photochemical initiation</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">Br</text><text x="53.76" y="155" font-size="24.00">–</text><text x="68.64" y="155" font-size="24.00">Br</text><text x="98.40" y="155" font-size="24.00"> + light</text><text x="665.00" y="155" font-size="24.00">2 Br•</text><path data-electrons="1" d="M61.20,141.60 Q50.04,98.60 38.88,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#nbs-bromination-2-fish)"/><path data-electrons="1" d="M61.20,141.60 Q72.36,203.60 83.52,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#nbs-bromination-2-fish)"/><text x="24" y="235" font-size="16">Br–Br homolysis creates chain carriers.</text></g></g><g transform="translate(0,930)"><title>NBS allylic bromination: Radical atom transfer</title><desc>Br• + ring CH=CH–CH(H)–(CH2)3–(back) → HBr + delocalized cyclohexenyl radical. Br radical removes an allylic H; resonance distributes the radical without a separate mechanistic event.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="nbs-bromination-3-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="nbs-bromination-3-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">NBS allylic bromination · 3</text><text x="24" y="65" font-size="17">Radical atom transfer</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="23.30">Br•</text><text x="67.33" y="155" font-size="23.30"> + ring CH=CH–</text><text x="269.56" y="155" font-size="23.30">CH</text><text x="298.44" y="155" font-size="23.30">(</text><text x="312.89" y="155" font-size="23.30">H</text><text x="327.33" y="155" font-size="23.30">)–(CH2)3–(back)</text><text x="665.00" y="155" font-size="21.65">HBr + delocalized cyclohexenyl radical</text><path data-electrons="1" d="M45.67,141.85 Q114.28,98.85 182.89,137.85" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#nbs-bromination-3-fish)"/><path data-electrons="1" d="M302.06,141.85 Q242.47,203.85 182.89,137.85" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#nbs-bromination-3-fish)"/><path data-electrons="1" d="M302.06,141.85 Q293.03,80.85 284.00,137.85" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#nbs-bromination-3-fish)"/><text x="24" y="235" font-size="16">Br radical removes an allylic H; resonance distributes the radical without a separate mechanistic event.</text></g></g><g transform="translate(0,1220)"><title>NBS allylic bromination: Radical atom transfer</title><desc>Cyclohexenyl C• + Br–Br → 3-Bromocyclohexene + Br•. The allylic radical abstracts Br from Br2, regenerating the chain carrier.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="nbs-bromination-4-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="nbs-bromination-4-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">NBS allylic bromination · 4</text><text x="24" y="65" font-size="17">Radical atom transfer</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">Cyclohexenyl </text><text x="217.44" y="155" font-size="24.00">C•</text><text x="247.20" y="155" font-size="24.00"> + </text><text x="291.84" y="155" font-size="24.00">Br</text><text x="321.60" y="155" font-size="24.00">–</text><text x="336.48" y="155" font-size="24.00">Br</text><text x="665.00" y="155" font-size="24.00">3-Bromocyclohexene + Br•</text><path data-electrons="1" d="M232.32,141.60 Q250.92,98.60 269.52,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#nbs-bromination-4-fish)"/><path data-electrons="1" d="M329.04,141.60 Q299.28,203.60 269.52,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#nbs-bromination-4-fish)"/><path data-electrons="1" d="M329.04,141.60 Q340.20,80.60 351.36,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#nbs-bromination-4-fish)"/><text x="24" y="235" font-size="16">The allylic radical abstracts Br from Br2, regenerating the chain carrier.</text></g></g></svg>