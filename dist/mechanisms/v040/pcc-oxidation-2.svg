<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" role="img"><title>PCC alcohol oxidation: Mechanistic boundary / grouped stage</title><desc>Ph–CH(O–Cr)–H + :base → PhCHO + reduced chromium species + H–base. Base-assisted removal of carbinol H forms C=O while O–Cr cleavage accompanies chromium reduction. Alignment of C–H and O–Cr is required.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="pcc-oxidation-2-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="pcc-oxidation-2-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">PCC alcohol oxidation · 2</text><text x="24" y="65" font-size="17">Mechanistic boundary / grouped stage</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">Ph–</text><text x="68.64" y="155" font-size="24.00">CH</text><text x="98.40" y="155" font-size="24.00">(</text><text x="113.28" y="155" font-size="24.00">O</text><text x="128.16" y="155" font-size="24.00">–</text><text x="143.04" y="155" font-size="24.00">Cr</text><text x="172.80" y="155" font-size="24.00">)–</text><text x="202.56" y="155" font-size="24.00">H</text><text x="217.44" y="155" font-size="24.00"> + </text><text x="262.08" y="155" font-size="24.00">:base</text><text x="665.00" y="155" font-size="20.06">PhCHO + reduced chromium species + H–base</text><path data-electrons="2" d="M299.28,141.60 Q254.64,98.60 210.00,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#pcc-oxidation-2-pair)"/><path data-electrons="2" d="M146.76,141.60 Q124.44,203.60 102.12,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#pcc-oxidation-2-pair)"/><path data-electrons="2" d="M139.32,141.60 Q148.62,80.60 157.92,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#pcc-oxidation-2-pair)"/><text x="24" y="235" font-size="16">Base-assisted removal of carbinol H forms C=O while O–Cr cleavage accompanies chromium reduction. Alignment</text><text x="24" y="258" font-size="16">of C–H and O–Cr is required.</text></g></svg>