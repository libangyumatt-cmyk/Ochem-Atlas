<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1220"><title>Osmium-catalyzed syn dihydroxylation: complete teaching sequence</title><g font-family="DejaVu Sans,sans-serif"><rect width="1200" height="350" fill="#fffefa"/><text x="25" y="32" font-size="21" fill="#203c43">Osmium-catalyzed syn dihydroxylation · representative molecular graphs</text><path d="M314.05,183.50 L235.95,183.50" stroke="#203c43" stroke-width="2" fill="none"/><path d="M314.05,177.50 L235.95,177.50" stroke="#203c43" stroke-width="2" fill="none"/><rect x="299.05" y="170.50" width="30" height="20" fill="#fffefa"/><text x="314.05" y="185.50" font-size="16" text-anchor="middle" fill="#203c43">CH2</text><rect x="220.95" y="170.50" width="30" height="20" fill="#fffefa"/><text x="235.95" y="185.50" font-size="16" text-anchor="middle" fill="#203c43">CH2</text><path d="M986.07,251.57 L906.46,246.18" stroke="#203c43" stroke-width="2" fill="none"/><path d="M906.46,246.18 L849.32,189.04" stroke="#203c43" stroke-width="2" fill="none"/><path d="M849.32,189.04 L843.93,109.43" stroke="#203c43" stroke-width="2" fill="none"/><rect x="976.07" y="241.57" width="20" height="20" fill="#fffefa"/><text x="986.07" y="256.57" font-size="16" text-anchor="middle" fill="#203c43">OH</text><rect x="891.46" y="236.18" width="30" height="20" fill="#fffefa"/><text x="906.46" y="251.18" font-size="16" text-anchor="middle" fill="#203c43">CH2</text><rect x="834.32" y="179.04" width="30" height="20" fill="#fffefa"/><text x="849.32" y="194.04" font-size="16" text-anchor="middle" fill="#203c43">CH2</text><rect x="833.93" y="99.43" width="20" height="20" fill="#fffefa"/><text x="843.93" y="114.43" font-size="16" text-anchor="middle" fill="#203c43">OH</text><text x="580" y="180" font-size="32" fill="#203c43">→</text><text x="25" y="330" font-size="15" fill="#203c43">Representative substrate/product connectivity; other reagents/byproducts are in the equation. No computed geometry.</text></g><g transform="translate(0,350)"><title>Osmium-catalyzed syn dihydroxylation: Mechanistic boundary / grouped stage</title><desc>CH2=CH2 + OsO4 → Cyclic osmate ester: Os–O–CH2–CH2–O ring. Concerted addition of two Os-bound oxygens across the alkene gives a cyclic osmate ester. This metal-oxide cycloaddition is not forced into a molecular pericyclic code.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="syn-dihydroxylation-1-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="syn-dihydroxylation-1-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Osmium-catalyzed syn dihydroxylation · 1</text><text x="24" y="65" font-size="17">Mechanistic boundary / grouped stage</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">CH2=CH2 + OsO4</text><text x="665.00" y="155" font-size="20.56">Cyclic osmate ester: Os–O–CH2–CH2–O ring</text><text x="30" y="202" font-size="16">Process model: no unique microscopic electron-arrow sequence asserted.</text><text x="24" y="235" font-size="16">Concerted addition of two Os-bound oxygens across the alkene gives a cyclic osmate ester. This metal-oxide</text><text x="24" y="258" font-size="16">cycloaddition is not forced into a molecular pericyclic code.</text></g></g><g transform="translate(0,640)"><title>Osmium-catalyzed syn dihydroxylation: Mechanistic boundary / grouped stage</title><desc>Cyclic osmate ester + water / reductive work-up → HOCH2CH2OH + reduced osmium species. Hydrolysis/reductive cleavage of Os–O bonds releases the syn diol; proton relays and exact osmium speciation are grouped.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="syn-dihydroxylation-2-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="syn-dihydroxylation-2-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Osmium-catalyzed syn dihydroxylation · 2</text><text x="24" y="65" font-size="17">Mechanistic boundary / grouped stage</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="17.84">Cyclic osmate ester + water / reductive work-up</text><text x="665.00" y="155" font-size="23.50">HOCH2CH2OH + reduced osmium species</text><text x="30" y="202" font-size="16">Process model: no unique microscopic electron-arrow sequence asserted.</text><text x="24" y="235" font-size="16">Hydrolysis/reductive cleavage of Os–O bonds releases the syn diol; proton relays and exact osmium speciation</text><text x="24" y="258" font-size="16">are grouped.</text></g></g><g transform="translate(0,930)"><title>Osmium-catalyzed syn dihydroxylation: Mechanistic boundary / grouped stage</title><desc>Reduced osmium species + NMO → OsO4 + N-methylmorpholine-derived products. Co-oxidant regenerates active osmium; the redox/ligand network is grouped rather than assigned a fictitious closed-shell elementary code.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="syn-dihydroxylation-3-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="syn-dihydroxylation-3-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Osmium-catalyzed syn dihydroxylation · 3</text><text x="24" y="65" font-size="17">Mechanistic boundary / grouped stage</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">Reduced osmium species + NMO</text><text x="665.00" y="155" font-size="19.59">OsO4 + N-methylmorpholine-derived products</text><text x="30" y="202" font-size="16">Process model: no unique microscopic electron-arrow sequence asserted.</text><text x="24" y="235" font-size="16">Co-oxidant regenerates active osmium; the redox/ligand network is grouped rather than assigned a fictitious</text><text x="24" y="258" font-size="16">closed-shell elementary code.</text></g></g></svg>