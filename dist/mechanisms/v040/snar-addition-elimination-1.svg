<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" role="img"><title>Activated nucleophilic aromatic substitution: Coupled polar bond reorganization</title><desc>ring C(F)=CH–CH=C(NO2)–CH=CH–(back) + :OMe− → ring C(F)(OMe)–CH−–CH=C(NO2)–CH=CH–(back). Methoxide adds at the ipso carbon; aromatic pi electrons redistribute into the ring/nitro group in the Meisenheimer model.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="snar-addition-elimination-1-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="snar-addition-elimination-1-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Activated nucleophilic aromatic substitution · 1</text><text x="24" y="65" font-size="17">Coupled polar bond reorganization</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="19.50">ring </text><text x="84.47" y="155" font-size="19.50">C</text><text x="96.56" y="155" font-size="19.50">(F)=CH–CH=C(NO2)–CH=CH–(back) + </text><text x="483.53" y="155" font-size="19.50">:OMe−</text><text x="665.00" y="155" font-size="20.06">ring C(F)(OMe)–CH−–CH=C(NO2)–CH=CH–(back)</text><path data-electrons="2" d="M513.77,143.17 Q302.14,100.17 90.51,139.17" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#snar-addition-elimination-1-pair)"/><text x="24" y="235" font-size="16">Methoxide adds at the ipso carbon; aromatic pi electrons redistribute into the ring/nitro group in the Meisenheimer model.</text></g></svg>