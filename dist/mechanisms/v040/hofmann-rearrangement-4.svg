<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" role="img"><title>Hofmann amide rearrangement: Coupled polar bond reorganization</title><desc>Ph–C(=O)–N−–Br → PhN=C=O + Br−. Phenyl migrates from acyl C to N as bromide leaves and C=N forms; a free nitrene is not inserted.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="hofmann-rearrangement-4-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="hofmann-rearrangement-4-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Hofmann amide rearrangement · 4</text><text x="24" y="65" font-size="17">Coupled polar bond reorganization</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">Ph</text><text x="53.76" y="155" font-size="24.00">–</text><text x="68.64" y="155" font-size="24.00">C</text><text x="83.52" y="155" font-size="24.00">(=O)–</text><text x="157.92" y="155" font-size="24.00">N−</text><text x="187.68" y="155" font-size="24.00">–</text><text x="202.56" y="155" font-size="24.00">Br</text><text x="665.00" y="155" font-size="24.00">PhN=C=O + Br−</text><path data-electrons="2" d="M57.48,141.60 Q115.14,98.60 172.80,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#hofmann-rearrangement-4-pair)"/><path data-electrons="2" d="M195.12,141.60 Q206.28,203.60 217.44,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#hofmann-rearrangement-4-pair)"/><path data-electrons="2" d="M172.80,141.60 Q148.62,80.60 124.44,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#hofmann-rearrangement-4-pair)"/><text x="24" y="235" font-size="16">Phenyl migrates from acyl C to N as bromide leaves and C=N forms; a free nitrene is not inserted.</text></g></svg>