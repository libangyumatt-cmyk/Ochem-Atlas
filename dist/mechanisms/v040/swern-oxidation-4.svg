<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" role="img"><title>Swern oxidation: Proton transfer</title><desc>PhCH2O–S+(Me)–CH2–H + :NEt3 → PhCH2O–S+(Me)–CH2− + Et3NH+. Base removes a sulfur-methyl proton in the sulfur-ylide model, not a hydride from alcohol carbon.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="swern-oxidation-4-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="swern-oxidation-4-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Swern oxidation · 4</text><text x="24" y="65" font-size="17">Proton transfer</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">PhCH2O–S+(Me)–</text><text x="232.32" y="155" font-size="24.00">CH2</text><text x="276.96" y="155" font-size="24.00">–</text><text x="291.84" y="155" font-size="24.00">H</text><text x="306.72" y="155" font-size="24.00"> + </text><text x="351.36" y="155" font-size="24.00">:NEt3</text><text x="665.00" y="155" font-size="24.00">PhCH2O–S+(Me)–CH2− + Et3NH+</text><path data-electrons="2" d="M388.56,141.60 Q343.92,98.60 299.28,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#swern-oxidation-4-pair)"/><path data-electrons="2" d="M276.96,141.60 Q265.80,203.60 254.64,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#swern-oxidation-4-pair)"/><text x="24" y="235" font-size="16">Base removes a sulfur-methyl proton in the sulfur-ylide model, not a hydride from alcohol carbon.</text></g></svg>