<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1510"><title>Wagner–Meerwein skeletal rearrangement: complete teaching sequence</title><g font-family="DejaVu Sans,sans-serif"><rect width="1200" height="350" fill="#fffefa"/><text x="25" y="32" font-size="21" fill="#203c43">Wagner–Meerwein skeletal rearrangement · representative molecular graphs</text><path d="M365.80,219.57 L295.16,211.82" stroke="#203c43" stroke-width="2" fill="none"/><path d="M295.16,211.82 L277.66,280.50" stroke="#203c43" stroke-width="2" fill="none"/><path d="M295.16,211.82 L255.19,146.92" stroke="#203c43" stroke-width="2" fill="none"/><path d="M255.19,146.92 L184.20,157.93" stroke="#203c43" stroke-width="2" fill="none"/><path d="M255.19,146.92 L228.02,80.50" stroke="#203c43" stroke-width="2" fill="none"/><path d="M255.19,146.92 L312.29,104.62" stroke="#203c43" stroke-width="2" fill="none"/><rect x="350.80" y="209.57" width="30" height="20" fill="#fffefa"/><text x="365.80" y="224.57" font-size="16" text-anchor="middle" fill="#203c43">CH3</text><rect x="285.16" y="201.82" width="20" height="20" fill="#fffefa"/><text x="295.16" y="216.82" font-size="16" text-anchor="middle" fill="#203c43">CH</text><rect x="267.66" y="270.50" width="20" height="20" fill="#fffefa"/><text x="277.66" y="285.50" font-size="16" text-anchor="middle" fill="#203c43">OH</text><rect x="250.19" y="136.92" width="10" height="20" fill="#fffefa"/><text x="255.19" y="151.92" font-size="16" text-anchor="middle" fill="#203c43">C</text><rect x="169.20" y="147.93" width="30" height="20" fill="#fffefa"/><text x="184.20" y="162.93" font-size="16" text-anchor="middle" fill="#203c43">CH3</text><rect x="213.02" y="70.50" width="30" height="20" fill="#fffefa"/><text x="228.02" y="85.50" font-size="16" text-anchor="middle" fill="#203c43">CH3</text><rect x="297.29" y="94.62" width="30" height="20" fill="#fffefa"/><text x="312.29" y="109.62" font-size="16" text-anchor="middle" fill="#203c43">CH3</text><path d="M1000.81,222.70 L925.27,213.26" stroke="#203c43" stroke-width="2" fill="none"/><path d="M925.27,213.26 L889.78,280.50" stroke="#203c43" stroke-width="2" fill="none"/><path d="M922.53,214.47 L890.48,141.77" stroke="#203c43" stroke-width="2" fill="none"/><path d="M928.02,212.05 L895.97,139.35" stroke="#203c43" stroke-width="2" fill="none"/><path d="M893.23,140.56 L829.19,99.34" stroke="#203c43" stroke-width="2" fill="none"/><path d="M893.23,140.56 L938.88,80.50" stroke="#203c43" stroke-width="2" fill="none"/><rect x="985.81" y="212.70" width="30" height="20" fill="#fffefa"/><text x="1000.81" y="227.70" font-size="16" text-anchor="middle" fill="#203c43">CH3</text><rect x="920.27" y="203.26" width="10" height="20" fill="#fffefa"/><text x="925.27" y="218.26" font-size="16" text-anchor="middle" fill="#203c43">C</text><rect x="874.78" y="270.50" width="30" height="20" fill="#fffefa"/><text x="889.78" y="285.50" font-size="16" text-anchor="middle" fill="#203c43">CH3</text><rect x="888.23" y="130.56" width="10" height="20" fill="#fffefa"/><text x="893.23" y="145.56" font-size="16" text-anchor="middle" fill="#203c43">C</text><rect x="814.19" y="89.34" width="30" height="20" fill="#fffefa"/><text x="829.19" y="104.34" font-size="16" text-anchor="middle" fill="#203c43">CH3</text><rect x="923.88" y="70.50" width="30" height="20" fill="#fffefa"/><text x="938.88" y="85.50" font-size="16" text-anchor="middle" fill="#203c43">CH3</text><text x="580" y="180" font-size="32" fill="#203c43">→</text><text x="25" y="330" font-size="15" fill="#203c43">Representative substrate/product connectivity; other reagents/byproducts are in the equation. No computed geometry.</text></g><g transform="translate(0,350)"><title>Wagner–Meerwein skeletal rearrangement: Proton transfer</title><desc>CH3CH(O:H)CMe3 + H–OH2+ → CH3CH(OH2+)CMe3 + H2O. Protonate alcohol O.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="wagner-meerwein-1-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="wagner-meerwein-1-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Wagner–Meerwein skeletal rearrangement · 1</text><text x="24" y="65" font-size="17">Proton transfer</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">CH3CH(</text><text x="113.28" y="155" font-size="24.00">O:H</text><text x="157.92" y="155" font-size="24.00">)CMe3 + </text><text x="276.96" y="155" font-size="24.00">H</text><text x="291.84" y="155" font-size="24.00">–</text><text x="306.72" y="155" font-size="24.00">OH2+</text><text x="665.00" y="155" font-size="24.00">CH3CH(OH2+)CMe3 + H2O</text><path data-electrons="2" d="M135.60,141.60 Q210.00,98.60 284.40,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#wagner-meerwein-1-pair)"/><path data-electrons="2" d="M310.44,141.60 Q323.46,203.60 336.48,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#wagner-meerwein-1-pair)"/><text x="24" y="235" font-size="16">Protonate alcohol O.</text></g></g><g transform="translate(0,640)"><title>Wagner–Meerwein skeletal rearrangement: Heterolytic ionization</title><desc>CH3–CH(OH2+)CMe3 → CH3CH+–CMe3 + H2O. Water departure is shown as a limiting ionization description.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="wagner-meerwein-2-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="wagner-meerwein-2-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Wagner–Meerwein skeletal rearrangement · 2</text><text x="24" y="65" font-size="17">Heterolytic ionization</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">CH3–</text><text x="83.52" y="155" font-size="24.00">CH</text><text x="113.28" y="155" font-size="24.00">(</text><text x="128.16" y="155" font-size="24.00">OH2+</text><text x="187.68" y="155" font-size="24.00">)CMe3</text><text x="665.00" y="155" font-size="24.00">CH3CH+–CMe3 + H2O</text><path data-electrons="2" d="M128.16,141.60 Q143.04,98.60 157.92,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#wagner-meerwein-2-pair)"/><text x="24" y="235" font-size="16">Water departure is shown as a limiting ionization description.</text></g></g><g transform="translate(0,930)"><title>Wagner–Meerwein skeletal rearrangement: 1,2 methyl migration</title><desc>CH3–CH+–C(Me)2–Me → (Me)2CH–C+(Me)2. The adjacent C–Me sigma pair migrates to the empty p orbital, moving the cation to the donor carbon.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="wagner-meerwein-3-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="wagner-meerwein-3-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Wagner–Meerwein skeletal rearrangement · 3</text><text x="24" y="65" font-size="17">1,2 methyl migration</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">CH3–</text><text x="83.52" y="155" font-size="24.00">CH+</text><text x="128.16" y="155" font-size="24.00">–</text><text x="143.04" y="155" font-size="24.00">C</text><text x="157.92" y="155" font-size="24.00">(Me)2–</text><text x="247.20" y="155" font-size="24.00">Me</text><text x="665.00" y="155" font-size="24.00">(Me)2CH–C+(Me)2</text><path data-electrons="2" d="M206.28,141.60 Q156.06,98.60 105.84,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#wagner-meerwein-3-pair)"/><text x="24" y="235" font-size="16">The adjacent C–Me sigma pair migrates to the empty p orbital, moving the cation to the donor carbon.</text></g></g><g transform="translate(0,1220)"><title>Wagner–Meerwein skeletal rearrangement: Coupled polar bond reorganization</title><desc>Me2C(H)–C+Me2 + :OH2 → Me2C=CMe2 + H3O+. Loss of the remaining adjacent H creates the most substituted alkene model.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="wagner-meerwein-4-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="wagner-meerwein-4-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Wagner–Meerwein skeletal rearrangement · 4</text><text x="24" y="65" font-size="17">Coupled polar bond reorganization</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">Me2</text><text x="68.64" y="155" font-size="24.00">C</text><text x="83.52" y="155" font-size="24.00">(</text><text x="98.40" y="155" font-size="24.00">H</text><text x="113.28" y="155" font-size="24.00">)–</text><text x="143.04" y="155" font-size="24.00">C+</text><text x="172.80" y="155" font-size="24.00">Me2 + </text><text x="262.08" y="155" font-size="24.00">:OH2</text><text x="665.00" y="155" font-size="24.00">Me2C=CMe2 + H3O+</text><path data-electrons="2" d="M291.84,141.60 Q198.84,98.60 105.84,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#wagner-meerwein-4-pair)"/><path data-electrons="2" d="M90.96,141.60 Q103.98,203.60 117.00,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#wagner-meerwein-4-pair)"/><text x="24" y="235" font-size="16">Loss of the remaining adjacent H creates the most substituted alkene model.</text></g></g></svg>