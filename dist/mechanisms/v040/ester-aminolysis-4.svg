<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" role="img"><title>Ester aminolysis: Proton transfer</title><desc>EtO− + H–NH3+ → EtOH + NH3. Ethoxide takes an ammonium proton, completing the proton inventory.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="ester-aminolysis-4-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="ester-aminolysis-4-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Ester aminolysis · 4</text><text x="24" y="65" font-size="17">Proton transfer</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">Et</text><text x="53.76" y="155" font-size="24.00">O−</text><text x="83.52" y="155" font-size="24.00"> + </text><text x="128.16" y="155" font-size="24.00">H</text><text x="143.04" y="155" font-size="24.00">–</text><text x="157.92" y="155" font-size="24.00">NH3+</text><text x="665.00" y="155" font-size="24.00">EtOH + NH3</text><path data-electrons="2" d="M68.64,141.60 Q102.12,98.60 135.60,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#ester-aminolysis-4-pair)"/><path data-electrons="2" d="M161.64,141.60 Q174.66,203.60 187.68,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#ester-aminolysis-4-pair)"/><text x="24" y="235" font-size="16">Ethoxide takes an ammonium proton, completing the proton inventory.</text></g></svg>