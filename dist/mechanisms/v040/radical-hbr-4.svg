<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" role="img"><title>Peroxide-initiated radical HBr addition: Radical atom transfer</title><desc>CH3–CH•–CH2Br + H–Br → CH3CH2CH2Br + Br•. The carbon radical abstracts H from HBr, regenerating Br• for the preceding propagation step.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="radical-hbr-4-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="radical-hbr-4-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Peroxide-initiated radical HBr addition · 4</text><text x="24" y="65" font-size="17">Radical atom transfer</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">CH3–</text><text x="83.52" y="155" font-size="24.00">CH•</text><text x="128.16" y="155" font-size="24.00">–CH2Br + </text><text x="262.08" y="155" font-size="24.00">H</text><text x="276.96" y="155" font-size="24.00">–</text><text x="291.84" y="155" font-size="24.00">Br</text><text x="665.00" y="155" font-size="24.00">CH3CH2CH2Br + Br•</text><path data-electrons="1" d="M105.84,141.60 Q146.76,98.60 187.68,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#radical-hbr-4-fish)"/><path data-electrons="1" d="M288.12,141.60 Q237.90,203.60 187.68,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#radical-hbr-4-fish)"/><path data-electrons="1" d="M288.12,141.60 Q297.42,80.60 306.72,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#radical-hbr-4-fish)"/><text x="24" y="235" font-size="16">The carbon radical abstracts H from HBr, regenerating Br• for the preceding propagation step.</text></g></svg>