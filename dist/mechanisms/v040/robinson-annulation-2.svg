<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" role="img"><title>Robinson annulation: Coupled polar bond reorganization</title><desc>Ring alpha-C:− + CH2=CH–COCH3 → Ring–CH2CH−COCH3 (acceptor enolate). The ring enolate makes a Michael bond to MVK beta carbon; pi electrons shift into the acceptor enolate.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="robinson-annulation-2-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="robinson-annulation-2-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Robinson annulation · 2</text><text x="24" y="65" font-size="17">Coupled polar bond reorganization</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">Ring alpha-</text><text x="187.68" y="155" font-size="24.00">C:−</text><text x="232.32" y="155" font-size="24.00"> + </text><text x="276.96" y="155" font-size="24.00">CH2</text><text x="321.60" y="155" font-size="24.00">=</text><text x="336.48" y="155" font-size="24.00">CH</text><text x="366.24" y="155" font-size="24.00">–COCH3</text><text x="665.00" y="155" font-size="23.50">Ring–CH2CH−COCH3 (acceptor enolate)</text><path data-electrons="2" d="M210.00,141.60 Q254.64,98.60 299.28,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#robinson-annulation-2-pair)"/><path data-electrons="2" d="M325.32,141.60 Q338.34,203.60 351.36,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#robinson-annulation-2-pair)"/><text x="24" y="235" font-size="16">The ring enolate makes a Michael bond to MVK beta carbon; pi electrons shift into the acceptor enolate.</text></g></svg>