<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" role="img"><title>Baeyer–Villiger oxidation: Proton transfer</title><desc>PhC(=O:)Me + H–acid → PhC(=OH+)Me + base−. Carbonyl protonation activates the ketone; acid strength and speciation depend on medium.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="baeyer-villiger-1-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="baeyer-villiger-1-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Baeyer–Villiger oxidation · 1</text><text x="24" y="65" font-size="17">Proton transfer</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">PhC(=</text><text x="98.40" y="155" font-size="24.00">O:</text><text x="128.16" y="155" font-size="24.00">)Me + </text><text x="217.44" y="155" font-size="24.00">H</text><text x="232.32" y="155" font-size="24.00">–</text><text x="247.20" y="155" font-size="24.00">acid</text><text x="665.00" y="155" font-size="24.00">PhC(=OH+)Me + base−</text><path data-electrons="2" d="M113.28,141.60 Q169.08,98.60 224.88,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#baeyer-villiger-1-pair)"/><path data-electrons="2" d="M250.92,141.60 Q263.94,203.60 276.96,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#baeyer-villiger-1-pair)"/><text x="24" y="235" font-size="16">Carbonyl protonation activates the ketone; acid strength and speciation depend on medium.</text></g></svg>