<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" role="img"><title>Alkyne hydroboration–oxidation: Vinylborane formation</title><desc>CH3–C≡CH + R2B–H → CH3CH=CHBR2. Alkyne pi donation to B and B–H transfer place B mainly at the terminal carbon.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="alkyne-hydroboration-1-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="alkyne-hydroboration-1-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Alkyne hydroboration–oxidation · 1</text><text x="24" y="65" font-size="17">Vinylborane formation</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">CH3–</text><text x="83.52" y="155" font-size="24.00">C</text><text x="98.40" y="155" font-size="24.00">≡</text><text x="113.28" y="155" font-size="24.00">CH</text><text x="143.04" y="155" font-size="24.00"> + R2</text><text x="217.44" y="155" font-size="24.00">B</text><text x="232.32" y="155" font-size="24.00">–</text><text x="247.20" y="155" font-size="24.00">H</text><text x="665.00" y="155" font-size="24.00">CH3CH=CHBR2</text><path data-electrons="2" d="M109.56,141.60 Q167.22,98.60 224.88,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#alkyne-hydroboration-1-pair)"/><path data-electrons="2" d="M239.76,141.60 Q165.36,203.60 90.96,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#alkyne-hydroboration-1-pair)"/><text x="24" y="235" font-size="16">Alkyne pi donation to B and B–H transfer place B mainly at the terminal carbon.</text></g></svg>