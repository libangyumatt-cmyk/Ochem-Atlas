y="181.22" width="30" height="20" fill="#fffefa"/><text x="225.56" y="196.22" font-size="16" text-anchor="middle" fill="#203c43">CH2</text><rect x="246.99" y="127.62" width="10" height="20" fill="#fffefa"/><text x="251.99" y="142.62" font-size="16" text-anchor="middle" fill="#203c43">C</text><rect x="239.09" y="70.50" width="30" height="20" fill="#fffefa"/><text x="254.09" y="85.50" font-size="16" text-anchor="middle" fill="#203c43">CH3</text><rect x="303.60" y="124.42" width="10" height="20" fill="#fffefa"/><text x="308.60" y="139.42" font-size="16" text-anchor="middle" fill="#203c43">O</text><path d="M1034.33,249.12 L955.81,267.37" stroke="#203c43" stroke-width="2" fill="none"/><path d="M955.81,267.37 L882.42,229.80" stroke="#203c43" stroke-width="2" fill="none"/><path d="M882.42,229.80 L854.47,150.50" stroke="#203c43" stroke-width="2" fill="none"/><path d="M854.47,150.50 L795.67,93.63" stroke="#203c43" stroke-width="2" fill="none"/><path d="M852.42,148.30 L912.00,92.77" stroke="#203c43" stroke-width="2" fill="none"/><path d="M856.52,152.69 L916.09,97.15" stroke="#203c43" stroke-width="2" fill="none"/><rect x="1019.33" y="239.12" width="30" height="20" fill="#fffefa"/><text x="1034.33" y="254.12" font-size="16" text-anchor="middle" fill="#203c43">CH3</text><rect x="940.81" y="257.37" width="30" height="20" fill="#fffefa"/><text x="955.81" y="272.37" font-size="16" text-anchor="middle" fill="#203c43">CH2</text><rect x="867.42" y="219.80" width="30" height="20" fill="#fffefa"/><text x="882.42" y="234.80" font-size="16" text-anchor="middle" fill="#203c43">CH2</text><rect x="849.47" y="140.50" width="10" height="20" fill="#fffefa"/><text x="854.47" y="155.50" font-size="16" text-anchor="middle" fill="#203c43">C</text><rect x="780.67" y="83.63" width="30" height="20" fill="#fffefa"/><text x="795.67" y="98.63" font-size="16" text-anchor="middle" fill="#203c43">CH3</text><rect x="909.04" y="84.96" width="10" height="20" fill="#fffefa"/><text x="914.04" y="99.96" font-size="16" text-anchor="middle" fill="#203c43">O</text><text x="580" y="180" font-size="32" fill="#203c43">→</text><text x="25" y="330" font-size="15" fill="#203c43">Representative substrate/product connectivity; other reagents/byproducts are in the equation. No computed geometry.</text></g><g transform="translate(0,350)"><title>Acetoacetic ester synthesis: Proton transfer</title><desc>CH3CO–CH(CO2Et)–H + :OEt− → [CH3COCHCO2Et]− + EtOH. Deprotonate the beta-keto ester methylene.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="acetoacetic-ester-synthesis-1-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="acetoacetic-ester-synthesis-1-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Acetoacetic ester synthesis · 1</text><text x="24" y="65" font-size="17">Proton transfer</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">CH3CO–</text><text x="113.28" y="155" font-size="24.00">CH</text><text x="143.04" y="155" font-size="24.00">(CO2Et)–</text><text x="262.08" y="155" font-size="24.00">H</text><text x="276.96" y="155" font-size="24.00"> + </text><text x="321.60" y="155" font-size="24.00">:OEt−</text><text x="665.00" y="155" font-size="24.00">[CH3COCHCO2Et]− + EtOH</text><path data-electrons="2" d="M358.80,141.60 Q314.16,98.60 269.52,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#acetoacetic-ester-synthesis-1-pair)"/><path data-electrons="2" d="M198.84,141.60 Q163.50,203.60 128.16,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#acetoacetic-ester-synthesis-1-pair)"/><text x="24" y="235" font-size="16">Deprotonate the beta-keto ester methylene.</text></g></g><g transform="translate(0,640)"><title>Acetoacetic ester synthesis: Bond-replacing displacement</title><desc>CH3CO–CH−–CO2Et + CH3–CH2–Br → CH3COCH(Et)CO2Et + Br−. The carbon enolate attacks the primary electrophile; the label Et denotes the ethyl carbon bearing Br.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="acetoacetic-ester-synthesis-2-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="acetoacetic-ester-synthesis-2-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Acetoacetic ester synthesis · 2</text><text x="24" y="65" font-size="17">Bond-replacing displacement</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">CH3CO–</text><text x="113.28" y="155" font-size="24.00">CH−</text><text x="157.92" y="155" font-size="24.00">–CO2Et + CH3–</text><text x="351.36" y="155" font-size="24.00">CH2</text><text x="396.00" y="155" font-size="24.00">–</text><text x="410.88" y="155" font-size="24.00">Br</text><text x="665.00" y="155" font-size="24.00">CH3COCH(Et)CO2Et + Br−</text><path data-electrons="2" d="M135.60,141.60 Q254.64,98.60 373.68,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#acetoacetic-ester-synthesis-2-pair)"/><path data-electrons="2" d="M399.72,141.60 Q412.74,203.60 425.76,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#acetoacetic-ester-synthesis-2-pair)"/><text x="24" y="235" font-size="16">The carbon enolate attacks the primary electrophile; the label Et denotes the ethyl carbon bearing Br.</text></g></g><g transform="translate(0,930)"><title>Acetoacetic ester synthesis: Mechanistic boundary / grouped stage</title><desc>CH3COCH(Et)CO2Et + hydrolysis / acidification → CH3COCH(Et)CO2H + EtOH. Ester hydrolysis and acid work-up give a beta-keto acid.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="acetoacetic-ester-synthesis-3-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="acetoacetic-ester-synthesis-3-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Acetoacetic ester synthesis · 3</text><text x="24" y="65" font-size="17">Mechanistic boundary / grouped stage</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="18.64">CH3COCH(Et)CO2Et + hydrolysis / acidification</text><text x="665.00" y="155" font-size="24.00">CH3COCH(Et)CO2H + EtOH</text><text x="30" y="202" font-size="16">Process model: no unique microscopic electron-arrow sequence asserted.</text><text x="24" y="235" font-size="16">Ester hydrolysis and acid work-up give a beta-keto acid.</text></g></g><g transform="translate(0,1220)"><title>Acetoacetic ester synthesis: Beta-keto-acid decarboxylation</title><desc>CH3COCH(Et)CO2H → CH3C(OH)=CHEt + CO2. A six-membered proton-transfer arrangement accompanies C–C cleavage and enol formation.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="acetoacetic-ester-synthesis-4-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="acetoacetic-ester-synthesis-4-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Acetoacetic ester synthesis · 4</text><text x="24" y="65" font-size="17">Beta-keto-acid decarboxylation</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">CH3COCH(Et)CO2H</text><text x="665.00" y="155" font-size="24.00">CH3C(OH)=CHEt + CO2</text><text x="30" y="202" font-size="16">Condensed structural stage; electron changes are specified below.</text><text x="24" y="235" font-size="16">A six-membered proton-transfer arrangement accompanies C–C cleavage and enol formation.</text></g></g><g transform="translate(0,1510)"><title>Acetoacetic ester synthesis: Mechanistic boundary / grouped stage</title><desc>CH3C(OH)=CHEt + proton relays → CH3COCH2Et. Acid/base-mediated enol–ketone tautomerization yields2-pentanone.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="acetoacetic-ester-synthesis-5-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="acetoacetic-ester-synthesis-5-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Acetoacetic ester synthesis · 5</text><text x="24" y="65" font-size="17">Mechanistic boundary / grouped stage</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">CH3C(OH)=CHEt + proton relays</text><text x="665.00" y="155" font-size="24.00">CH3COCH2Et</text><text x="30" y="202" font-size="16">Process model: no unique microscopic electron-arrow sequence asserted.</text><text x="24" y="235" font-size="16">Acid/base-mediated enol–ketone tautomerization yields2-pentanone.</text></g></g></svg>