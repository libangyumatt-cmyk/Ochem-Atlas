<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" role="img"><title>Aromatic sulfonation: Coupled polar bond reorganization</title><desc>ring CH=CH–CH=CH–CH=CH–(back) + S(=O)(=O)=O → [C6H6–SO3] zwitterionic sigma complex. Arene pi electrons attack sulfur; one S=O bond polarizes to oxygen, giving an arenium/sulfonate description.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="aromatic-sulfonation-1-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="aromatic-sulfonation-1-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Aromatic sulfonation · 1</text><text x="24" y="65" font-size="17">Coupled polar bond reorganization</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="19.50">ring </text><text x="84.47" y="155" font-size="19.50">CH</text><text x="108.65" y="155" font-size="19.50">=</text><text x="120.74" y="155" font-size="19.50">CH</text><text x="144.93" y="155" font-size="19.50">–CH=CH–CH=CH–(back) + </text><text x="410.98" y="155" font-size="19.50">S</text><text x="423.07" y="155" font-size="19.50">(=</text><text x="447.26" y="155" font-size="19.50">O</text><text x="459.35" y="155" font-size="19.50">)(=O)=O</text><text x="665.00" y="155" font-size="22.23">[C6H6–SO3] zwitterionic sigma complex</text><path data-electrons="2" d="M114.70,143.17 Q265.86,100.17 417.02,139.17" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#aromatic-sulfonation-1-pair)"/><path data-electrons="2" d="M435.16,143.17 Q444.23,205.17 453.30,139.17" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#aromatic-sulfonation-1-pair)"/><text x="24" y="235" font-size="16">Arene pi electrons attack sulfur; one S=O bond polarizes to oxygen, giving an arenium/sulfonate description.</text></g></svg>