<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" role="img"><title>Pinacol rearrangement: 1,2 migration with carbonyl formation</title><desc>Me2C+–C(OH:)(Me)–Me → Me3C–C(=OH+)Me. The adjacent C–Me sigma bond migrates to the cation as O donates to form carbonyl; free methyl anion is not formed.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="pinacol-3-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="pinacol-3-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Pinacol rearrangement · 3</text><text x="24" y="65" font-size="17">1,2 migration with carbonyl formation</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">Me2</text><text x="68.64" y="155" font-size="24.00">C+</text><text x="98.40" y="155" font-size="24.00">–</text><text x="113.28" y="155" font-size="24.00">C</text><text x="128.16" y="155" font-size="24.00">(</text><text x="143.04" y="155" font-size="24.00">OH:</text><text x="187.68" y="155" font-size="24.00">)(Me)–</text><text x="276.96" y="155" font-size="24.00">Me</text><text x="665.00" y="155" font-size="24.00">Me3C–C(=OH+)Me</text><path data-electrons="2" d="M206.28,141.60 Q144.90,98.60 83.52,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#pinacol-3-pair)"/><path data-electrons="2" d="M165.36,141.60 Q154.20,203.60 143.04,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#pinacol-3-pair)"/><text x="24" y="235" font-size="16">The adjacent C–Me sigma bond migrates to the cation as O donates to form carbonyl; free methyl anion is not</text><text x="24" y="258" font-size="16">formed.</text></g></svg>