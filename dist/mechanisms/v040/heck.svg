x="281.58" y="105.11" width="10" height="20" fill="#fffefa"/><text x="286.58" y="120.11" font-size="16" text-anchor="middle" fill="#203c43">O</text><rect x="309.20" y="104.30" width="30" height="20" fill="#fffefa"/><text x="324.20" y="119.30" font-size="16" text-anchor="middle" fill="#203c43">CH2</text><rect x="344.45" y="112.36" width="30" height="20" fill="#fffefa"/><text x="359.45" y="127.36" font-size="16" text-anchor="middle" fill="#203c43">CH3</text><path d="M907.05,280.50 L881.82,258.28" stroke="#203c43" stroke-width="2" fill="none"/><path d="M881.82,258.28 L864.62,227.76" stroke="#203c43" stroke-width="2" fill="none"/><path d="M864.62,227.76 L857.75,192.42" stroke="#203c43" stroke-width="2" fill="none"/><path d="M856.04,194.88 L828.20,175.58" stroke="#203c43" stroke-width="2" fill="none"/><path d="M859.46,189.95 L831.62,170.65" stroke="#203c43" stroke-width="2" fill="none"/><path d="M857.75,192.42 L879.42,164.56" stroke="#203c43" stroke-width="2" fill="none"/><path d="M879.42,161.56 L914.01,161.56" stroke="#203c43" stroke-width="2" fill="none"/><path d="M879.42,167.56 L914.01,167.56" stroke="#203c43" stroke-width="2" fill="none"/><path d="M914.01,164.56 L935.62,136.77" stroke="#203c43" stroke-width="2" fill="none"/><path d="M932.65,137.13 L928.50,102.76" stroke="#203c43" stroke-width="2" fill="none"/><path d="M938.60,136.41 L934.45,102.04" stroke="#203c43" stroke-width="2" fill="none" stroke-dasharray="4 3"/><path d="M929.55,100.10 L955.62,78.20" stroke="#203c43" stroke-width="2" fill="none"/><path d="M933.41,104.69 L959.47,82.80" stroke="#203c43" stroke-width="2" fill="none" stroke-dasharray="4 3"/><path d="M958.14,77.56 L991.39,84.26" stroke="#203c43" stroke-width="2" fill="none"/><path d="M956.95,83.44 L990.20,90.15" stroke="#203c43" stroke-width="2" fill="none" stroke-dasharray="4 3"/><path d="M993.67,86.37 L1002.97,118.47" stroke="#203c43" stroke-width="2" fill="none"/><path d="M987.91,88.04 L997.21,120.14" stroke="#203c43" stroke-width="2" fill="none" stroke-dasharray="4 3"/><path d="M1001.65,121.87 L972.45,139.61" stroke="#203c43" stroke-width="2" fill="none"/><path d="M998.53,116.75 L969.34,134.48" stroke="#203c43" stroke-width="2" fill="none" stroke-dasharray="4 3"/><path d="M935.65,133.77 L970.92,134.05" stroke="#203c43" stroke-width="2" fill="none"/><path d="M935.60,139.77 L970.87,140.05" stroke="#203c43" stroke-width="2" fill="none" stroke-dasharray="4 3"/><rect x="892.05" y="270.50" width="30" height="20" fill="#fffefa"/><text x="907.05" y="285.50" font-size="16" text-anchor="middle" fill="#203c43">CH3</text><rect x="866.82" y="248.28" width="30" height="20" fill="#fffefa"/><text x="881.82" y="263.28" font-size="16" text-anchor="middle" fill="#203c43">CH2</text><rect x="859.62" y="217.76" width="10" height="20" fill="#fffefa"/><text x="864.62" y="232.76" font-size="16" text-anchor="middle" fill="#203c43">O</text><rect x="852.75" y="182.42" width="10" height="20" fill="#fffefa"/><text x="857.75" y="197.42" font-size="16" text-anchor="middle" fill="#203c43">C</text><rect x="824.91" y="163.11" width="10" height="20" fill="#fffefa"/><text x="829.91" y="178.11" font-size="16" text-anchor="middle" fill="#203c43">O</text><rect x="869.42" y="154.56" width="20" height="20" fill="#fffefa"/><text x="879.42" y="169.56" font-size="16" text-anchor="middle" fill="#203c43">CH</text><rect x="904.01" y="154.56" width="20" height="20" fill="#fffefa"/><text x="914.01" y="169.56" font-size="16" text-anchor="middle" fill="#203c43">CH</text><rect x="930.62" y="126.77" width="10" height="20" fill="#fffefa"/><text x="935.62" y="141.77" font-size="16" text-anchor="middle" fill="#203c43">C</text><rect x="921.48" y="92.40" width="20" height="20" fill="#fffefa"/><text x="931.48" y="107.40" font-size="16" text-anchor="middle" fill="#203c43">CH</text><rect x="947.55" y="70.50" width="20" height="20" fill="#fffefa"/><text x="957.55" y="85.50" font-size="16" text-anchor="middle" fill="#203c43">CH</text><rect x="980.79" y="77.21" width="20" height="20" fill="#fffefa"/><text x="990.79" y="92.21" font-size="16" text-anchor="middle" fill="#203c43">CH</text><rect x="990.09" y="109.31" width="20" height="20" fill="#fffefa"/><text x="1000.09" y="124.31" font-size="16" text-anchor="middle" fill="#203c43">CH</text><rect x="960.90" y="127.05" width="20" height="20" fill="#fffefa"/><text x="970.90" y="142.05" font-size="16" text-anchor="middle" fill="#203c43">CH</text><text x="580" y="180" font-size="32" fill="#203c43">→</text><text x="25" y="330" font-size="15" fill="#203c43">Representative substrate/product connectivity; other reagents/byproducts are in the equation. No computed geometry.</text><text x="680" y="60" font-size="20">E alkene · relative double-bond geometry specified</text></g><g transform="translate(0,350)"><title>Mizoroki–Heck coupling: Oxidative addition</title><desc>LnPd(0) + Ph–Br → LnPd(II)(Ph)(Br). Oxidative addition makes Pd–C/Pd–Br bonds and raises formal Pd oxidation state. Ligand dissociation/association and spin/speciation are not reduced to a molecular SN2 code.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="heck-1-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="heck-1-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Mizoroki–Heck coupling · 1</text><text x="24" y="65" font-size="17">Oxidative addition</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">LnPd(0) + Ph–Br</text><text x="665.00" y="155" font-size="24.00">LnPd(II)(Ph)(Br)</text><text x="30" y="202" font-size="16">Process model: no unique microscopic electron-arrow sequence asserted.</text><text x="24" y="235" font-size="16">Oxidative addition makes Pd–C/Pd–Br bonds and raises formal Pd oxidation state. Ligand</text><text x="24" y="258" font-size="16">dissociation/association and spin/speciation are not reduced to a molecular SN2 code.</text></g></g><g transform="translate(0,640)"><title>Mizoroki–Heck coupling: Alkene coordination</title><desc>LnPd(II)(Ph)(Br) + CH2=CHCO2Et → Pi-alkene palladium complex. Alkene coordination requires an available site; ligand dissociation is grouped.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="heck-2-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="heck-2-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Mizoroki–Heck coupling · 2</text><text x="24" y="65" font-size="17">Alkene coordination</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">LnPd(II)(Ph)(Br) + CH2=CHCO2Et</text><text x="665.00" y="155" font-size="24.00">Pi-alkene palladium complex</text><text x="30" y="202" font-size="16">Process model: no unique microscopic electron-arrow sequence asserted.</text><text x="24" y="235" font-size="16">Alkene coordination requires an available site; ligand dissociation is grouped.</text></g></g><g transform="translate(0,930)"><title>Mizoroki–Heck coupling: Migratory insertion</title><desc>Pd–Ph with coordinated CH2=CHCO2Et → PhCH2–CH(PdBrLn)CO2Et. Syn migratory insertion makes C–C and a new Pd–C bond. It is not free phenyl-anion attack.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="heck-3-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="heck-3-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Mizoroki–Heck coupling · 3</text><text x="24" y="65" font-size="17">Migratory insertion</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">Pd–Ph with coordinated CH2=CHCO2Et</text><text x="665.00" y="155" font-size="24.00">PhCH2–CH(PdBrLn)CO2Et</text><text x="30" y="202" font-size="16">Process model: no unique microscopic electron-arrow sequence asserted.</text><text x="24" y="235" font-size="16">Syn migratory insertion makes C–C and a new Pd–C bond. It is not free phenyl-anion attack.</text></g></g><g transform="translate(0,1220)"><title>Mizoroki–Heck coupling: Beta-hydride elimination</title><desc>PhCH2–CH(PdBrLn)CO2Et → (E)-PhCH=CHCO2Et bound to LnPd(H)(Br). Syn-coplanar Pd–C–C–H alignment allows beta-hydride elimination; conformational selection contributes to E preference.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="heck-4-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="heck-4-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Mizoroki–Heck coupling · 4</text><text x="24" y="65" font-size="17">Beta-hydride elimination</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">PhCH2–CH(PdBrLn)CO2Et</text><text x="665.00" y="155" font-size="22.23">(E)-PhCH=CHCO2Et bound to LnPd(H)(Br)</text><text x="30" y="202" font-size="16">Process model: no unique microscopic electron-arrow sequence asserted.</text><text x="24" y="235" font-size="16">Syn-coplanar Pd–C–C–H alignment allows beta-hydride elimination; conformational selection contributes to E</text><text x="24" y="258" font-size="16">preference.</text></g></g><g transform="translate(0,1510)"><title>Mizoroki–Heck coupling: Mechanistic boundary / grouped stage</title><desc>Alkene–LnPd(H)(Br) complex → PhCH=CHCO2Et + LnPd(H)(Br). Product dissociation releases the alkene.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="heck-5-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="heck-5-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Mizoroki–Heck coupling · 5</text><text x="24" y="65" font-size="17">Mechanistic boundary / grouped stage</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">Alkene–LnPd(H)(Br) complex</text><text x="665.00" y="155" font-size="24.00">PhCH=CHCO2Et + LnPd(H)(Br)</text><text x="30" y="202" font-size="16">Process model: no unique microscopic electron-arrow sequence asserted.</text><text x="24" y="235" font-size="16">Product dissociation releases the alkene.</text></g></g><g transform="translate(0,1800)"><title>Mizoroki–Heck coupling: Mechanistic boundary / grouped stage</title><desc>LnPd(H)(Br) + base → LnPd(0) + base·HBr. HX elimination/base capture regenerates Pd(0); ionic/neutral catalyst pathways can differ.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="heck-6-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="heck-6-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Mizoroki–Heck coupling · 6</text><text x="24" y="65" font-size="17">Mechanistic boundary / grouped stage</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">LnPd(H)(Br) + base</text><text x="665.00" y="155" font-size="24.00">LnPd(0) + base·HBr</text><text x="30" y="202" font-size="16">Process model: no unique microscopic electron-arrow sequence asserted.</text><text x="24" y="235" font-size="16">HX elimination/base capture regenerates Pd(0); ionic/neutral catalyst pathways can differ.</text></g></g></svg>