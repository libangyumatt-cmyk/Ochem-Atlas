<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1510"><title>Triplet-sensitized enone [2+2] cycloaddition: complete teaching sequence</title><g font-family="DejaVu Sans,sans-serif"><rect width="1200" height="350" fill="#fffefa"/><text x="25" y="32" font-size="21" fill="#203c43">Triplet-sensitized enone [2+2] cycloaddition · representative molecular graphs</text><path d="M350.01,234.83 L296.41,240.10" stroke="#203c43" stroke-width="2" fill="none"/><path d="M349.43,228.86 L295.82,234.12" stroke="#203c43" stroke-width="2" fill="none"/><path d="M296.12,237.11 L263.77,280.50" stroke="#203c43" stroke-width="2" fill="none"/><path d="M263.37,283.47 L210.43,276.38" stroke="#203c43" stroke-width="2" fill="none"/><path d="M264.17,277.53 L211.23,270.43" stroke="#203c43" stroke-width="2" fill="none"/><path d="M210.83,273.41 L200.28,221.61" stroke="#203c43" stroke-width="2" fill="none"/><path d="M200.28,221.61 L251.22,205.87" stroke="#203c43" stroke-width="2" fill="none"/><path d="M296.12,237.11 L251.22,205.87" stroke="#203c43" stroke-width="2" fill="none"/><path d="M294.48,77.67 L342.71,94.67" stroke="#203c43" stroke-width="2" fill="none"/><path d="M292.49,83.33 L340.72,100.33" stroke="#203c43" stroke-width="2" fill="none"/><rect x="344.72" y="221.85" width="10" height="20" fill="#fffefa"/><text x="349.72" y="236.85" font-size="16" text-anchor="middle" fill="#203c43">O</text><rect x="291.12" y="227.11" width="10" height="20" fill="#fffefa"/><text x="296.12" y="242.11" font-size="16" text-anchor="middle" fill="#203c43">C</text><rect x="253.77" y="270.50" width="20" height="20" fill="#fffefa"/><text x="263.77" y="285.50" font-size="16" text-anchor="middle" fill="#203c43">CH</text><rect x="200.83" y="263.41" width="20" height="20" fill="#fffefa"/><text x="210.83" y="278.41" font-size="16" text-anchor="middle" fill="#203c43">CH</text><rect x="185.28" y="211.61" width="30" height="20" fill="#fffefa"/><text x="200.28" y="226.61" font-size="16" text-anchor="middle" fill="#203c43">CH2</text><rect x="236.22" y="195.87" width="30" height="20" fill="#fffefa"/><text x="251.22" y="210.87" font-size="16" text-anchor="middle" fill="#203c43">CH2</text><rect x="278.49" y="70.50" width="30" height="20" fill="#fffefa"/><text x="293.49" y="85.50" font-size="16" text-anchor="middle" fill="#203c43">CH2</text><rect x="326.71" y="87.50" width="30" height="20" fill="#fffefa"/><text x="341.71" y="102.50" font-size="16" text-anchor="middle" fill="#203c43">CH2</text><path d="M1027.57,219.35 L948.99,224.07" stroke="#203c43" stroke-width="2" fill="none"/><path d="M1027.21,213.36 L948.63,218.08" stroke="#203c43" stroke-width="2" fill="none"/><path d="M948.81,221.07 L895.17,280.50" stroke="#203c43" stroke-width="2" fill="none"/><path d="M895.17,280.50 L821.24,254.97" stroke="#203c43" stroke-width="2" fill="none"/><path d="M821.24,254.97 L820.83,175.24" stroke="#203c43" stroke-width="2" fill="none"/><path d="M820.83,175.24 L802.61,98.78" stroke="#203c43" stroke-width="2" fill="none"/><path d="M802.61,98.78 L876.72,80.50" stroke="#203c43" stroke-width="2" fill="none"/><path d="M876.72,80.50 L898.35,156.53" stroke="#203c43" stroke-width="2" fill="none"/><path d="M948.81,221.07 L898.35,156.53" stroke="#203c43" stroke-width="2" fill="none"/><path d="M820.83,175.24 L898.35,156.53" stroke="#203c43" stroke-width="2" fill="none"/><rect x="1022.39" y="206.35" width="10" height="20" fill="#fffefa"/><text x="1027.39" y="221.35" font-size="16" text-anchor="middle" fill="#203c43">O</text><rect x="943.81" y="211.07" width="10" height="20" fill="#fffefa"/><text x="948.81" y="226.07" font-size="16" text-anchor="middle" fill="#203c43">C</text><rect x="880.17" y="270.50" width="30" height="20" fill="#fffefa"/><text x="895.17" y="285.50" font-size="16" text-anchor="middle" fill="#203c43">CH2</text><rect x="806.24" y="244.97" width="30" height="20" fill="#fffefa"/><text x="821.24" y="259.97" font-size="16" text-anchor="middle" fill="#203c43">CH2</text><rect x="810.83" y="165.24" width="20" height="20" fill="#fffefa"/><text x="820.83" y="180.24" font-size="16" text-anchor="middle" fill="#203c43">CH</text><rect x="787.61" y="88.78" width="30" height="20" fill="#fffefa"/><text x="802.61" y="103.78" font-size="16" text-anchor="middle" fill="#203c43">CH2</text><rect x="861.72" y="70.50" width="30" height="20" fill="#fffefa"/><text x="876.72" y="85.50" font-size="16" text-anchor="middle" fill="#203c43">CH2</text><rect x="888.35" y="146.53" width="20" height="20" fill="#fffefa"/><text x="898.35" y="161.53" font-size="16" text-anchor="middle" fill="#203c43">CH</text><text x="580" y="180" font-size="32" fill="#203c43">→</text><text x="25" y="330" font-size="15" fill="#203c43">Representative substrate/product connectivity; other reagents/byproducts are in the equation. No computed geometry.</text></g><g transform="translate(0,350)"><title>Triplet-sensitized enone [2+2] cycloaddition: Mechanistic boundary / grouped stage</title><desc>Cyclopentenone + sensitizer* → Triplet cyclopentenone + sensitizer. Energy transfer populates an enone triplet; excitation and intersystem behavior are not assigned a fabricated thermal1333 code.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="photochemical-cycloaddition-1-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="photochemical-cycloaddition-1-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Triplet-sensitized enone [2+2] cycloaddition · 1</text><text x="24" y="65" font-size="17">Mechanistic boundary / grouped stage</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">Cyclopentenone + sensitizer*</text><text x="665.00" y="155" font-size="23.50">Triplet cyclopentenone + sensitizer</text><text x="30" y="202" font-size="16">Process model: no unique microscopic electron-arrow sequence asserted.</text><text x="24" y="235" font-size="16">Energy transfer populates an enone triplet; excitation and intersystem behavior are not assigned a</text><text x="24" y="258" font-size="16">fabricated thermal1333 code.</text></g></g><g transform="translate(0,640)"><title>Triplet-sensitized enone [2+2] cycloaddition: Radical bond formation</title><desc>Enone alpha-C•–beta-C• + CH2=CH2 → Ring O=C–CH•–CH(CH2CH2•)–CH2–CH2–(back). One enone radical center adds to ethene, giving a triplet1,4-diradical; another radical remains at enone alpha carbon.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="photochemical-cycloaddition-2-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="photochemical-cycloaddition-2-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Triplet-sensitized enone [2+2] cycloaddition · 2</text><text x="24" y="65" font-size="17">Radical bond formation</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">Enone alpha-C•–</text><text x="247.20" y="155" font-size="24.00">beta-C•</text><text x="351.36" y="155" font-size="24.00"> + </text><text x="396.00" y="155" font-size="24.00">CH2</text><text x="440.64" y="155" font-size="24.00">=</text><text x="455.52" y="155" font-size="24.00">CH2</text><text x="665.00" y="155" font-size="21.09">Ring O=C–CH•–CH(CH2CH2•)–CH2–CH2–(back)</text><path data-electrons="1" d="M299.28,141.60 Q329.04,98.60 358.80,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#photochemical-cycloaddition-2-fish)"/><path data-electrons="1" d="M448.08,141.60 Q403.44,203.60 358.80,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#photochemical-cycloaddition-2-fish)"/><path data-electrons="1" d="M448.08,141.60 Q462.96,80.60 477.84,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#photochemical-cycloaddition-2-fish)"/><text x="24" y="235" font-size="16">One enone radical center adds to ethene, giving a triplet1,4-diradical; another radical remains at enone</text><text x="24" y="258" font-size="16">alpha carbon.</text></g></g><g transform="translate(0,930)"><title>Triplet-sensitized enone [2+2] cycloaddition: Mechanistic boundary / grouped stage</title><desc>Triplet1,4-diradical → Singlet1,4-diradical. Spin conversion allows subsequent paired ring closure. Crossing kinetics and surface topology are not computed.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="photochemical-cycloaddition-3-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="photochemical-cycloaddition-3-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Triplet-sensitized enone [2+2] cycloaddition · 3</text><text x="24" y="65" font-size="17">Mechanistic boundary / grouped stage</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">Triplet1,4-diradical</text><text x="665.00" y="155" font-size="24.00">Singlet1,4-diradical</text><text x="30" y="202" font-size="16">Process model: no unique microscopic electron-arrow sequence asserted.</text><text x="24" y="235" font-size="16">Spin conversion allows subsequent paired ring closure. Crossing kinetics and surface topology are not</text><text x="24" y="258" font-size="16">computed.</text></g></g><g transform="translate(0,1220)"><title>Triplet-sensitized enone [2+2] cycloaddition: Spin-compatible diradical closure</title><desc>Ring alpha-C• ... tether ... •CH2 → Cyclopentanone fused across alpha/beta to a cyclobutane ring. Two spin-compatible radical electrons form the second C–C bond, closing the four-membered ring.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="photochemical-cycloaddition-4-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="photochemical-cycloaddition-4-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Triplet-sensitized enone [2+2] cycloaddition · 4</text><text x="24" y="65" font-size="17">Spin-compatible diradical closure</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">Ring alpha-</text><text x="187.68" y="155" font-size="24.00">C•</text><text x="217.44" y="155" font-size="24.00"> ... tether ... </text><text x="455.52" y="155" font-size="24.00">•CH2</text><text x="665.00" y="155" font-size="13.71">Cyclopentanone fused across alpha/beta to a cyclobutane ring</text><path data-electrons="1" d="M202.56,141.60 Q273.24,98.60 343.92,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#photochemical-cycloaddition-4-fish)"/><path data-electrons="1" d="M485.28,141.60 Q414.60,203.60 343.92,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#photochemical-cycloaddition-4-fish)"/><text x="24" y="235" font-size="16">Two spin-compatible radical electrons form the second C–C bond, closing the four-membered ring.</text></g></g></svg>