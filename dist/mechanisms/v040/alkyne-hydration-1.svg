<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" role="img"><title>Mercury-catalyzed alkyne hydration: Mechanistic boundary / grouped stage</title><desc>CH3C≡CH + Hg2+ → Pi-coordinated alkyne–Hg2+ model. Mercury activates the alkyne; free high-energy vinyl cation formation is not asserted.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="alkyne-hydration-1-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="alkyne-hydration-1-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Mercury-catalyzed alkyne hydration · 1</text><text x="24" y="65" font-size="17">Mechanistic boundary / grouped stage</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">CH3C≡CH + Hg2+</text><text x="665.00" y="155" font-size="24.00">Pi-coordinated alkyne–Hg2+ model</text><text x="30" y="202" font-size="16">Process model: no unique microscopic electron-arrow sequence asserted.</text><text x="24" y="235" font-size="16">Mercury activates the alkyne; free high-energy vinyl cation formation is not asserted.</text></g></svg>