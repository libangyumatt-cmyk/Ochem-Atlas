<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" role="img"><title>Alcohol tosylation: Proton transfer</title><desc>Et–O+(Ts)–H + :pyridine → Et–OTs + pyridinium+. Pyridine removes the O-bound proton; the O–H pair returns to oxygen.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="tosylation-2-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="tosylation-2-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Alcohol tosylation · 2</text><text x="24" y="65" font-size="17">Proton transfer</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">Et–</text><text x="68.64" y="155" font-size="24.00">O+</text><text x="98.40" y="155" font-size="24.00">(Ts)–</text><text x="172.80" y="155" font-size="24.00">H</text><text x="187.68" y="155" font-size="24.00"> + </text><text x="232.32" y="155" font-size="24.00">:pyridine</text><text x="665.00" y="155" font-size="24.00">Et–OTs + pyridinium+</text><path data-electrons="2" d="M299.28,141.60 Q239.76,98.60 180.24,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#tosylation-2-pair)"/><path data-electrons="2" d="M131.88,141.60 Q107.70,203.60 83.52,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#tosylation-2-pair)"/><text x="24" y="235" font-size="16">Pyridine removes the O-bound proton; the O–H pair returns to oxygen.</text></g></svg>