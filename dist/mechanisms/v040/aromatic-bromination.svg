><rect x="182.65" y="170.50" width="20" height="20" fill="#fffefa"/><text x="192.65" y="185.50" font-size="16" text-anchor="middle" fill="#203c43">CH</text><rect x="223.82" y="99.18" width="20" height="20" fill="#fffefa"/><text x="233.82" y="114.18" font-size="16" text-anchor="middle" fill="#203c43">CH</text><rect x="306.18" y="99.18" width="20" height="20" fill="#fffefa"/><text x="316.18" y="114.18" font-size="16" text-anchor="middle" fill="#203c43">CH</text><path d="M1036.66,228.24 L954.78,219.08" stroke="#203c43" stroke-width="2" fill="none"/><path d="M956.27,221.68 L882.71,264.00" stroke="#203c43" stroke-width="2" fill="none"/><path d="M953.28,216.48 L879.72,258.80" stroke="#203c43" stroke-width="2" fill="none" stroke-dasharray="4 3"/><path d="M880.09,264.19 L803.00,233.12" stroke="#203c43" stroke-width="2" fill="none"/><path d="M882.34,258.62 L805.24,227.55" stroke="#203c43" stroke-width="2" fill="none" stroke-dasharray="4 3"/><path d="M801.15,230.73 L790.37,148.90" stroke="#203c43" stroke-width="2" fill="none"/><path d="M807.10,229.94 L796.32,148.12" stroke="#203c43" stroke-width="2" fill="none" stroke-dasharray="4 3"/><path d="M791.56,146.10 L857.73,97.18" stroke="#203c43" stroke-width="2" fill="none"/><path d="M795.13,150.92 L861.30,102.01" stroke="#203c43" stroke-width="2" fill="none" stroke-dasharray="4 3"/><path d="M860.91,96.94 L934.06,135.31" stroke="#203c43" stroke-width="2" fill="none"/><path d="M858.12,102.25 L931.27,140.62" stroke="#203c43" stroke-width="2" fill="none" stroke-dasharray="4 3"/><path d="M951.88,219.87 L929.77,138.76" stroke="#203c43" stroke-width="2" fill="none"/><path d="M957.67,218.29 L935.56,137.18" stroke="#203c43" stroke-width="2" fill="none" stroke-dasharray="4 3"/><rect x="1026.66" y="218.24" width="20" height="20" fill="#fffefa"/><text x="1036.66" y="233.24" font-size="16" text-anchor="middle" fill="#203c43">Br</text><rect x="949.78" y="209.08" width="10" height="20" fill="#fffefa"/><text x="954.78" y="224.08" font-size="16" text-anchor="middle" fill="#203c43">C</text><rect x="871.22" y="251.40" width="20" height="20" fill="#fffefa"/><text x="881.22" y="266.40" font-size="16" text-anchor="middle" fill="#203c43">CH</text><rect x="794.12" y="220.34" width="20" height="20" fill="#fffefa"/><text x="804.12" y="235.34" font-size="16" text-anchor="middle" fill="#203c43">CH</text><rect x="783.34" y="138.51" width="20" height="20" fill="#fffefa"/><text x="793.34" y="153.51" font-size="16" text-anchor="middle" fill="#203c43">CH</text><rect x="849.51" y="89.60" width="20" height="20" fill="#fffefa"/><text x="859.51" y="104.60" font-size="16" text-anchor="middle" fill="#203c43">CH</text><rect x="922.66" y="127.97" width="20" height="20" fill="#fffefa"/><text x="932.66" y="142.97" font-size="16" text-anchor="middle" fill="#203c43">CH</text><text x="580" y="180" font-size="32" fill="#203c43">→</text><text x="25" y="330" font-size="15" fill="#203c43">Representative substrate/product connectivity; other reagents/byproducts are in the equation. No computed geometry.</text></g><g transform="translate(0,350)"><title>Electrophilic aromatic bromination: Lone-pair capture</title><desc>Br–Br: + FeBr3 → Br2·FeBr3. Bromine coordinates to the Lewis acid, polarizing Br–Br. A freely solvated Br+ is not required.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="aromatic-bromination-1-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="aromatic-bromination-1-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Electrophilic aromatic bromination · 1</text><text x="24" y="65" font-size="17">Lone-pair capture</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">Br</text><text x="53.76" y="155" font-size="24.00">–</text><text x="68.64" y="155" font-size="24.00">Br:</text><text x="113.28" y="155" font-size="24.00"> + </text><text x="157.92" y="155" font-size="24.00">FeBr3</text><text x="665.00" y="155" font-size="24.00">Br2·FeBr3</text><path data-electrons="2" d="M90.96,141.60 Q143.04,98.60 195.12,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#aromatic-bromination-1-pair)"/><text x="24" y="235" font-size="16">Bromine coordinates to the Lewis acid, polarizing Br–Br. A freely solvated Br+ is not required.</text></g></g><g transform="translate(0,640)"><title>Electrophilic aromatic bromination: Coupled polar bond reorganization</title><desc>ring CH=CH–CH=CH–CH=CH–(back) + Br–Br·FeBr3 → ring CH(Br)–CH+–CH=CH–CH=CH–(back) + FeBr4−. A ring pi pair bonds to electrophilic Br; Br–Br cleavage forms the arenium-ion model.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="aromatic-bromination-2-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="aromatic-bromination-2-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Electrophilic aromatic bromination · 2</text><text x="24" y="65" font-size="17">Coupled polar bond reorganization</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="19.50">ring </text><text x="84.47" y="155" font-size="19.50">CH</text><text x="108.65" y="155" font-size="19.50">=</text><text x="120.74" y="155" font-size="19.50">CH</text><text x="144.93" y="155" font-size="19.50">–CH=CH–CH=CH–(back) + </text><text x="410.98" y="155" font-size="19.50">Br</text><text x="435.16" y="155" font-size="19.50">–</text><text x="447.26" y="155" font-size="19.50">Br</text><text x="471.44" y="155" font-size="19.50">·FeBr3</text><text x="665.00" y="155" font-size="19.13">ring CH(Br)–CH+–CH=CH–CH=CH–(back) + FeBr4−</text><path data-electrons="2" d="M114.70,143.17 Q268.88,100.17 423.07,139.17" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#aromatic-bromination-2-pair)"/><path data-electrons="2" d="M441.21,143.17 Q450.28,205.17 459.35,139.17" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#aromatic-bromination-2-pair)"/><text x="24" y="235" font-size="16">A ring pi pair bonds to electrophilic Br; Br–Br cleavage forms the arenium-ion model.</text></g></g><g transform="translate(0,930)"><title>Electrophilic aromatic bromination: Coupled polar bond reorganization</title><desc>ring C(H)(Br)–CH+–CH=CH–CH=CH–(back) + FeBr4− → C6H5Br + HBr + FeBr3. Counterion removes the substituted-carbon proton; the C–H pair restores aromatic pi bonding and regenerates FeBr3.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="aromatic-bromination-3-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="aromatic-bromination-3-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Electrophilic aromatic bromination · 3</text><text x="24" y="65" font-size="17">Coupled polar bond reorganization</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="18.64">ring </text><text x="81.78" y="155" font-size="18.64">C</text><text x="93.33" y="155" font-size="18.64">(</text><text x="104.89" y="155" font-size="18.64">H</text><text x="116.44" y="155" font-size="18.64">)(Br)–</text><text x="185.78" y="155" font-size="18.64">CH+</text><text x="220.44" y="155" font-size="18.64">–CH=CH–CH=CH–(back) + </text><text x="474.67" y="155" font-size="18.64">FeBr4−</text><text x="665.00" y="155" font-size="24.00">C6H5Br + HBr + FeBr3</text><path data-electrons="2" d="M509.33,143.48 Q310.00,100.48 110.67,139.48" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#aromatic-bromination-3-pair)"/><path data-electrons="2" d="M99.11,143.48 Q122.22,205.48 145.33,139.48" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#aromatic-bromination-3-pair)"/><text x="24" y="235" font-size="16">Counterion removes the substituted-carbon proton; the C–H pair restores aromatic pi bonding and regenerates</text><text x="24" y="258" font-size="16">FeBr3.</text></g></g></svg>