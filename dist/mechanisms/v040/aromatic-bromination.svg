<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 870"><title>Electrophilic aromatic bromination: complete teaching sequence</title><g transform="translate(0,0)"><title>Electrophilic aromatic bromination: Lone-pair capture</title><desc>Br–Br: + FeBr3 → Br2·FeBr3. Bromine coordinates to the Lewis acid, polarizing Br–Br. A freely solvated Br+ is not required.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="aromatic-bromination-1-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="aromatic-bromination-1-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Electrophilic aromatic bromination · 1</text><text x="24" y="65" font-size="17">Lone-pair capture</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">Br</text><text x="53.76" y="155" font-size="24.00">–</text><text x="68.64" y="155" font-size="24.00">Br:</text><text x="113.28" y="155" font-size="24.00"> + </text><text x="157.92" y="155" font-size="24.00">FeBr3</text><text x="665.00" y="155" font-size="24.00">Br2·FeBr3</text><path data-electrons="2" d="M90.96,141.60 Q143.04,98.60 195.12,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#aromatic-bromination-1-pair)"/><text x="24" y="235" font-size="16">Bromine coordinates to the Lewis acid, polarizing Br–Br. A freely solvated Br+ is not required.</text></g></g><g transform="translate(0,290)"><title>Electrophilic aromatic bromination: Coupled polar bond reorganization</title><desc>ring CH=CH–CH=CH–CH=CH–(back) + Br–Br·FeBr3 → ring CH(Br)–CH+–CH=CH–CH=CH–(back) + FeBr4−. A ring pi pair bonds to electrophilic Br; Br–Br cleavage forms the arenium-ion model.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="aromatic-bromination-2-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="aromatic-bromination-2-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Electrophilic aromatic bromination · 2</text><text x="24" y="65" font-size="17">Coupled polar bond reorganization</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="19.50">ring </text><text x="84.47" y="155" font-size="19.50">CH</text><text x="108.65" y="155" font-size="19.50">=</text><text x="120.74" y="155" font-size="19.50">CH</text><text x="144.93" y="155" font-size="19.50">–CH=CH–CH=CH–(back) + </text><text x="410.98" y="155" font-size="19.50">Br</text><text x="435.16" y="155" font-size="19.50">–</text><text x="447.26" y="155" font-size="19.50">Br</text><text x="471.44" y="155" font-size="19.50">·FeBr3</text><text x="665.00" y="155" font-size="19.13">ring CH(Br)–CH+–CH=CH–CH=CH–(back) + FeBr4−</text><path data-electrons="2" d="M114.70,143.17 Q268.88,100.17 423.07,139.17" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#aromatic-bromination-2-pair)"/><path data-electrons="2" d="M441.21,143.17 Q450.28,205.17 459.35,139.17" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#aromatic-bromination-2-pair)"/><text x="24" y="235" font-size="16">A ring pi pair bonds to electrophilic Br; Br–Br cleavage forms the arenium-ion model.</text></g></g><g transform="translate(0,580)"><title>Electrophilic aromatic bromination: Coupled polar bond reorganization</title><desc>ring C(H)(Br)–CH+–CH=CH–CH=CH–(back) + FeBr4− → C6H5Br + HBr + FeBr3. Counterion removes the substituted-carbon proton; the C–H pair restores aromatic pi bonding and regenerates FeBr3.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="aromatic-bromination-3-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="aromatic-bromination-3-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Electrophilic aromatic bromination · 3</text><text x="24" y="65" font-size="17">Coupled polar bond reorganization</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="18.64">ring </text><text x="81.78" y="155" font-size="18.64">C</text><text x="93.33" y="155" font-size="18.64">(</text><text x="104.89" y="155" font-size="18.64">H</text><text x="116.44" y="155" font-size="18.64">)(Br)–</text><text x="185.78" y="155" font-size="18.64">CH+</text><text x="220.44" y="155" font-size="18.64">–CH=CH–CH=CH–(back) + </text><text x="474.67" y="155" font-size="18.64">FeBr4−</text><text x="665.00" y="155" font-size="24.00">C6H5Br + HBr + FeBr3</text><path data-electrons="2" d="M509.33,143.48 Q310.00,100.48 110.67,139.48" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#aromatic-bromination-3-pair)"/><path data-electrons="2" d="M99.11,143.48 Q122.22,205.48 145.33,139.48" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#aromatic-bromination-3-pair)"/><text x="24" y="235" font-size="16">Counterion removes the substituted-carbon proton; the C–H pair restores aromatic pi bonding and regenerates FeBr3.</text></g></g></svg>