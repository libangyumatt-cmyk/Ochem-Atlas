<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" role="img"><title>Alcohol tosylation: Bond-replacing displacement</title><desc>Et–O:H + p-MeC6H4–S(=O)2–Cl → Et–O+(H)–SO2–C6H4Me-p + Cl−. Alcohol oxygen attacks sulfur and chloride departs. Shown as a bond-replacing stage, without asserting a stable sulfurane.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="tosylation-1-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="tosylation-1-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Alcohol tosylation · 1</text><text x="24" y="65" font-size="17">Bond-replacing displacement</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">Et–</text><text x="68.64" y="155" font-size="24.00">O:H</text><text x="113.28" y="155" font-size="24.00"> + p-MeC6H4–</text><text x="291.84" y="155" font-size="24.00">S</text><text x="306.72" y="155" font-size="24.00">(=O)2–</text><text x="396.00" y="155" font-size="24.00">Cl</text><text x="665.00" y="155" font-size="24.00">Et–O+(H)–SO2–C6H4Me-p + Cl−</text><path data-electrons="2" d="M90.96,141.60 Q195.12,98.60 299.28,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#tosylation-1-pair)"/><path data-electrons="2" d="M355.08,141.60 Q382.98,203.60 410.88,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#tosylation-1-pair)"/><text x="24" y="235" font-size="16">Alcohol oxygen attacks sulfur and chloride departs. Shown as a bond-replacing stage, without asserting a stable sulfurane.</text></g></svg>