<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" role="img"><title>Benzyne elimination–addition substitution: Proton transfer</title><desc>H2N–C6H4–C:− + H–NH2 → C6H5NH2 + NH2−. The aryl carbanion takes a proton from ammonia, furnishing aniline.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="benzyne-substitution-4-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="benzyne-substitution-4-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Benzyne elimination–addition substitution · 4</text><text x="24" y="65" font-size="17">Proton transfer</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">H2N–C6H4–</text><text x="157.92" y="155" font-size="24.00">C:−</text><text x="202.56" y="155" font-size="24.00"> + </text><text x="247.20" y="155" font-size="24.00">H</text><text x="262.08" y="155" font-size="24.00">–</text><text x="276.96" y="155" font-size="24.00">NH2</text><text x="665.00" y="155" font-size="24.00">C6H5NH2 + NH2−</text><path data-electrons="2" d="M180.24,141.60 Q217.44,98.60 254.64,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#benzyne-substitution-4-pair)"/><path data-electrons="2" d="M276.96,141.60 Q288.12,203.60 299.28,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#benzyne-substitution-4-pair)"/><text x="24" y="235" font-size="16">The aryl carbanion takes a proton from ammonia, furnishing aniline.</text></g></svg>