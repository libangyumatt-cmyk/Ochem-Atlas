<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" role="img"><title>Benzyne elimination–addition substitution: Proton transfer</title><desc>ring C(NH2)=CH–CH=CH–CH=C:−–(back) + H–NH2 → C6H5NH2 + NH2−. The aryl carbanion takes a proton from ammonia, furnishing aniline.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="benzyne-substitution-4-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="benzyne-substitution-4-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Benzyne elimination–addition substitution · 4</text><text x="24" y="65" font-size="17">Proton transfer</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="19.97">ring C(NH2)=CH–CH=CH–CH=</text><text x="321.14" y="155" font-size="19.97">C:−</text><text x="358.29" y="155" font-size="19.97">–(back) + </text><text x="482.10" y="155" font-size="19.97">H</text><text x="494.48" y="155" font-size="19.97">–</text><text x="506.86" y="155" font-size="19.97">NH2</text><text x="665.00" y="155" font-size="24.00">C6H5NH2 + NH2−</text><path data-electrons="2" d="M339.71,143.01 Q414.00,100.01 488.29,139.01" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#benzyne-substitution-4-pair)"/><path data-electrons="2" d="M506.86,143.01 Q516.14,205.01 525.43,139.01" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#benzyne-substitution-4-pair)"/><text x="24" y="235" font-size="16">The aryl carbanion takes a proton from ammonia, furnishing aniline.</text></g></svg>