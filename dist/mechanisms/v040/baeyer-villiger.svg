1.18" stroke="#203c43" stroke-width="2" fill="none" stroke-dasharray="4 3"/><path d="M831.34,109.27 L866.60,78.25" stroke="#203c43" stroke-width="2" fill="none"/><path d="M835.31,113.78 L870.56,82.75" stroke="#203c43" stroke-width="2" fill="none" stroke-dasharray="4 3"/><path d="M869.42,77.62 L913.94,90.57" stroke="#203c43" stroke-width="2" fill="none"/><path d="M867.74,83.38 L912.26,96.33" stroke="#203c43" stroke-width="2" fill="none" stroke-dasharray="4 3"/><path d="M916.09,93.60 L913.82,140.20" stroke="#203c43" stroke-width="2" fill="none"/><path d="M910.10,93.31 L907.82,139.91" stroke="#203c43" stroke-width="2" fill="none" stroke-dasharray="4 3"/><path d="M880.06,177.06 L908.40,138.29" stroke="#203c43" stroke-width="2" fill="none"/><path d="M884.90,180.60 L913.24,141.83" stroke="#203c43" stroke-width="2" fill="none" stroke-dasharray="4 3"/><rect x="981.67" y="199.39" width="30" height="20" fill="#fffefa"/><text x="996.67" y="214.39" font-size="16" text-anchor="middle" fill="#203c43">CH3</text><rect x="951.94" y="224.35" width="10" height="20" fill="#fffefa"/><text x="956.94" y="239.35" font-size="16" text-anchor="middle" fill="#203c43">C</text><rect x="952.07" y="270.50" width="10" height="20" fill="#fffefa"/><text x="957.07" y="285.50" font-size="16" text-anchor="middle" fill="#203c43">O</text><rect x="906.94" y="207.32" width="10" height="20" fill="#fffefa"/><text x="911.94" y="222.32" font-size="16" text-anchor="middle" fill="#203c43">O</text><rect x="877.48" y="168.83" width="10" height="20" fill="#fffefa"/><text x="882.48" y="183.83" font-size="16" text-anchor="middle" fill="#203c43">C</text><rect x="828.73" y="148.34" width="20" height="20" fill="#fffefa"/><text x="838.73" y="163.34" font-size="16" text-anchor="middle" fill="#203c43">CH</text><rect x="823.33" y="101.53" width="20" height="20" fill="#fffefa"/><text x="833.33" y="116.53" font-size="16" text-anchor="middle" fill="#203c43">CH</text><rect x="858.58" y="70.50" width="20" height="20" fill="#fffefa"/><text x="868.58" y="85.50" font-size="16" text-anchor="middle" fill="#203c43">CH</text><rect x="903.10" y="83.45" width="20" height="20" fill="#fffefa"/><text x="913.10" y="98.45" font-size="16" text-anchor="middle" fill="#203c43">CH</text><rect x="900.82" y="130.06" width="20" height="20" fill="#fffefa"/><text x="910.82" y="145.06" font-size="16" text-anchor="middle" fill="#203c43">CH</text><text x="580" y="180" font-size="32" fill="#203c43">→</text><text x="25" y="330" font-size="15" fill="#203c43">Representative substrate/product connectivity; other reagents/byproducts are in the equation. No computed geometry.</text></g><g transform="translate(0,350)"><title>Baeyer–Villiger oxidation: Proton transfer</title><desc>PhC(=O:)Me + H–acid → PhC(=OH+)Me + base−. Carbonyl protonation activates the ketone; acid strength and speciation depend on medium.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="baeyer-villiger-1-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="baeyer-villiger-1-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Baeyer–Villiger oxidation · 1</text><text x="24" y="65" font-size="17">Proton transfer</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">PhC(=</text><text x="98.40" y="155" font-size="24.00">O:</text><text x="128.16" y="155" font-size="24.00">)Me + </text><text x="217.44" y="155" font-size="24.00">H</text><text x="232.32" y="155" font-size="24.00">–</text><text x="247.20" y="155" font-size="24.00">acid</text><text x="665.00" y="155" font-size="24.00">PhC(=OH+)Me + base−</text><path data-electrons="2" d="M113.28,141.60 Q169.08,98.60 224.88,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#baeyer-villiger-1-pair)"/><path data-electrons="2" d="M250.92,141.60 Q263.94,203.60 276.96,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#baeyer-villiger-1-pair)"/><text x="24" y="235" font-size="16">Carbonyl protonation activates the ketone; acid strength and speciation depend on medium.</text></g></g><g transform="translate(0,640)"><title>Baeyer–Villiger oxidation: Nucleophilic carbonyl addition</title><desc>Ph–C(=OH+)Me + ArCO2–O:H → PhC(OH)(Me)–O+H–OCOAr. The terminal peracid oxygen adds to carbonyl carbon; Ar=3-chlorophenyl.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="baeyer-villiger-2-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="baeyer-villiger-2-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Baeyer–Villiger oxidation · 2</text><text x="24" y="65" font-size="17">Nucleophilic carbonyl addition</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">Ph–</text><text x="68.64" y="155" font-size="24.00">C</text><text x="83.52" y="155" font-size="24.00">(=</text><text x="113.28" y="155" font-size="24.00">OH+</text><text x="157.92" y="155" font-size="24.00">)Me + ArCO2–</text><text x="336.48" y="155" font-size="24.00">O:H</text><text x="665.00" y="155" font-size="24.00">PhC(OH)(Me)–O+H–OCOAr</text><path data-electrons="2" d="M358.80,141.60 Q217.44,98.60 76.08,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#baeyer-villiger-2-pair)"/><path data-electrons="2" d="M105.84,141.60 Q120.72,203.60 135.60,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#baeyer-villiger-2-pair)"/><text x="24" y="235" font-size="16">The terminal peracid oxygen adds to carbonyl carbon; Ar=3-chlorophenyl.</text></g></g><g transform="translate(0,930)"><title>Baeyer–Villiger oxidation: Proton transfer</title><desc>PhC(OH)(Me)–O+(OCOAr)–H + :base− → PhC(OH)(Me)–O–OCOAr + H–base. Deprotonate the peroxy oxygen to form the Criegee intermediate.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="baeyer-villiger-3-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="baeyer-villiger-3-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Baeyer–Villiger oxidation · 3</text><text x="24" y="65" font-size="17">Proton transfer</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">PhC(OH)(Me)–</text><text x="202.56" y="155" font-size="24.00">O+</text><text x="232.32" y="155" font-size="24.00">(OCOAr)–</text><text x="351.36" y="155" font-size="24.00">H</text><text x="366.24" y="155" font-size="24.00"> + </text><text x="410.88" y="155" font-size="24.00">:base−</text><text x="665.00" y="155" font-size="24.00">PhC(OH)(Me)–O–OCOAr + H–base</text><path data-electrons="2" d="M455.52,141.60 Q407.16,98.60 358.80,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#baeyer-villiger-3-pair)"/><path data-electrons="2" d="M288.12,141.60 Q252.78,203.60 217.44,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#baeyer-villiger-3-pair)"/><text x="24" y="235" font-size="16">Deprotonate the peroxy oxygen to form the Criegee intermediate.</text></g></g><g transform="translate(0,1220)"><title>Baeyer–Villiger oxidation: Coupled polar bond reorganization</title><desc>Ph–C(O:H)(Me)–O–OCOAr → MeC(=OH+)OPh + ArCO2−. C–Ph migrates to adjacent peroxide O; O–O cleaves and the original carbonyl O reforms C=O. Migration is not loss of a free phenyl anion.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="baeyer-villiger-4-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="baeyer-villiger-4-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Baeyer–Villiger oxidation · 4</text><text x="24" y="65" font-size="17">Coupled polar bond reorganization</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">Ph</text><text x="53.76" y="155" font-size="24.00">–</text><text x="68.64" y="155" font-size="24.00">C</text><text x="83.52" y="155" font-size="24.00">(</text><text x="98.40" y="155" font-size="24.00">O:H</text><text x="143.04" y="155" font-size="24.00">)(Me)–</text><text x="232.32" y="155" font-size="24.00">O</text><text x="247.20" y="155" font-size="24.00">–</text><text x="262.08" y="155" font-size="24.00">OCOAr</text><text x="665.00" y="155" font-size="24.00">MeC(=OH+)OPh + ArCO2−</text><path data-electrons="2" d="M57.48,141.60 Q148.62,98.60 239.76,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#baeyer-villiger-4-pair)"/><path data-electrons="2" d="M269.52,141.60 Q284.40,203.60 299.28,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#baeyer-villiger-4-pair)"/><path data-electrons="2" d="M120.72,141.60 Q109.56,80.60 98.40,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#baeyer-villiger-4-pair)"/><text x="24" y="235" font-size="16">C–Ph migrates to adjacent peroxide O; O–O cleaves and the original carbonyl O reforms C=O. Migration is not</text><text x="24" y="258" font-size="16">loss of a free phenyl anion.</text></g></g><g transform="translate(0,1510)"><title>Baeyer–Villiger oxidation: Proton transfer</title><desc>MeC(=O+–H)OPh + :O2CAr− → MeCO2Ph + ArCO2H. Carboxylate removes the carbonyl O proton to release phenyl acetate.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="baeyer-villiger-5-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="baeyer-villiger-5-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Baeyer–Villiger oxidation · 5</text><text x="24" y="65" font-size="17">Proton transfer</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">MeC(=</text><text x="98.40" y="155" font-size="24.00">O+</text><text x="128.16" y="155" font-size="24.00">–</text><text x="143.04" y="155" font-size="24.00">H</text><text x="157.92" y="155" font-size="24.00">)OPh + </text><text x="262.08" y="155" font-size="24.00">:O2CAr−</text><text x="665.00" y="155" font-size="24.00">MeCO2Ph + ArCO2H</text><path data-electrons="2" d="M314.16,141.60 Q232.32,98.60 150.48,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#baeyer-villiger-5-pair)"/><path data-electrons="2" d="M131.88,141.60 Q122.58,203.60 113.28,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#baeyer-villiger-5-pair)"/><text x="24" y="235" font-size="16">Carboxylate removes the carbonyl O proton to release phenyl acetate.</text></g></g></svg>