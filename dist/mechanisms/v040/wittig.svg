<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 870"><title>Wittig olefination: complete teaching sequence</title><g transform="translate(0,0)"><title>Wittig olefination: Proton transfer</title><desc>Ph3P+–CH2–H + :base− → Ph3P+–CH2− + H–base. Deprotonation of a methylphosphonium salt generates the ylide; P=C and P+–C− are resonance descriptions.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="wittig-1-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="wittig-1-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Wittig olefination · 1</text><text x="24" y="65" font-size="17">Proton transfer</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">Ph3P+–</text><text x="113.28" y="155" font-size="24.00">CH2</text><text x="157.92" y="155" font-size="24.00">–</text><text x="172.80" y="155" font-size="24.00">H</text><text x="187.68" y="155" font-size="24.00"> + </text><text x="232.32" y="155" font-size="24.00">:base−</text><text x="665.00" y="155" font-size="24.00">Ph3P+–CH2− + H–base</text><path data-electrons="2" d="M276.96,141.60 Q228.60,98.60 180.24,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#wittig-1-pair)"/><path data-electrons="2" d="M157.92,141.60 Q146.76,203.60 135.60,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#wittig-1-pair)"/><text x="24" y="235" font-size="16">Deprotonation of a methylphosphonium salt generates the ylide; P=C and P+–C− are resonance descriptions.</text></g></g><g transform="translate(0,290)"><title>Wittig olefination: Oxaphosphetane formation</title><desc>Ph–CH=O + Ph3P+–CH2− → Oxaphosphetane: PhCH–O–PPh3–CH2 four-membered ring. Polar bond formation joins ylide C to carbonyl C and O to P. A salt-free unstabilized-ylide model can form oxaphosphetane without a stable betaine.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="wittig-2-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="wittig-2-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Wittig olefination · 2</text><text x="24" y="65" font-size="17">Oxaphosphetane formation</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">Ph–</text><text x="68.64" y="155" font-size="24.00">CH</text><text x="98.40" y="155" font-size="24.00">=</text><text x="113.28" y="155" font-size="24.00">O</text><text x="128.16" y="155" font-size="24.00"> + Ph3</text><text x="217.44" y="155" font-size="24.00">P+</text><text x="247.20" y="155" font-size="24.00">–</text><text x="262.08" y="155" font-size="24.00">CH2−</text><text x="665.00" y="155" font-size="16.45">Oxaphosphetane: PhCH–O–PPh3–CH2 four-membered ring</text><path data-electrons="2" d="M291.84,141.60 Q187.68,98.60 83.52,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#wittig-2-pair)"/><path data-electrons="2" d="M102.12,141.60 Q111.42,203.60 120.72,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#wittig-2-pair)"/><path data-electrons="2" d="M120.72,141.60 Q176.52,80.60 232.32,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#wittig-2-pair)"/><text x="24" y="235" font-size="16">Polar bond formation joins ylide C to carbonyl C and O to P. A salt-free unstabilized-ylide model can form oxaphosphetane without a</text><text x="24" y="258" font-size="16">stable betaine.</text></g></g><g transform="translate(0,580)"><title>Wittig olefination: Oxaphosphetane fragmentation</title><desc>Ring Ph–CH–O–P(Ph)3–CH2–(back to a) → PhCH=CH2 + Ph3P=O. Coupled C–O/C–P cleavage forms alkene and phosphine oxide. No freely rotating carbocation intermediate is inserted.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="wittig-3-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="wittig-3-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Wittig olefination · 3</text><text x="24" y="65" font-size="17">Oxaphosphetane fragmentation</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="23.96">Ring Ph–</text><text x="142.86" y="155" font-size="23.96">CH</text><text x="172.57" y="155" font-size="23.96">–</text><text x="187.43" y="155" font-size="23.96">O</text><text x="202.29" y="155" font-size="23.96">–</text><text x="217.14" y="155" font-size="23.96">P</text><text x="232.00" y="155" font-size="23.96">(Ph)3–</text><text x="321.14" y="155" font-size="23.96">CH2</text><text x="365.71" y="155" font-size="23.96">–(back to a)</text><text x="665.00" y="155" font-size="24.00">PhCH=CH2 + Ph3P=O</text><path data-electrons="2" d="M176.29,141.61 Q213.43,98.61 250.57,137.61" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#wittig-3-pair)"/><path data-electrons="2" d="M284.00,141.61 Q246.86,203.61 209.71,137.61" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#wittig-3-pair)"/><text x="24" y="235" font-size="16">Coupled C–O/C–P cleavage forms alkene and phosphine oxide. No freely rotating carbocation intermediate is inserted.</text></g></g></svg>