width="2" fill="none" stroke-dasharray="4 3"/><path d="M867.39,88.24 L915.16,155.52" stroke="#203c43" stroke-width="2" fill="none"/><path d="M862.50,91.72 L910.27,158.99" stroke="#203c43" stroke-width="2" fill="none" stroke-dasharray="4 3"/><path d="M904.88,241.41 L909.72,157.09" stroke="#203c43" stroke-width="2" fill="none"/><path d="M910.87,241.76 L915.71,157.43" stroke="#203c43" stroke-width="2" fill="none" stroke-dasharray="4 3"/><rect x="1049.59" y="236.43" width="30" height="20" fill="#fffefa"/><text x="1064.59" y="251.43" font-size="16" text-anchor="middle" fill="#203c43">CH2</text><rect x="977.30" y="261.02" width="20" height="20" fill="#fffefa"/><text x="987.30" y="276.02" font-size="16" text-anchor="middle" fill="#203c43">CH</text><rect x="902.88" y="231.58" width="10" height="20" fill="#fffefa"/><text x="907.88" y="246.58" font-size="16" text-anchor="middle" fill="#203c43">C</text><rect x="813.07" y="241.82" width="20" height="20" fill="#fffefa"/><text x="823.07" y="256.82" font-size="16" text-anchor="middle" fill="#203c43">CH</text><rect x="755.41" y="181.56" width="20" height="20" fill="#fffefa"/><text x="765.41" y="196.56" font-size="16" text-anchor="middle" fill="#203c43">CH</text><rect x="775.68" y="101.33" width="20" height="20" fill="#fffefa"/><text x="785.68" y="116.33" font-size="16" text-anchor="middle" fill="#203c43">CH</text><rect x="854.95" y="79.98" width="20" height="20" fill="#fffefa"/><text x="864.95" y="94.98" font-size="16" text-anchor="middle" fill="#203c43">CH</text><rect x="902.72" y="147.26" width="20" height="20" fill="#fffefa"/><text x="912.72" y="162.26" font-size="16" text-anchor="middle" fill="#203c43">CH</text><text x="580" y="180" font-size="32" fill="#203c43">→</text><text x="25" y="330" font-size="15" fill="#203c43">Representative substrate/product connectivity; other reagents/byproducts are in the equation. No computed geometry.</text></g><g transform="translate(0,350)"><title>Wittig olefination: Proton transfer</title><desc>Ph3P+–CH2–H + :base− → Ph3P+–CH2− + H–base. Deprotonation of a methylphosphonium salt generates the ylide; P=C and P+–C− are resonance descriptions.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="wittig-1-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="wittig-1-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Wittig olefination · 1</text><text x="24" y="65" font-size="17">Proton transfer</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">Ph3P+–</text><text x="113.28" y="155" font-size="24.00">CH2</text><text x="157.92" y="155" font-size="24.00">–</text><text x="172.80" y="155" font-size="24.00">H</text><text x="187.68" y="155" font-size="24.00"> + </text><text x="232.32" y="155" font-size="24.00">:base−</text><text x="665.00" y="155" font-size="24.00">Ph3P+–CH2− + H–base</text><path data-electrons="2" d="M276.96,141.60 Q228.60,98.60 180.24,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#wittig-1-pair)"/><path data-electrons="2" d="M157.92,141.60 Q146.76,203.60 135.60,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#wittig-1-pair)"/><text x="24" y="235" font-size="16">Deprotonation of a methylphosphonium salt generates the ylide; P=C and P+–C− are resonance descriptions.</text></g></g><g transform="translate(0,640)"><title>Wittig olefination: Oxaphosphetane formation</title><desc>Ph–CH=O + Ph3P+–CH2− → Oxaphosphetane: PhCH–O–PPh3–CH2 four-membered ring. Polar bond formation joins ylide C to carbonyl C and O to P. A salt-free unstabilized-ylide model can form oxaphosphetane without a stable betaine.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="wittig-2-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="wittig-2-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Wittig olefination · 2</text><text x="24" y="65" font-size="17">Oxaphosphetane formation</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">Ph–</text><text x="68.64" y="155" font-size="24.00">CH</text><text x="98.40" y="155" font-size="24.00">=</text><text x="113.28" y="155" font-size="24.00">O</text><text x="128.16" y="155" font-size="24.00"> + Ph3</text><text x="217.44" y="155" font-size="24.00">P+</text><text x="247.20" y="155" font-size="24.00">–</text><text x="262.08" y="155" font-size="24.00">CH2−</text><text x="665.00" y="155" font-size="16.45">Oxaphosphetane: PhCH–O–PPh3–CH2 four-membered ring</text><path data-electrons="2" d="M291.84,141.60 Q187.68,98.60 83.52,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#wittig-2-pair)"/><path data-electrons="2" d="M102.12,141.60 Q111.42,203.60 120.72,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#wittig-2-pair)"/><path data-electrons="2" d="M120.72,141.60 Q176.52,80.60 232.32,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#wittig-2-pair)"/><text x="24" y="235" font-size="16">Polar bond formation joins ylide C to carbonyl C and O to P. A salt-free unstabilized-ylide model can form</text><text x="24" y="258" font-size="16">oxaphosphetane without a stable betaine.</text></g></g><g transform="translate(0,930)"><title>Wittig olefination: Oxaphosphetane fragmentation</title><desc>Ring Ph–CH–O–P(Ph)3–CH2–(back to a) → PhCH=CH2 + Ph3P=O. Coupled C–O/C–P cleavage forms alkene and phosphine oxide. No freely rotating carbocation intermediate is inserted.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="wittig-3-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="wittig-3-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Wittig olefination · 3</text><text x="24" y="65" font-size="17">Oxaphosphetane fragmentation</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="23.96">Ring Ph–</text><text x="142.86" y="155" font-size="23.96">CH</text><text x="172.57" y="155" font-size="23.96">–</text><text x="187.43" y="155" font-size="23.96">O</text><text x="202.29" y="155" font-size="23.96">–</text><text x="217.14" y="155" font-size="23.96">P</text><text x="232.00" y="155" font-size="23.96">(Ph)3–</text><text x="321.14" y="155" font-size="23.96">CH2</text><text x="365.71" y="155" font-size="23.96">–(back to a)</text><text x="665.00" y="155" font-size="24.00">PhCH=CH2 + Ph3P=O</text><path data-electrons="2" d="M176.29,141.61 Q213.43,98.61 250.57,137.61" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#wittig-3-pair)"/><path data-electrons="2" d="M284.00,141.61 Q246.86,203.61 209.71,137.61" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#wittig-3-pair)"/><text x="24" y="235" font-size="16">Coupled C–O/C–P cleavage forms alkene and phosphine oxide. No freely rotating carbocation intermediate is</text><text x="24" y="258" font-size="16">inserted.</text></g></g></svg>