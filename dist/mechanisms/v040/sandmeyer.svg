<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 2090"><title>Sandmeyer chlorination: complete teaching sequence</title><g font-family="DejaVu Sans,sans-serif"><rect width="1200" height="350" fill="#fffefa"/><text x="25" y="32" font-size="21" fill="#203c43">Sandmeyer chlorination · representative molecular graphs</text><path d="M396.66,228.24 L314.78,219.08" stroke="#203c43" stroke-width="2" fill="none"/><path d="M316.27,221.68 L242.71,264.00" stroke="#203c43" stroke-width="2" fill="none"/><path d="M313.28,216.48 L239.72,258.80" stroke="#203c43" stroke-width="2" fill="none" stroke-dasharray="4 3"/><path d="M240.09,264.19 L163.00,233.12" stroke="#203c43" stroke-width="2" fill="none"/><path d="M242.34,258.62 L165.24,227.55" stroke="#203c43" stroke-width="2" fill="none" stroke-dasharray="4 3"/><path d="M161.15,230.73 L150.37,148.90" stroke="#203c43" stroke-width="2" fill="none"/><path d="M167.10,229.94 L156.32,148.12" stroke="#203c43" stroke-width="2" fill="none" stroke-dasharray="4 3"/><path d="M151.56,146.10 L217.73,97.18" stroke="#203c43" stroke-width="2" fill="none"/><path d="M155.13,150.92 L221.30,102.01" stroke="#203c43" stroke-width="2" fill="none" stroke-dasharray="4 3"/><path d="M220.91,96.94 L294.06,135.31" stroke="#203c43" stroke-width="2" fill="none"/><path d="M218.12,102.25 L291.27,140.62" stroke="#203c43" stroke-width="2" fill="none" stroke-dasharray="4 3"/><path d="M311.88,219.87 L289.77,138.76" stroke="#203c43" stroke-width="2" fill="none"/><path d="M317.67,218.29 L295.56,137.18" stroke="#203c43" stroke-width="2" fill="none" stroke-dasharray="4 3"/><rect x="381.66" y="218.24" width="30" height="20" fill="#fffefa"/><text x="396.66" y="233.24" font-size="16" text-anchor="middle" fill="#203c43">NH2</text><rect x="309.78" y="209.08" width="10" height="20" fill="#fffefa"/><text x="314.78" y="224.08" font-size="16" text-anchor="middle" fill="#203c43">C</text><rect x="231.22" y="251.40" width="20" height="20" fill="#fffefa"/><text x="241.22" y="266.40" font-size="16" text-anchor="middle" fill="#203c43">CH</text><rect x="154.12" y="220.34" width="20" height="20" fill="#fffefa"/><text x="164.12" y="235.34" font-size="16" text-anchor="middle" fill="#203c43">CH</text><rect x="143.34" y="138.51" width="20" height="20" fill="#fffefa"/><text x="153.34" y="153.51" font-size="16" text-anchor="middle" fill="#203c43">CH</text><rect x="209.51" y="89.60" width="20" height="20" fill="#fffefa"/><text x="219.51" y="104.60" font-size="16" text-anchor="middle" fill="#203c43">CH</text><rect x="282.66" y="127.97" width="20" height="20" fill="#fffefa"/><text x="292.66" y="142.97" font-size="16" text-anchor="middle" fill="#203c43">CH</text><path d="M1036.66,228.24 L954.78,219.08" stroke="#203c43" stroke-width="2" fill="none"/><path d="M956.27,221.68 L882.71,264.00" stroke="#203c43" stroke-width="2" fill="none"/><path d="M953.28,216.48 L879.72,258.80" stroke="#203c43" stroke-width="2" fill="none" stroke-dasharray="4 3"/><path d="M880.09,264.19 L803.00,233.12" stroke="#203c43" stroke-width="2" fill="none"/><path d="M882.34,258.62 L805.24,227.55" stroke="#203c43" stroke-width="2" fill="none" stroke-dasharray="4 3"/><path d="M801.15,230.73 L790.37,148.90" stroke="#203c43" stroke-width="2" fill="none"/><path d="M807.10,229.94 L796.32,148.12" stroke="#203c43" stroke-width="2" fill="none" stroke-dasharray="4 3"/><path d="M791.56,146.10 L857.73,97.18" stroke="#203c43" stroke-width="2" fill="none"/><path d="M795.13,150.92 L861.30,102.01" stroke="#203c43" stroke-width="2" fill="none" stroke-dasharray="4 3"/><path d="M860.91,96.94 L934.06,135.31" stroke="#203c43" stroke-width="2" fill="none"/><path d="M858.12,102.25 L931.27,140.62" stroke="#203c43" stroke-width="2" fill="none" stroke-dasharray="4 3"/><path d="M951.88,219.87 L929.77,138.76" stroke="#203c43" stroke-width="2" fill="none"/><path d="M957.67,218.29 L935.56,137.18" stroke="#203c43" stroke-width="2" fill="none" stroke-dasharray="4 3"/><rect x="1026.66" y="218.24" width="20" height="20" fill="#fffefa"/><text x="1036.66" y="233.24" font-size="16" text-anchor="middle" fill="#203c43">Cl</text><rect x="949.78" y="209.08" width="10" height="20" fill="#fffefa"/><text x="954.78" y="224.08" font-size="16" text-anchor="middle" fill="#203c43">C</text><rect x="871.22" y="251.40" width="20" height="20" fill="#fffefa"/><text x="881.22" y="266.40" font-size="16" text-anchor="middle" fill="#203c43">CH</text><rect x="794.12" y="220.34" width="20" height="20" fill="#fffefa"/><text x="804.12" y="235.34" font-size="16" text-anchor="middle" fill="#203c43">CH</text><rect x="783.34" y="138.51" width="20" height="20" fill="#fffefa"/><text x="793.34" y="153.51" font-size="16" text-anchor="middle" fill="#203c43">CH</text><rect x="849.51" y="89.60" width="20" height="20" fill="#fffefa"/><text x="859.51" y="104.60" font-size="16" text-anchor="middle" fill="#203c43">CH</text><rect x="922.66" y="127.97" width="20" height="20" fill="#fffefa"/><text x="932.66" y="142.97" font-size="16" text-anchor="middle" fill="#203c43">CH</text><text x="580" y="180" font-size="32" fill="#203c43">→</text><text x="25" y="330" font-size="15" fill="#203c43">Representative substrate/product connectivity; other reagents/byproducts are in the equation. No computed geometry.</text></g><g transform="translate(0,350)"><title>Sandmeyer chlorination: Mechanistic boundary / grouped stage</title><desc>NO2− + acid → Nitrosating species (NO+ equivalent) + water. Acid generates a nitrosating electrophile; nitrous-acid protonation/dehydration and speciation are grouped.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="sandmeyer-1-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="sandmeyer-1-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Sandmeyer chlorination · 1</text><text x="24" y="65" font-size="17">Mechanistic boundary / grouped stage</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">NO2− + acid</text><text x="665.00" y="155" font-size="18.70">Nitrosating species (NO+ equivalent) + water</text><text x="30" y="202" font-size="16">Process model: no unique microscopic electron-arrow sequence asserted.</text><text x="24" y="235" font-size="16">Acid generates a nitrosating electrophile; nitrous-acid protonation/dehydration and speciation are grouped.</text></g></g><g transform="translate(0,640)"><title>Sandmeyer chlorination: Lone-pair capture</title><desc>Ph–NH2: + NO+ → Ph–NH2+–N=O. Aniline nitrogen attacks nitrosating nitrogen.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="sandmeyer-2-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="sandmeyer-2-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Sandmeyer chlorination · 2</text><text x="24" y="65" font-size="17">Lone-pair capture</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">Ph–</text><text x="68.64" y="155" font-size="24.00">NH2:</text><text x="128.16" y="155" font-size="24.00"> + </text><text x="172.80" y="155" font-size="24.00">NO+</text><text x="665.00" y="155" font-size="24.00">Ph–NH2+–N=O</text><path data-electrons="2" d="M98.40,141.60 Q146.76,98.60 195.12,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#sandmeyer-2-pair)"/><text x="24" y="235" font-size="16">Aniline nitrogen attacks nitrosating nitrogen.</text></g></g><g transform="translate(0,930)"><title>Sandmeyer chlorination: Mechanistic boundary / grouped stage</title><desc>Ph–NH2+–N=O + proton relays → Ph–N=N–OH + acid. N-deprotonation and tautomerization produce a diazohydroxide model; solvent proton relays are grouped.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="sandmeyer-3-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="sandmeyer-3-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Sandmeyer chlorination · 3</text><text x="24" y="65" font-size="17">Mechanistic boundary / grouped stage</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">Ph–NH2+–N=O + proton relays</text><text x="665.00" y="155" font-size="24.00">Ph–N=N–OH + acid</text><text x="30" y="202" font-size="16">Process model: no unique microscopic electron-arrow sequence asserted.</text><text x="24" y="235" font-size="16">N-deprotonation and tautomerization produce a diazohydroxide model; solvent proton relays are grouped.</text></g></g><g transform="translate(0,1220)"><title>Sandmeyer chlorination: Mechanistic boundary / grouped stage</title><desc>Ph–N=N–OH + acid → Ph–N≡N+ + H2O. O-protonation followed by water loss gives benzenediazonium; no extra aryl cation is inserted.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="sandmeyer-4-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="sandmeyer-4-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Sandmeyer chlorination · 4</text><text x="24" y="65" font-size="17">Mechanistic boundary / grouped stage</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">Ph–N=N–OH + acid</text><text x="665.00" y="155" font-size="24.00">Ph–N≡N+ + H2O</text><text x="30" y="202" font-size="16">Process model: no unique microscopic electron-arrow sequence asserted.</text><text x="24" y="235" font-size="16">O-protonation followed by water loss gives benzenediazonium; no extra aryl cation is inserted.</text></g></g><g transform="translate(0,1510)"><title>Sandmeyer chlorination: Mechanistic boundary / grouped stage</title><desc>PhN2+ + Cu(I) → Ph• + N2 + Cu(II) species. Single-electron transfer and nitrogen extrusion generate an aryl-radical/copper-ion-pair model.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="sandmeyer-5-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="sandmeyer-5-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Sandmeyer chlorination · 5</text><text x="24" y="65" font-size="17">Mechanistic boundary / grouped stage</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">PhN2+ + Cu(I)</text><text x="665.00" y="155" font-size="24.00">Ph• + N2 + Cu(II) species</text><text x="30" y="202" font-size="16">Process model: no unique microscopic electron-arrow sequence asserted.</text><text x="24" y="235" font-size="16">Single-electron transfer and nitrogen extrusion generate an aryl-radical/copper-ion-pair model.</text></g></g><g transform="translate(0,1800)"><title>Sandmeyer chlorination: Mechanistic boundary / grouped stage</title><desc>Ph• + Cu(II)–Cl species → PhCl + Cu(I). Chlorine transfer/cage capture restores the Cu(I) cycle; speciation and alternatives depend on the system.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="sandmeyer-6-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="sandmeyer-6-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Sandmeyer chlorination · 6</text><text x="24" y="65" font-size="17">Mechanistic boundary / grouped stage</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">Ph• + Cu(II)–Cl species</text><text x="665.00" y="155" font-size="24.00">PhCl + Cu(I)</text><text x="30" y="202" font-size="16">Process model: no unique microscopic electron-arrow sequence asserted.</text><text x="24" y="235" font-size="16">Chlorine transfer/cage capture restores the Cu(I) cycle; speciation and alternatives depend on the system.</text></g></g></svg>