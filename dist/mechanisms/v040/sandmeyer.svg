<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1740"><title>Sandmeyer chlorination: complete teaching sequence</title><g transform="translate(0,0)"><title>Sandmeyer chlorination: Mechanistic boundary / grouped stage</title><desc>NO2− + acid → Nitrosating species (NO+ equivalent) + water. Acid generates a nitrosating electrophile; nitrous-acid protonation/dehydration and speciation are grouped.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="sandmeyer-1-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="sandmeyer-1-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Sandmeyer chlorination · 1</text><text x="24" y="65" font-size="17">Mechanistic boundary / grouped stage</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">NO2− + acid</text><text x="665.00" y="155" font-size="18.70">Nitrosating species (NO+ equivalent) + water</text><text x="30" y="202" font-size="16">Process model: no unique microscopic electron-arrow sequence asserted.</text><text x="24" y="235" font-size="16">Acid generates a nitrosating electrophile; nitrous-acid protonation/dehydration and speciation are grouped.</text></g></g><g transform="translate(0,290)"><title>Sandmeyer chlorination: Lone-pair capture</title><desc>Ph–NH2: + NO+ → Ph–NH2+–N=O. Aniline nitrogen attacks nitrosating nitrogen.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="sandmeyer-2-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="sandmeyer-2-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Sandmeyer chlorination · 2</text><text x="24" y="65" font-size="17">Lone-pair capture</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">Ph–</text><text x="68.64" y="155" font-size="24.00">NH2:</text><text x="128.16" y="155" font-size="24.00"> + </text><text x="172.80" y="155" font-size="24.00">NO+</text><text x="665.00" y="155" font-size="24.00">Ph–NH2+–N=O</text><path data-electrons="2" d="M98.40,141.60 Q146.76,98.60 195.12,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#sandmeyer-2-pair)"/><text x="24" y="235" font-size="16">Aniline nitrogen attacks nitrosating nitrogen.</text></g></g><g transform="translate(0,580)"><title>Sandmeyer chlorination: Mechanistic boundary / grouped stage</title><desc>Ph–NH2+–N=O + proton relays → Ph–N=N–OH + acid. N-deprotonation and tautomerization produce a diazohydroxide model; solvent proton relays are grouped.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="sandmeyer-3-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="sandmeyer-3-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Sandmeyer chlorination · 3</text><text x="24" y="65" font-size="17">Mechanistic boundary / grouped stage</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">Ph–NH2+–N=O + proton relays</text><text x="665.00" y="155" font-size="24.00">Ph–N=N–OH + acid</text><text x="30" y="202" font-size="16">Process model: no unique microscopic electron-arrow sequence asserted.</text><text x="24" y="235" font-size="16">N-deprotonation and tautomerization produce a diazohydroxide model; solvent proton relays are grouped.</text></g></g><g transform="translate(0,870)"><title>Sandmeyer chlorination: Mechanistic boundary / grouped stage</title><desc>Ph–N=N–OH + acid → Ph–N≡N+ + H2O. O-protonation followed by water loss gives benzenediazonium; no extra aryl cation is inserted.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="sandmeyer-4-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="sandmeyer-4-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Sandmeyer chlorination · 4</text><text x="24" y="65" font-size="17">Mechanistic boundary / grouped stage</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">Ph–N=N–OH + acid</text><text x="665.00" y="155" font-size="24.00">Ph–N≡N+ + H2O</text><text x="30" y="202" font-size="16">Process model: no unique microscopic electron-arrow sequence asserted.</text><text x="24" y="235" font-size="16">O-protonation followed by water loss gives benzenediazonium; no extra aryl cation is inserted.</text></g></g><g transform="translate(0,1160)"><title>Sandmeyer chlorination: Mechanistic boundary / grouped stage</title><desc>PhN2+ + Cu(I) → Ph• + N2 + Cu(II) species. Single-electron transfer and nitrogen extrusion generate an aryl-radical/copper-ion-pair model.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="sandmeyer-5-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="sandmeyer-5-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Sandmeyer chlorination · 5</text><text x="24" y="65" font-size="17">Mechanistic boundary / grouped stage</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">PhN2+ + Cu(I)</text><text x="665.00" y="155" font-size="24.00">Ph• + N2 + Cu(II) species</text><text x="30" y="202" font-size="16">Process model: no unique microscopic electron-arrow sequence asserted.</text><text x="24" y="235" font-size="16">Single-electron transfer and nitrogen extrusion generate an aryl-radical/copper-ion-pair model.</text></g></g><g transform="translate(0,1450)"><title>Sandmeyer chlorination: Mechanistic boundary / grouped stage</title><desc>Ph• + Cu(II)–Cl species → PhCl + Cu(I). Chlorine transfer/cage capture restores the Cu(I) cycle; speciation and alternatives depend on the system.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="sandmeyer-6-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="sandmeyer-6-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Sandmeyer chlorination · 6</text><text x="24" y="65" font-size="17">Mechanistic boundary / grouped stage</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">Ph• + Cu(II)–Cl species</text><text x="665.00" y="155" font-size="24.00">PhCl + Cu(I)</text><text x="30" y="202" font-size="16">Process model: no unique microscopic electron-arrow sequence asserted.</text><text x="24" y="235" font-size="16">Chlorine transfer/cage capture restores the Cu(I) cycle; speciation and alternatives depend on the system.</text></g></g></svg>