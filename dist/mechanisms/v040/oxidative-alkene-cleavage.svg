<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1510"><title>Permanganate oxidative alkene cleavage: complete teaching sequence</title><g font-family="DejaVu Sans,sans-serif"><rect width="1200" height="350" fill="#fffefa"/><text x="25" y="32" font-size="21" fill="#203c43">Permanganate oxidative alkene cleavage · representative molecular graphs</text><path d="M346.07,251.57 L266.46,246.18" stroke="#203c43" stroke-width="2" fill="none"/><path d="M264.34,248.30 L207.20,191.16" stroke="#203c43" stroke-width="2" fill="none"/><path d="M268.59,244.05 L211.45,186.91" stroke="#203c43" stroke-width="2" fill="none"/><path d="M209.32,189.04 L203.93,109.43" stroke="#203c43" stroke-width="2" fill="none"/><rect x="331.07" y="241.57" width="30" height="20" fill="#fffefa"/><text x="346.07" y="256.57" font-size="16" text-anchor="middle" fill="#203c43">CH3</text><rect x="256.46" y="236.18" width="20" height="20" fill="#fffefa"/><text x="266.46" y="251.18" font-size="16" text-anchor="middle" fill="#203c43">CH</text><rect x="199.32" y="179.04" width="20" height="20" fill="#fffefa"/><text x="209.32" y="194.04" font-size="16" text-anchor="middle" fill="#203c43">CH</text><rect x="188.93" y="99.43" width="30" height="20" fill="#fffefa"/><text x="203.93" y="114.43" font-size="16" text-anchor="middle" fill="#203c43">CH3</text><path d="M980.53,215.57 L944.02,238.51" stroke="#203c43" stroke-width="2" fill="none"/><path d="M946.98,238.94 L940.84,280.93" stroke="#203c43" stroke-width="2" fill="none"/><path d="M941.05,238.07 L934.90,280.07" stroke="#203c43" stroke-width="2" fill="none"/><path d="M944.02,238.51 L901.58,232.79" stroke="#203c43" stroke-width="2" fill="none"/><path d="M849.47,145.43 L885.98,122.49" stroke="#203c43" stroke-width="2" fill="none"/><path d="M883.02,122.06 L889.16,80.07" stroke="#203c43" stroke-width="2" fill="none"/><path d="M888.95,122.93 L895.10,80.93" stroke="#203c43" stroke-width="2" fill="none"/><path d="M885.98,122.49 L928.42,128.21" stroke="#203c43" stroke-width="2" fill="none"/><rect x="965.53" y="205.57" width="30" height="20" fill="#fffefa"/><text x="980.53" y="220.57" font-size="16" text-anchor="middle" fill="#203c43">CH3</text><rect x="939.02" y="228.51" width="10" height="20" fill="#fffefa"/><text x="944.02" y="243.51" font-size="16" text-anchor="middle" fill="#203c43">C</text><rect x="932.87" y="270.50" width="10" height="20" fill="#fffefa"/><text x="937.87" y="285.50" font-size="16" text-anchor="middle" fill="#203c43">O</text><rect x="891.58" y="222.79" width="20" height="20" fill="#fffefa"/><text x="901.58" y="237.79" font-size="16" text-anchor="middle" fill="#203c43">OH</text><rect x="834.47" y="135.43" width="30" height="20" fill="#fffefa"/><text x="849.47" y="150.43" font-size="16" text-anchor="middle" fill="#203c43">CH3</text><rect x="880.98" y="112.49" width="10" height="20" fill="#fffefa"/><text x="885.98" y="127.49" font-size="16" text-anchor="middle" fill="#203c43">C</text><rect x="887.13" y="70.50" width="10" height="20" fill="#fffefa"/><text x="892.13" y="85.50" font-size="16" text-anchor="middle" fill="#203c43">O</text><rect x="918.42" y="118.21" width="20" height="20" fill="#fffefa"/><text x="928.42" y="133.21" font-size="16" text-anchor="middle" fill="#203c43">OH</text><text x="580" y="180" font-size="32" fill="#203c43">→</text><text x="25" y="330" font-size="15" fill="#203c43">Representative substrate/product connectivity; other reagents/byproducts are in the equation. No computed geometry.</text></g><g transform="translate(0,350)"><title>Permanganate oxidative alkene cleavage: Mechanistic boundary / grouped stage</title><desc>CH3CH=CHCH3 + MnO4− → Cyclic manganate-derived adduct. Oxidant addition introduces two C–O linkages through a cyclic manganese-containing model; manganese speciation is not fixed by a four-digit code.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="oxidative-alkene-cleavage-1-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="oxidative-alkene-cleavage-1-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Permanganate oxidative alkene cleavage · 1</text><text x="24" y="65" font-size="17">Mechanistic boundary / grouped stage</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">CH3CH=CHCH3 + MnO4−</text><text x="665.00" y="155" font-size="24.00">Cyclic manganate-derived adduct</text><text x="30" y="202" font-size="16">Process model: no unique microscopic electron-arrow sequence asserted.</text><text x="24" y="235" font-size="16">Oxidant addition introduces two C–O linkages through a cyclic manganese-containing model; manganese</text><text x="24" y="258" font-size="16">speciation is not fixed by a four-digit code.</text></g></g><g transform="translate(0,640)"><title>Permanganate oxidative alkene cleavage: Mechanistic boundary / grouped stage</title><desc>Manganate-derived adduct + water → CH3CH(OH)CH(OH)CH3 + reduced Mn species. Hydrolysis gives a vicinal-diol description at teaching resolution; its accumulation is not required under forcing conditions.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="oxidative-alkene-cleavage-2-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="oxidative-alkene-cleavage-2-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Permanganate oxidative alkene cleavage · 2</text><text x="24" y="65" font-size="17">Mechanistic boundary / grouped stage</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">Manganate-derived adduct + water</text><text x="665.00" y="155" font-size="21.09">CH3CH(OH)CH(OH)CH3 + reduced Mn species</text><text x="30" y="202" font-size="16">Process model: no unique microscopic electron-arrow sequence asserted.</text><text x="24" y="235" font-size="16">Hydrolysis gives a vicinal-diol description at teaching resolution; its accumulation is not required under</text><text x="24" y="258" font-size="16">forcing conditions.</text></g></g><g transform="translate(0,930)"><title>Permanganate oxidative alkene cleavage: Mechanistic boundary / grouped stage</title><desc>CH3CH(OH)CH(OH)CH3 + oxidant → 2 CH3CHO + reduced Mn / water. Further oxidation cleaves the C–C bond; the oxidation network is grouped, not claimed as one known elementary transition structure.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="oxidative-alkene-cleavage-3-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="oxidative-alkene-cleavage-3-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Permanganate oxidative alkene cleavage · 3</text><text x="24" y="65" font-size="17">Mechanistic boundary / grouped stage</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">CH3CH(OH)CH(OH)CH3 + oxidant</text><text x="665.00" y="155" font-size="24.00">2 CH3CHO + reduced Mn / water</text><text x="30" y="202" font-size="16">Process model: no unique microscopic electron-arrow sequence asserted.</text><text x="24" y="235" font-size="16">Further oxidation cleaves the C–C bond; the oxidation network is grouped, not claimed as one known</text><text x="24" y="258" font-size="16">elementary transition structure.</text></g></g><g transform="translate(0,1220)"><title>Permanganate oxidative alkene cleavage: Mechanistic boundary / grouped stage</title><desc>2 CH3CHO + oxidant / water → 2 CH3CO2H. Aldehydes are oxidized further through hydrated/metal-bound species under these conditions.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="oxidative-alkene-cleavage-4-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="oxidative-alkene-cleavage-4-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Permanganate oxidative alkene cleavage · 4</text><text x="24" y="65" font-size="17">Mechanistic boundary / grouped stage</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">2 CH3CHO + oxidant / water</text><text x="665.00" y="155" font-size="24.00">2 CH3CO2H</text><text x="30" y="202" font-size="16">Process model: no unique microscopic electron-arrow sequence asserted.</text><text x="24" y="235" font-size="16">Aldehydes are oxidized further through hydrated/metal-bound species under these conditions.</text></g></g></svg>