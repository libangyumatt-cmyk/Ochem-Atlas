" height="20" fill="#fffefa"/><text x="785.68" y="116.33" font-size="16" text-anchor="middle" fill="#203c43">CH</text><rect x="854.95" y="79.98" width="20" height="20" fill="#fffefa"/><text x="864.95" y="94.98" font-size="16" text-anchor="middle" fill="#203c43">CH</text><rect x="902.72" y="147.26" width="20" height="20" fill="#fffefa"/><text x="912.72" y="162.26" font-size="16" text-anchor="middle" fill="#203c43">CH</text><text x="580" y="180" font-size="32" fill="#203c43">→</text><text x="25" y="330" font-size="15" fill="#203c43">Representative substrate/product connectivity; other reagents/byproducts are in the equation. No computed geometry.</text></g><g transform="translate(0,350)"><title>DIBAL-H partial ester reduction: Mechanistic boundary / grouped stage</title><desc>PhCO2Et + iBu2AlH → O→Al ester complex. Ester oxygen coordinates to aluminum; aggregation and counterion structures are not fixed.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="dibal-ester-reduction-1-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="dibal-ester-reduction-1-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">DIBAL-H partial ester reduction · 1</text><text x="24" y="65" font-size="17">Mechanistic boundary / grouped stage</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">PhCO2Et + iBu2AlH</text><text x="665.00" y="155" font-size="24.00">O→Al ester complex</text><text x="30" y="202" font-size="16">Process model: no unique microscopic electron-arrow sequence asserted.</text><text x="24" y="235" font-size="16">Ester oxygen coordinates to aluminum; aggregation and counterion structures are not fixed.</text></g></g><g transform="translate(0,640)"><title>DIBAL-H partial ester reduction: Nucleophilic carbonyl addition</title><desc>Ph–C(=O)OEt + iBu2Al–H → PhCH(O–Al species)OEt. The Al–H pair transfers to ester carbonyl carbon, forming a tetrahedral aluminum-bound intermediate.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="dibal-ester-reduction-2-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="dibal-ester-reduction-2-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">DIBAL-H partial ester reduction · 2</text><text x="24" y="65" font-size="17">Nucleophilic carbonyl addition</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">Ph–</text><text x="68.64" y="155" font-size="24.00">C</text><text x="83.52" y="155" font-size="24.00">(=</text><text x="113.28" y="155" font-size="24.00">O</text><text x="128.16" y="155" font-size="24.00">)OEt + iBu2</text><text x="291.84" y="155" font-size="24.00">Al</text><text x="321.60" y="155" font-size="24.00">–</text><text x="336.48" y="155" font-size="24.00">H</text><text x="665.00" y="155" font-size="24.00">PhCH(O–Al species)OEt</text><path data-electrons="2" d="M325.32,141.60 Q200.70,98.60 76.08,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#dibal-ester-reduction-2-pair)"/><path data-electrons="2" d="M98.40,141.60 Q109.56,203.60 120.72,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#dibal-ester-reduction-2-pair)"/><text x="24" y="235" font-size="16">The Al–H pair transfers to ester carbonyl carbon, forming a tetrahedral aluminum-bound intermediate.</text></g></g><g transform="translate(0,930)"><title>DIBAL-H partial ester reduction: Mechanistic boundary / grouped stage</title><desc>Aluminum-bound tetrahedral intermediate + water → PhCH(OH)OEt + hydrated aluminum species. Hydrolysis releases a hemiacetal-like intermediate; no free aldehyde is required during the cold hydride stage.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="dibal-ester-reduction-3-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="dibal-ester-reduction-3-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">DIBAL-H partial ester reduction · 3</text><text x="24" y="65" font-size="17">Mechanistic boundary / grouped stage</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="17.84">Aluminum-bound tetrahedral intermediate + water</text><text x="665.00" y="155" font-size="21.09">PhCH(OH)OEt + hydrated aluminum species</text><text x="30" y="202" font-size="16">Process model: no unique microscopic electron-arrow sequence asserted.</text><text x="24" y="235" font-size="16">Hydrolysis releases a hemiacetal-like intermediate; no free aldehyde is required during the cold hydride</text><text x="24" y="258" font-size="16">stage.</text></g></g><g transform="translate(0,1220)"><title>DIBAL-H partial ester reduction: Tetrahedral intermediate collapse</title><desc>Ph–CH(O:H)–OEt + proton relays → PhCHO + EtOH. Solvent-assisted proton transfers and carbonyl reformation release ethanol and aldehyde.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="dibal-ester-reduction-4-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="dibal-ester-reduction-4-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">DIBAL-H partial ester reduction · 4</text><text x="24" y="65" font-size="17">Tetrahedral intermediate collapse</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">Ph–</text><text x="68.64" y="155" font-size="24.00">CH</text><text x="98.40" y="155" font-size="24.00">(</text><text x="113.28" y="155" font-size="24.00">O:H</text><text x="157.92" y="155" font-size="24.00">)–</text><text x="187.68" y="155" font-size="24.00">OEt</text><text x="232.32" y="155" font-size="24.00"> + proton relays</text><text x="665.00" y="155" font-size="24.00">PhCHO + EtOH</text><path data-electrons="2" d="M135.60,141.60 Q122.58,98.60 109.56,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#dibal-ester-reduction-4-pair)"/><path data-electrons="2" d="M146.76,141.60 Q178.38,203.60 210.00,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#dibal-ester-reduction-4-pair)"/><text x="24" y="235" font-size="16">Solvent-assisted proton transfers and carbonyl reformation release ethanol and aldehyde.</text></g></g></svg>