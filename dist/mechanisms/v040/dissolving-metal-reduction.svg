<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1510"><title>Dissolving-metal alkyne reduction: complete teaching sequence</title><g font-family="DejaVu Sans,sans-serif"><rect width="1200" height="350" fill="#fffefa"/><text x="25" y="32" font-size="21" fill="#203c43">Dissolving-metal alkyne reduction · representative molecular graphs</text><path d="M346.07,251.57 L266.46,246.18" stroke="#203c43" stroke-width="2" fill="none"/><path d="M263.49,249.15 L206.35,192.01" stroke="#203c43" stroke-width="2" fill="none"/><path d="M266.46,246.18 L209.32,189.04" stroke="#203c43" stroke-width="2" fill="none"/><path d="M269.43,243.21 L212.29,186.07" stroke="#203c43" stroke-width="2" fill="none"/><path d="M209.32,189.04 L203.93,109.43" stroke="#203c43" stroke-width="2" fill="none"/><rect x="331.07" y="241.57" width="30" height="20" fill="#fffefa"/><text x="346.07" y="256.57" font-size="16" text-anchor="middle" fill="#203c43">CH3</text><rect x="261.46" y="236.18" width="10" height="20" fill="#fffefa"/><text x="266.46" y="251.18" font-size="16" text-anchor="middle" fill="#203c43">C</text><rect x="204.32" y="179.04" width="10" height="20" fill="#fffefa"/><text x="209.32" y="194.04" font-size="16" text-anchor="middle" fill="#203c43">C</text><rect x="188.93" y="99.43" width="30" height="20" fill="#fffefa"/><text x="203.93" y="114.43" font-size="16" text-anchor="middle" fill="#203c43">CH3</text><path d="M823.76,243.48 L872.75,180.50" stroke="#203c43" stroke-width="2" fill="none"/><path d="M872.75,177.50 L957.25,177.50" stroke="#203c43" stroke-width="2" fill="none"/><path d="M872.75,183.50 L957.25,183.50" stroke="#203c43" stroke-width="2" fill="none"/><path d="M957.25,180.50 L1006.24,117.52" stroke="#203c43" stroke-width="2" fill="none"/><rect x="808.76" y="233.48" width="30" height="20" fill="#fffefa"/><text x="823.76" y="248.48" font-size="16" text-anchor="middle" fill="#203c43">CH3</text><rect x="862.75" y="170.50" width="20" height="20" fill="#fffefa"/><text x="872.75" y="185.50" font-size="16" text-anchor="middle" fill="#203c43">CH</text><rect x="947.25" y="170.50" width="20" height="20" fill="#fffefa"/><text x="957.25" y="185.50" font-size="16" text-anchor="middle" fill="#203c43">CH</text><rect x="991.24" y="107.52" width="30" height="20" fill="#fffefa"/><text x="1006.24" y="122.52" font-size="16" text-anchor="middle" fill="#203c43">CH3</text><text x="580" y="180" font-size="32" fill="#203c43">→</text><text x="25" y="330" font-size="15" fill="#203c43">Representative substrate/product connectivity; other reagents/byproducts are in the equation. No computed geometry.</text><text x="680" y="60" font-size="20">E alkene · relative double-bond geometry specified</text></g><g transform="translate(0,350)"><title>Dissolving-metal alkyne reduction: Mechanistic boundary / grouped stage</title><desc>CH3C≡CCH3 + e− → [CH3C= CCH3]•−. A solvated electron enters an alkyne pi* orbital, producing a bent radical-anion model. This is SET, not paired nucleophilic addition.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="dissolving-metal-reduction-1-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="dissolving-metal-reduction-1-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Dissolving-metal alkyne reduction · 1</text><text x="24" y="65" font-size="17">Mechanistic boundary / grouped stage</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">CH3C≡CCH3 + e−</text><text x="665.00" y="155" font-size="24.00">[CH3C= CCH3]•−</text><text x="30" y="202" font-size="16">Process model: no unique microscopic electron-arrow sequence asserted.</text><text x="24" y="235" font-size="16">A solvated electron enters an alkyne pi* orbital, producing a bent radical-anion model. This is SET, not</text><text x="24" y="258" font-size="16">paired nucleophilic addition.</text></g></g><g transform="translate(0,640)"><title>Dissolving-metal alkyne reduction: Mechanistic boundary / grouped stage</title><desc>Alkyne radical anion + NH3 → CH3CH=C•CH3 + NH2−. Proton transfer to the radical anion yields a vinyl radical; charge and spin are not conflated.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="dissolving-metal-reduction-2-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="dissolving-metal-reduction-2-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Dissolving-metal alkyne reduction · 2</text><text x="24" y="65" font-size="17">Mechanistic boundary / grouped stage</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">Alkyne radical anion + NH3</text><text x="665.00" y="155" font-size="24.00">CH3CH=C•CH3 + NH2−</text><text x="30" y="202" font-size="16">Process model: no unique microscopic electron-arrow sequence asserted.</text><text x="24" y="235" font-size="16">Proton transfer to the radical anion yields a vinyl radical; charge and spin are not conflated.</text></g></g><g transform="translate(0,930)"><title>Dissolving-metal alkyne reduction: Mechanistic boundary / grouped stage</title><desc>CH3CH=C•CH3 + e− → CH3CH=C−CH3. A second electron reduces the vinyl radical to a vinyl anion.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="dissolving-metal-reduction-3-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="dissolving-metal-reduction-3-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Dissolving-metal alkyne reduction · 3</text><text x="24" y="65" font-size="17">Mechanistic boundary / grouped stage</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">CH3CH=C•CH3 + e−</text><text x="665.00" y="155" font-size="24.00">CH3CH=C−CH3</text><text x="30" y="202" font-size="16">Process model: no unique microscopic electron-arrow sequence asserted.</text><text x="24" y="235" font-size="16">A second electron reduces the vinyl radical to a vinyl anion.</text></g></g><g transform="translate(0,1220)"><title>Dissolving-metal alkyne reduction: Mechanistic boundary / grouped stage</title><desc>CH3CH=C−CH3 + NH3 → trans-(E)-CH3CH=CHCH3 + NH2−. Protonation of the favored anion geometry yields predominantly trans-2-butene.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="dissolving-metal-reduction-4-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="dissolving-metal-reduction-4-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Dissolving-metal alkyne reduction · 4</text><text x="24" y="65" font-size="17">Mechanistic boundary / grouped stage</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">CH3CH=C−CH3 + NH3</text><text x="665.00" y="155" font-size="24.00">trans-(E)-CH3CH=CHCH3 + NH2−</text><text x="30" y="202" font-size="16">Process model: no unique microscopic electron-arrow sequence asserted.</text><text x="24" y="235" font-size="16">Protonation of the favored anion geometry yields predominantly trans-2-butene.</text></g></g></svg>