<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1160"><title>Dissolving-metal alkyne reduction: complete teaching sequence</title><g transform="translate(0,0)"><title>Dissolving-metal alkyne reduction: Mechanistic boundary / grouped stage</title><desc>CH3C≡CCH3 + e− → [CH3C= CCH3]•−. A solvated electron enters an alkyne pi* orbital, producing a bent radical-anion model. This is SET, not paired nucleophilic addition.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="dissolving-metal-reduction-1-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="dissolving-metal-reduction-1-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Dissolving-metal alkyne reduction · 1</text><text x="24" y="65" font-size="17">Mechanistic boundary / grouped stage</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">CH3C≡CCH3 + e−</text><text x="665.00" y="155" font-size="24.00">[CH3C= CCH3]•−</text><text x="30" y="202" font-size="16">Process model: no unique microscopic electron-arrow sequence asserted.</text><text x="24" y="235" font-size="16">A solvated electron enters an alkyne pi* orbital, producing a bent radical-anion model. This is SET, not paired nucleophilic</text><text x="24" y="258" font-size="16">addition.</text></g></g><g transform="translate(0,290)"><title>Dissolving-metal alkyne reduction: Mechanistic boundary / grouped stage</title><desc>Alkyne radical anion + NH3 → CH3CH=C•CH3 + NH2−. Proton transfer to the radical anion yields a vinyl radical; charge and spin are not conflated.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="dissolving-metal-reduction-2-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="dissolving-metal-reduction-2-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Dissolving-metal alkyne reduction · 2</text><text x="24" y="65" font-size="17">Mechanistic boundary / grouped stage</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">Alkyne radical anion + NH3</text><text x="665.00" y="155" font-size="24.00">CH3CH=C•CH3 + NH2−</text><text x="30" y="202" font-size="16">Process model: no unique microscopic electron-arrow sequence asserted.</text><text x="24" y="235" font-size="16">Proton transfer to the radical anion yields a vinyl radical; charge and spin are not conflated.</text></g></g><g transform="translate(0,580)"><title>Dissolving-metal alkyne reduction: Mechanistic boundary / grouped stage</title><desc>CH3CH=C•CH3 + e− → CH3CH=C−CH3. A second electron reduces the vinyl radical to a vinyl anion.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="dissolving-metal-reduction-3-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="dissolving-metal-reduction-3-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Dissolving-metal alkyne reduction · 3</text><text x="24" y="65" font-size="17">Mechanistic boundary / grouped stage</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">CH3CH=C•CH3 + e−</text><text x="665.00" y="155" font-size="24.00">CH3CH=C−CH3</text><text x="30" y="202" font-size="16">Process model: no unique microscopic electron-arrow sequence asserted.</text><text x="24" y="235" font-size="16">A second electron reduces the vinyl radical to a vinyl anion.</text></g></g><g transform="translate(0,870)"><title>Dissolving-metal alkyne reduction: Mechanistic boundary / grouped stage</title><desc>CH3CH=C−CH3 + NH3 → trans-(E)-CH3CH=CHCH3 + NH2−. Protonation of the favored anion geometry yields predominantly trans-2-butene.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="dissolving-metal-reduction-4-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="dissolving-metal-reduction-4-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Dissolving-metal alkyne reduction · 4</text><text x="24" y="65" font-size="17">Mechanistic boundary / grouped stage</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">CH3CH=C−CH3 + NH3</text><text x="665.00" y="155" font-size="24.00">trans-(E)-CH3CH=CHCH3 + NH2−</text><text x="30" y="202" font-size="16">Process model: no unique microscopic electron-arrow sequence asserted.</text><text x="24" y="235" font-size="16">Protonation of the favored anion geometry yields predominantly trans-2-butene.</text></g></g></svg>