<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" role="img"><title>Benzoin condensation: Tetrahedral intermediate collapse</title><desc>Ph–C(O−)–CN attached to CH(OH)Ph → PhCOCH(OH)Ph + CN−. O forms C=O as the C–CN bond returns its pair to cyanide, regenerating catalyst.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="benzoin-6-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="benzoin-6-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Benzoin condensation · 6</text><text x="24" y="65" font-size="17">Tetrahedral intermediate collapse</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">Ph–</text><text x="68.64" y="155" font-size="24.00">C</text><text x="83.52" y="155" font-size="24.00">(</text><text x="98.40" y="155" font-size="24.00">O−</text><text x="128.16" y="155" font-size="24.00">)–</text><text x="157.92" y="155" font-size="24.00">CN</text><text x="187.68" y="155" font-size="24.00"> attached to CH(OH)Ph</text><text x="665.00" y="155" font-size="24.00">PhCOCH(OH)Ph + CN−</text><path data-electrons="2" d="M113.28,141.60 Q103.98,98.60 94.68,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#benzoin-6-pair)"/><path data-electrons="2" d="M124.44,141.60 Q148.62,203.60 172.80,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#benzoin-6-pair)"/><text x="24" y="235" font-size="16">O forms C=O as the C–CN bond returns its pair to cyanide, regenerating catalyst.</text></g></svg>