<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1450"><title>Claisen ester condensation: complete teaching sequence</title><g transform="translate(0,0)"><title>Claisen ester condensation: Proton transfer</title><desc>EtO2C–CH2–H + :OEt− → EtO2CCH2− + EtOH. Ethoxide forms a low-equilibrium-concentration ester enolate.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="claisen-condensation-1-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="claisen-condensation-1-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Claisen ester condensation · 1</text><text x="24" y="65" font-size="17">Proton transfer</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">EtO2C–</text><text x="113.28" y="155" font-size="24.00">CH2</text><text x="157.92" y="155" font-size="24.00">–</text><text x="172.80" y="155" font-size="24.00">H</text><text x="187.68" y="155" font-size="24.00"> + </text><text x="232.32" y="155" font-size="24.00">:OEt−</text><text x="665.00" y="155" font-size="24.00">EtO2CCH2− + EtOH</text><path data-electrons="2" d="M269.52,141.60 Q224.88,98.60 180.24,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#claisen-condensation-1-pair)"/><path data-electrons="2" d="M157.92,141.60 Q146.76,203.60 135.60,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#claisen-condensation-1-pair)"/><text x="24" y="235" font-size="16">Ethoxide forms a low-equilibrium-concentration ester enolate.</text></g></g><g transform="translate(0,290)"><title>Claisen ester condensation: Nucleophilic carbonyl addition</title><desc>EtO2C–CH2− + CH3–C(=O)OEt → EtO2CCH2C(O−)(OEt)CH3. Carbon enolate attacks another ester carbonyl.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="claisen-condensation-2-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="claisen-condensation-2-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Claisen ester condensation · 2</text><text x="24" y="65" font-size="17">Nucleophilic carbonyl addition</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">EtO2C–</text><text x="113.28" y="155" font-size="24.00">CH2−</text><text x="172.80" y="155" font-size="24.00"> + CH3–</text><text x="276.96" y="155" font-size="24.00">C</text><text x="291.84" y="155" font-size="24.00">(=</text><text x="321.60" y="155" font-size="24.00">O</text><text x="336.48" y="155" font-size="24.00">)OEt</text><text x="665.00" y="155" font-size="24.00">EtO2CCH2C(O−)(OEt)CH3</text><path data-electrons="2" d="M143.04,141.60 Q213.72,98.60 284.40,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#claisen-condensation-2-pair)"/><path data-electrons="2" d="M306.72,141.60 Q317.88,203.60 329.04,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#claisen-condensation-2-pair)"/><text x="24" y="235" font-size="16">Carbon enolate attacks another ester carbonyl.</text></g></g><g transform="translate(0,580)"><title>Claisen ester condensation: Tetrahedral intermediate collapse</title><desc>EtO2CCH2–C(O−)(CH3)–OEt → EtO2CCH2COCH3 + EtO−. Tetrahedral collapse expels ethoxide and forms the beta-keto ester.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="claisen-condensation-3-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="claisen-condensation-3-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Claisen ester condensation · 3</text><text x="24" y="65" font-size="17">Tetrahedral intermediate collapse</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">EtO2CCH2–</text><text x="157.92" y="155" font-size="24.00">C</text><text x="172.80" y="155" font-size="24.00">(</text><text x="187.68" y="155" font-size="24.00">O−</text><text x="217.44" y="155" font-size="24.00">)(CH3)–</text><text x="321.60" y="155" font-size="24.00">OEt</text><text x="665.00" y="155" font-size="24.00">EtO2CCH2COCH3 + EtO−</text><path data-electrons="2" d="M202.56,141.60 Q193.26,98.60 183.96,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#claisen-condensation-3-pair)"/><path data-electrons="2" d="M254.64,141.60 Q299.28,203.60 343.92,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#claisen-condensation-3-pair)"/><text x="24" y="235" font-size="16">Tetrahedral collapse expels ethoxide and forms the beta-keto ester.</text></g></g><g transform="translate(0,870)"><title>Claisen ester condensation: Proton transfer</title><desc>EtO2C–CH(COCH3)–H + :OEt− → [EtO2CCHCOCH3]− + EtOH. The acidic methylene product is deprotonated, supplying the thermodynamic driving step.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="claisen-condensation-4-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="claisen-condensation-4-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Claisen ester condensation · 4</text><text x="24" y="65" font-size="17">Proton transfer</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">EtO2C–</text><text x="113.28" y="155" font-size="24.00">CH</text><text x="143.04" y="155" font-size="24.00">(COCH3)–</text><text x="262.08" y="155" font-size="24.00">H</text><text x="276.96" y="155" font-size="24.00"> + </text><text x="321.60" y="155" font-size="24.00">:OEt−</text><text x="665.00" y="155" font-size="24.00">[EtO2CCHCOCH3]− + EtOH</text><path data-electrons="2" d="M358.80,141.60 Q314.16,98.60 269.52,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#claisen-condensation-4-pair)"/><path data-electrons="2" d="M198.84,141.60 Q163.50,203.60 128.16,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#claisen-condensation-4-pair)"/><text x="24" y="235" font-size="16">The acidic methylene product is deprotonated, supplying the thermodynamic driving step.</text></g></g><g transform="translate(0,1160)"><title>Claisen ester condensation: Proton transfer</title><desc>[EtO2C–CH–COCH3]− + H–OH2+ → EtO2CCH2COCH3 + H2O. Acidic work-up protonates the enolate; its resonance contributors are not separate intermediates.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="claisen-condensation-5-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="claisen-condensation-5-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Claisen ester condensation · 5</text><text x="24" y="65" font-size="17">Proton transfer</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">[EtO2C–</text><text x="128.16" y="155" font-size="24.00">CH</text><text x="157.92" y="155" font-size="24.00">–COCH3]− + </text><text x="321.60" y="155" font-size="24.00">H</text><text x="336.48" y="155" font-size="24.00">–</text><text x="351.36" y="155" font-size="24.00">OH2+</text><text x="665.00" y="155" font-size="24.00">EtO2CCH2COCH3 + H2O</text><path data-electrons="2" d="M143.04,141.60 Q236.04,98.60 329.04,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#claisen-condensation-5-pair)"/><path data-electrons="2" d="M355.08,141.60 Q368.10,203.60 381.12,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#claisen-condensation-5-pair)"/><text x="24" y="235" font-size="16">Acidic work-up protonates the enolate; its resonance contributors are not separate intermediates.</text></g></g></svg>