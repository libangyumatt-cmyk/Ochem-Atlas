<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" role="img"><title>Acid-catalyzed alcohol dehydration: Heterolytic ionization</title><desc>(CH3)3C–OH2+ → (CH3)3C+ + H2O. The C–O bond pair leaves with water, generating the tertiary cation model.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="alcohol-dehydration-2-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="alcohol-dehydration-2-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Acid-catalyzed alcohol dehydration · 2</text><text x="24" y="65" font-size="17">Heterolytic ionization</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">(CH3)3</text><text x="113.28" y="155" font-size="24.00">C</text><text x="128.16" y="155" font-size="24.00">–</text><text x="143.04" y="155" font-size="24.00">OH2+</text><text x="665.00" y="155" font-size="24.00">(CH3)3C+ + H2O</text><path data-electrons="2" d="M146.76,141.60 Q159.78,98.60 172.80,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#alcohol-dehydration-2-pair)"/><text x="24" y="235" font-size="16">The C–O bond pair leaves with water, generating the tertiary cation model.</text></g></svg>