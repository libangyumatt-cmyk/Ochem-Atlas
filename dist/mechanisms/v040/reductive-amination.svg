<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 930"><title>Reductive amination: complete teaching sequence</title><g font-family="DejaVu Sans,sans-serif"><rect width="1200" height="350" fill="#fffefa"/><text x="25" y="32" font-size="21" fill="#203c43">Reductive amination · representative molecular graphs</text><path d="M351.33,234.89 L275.00,206.90" stroke="#203c43" stroke-width="2" fill="none"/><path d="M276.03,209.72 L199.70,237.71" stroke="#203c43" stroke-width="2" fill="none"/><path d="M273.97,204.09 L197.64,232.08" stroke="#203c43" stroke-width="2" fill="none"/><path d="M275.00,206.90 L275.00,126.11" stroke="#203c43" stroke-width="2" fill="none"/><rect x="336.33" y="224.89" width="30" height="20" fill="#fffefa"/><text x="351.33" y="239.89" font-size="16" text-anchor="middle" fill="#203c43">CH3</text><rect x="270.00" y="196.90" width="10" height="20" fill="#fffefa"/><text x="275.00" y="211.90" font-size="16" text-anchor="middle" fill="#203c43">C</text><rect x="193.67" y="224.89" width="10" height="20" fill="#fffefa"/><text x="198.67" y="239.89" font-size="16" text-anchor="middle" fill="#203c43">O</text><rect x="260.00" y="116.11" width="30" height="20" fill="#fffefa"/><text x="275.00" y="131.11" font-size="16" text-anchor="middle" fill="#203c43">CH3</text><path d="M980.78,242.07 L905.65,229.42" stroke="#203c43" stroke-width="2" fill="none"/><path d="M905.65,229.42 L849.22,280.50" stroke="#203c43" stroke-width="2" fill="none"/><path d="M905.65,229.42 L887.61,154.36" stroke="#203c43" stroke-width="2" fill="none"/><path d="M887.61,154.36 L899.42,80.50" stroke="#203c43" stroke-width="2" fill="none"/><rect x="965.78" y="232.07" width="30" height="20" fill="#fffefa"/><text x="980.78" y="247.07" font-size="16" text-anchor="middle" fill="#203c43">CH3</text><rect x="895.65" y="219.42" width="20" height="20" fill="#fffefa"/><text x="905.65" y="234.42" font-size="16" text-anchor="middle" fill="#203c43">CH</text><rect x="834.22" y="270.50" width="30" height="20" fill="#fffefa"/><text x="849.22" y="285.50" font-size="16" text-anchor="middle" fill="#203c43">CH3</text><rect x="877.61" y="144.36" width="20" height="20" fill="#fffefa"/><text x="887.61" y="159.36" font-size="16" text-anchor="middle" fill="#203c43">NH</text><rect x="884.42" y="70.50" width="30" height="20" fill="#fffefa"/><text x="899.42" y="85.50" font-size="16" text-anchor="middle" fill="#203c43">CH3</text><text x="580" y="180" font-size="32" fill="#203c43">→</text><text x="25" y="330" font-size="15" fill="#203c43">Representative substrate/product connectivity; other reagents/byproducts are in the equation. No computed geometry.</text></g><g transform="translate(0,350)"><title>Reductive amination: Mechanistic boundary / grouped stage</title><desc>Me2CO + MeNH2 + catalytic acid → Me2C=NMe / Me2C=N+HMe + H2O. Carbonyl protonation, N addition, carbinolamine proton relays and dehydration generate the imine/iminium pool; the complete shared condensation sequence is detailed in the existing imine entry.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="reductive-amination-1-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="reductive-amination-1-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Reductive amination · 1</text><text x="24" y="65" font-size="17">Mechanistic boundary / grouped stage</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">Me2CO + MeNH2 + catalytic acid</text><text x="665.00" y="155" font-size="24.00">Me2C=NMe / Me2C=N+HMe + H2O</text><text x="30" y="202" font-size="16">Process model: no unique microscopic electron-arrow sequence asserted.</text><text x="24" y="235" font-size="16">Carbonyl protonation, N addition, carbinolamine proton relays and dehydration generate the imine/iminium</text><text x="24" y="258" font-size="16">pool; the complete shared condensation sequence is detailed in the existing imine entry.</text></g></g><g transform="translate(0,640)"><title>Reductive amination: Nucleophilic carbonyl addition</title><desc>Me2C=N+HMe + B–H → Me2CH–NHMe + boron-derived species. A reagent B–H bond donates hydride to iminium carbon; C=N pi electrons return to N, directly giving neutral secondary amine.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="reductive-amination-2-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="reductive-amination-2-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Reductive amination · 2</text><text x="24" y="65" font-size="17">Nucleophilic carbonyl addition</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">Me2</text><text x="68.64" y="155" font-size="24.00">C</text><text x="83.52" y="155" font-size="24.00">=</text><text x="98.40" y="155" font-size="24.00">N+HMe</text><text x="172.80" y="155" font-size="24.00"> + B–</text><text x="247.20" y="155" font-size="24.00">H</text><text x="665.00" y="155" font-size="24.00">Me2CH–NHMe + boron-derived species</text><path data-electrons="2" d="M254.64,141.60 Q165.36,98.60 76.08,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#reductive-amination-2-pair)"/><path data-electrons="2" d="M105.84,141.60 Q120.72,203.60 135.60,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#reductive-amination-2-pair)"/><text x="24" y="235" font-size="16">A reagent B–H bond donates hydride to iminium carbon; C=N pi electrons return to N, directly giving neutral</text><text x="24" y="258" font-size="16">secondary amine.</text></g></g></svg>