y="155" font-size="24.00">C</text><text x="98.40" y="155" font-size="24.00">(=O)–</text><text x="172.80" y="155" font-size="24.00">Cl</text><text x="202.56" y="155" font-size="24.00">·AlCl3</text><text x="665.00" y="155" font-size="24.00">CH3–C+=O + AlCl4−</text><path data-electrons="2" d="M139.32,141.60 Q163.50,98.60 187.68,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#friedel-crafts-acylation-2-pair)"/><text x="24" y="235" font-size="16">Acyl C–Cl cleavage gives an acylium ion model; CH3–C+=O and CH3–C≡O+ are resonance contributors.</text></g></g><g transform="translate(0,930)"><title>Friedel–Crafts acylation: Coupled polar bond reorganization</title><desc>ring CH=CH–CH=CH–CH=CH–(back) + CH3–C+=O → [C6H6–COCH3]+. Arene pi electrons form the C–C bond to acylium carbon.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="friedel-crafts-acylation-3-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="friedel-crafts-acylation-3-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Friedel–Crafts acylation · 3</text><text x="24" y="65" font-size="17">Coupled polar bond reorganization</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="20.97">ring </text><text x="89.00" y="155" font-size="20.97">CH</text><text x="115.00" y="155" font-size="20.97">=</text><text x="128.00" y="155" font-size="20.97">CH</text><text x="154.00" y="155" font-size="20.97">–CH=CH–CH=CH–(back) + CH3–</text><text x="492.00" y="155" font-size="20.97">C+</text><text x="518.00" y="155" font-size="20.97">=O</text><text x="665.00" y="155" font-size="24.00">[C6H6–COCH3]+</text><path data-electrons="2" d="M121.50,142.66 Q313.25,99.66 505.00,138.66" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#friedel-crafts-acylation-3-pair)"/><text x="24" y="235" font-size="16">Arene pi electrons form the C–C bond to acylium carbon.</text></g></g><g transform="translate(0,1220)"><title>Friedel–Crafts acylation: Coupled polar bond reorganization</title><desc>ring C(H)(COCH3)–CH+–CH=CH–CH=CH–(back) + AlCl4− → C6H5COCH3·AlCl3 + HCl. Deprotonation rearomatizes; the product carbonyl binds available Lewis acid.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="friedel-crafts-acylation-4-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="friedel-crafts-acylation-4-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Friedel–Crafts acylation · 4</text><text x="24" y="65" font-size="17">Coupled polar bond reorganization</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="17.47">ring </text><text x="78.17" y="155" font-size="17.47">C</text><text x="89.00" y="155" font-size="17.47">(</text><text x="99.83" y="155" font-size="17.47">H</text><text x="110.67" y="155" font-size="17.47">)(COCH3)–</text><text x="208.17" y="155" font-size="17.47">CH+</text><text x="240.67" y="155" font-size="17.47">–CH=CH–CH=CH–(back) + </text><text x="479.00" y="155" font-size="17.47">AlCl4−</text><text x="665.00" y="155" font-size="24.00">C6H5COCH3·AlCl3 + HCl</text><path data-electrons="2" d="M511.50,143.88 Q308.37,100.88 105.25,139.88" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#friedel-crafts-acylation-4-pair)"/><path data-electrons="2" d="M94.42,143.88 Q124.21,205.88 154.00,139.88" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#friedel-crafts-acylation-4-pair)"/><text x="24" y="235" font-size="16">Deprotonation rearomatizes; the product carbonyl binds available Lewis acid.</text></g></g><g transform="translate(0,1510)"><title>Friedel–Crafts acylation: Mechanistic boundary / grouped stage</title><desc>C6H5COCH3·AlCl3 + aqueous work-up → C6H5COCH3 + hydrated aluminum species. Hydrolytic decomplexation releases acetophenone; counterions and proton relays are grouped.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="friedel-crafts-acylation-5-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="friedel-crafts-acylation-5-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Friedel–Crafts acylation · 5</text><text x="24" y="65" font-size="17">Mechanistic boundary / grouped stage</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">C6H5COCH3·AlCl3 + aqueous work-up</text><text x="665.00" y="155" font-size="22.23">C6H5COCH3 + hydrated aluminum species</text><text x="30" y="202" font-size="16">Process model: no unique microscopic electron-arrow sequence asserted.</text><text x="24" y="235" font-size="16">Hydrolytic decomplexation releases acetophenone; counterions and proton relays are grouped.</text></g></g></svg>