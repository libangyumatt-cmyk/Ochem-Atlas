<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" role="img"><title>Wittig olefination: Oxaphosphetane fragmentation</title><desc>Ring Ph–CH–O–P(Ph)3–CH2–(back to a) → PhCH=CH2 + Ph3P=O. Coupled C–O/C–P cleavage forms alkene and phosphine oxide. No freely rotating carbocation intermediate is inserted.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="wittig-3-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="wittig-3-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Wittig olefination · 3</text><text x="24" y="65" font-size="17">Oxaphosphetane fragmentation</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="23.96">Ring Ph–</text><text x="142.86" y="155" font-size="23.96">CH</text><text x="172.57" y="155" font-size="23.96">–</text><text x="187.43" y="155" font-size="23.96">O</text><text x="202.29" y="155" font-size="23.96">–</text><text x="217.14" y="155" font-size="23.96">P</text><text x="232.00" y="155" font-size="23.96">(Ph)3–</text><text x="321.14" y="155" font-size="23.96">CH2</text><text x="365.71" y="155" font-size="23.96">–(back to a)</text><text x="665.00" y="155" font-size="24.00">PhCH=CH2 + Ph3P=O</text><path data-electrons="2" d="M176.29,141.61 Q213.43,98.61 250.57,137.61" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#wittig-3-pair)"/><path data-electrons="2" d="M284.00,141.61 Q246.86,203.61 209.71,137.61" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#wittig-3-pair)"/><text x="24" y="235" font-size="16">Coupled C–O/C–P cleavage forms alkene and phosphine oxide. No freely rotating carbocation intermediate is inserted.</text></g></svg>