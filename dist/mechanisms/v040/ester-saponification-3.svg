<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" role="img"><title>Ester saponification: Proton transfer</title><desc>CH3CO2–H + EtO− → CH3CO2− + EtOH. Ethoxide deprotonates the carboxylic acid; acid work-up, if desired, reverses only this protonation state.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="ester-saponification-3-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="ester-saponification-3-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Ester saponification · 3</text><text x="24" y="65" font-size="17">Proton transfer</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">CH3CO2–</text><text x="128.16" y="155" font-size="24.00">H</text><text x="143.04" y="155" font-size="24.00"> + Et</text><text x="217.44" y="155" font-size="24.00">O−</text><text x="665.00" y="155" font-size="24.00">CH3CO2− + EtOH</text><path data-electrons="2" d="M232.32,141.60 Q183.96,98.60 135.60,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#ester-saponification-3-pair)"/><text x="24" y="235" font-size="16">Ethoxide deprotonates the carboxylic acid; acid work-up, if desired, reverses only this protonation state.</text></g></svg>