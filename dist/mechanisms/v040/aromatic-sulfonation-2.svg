<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" role="img"><title>Aromatic sulfonation: Coupled polar bond reorganization</title><desc>ring C(H)(SO3−)–CH+–CH=CH–CH=CH–(back) + :solvent → C6H5SO3H + solvent. Solvent-mediated loss of ring H restores aromaticity; protonation of sulfonate gives the sulfonic acid. Proton relays are grouped.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="aromatic-sulfonation-2-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="aromatic-sulfonation-2-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Aromatic sulfonation · 2</text><text x="24" y="65" font-size="17">Coupled polar bond reorganization</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="17.12">ring </text><text x="77.06" y="155" font-size="17.12">C</text><text x="87.67" y="155" font-size="17.12">(</text><text x="98.29" y="155" font-size="17.12">H</text><text x="108.90" y="155" font-size="17.12">)(SO3−)–</text><text x="193.80" y="155" font-size="17.12">CH+</text><text x="225.63" y="155" font-size="17.12">–CH=CH–CH=CH–(back) + </text><text x="459.10" y="155" font-size="17.12">:solvent</text><text x="665.00" y="155" font-size="24.00">C6H5SO3H + solvent</text><path data-electrons="2" d="M501.55,144.01 Q302.57,101.01 103.59,140.01" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#aromatic-sulfonation-2-pair)"/><path data-electrons="2" d="M92.98,144.01 Q119.51,206.01 146.04,140.01" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#aromatic-sulfonation-2-pair)"/><text x="24" y="235" font-size="16">Solvent-mediated loss of ring H restores aromaticity; protonation of sulfonate gives the sulfonic acid. Proton relays are grouped.</text></g></svg>