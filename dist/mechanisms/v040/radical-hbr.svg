<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1510"><title>Peroxide-initiated radical HBr addition: complete teaching sequence</title><g font-family="DejaVu Sans,sans-serif"><rect width="1200" height="350" fill="#fffefa"/><text x="25" y="32" font-size="21" fill="#203c43">Peroxide-initiated radical HBr addition · representative molecular graphs</text><path d="M339.95,219.45 L262.88,200.71" stroke="#203c43" stroke-width="2" fill="none"/><path d="M260.64,202.70 L207.81,143.54" stroke="#203c43" stroke-width="2" fill="none"/><path d="M265.12,198.71 L212.29,139.55" stroke="#203c43" stroke-width="2" fill="none"/><rect x="324.95" y="209.45" width="30" height="20" fill="#fffefa"/><text x="339.95" y="224.45" font-size="16" text-anchor="middle" fill="#203c43">CH3</text><rect x="252.88" y="190.71" width="20" height="20" fill="#fffefa"/><text x="262.88" y="205.71" font-size="16" text-anchor="middle" fill="#203c43">CH</text><rect x="195.05" y="131.55" width="30" height="20" fill="#fffefa"/><text x="210.05" y="146.55" font-size="16" text-anchor="middle" fill="#203c43">CH2</text><path d="M986.07,251.57 L906.46,246.18" stroke="#203c43" stroke-width="2" fill="none"/><path d="M906.46,246.18 L849.32,189.04" stroke="#203c43" stroke-width="2" fill="none"/><path d="M849.32,189.04 L843.93,109.43" stroke="#203c43" stroke-width="2" fill="none"/><rect x="971.07" y="241.57" width="30" height="20" fill="#fffefa"/><text x="986.07" y="256.57" font-size="16" text-anchor="middle" fill="#203c43">CH3</text><rect x="891.46" y="236.18" width="30" height="20" fill="#fffefa"/><text x="906.46" y="251.18" font-size="16" text-anchor="middle" fill="#203c43">CH2</text><rect x="834.32" y="179.04" width="30" height="20" fill="#fffefa"/><text x="849.32" y="194.04" font-size="16" text-anchor="middle" fill="#203c43">CH2</text><rect x="833.93" y="99.43" width="20" height="20" fill="#fffefa"/><text x="843.93" y="114.43" font-size="16" text-anchor="middle" fill="#203c43">Br</text><text x="580" y="180" font-size="32" fill="#203c43">→</text><text x="25" y="330" font-size="15" fill="#203c43">Representative substrate/product connectivity; other reagents/byproducts are in the equation. No computed geometry.</text></g><g transform="translate(0,350)"><title>Peroxide-initiated radical HBr addition: Initiator homolysis</title><desc>R–O–O–R → 2 RO•. Initiator O–O homolysis supplies radicals; each O takes one electron. RO groups are the specified initiator fragments.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="radical-hbr-1-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="radical-hbr-1-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Peroxide-initiated radical HBr addition · 1</text><text x="24" y="65" font-size="17">Initiator homolysis</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">R–</text><text x="53.76" y="155" font-size="24.00">O</text><text x="68.64" y="155" font-size="24.00">–</text><text x="83.52" y="155" font-size="24.00">O</text><text x="98.40" y="155" font-size="24.00">–R</text><text x="665.00" y="155" font-size="24.00">2 RO•</text><path data-electrons="1" d="M76.08,141.60 Q68.64,98.60 61.20,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#radical-hbr-1-fish)"/><path data-electrons="1" d="M76.08,141.60 Q83.52,203.60 90.96,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#radical-hbr-1-fish)"/><text x="24" y="235" font-size="16">Initiator O–O homolysis supplies radicals; each O takes one electron. RO groups are the specified initiator</text><text x="24" y="258" font-size="16">fragments.</text></g></g><g transform="translate(0,640)"><title>Peroxide-initiated radical HBr addition: Radical atom transfer</title><desc>RO• + H–Br → ROH + Br•. Alkoxy radical abstracts H from HBr to create the chain carrier.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="radical-hbr-2-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="radical-hbr-2-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Peroxide-initiated radical HBr addition · 2</text><text x="24" y="65" font-size="17">Radical atom transfer</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">RO•</text><text x="68.64" y="155" font-size="24.00"> + </text><text x="113.28" y="155" font-size="24.00">H</text><text x="128.16" y="155" font-size="24.00">–</text><text x="143.04" y="155" font-size="24.00">Br</text><text x="665.00" y="155" font-size="24.00">ROH + Br•</text><path data-electrons="1" d="M46.32,141.60 Q64.92,98.60 83.52,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#radical-hbr-2-fish)"/><path data-electrons="1" d="M139.32,141.60 Q111.42,203.60 83.52,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#radical-hbr-2-fish)"/><path data-electrons="1" d="M139.32,141.60 Q148.62,80.60 157.92,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#radical-hbr-2-fish)"/><text x="24" y="235" font-size="16">Alkoxy radical abstracts H from HBr to create the chain carrier.</text></g></g><g transform="translate(0,930)"><title>Peroxide-initiated radical HBr addition: Radical bond formation</title><desc>Br• + CH3–CH=CH2 → CH3CH•CH2Br. Br radical adds at terminal carbon; the other pi electron remains at the more substituted carbon.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="radical-hbr-3-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="radical-hbr-3-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Peroxide-initiated radical HBr addition · 3</text><text x="24" y="65" font-size="17">Radical bond formation</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">Br•</text><text x="68.64" y="155" font-size="24.00"> + CH3–</text><text x="172.80" y="155" font-size="24.00">CH</text><text x="202.56" y="155" font-size="24.00">=</text><text x="217.44" y="155" font-size="24.00">CH2</text><text x="665.00" y="155" font-size="24.00">CH3CH•CH2Br</text><path data-electrons="1" d="M46.32,141.60 Q94.68,98.60 143.04,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#radical-hbr-3-fish)"/><path data-electrons="1" d="M213.72,141.60 Q178.38,203.60 143.04,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#radical-hbr-3-fish)"/><path data-electrons="1" d="M213.72,141.60 Q200.70,80.60 187.68,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#radical-hbr-3-fish)"/><text x="24" y="235" font-size="16">Br radical adds at terminal carbon; the other pi electron remains at the more substituted carbon.</text></g></g><g transform="translate(0,1220)"><title>Peroxide-initiated radical HBr addition: Radical atom transfer</title><desc>CH3–CH•–CH2Br + H–Br → CH3CH2CH2Br + Br•. The carbon radical abstracts H from HBr, regenerating Br• for the preceding propagation step.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="radical-hbr-4-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="radical-hbr-4-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Peroxide-initiated radical HBr addition · 4</text><text x="24" y="65" font-size="17">Radical atom transfer</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">CH3–</text><text x="83.52" y="155" font-size="24.00">CH•</text><text x="128.16" y="155" font-size="24.00">–CH2Br + </text><text x="262.08" y="155" font-size="24.00">H</text><text x="276.96" y="155" font-size="24.00">–</text><text x="291.84" y="155" font-size="24.00">Br</text><text x="665.00" y="155" font-size="24.00">CH3CH2CH2Br + Br•</text><path data-electrons="1" d="M105.84,141.60 Q146.76,98.60 187.68,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#radical-hbr-4-fish)"/><path data-electrons="1" d="M288.12,141.60 Q237.90,203.60 187.68,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#radical-hbr-4-fish)"/><path data-electrons="1" d="M288.12,141.60 Q297.42,80.60 306.72,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#radical-hbr-4-fish)"/><text x="24" y="235" font-size="16">The carbon radical abstracts H from HBr, regenerating Br• for the preceding propagation step.</text></g></g></svg>