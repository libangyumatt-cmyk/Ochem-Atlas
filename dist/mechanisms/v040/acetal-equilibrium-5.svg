<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" role="img"><title>Acetal formation and hydrolysis: Heterolytic ionization</title><desc>CH3CH(OMe)–OH2+ → [CH3CH(OMe)]+ + H2O. Water departure gives an oxygen-stabilized oxocarbenium model, not an unqualified alkyl carbocation.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="acetal-equilibrium-5-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="acetal-equilibrium-5-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Acetal formation and hydrolysis · 5</text><text x="24" y="65" font-size="17">Heterolytic ionization</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">CH3</text><text x="68.64" y="155" font-size="24.00">CH</text><text x="98.40" y="155" font-size="24.00">(OMe)–</text><text x="187.68" y="155" font-size="24.00">OH2+</text><text x="665.00" y="155" font-size="24.00">[CH3CH(OMe)]+ + H2O</text><path data-electrons="2" d="M150.48,141.60 Q183.96,98.60 217.44,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#acetal-equilibrium-5-pair)"/><text x="24" y="235" font-size="16">Water departure gives an oxygen-stabilized oxocarbenium model, not an unqualified alkyl carbocation.</text></g></svg>