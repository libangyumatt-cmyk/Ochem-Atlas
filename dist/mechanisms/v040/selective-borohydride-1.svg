<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" role="img"><title>Chemoselective borohydride ketone reduction: Nucleophilic carbonyl addition</title><desc>EtO2C–C6H4–C(=O)Me + B–H → EtO2C–C6H4–CH(O−)Me + boron species. A B–H pair donates to ketone carbon; ketone pi electrons move to oxygen. The remote ester is retained.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="selective-borohydride-1-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="selective-borohydride-1-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Chemoselective borohydride ketone reduction · 1</text><text x="24" y="65" font-size="17">Nucleophilic carbonyl addition</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">EtO2C–C6H4–</text><text x="187.68" y="155" font-size="24.00">C</text><text x="202.56" y="155" font-size="24.00">(=</text><text x="232.32" y="155" font-size="24.00">O</text><text x="247.20" y="155" font-size="24.00">)Me + </text><text x="336.48" y="155" font-size="24.00">B</text><text x="351.36" y="155" font-size="24.00">–</text><text x="366.24" y="155" font-size="24.00">H</text><text x="665.00" y="155" font-size="23.50">EtO2C–C6H4–CH(O−)Me + boron species</text><path data-electrons="2" d="M358.80,141.60 Q276.96,98.60 195.12,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#selective-borohydride-1-pair)"/><path data-electrons="2" d="M217.44,141.60 Q228.60,203.60 239.76,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#selective-borohydride-1-pair)"/><text x="24" y="235" font-size="16">A B–H pair donates to ketone carbon; ketone pi electrons move to oxygen. The remote ester is retained.</text></g></svg>