<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 2090"><title>Hydrazone formation: complete teaching sequence</title><g font-family="DejaVu Sans,sans-serif"><rect width="1200" height="350" fill="#fffefa"/><text x="25" y="32" font-size="21" fill="#203c43">Hydrazone formation · representative molecular graphs</text><path d="M351.33,234.89 L275.00,206.90" stroke="#203c43" stroke-width="2" fill="none"/><path d="M276.03,209.72 L199.70,237.71" stroke="#203c43" stroke-width="2" fill="none"/><path d="M273.97,204.09 L197.64,232.08" stroke="#203c43" stroke-width="2" fill="none"/><path d="M275.00,206.90 L275.00,126.11" stroke="#203c43" stroke-width="2" fill="none"/><rect x="336.33" y="224.89" width="30" height="20" fill="#fffefa"/><text x="351.33" y="239.89" font-size="16" text-anchor="middle" fill="#203c43">CH3</text><rect x="270.00" y="196.90" width="10" height="20" fill="#fffefa"/><text x="275.00" y="211.90" font-size="16" text-anchor="middle" fill="#203c43">C</text><rect x="193.67" y="224.89" width="10" height="20" fill="#fffefa"/><text x="198.67" y="239.89" font-size="16" text-anchor="middle" fill="#203c43">O</text><rect x="260.00" y="116.11" width="30" height="20" fill="#fffefa"/><text x="275.00" y="131.11" font-size="16" text-anchor="middle" fill="#203c43">CH3</text><path d="M980.78,242.07 L905.65,229.42" stroke="#203c43" stroke-width="2" fill="none"/><path d="M905.65,229.42 L849.22,280.50" stroke="#203c43" stroke-width="2" fill="none"/><path d="M902.73,230.12 L884.69,155.06" stroke="#203c43" stroke-width="2" fill="none"/><path d="M908.57,228.72 L890.53,153.65" stroke="#203c43" stroke-width="2" fill="none"/><path d="M887.61,154.36 L899.42,80.50" stroke="#203c43" stroke-width="2" fill="none"/><rect x="965.78" y="232.07" width="30" height="20" fill="#fffefa"/><text x="980.78" y="247.07" font-size="16" text-anchor="middle" fill="#203c43">CH3</text><rect x="900.65" y="219.42" width="10" height="20" fill="#fffefa"/><text x="905.65" y="234.42" font-size="16" text-anchor="middle" fill="#203c43">C</text><rect x="834.22" y="270.50" width="30" height="20" fill="#fffefa"/><text x="849.22" y="285.50" font-size="16" text-anchor="middle" fill="#203c43">CH3</text><rect x="882.61" y="144.36" width="10" height="20" fill="#fffefa"/><text x="887.61" y="159.36" font-size="16" text-anchor="middle" fill="#203c43">N</text><rect x="884.42" y="70.50" width="30" height="20" fill="#fffefa"/><text x="899.42" y="85.50" font-size="16" text-anchor="middle" fill="#203c43">NH2</text><text x="580" y="180" font-size="32" fill="#203c43">→</text><text x="25" y="330" font-size="15" fill="#203c43">Representative substrate/product connectivity; other reagents/byproducts are in the equation. No computed geometry.</text></g><g transform="translate(0,350)"><title>Hydrazone formation: Proton transfer</title><desc>Me2C=O: + H–OH2+ → Me2C=OH+ + H2O. Carbonyl oxygen accepts a proton.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="hydrazone-formation-1-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="hydrazone-formation-1-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Hydrazone formation · 1</text><text x="24" y="65" font-size="17">Proton transfer</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">Me2C=</text><text x="98.40" y="155" font-size="24.00">O:</text><text x="128.16" y="155" font-size="24.00"> + </text><text x="172.80" y="155" font-size="24.00">H</text><text x="187.68" y="155" font-size="24.00">–</text><text x="202.56" y="155" font-size="24.00">OH2+</text><text x="665.00" y="155" font-size="24.00">Me2C=OH+ + H2O</text><path data-electrons="2" d="M113.28,141.60 Q146.76,98.60 180.24,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#hydrazone-formation-1-pair)"/><path data-electrons="2" d="M206.28,141.60 Q219.30,203.60 232.32,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#hydrazone-formation-1-pair)"/><text x="24" y="235" font-size="16">Carbonyl oxygen accepts a proton.</text></g></g><g transform="translate(0,640)"><title>Hydrazone formation: Nucleophilic carbonyl addition</title><desc>Me2C=OH+ + :NH2NH2 → Me2C(OH)(NH2+–NH2). Nitrogen attacks carbonyl carbon; the C=O pi pair returns to O, giving the carbinolammonium form.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="hydrazone-formation-2-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="hydrazone-formation-2-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Hydrazone formation · 2</text><text x="24" y="65" font-size="17">Nucleophilic carbonyl addition</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">Me2</text><text x="68.64" y="155" font-size="24.00">C</text><text x="83.52" y="155" font-size="24.00">=</text><text x="98.40" y="155" font-size="24.00">OH+</text><text x="143.04" y="155" font-size="24.00"> + </text><text x="187.68" y="155" font-size="24.00">:NH2NH2</text><text x="665.00" y="155" font-size="24.00">Me2C(OH)(NH2+–NH2)</text><path data-electrons="2" d="M239.76,141.60 Q157.92,98.60 76.08,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#hydrazone-formation-2-pair)"/><path data-electrons="2" d="M98.40,141.60 Q109.56,203.60 120.72,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#hydrazone-formation-2-pair)"/><text x="24" y="235" font-size="16">Nitrogen attacks carbonyl carbon; the C=O pi pair returns to O, giving the carbinolammonium form.</text></g></g><g transform="translate(0,930)"><title>Hydrazone formation: Proton transfer</title><desc>Me2C(OH)–N+(H)(NH2)–H + :OH2 → Me2C(OH)(NH–NH2) + H3O+. Water removes one N-bound proton.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="hydrazone-formation-3-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="hydrazone-formation-3-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Hydrazone formation · 3</text><text x="24" y="65" font-size="17">Proton transfer</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">Me2C(OH)–</text><text x="157.92" y="155" font-size="24.00">N+</text><text x="187.68" y="155" font-size="24.00">(H)(NH2)–</text><text x="321.60" y="155" font-size="24.00">H</text><text x="336.48" y="155" font-size="24.00"> + </text><text x="381.12" y="155" font-size="24.00">:OH2</text><text x="665.00" y="155" font-size="24.00">Me2C(OH)(NH–NH2) + H3O+</text><path data-electrons="2" d="M410.88,141.60 Q369.96,98.60 329.04,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#hydrazone-formation-3-pair)"/><path data-electrons="2" d="M250.92,141.60 Q211.86,203.60 172.80,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#hydrazone-formation-3-pair)"/><text x="24" y="235" font-size="16">Water removes one N-bound proton.</text></g></g><g transform="translate(0,1220)"><title>Hydrazone formation: Proton transfer</title><desc>Me2C(O:H)(NH–NH2) + H–OH2+ → Me2C(OH2+)(NH–NH2) + H2O. Protonation makes the hydroxyl group a water leaving group.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="hydrazone-formation-4-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="hydrazone-formation-4-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Hydrazone formation · 4</text><text x="24" y="65" font-size="17">Proton transfer</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">Me2C(</text><text x="98.40" y="155" font-size="24.00">O:H</text><text x="143.04" y="155" font-size="24.00">)(NH–NH2) + </text><text x="321.60" y="155" font-size="24.00">H</text><text x="336.48" y="155" font-size="24.00">–</text><text x="351.36" y="155" font-size="24.00">OH2+</text><text x="665.00" y="155" font-size="24.00">Me2C(OH2+)(NH–NH2) + H2O</text><path data-electrons="2" d="M120.72,141.60 Q224.88,98.60 329.04,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#hydrazone-formation-4-pair)"/><path data-electrons="2" d="M355.08,141.60 Q368.10,203.60 381.12,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#hydrazone-formation-4-pair)"/><text x="24" y="235" font-size="16">Protonation makes the hydroxyl group a water leaving group.</text></g></g><g transform="translate(0,1510)"><title>Hydrazone formation: Tetrahedral intermediate collapse</title><desc>Me2C(OH2+)–N:(H)–NH2 → Me2C=N+(H)–NH2 + H2O. Nitrogen lone-pair donation forms C=N as water leaves.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="hydrazone-formation-5-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="hydrazone-formation-5-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Hydrazone formation · 5</text><text x="24" y="65" font-size="17">Tetrahedral intermediate collapse</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">Me2</text><text x="68.64" y="155" font-size="24.00">C</text><text x="83.52" y="155" font-size="24.00">(</text><text x="98.40" y="155" font-size="24.00">OH2+</text><text x="157.92" y="155" font-size="24.00">)–</text><text x="187.68" y="155" font-size="24.00">N:</text><text x="217.44" y="155" font-size="24.00">(H)–NH2</text><text x="665.00" y="155" font-size="24.00">Me2C=N+(H)–NH2 + H2O</text><path data-electrons="2" d="M202.56,141.60 Q170.94,98.60 139.32,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#hydrazone-formation-5-pair)"/><path data-electrons="2" d="M102.12,141.60 Q115.14,203.60 128.16,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#hydrazone-formation-5-pair)"/><text x="24" y="235" font-size="16">Nitrogen lone-pair donation forms C=N as water leaves.</text></g></g><g transform="translate(0,1800)"><title>Hydrazone formation: Proton transfer</title><desc>Me2C=N+(NH2)–H + :OH2 → Me2C=N–NH2 + H3O+. Water removes the remaining iminium N–H proton.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="hydrazone-formation-6-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="hydrazone-formation-6-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Hydrazone formation · 6</text><text x="24" y="65" font-size="17">Proton transfer</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">Me2C=</text><text x="98.40" y="155" font-size="24.00">N+</text><text x="128.16" y="155" font-size="24.00">(NH2)–</text><text x="217.44" y="155" font-size="24.00">H</text><text x="232.32" y="155" font-size="24.00"> + </text><text x="276.96" y="155" font-size="24.00">:OH2</text><text x="665.00" y="155" font-size="24.00">Me2C=N–NH2 + H3O+</text><path data-electrons="2" d="M306.72,141.60 Q265.80,98.60 224.88,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#hydrazone-formation-6-pair)"/><path data-electrons="2" d="M169.08,141.60 Q141.18,203.60 113.28,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#hydrazone-formation-6-pair)"/><text x="24" y="235" font-size="16">Water removes the remaining iminium N–H proton.</text></g></g></svg>