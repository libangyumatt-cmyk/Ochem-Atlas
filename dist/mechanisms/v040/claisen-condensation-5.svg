<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" role="img"><title>Claisen ester condensation: Proton transfer</title><desc>[EtO2C–CH–COCH3]− + H–OH2+ → EtO2CCH2COCH3 + H2O. Acidic work-up protonates the enolate; its resonance contributors are not separate intermediates.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="claisen-condensation-5-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="claisen-condensation-5-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Claisen ester condensation · 5</text><text x="24" y="65" font-size="17">Proton transfer</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">[EtO2C–</text><text x="128.16" y="155" font-size="24.00">CH</text><text x="157.92" y="155" font-size="24.00">–COCH3]− + </text><text x="321.60" y="155" font-size="24.00">H</text><text x="336.48" y="155" font-size="24.00">–</text><text x="351.36" y="155" font-size="24.00">OH2+</text><text x="665.00" y="155" font-size="24.00">EtO2CCH2COCH3 + H2O</text><path data-electrons="2" d="M143.04,141.60 Q236.04,98.60 329.04,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#claisen-condensation-5-pair)"/><path data-electrons="2" d="M355.08,141.60 Q368.10,203.60 381.12,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#claisen-condensation-5-pair)"/><text x="24" y="235" font-size="16">Acidic work-up protonates the enolate; its resonance contributors are not separate intermediates.</text></g></svg>