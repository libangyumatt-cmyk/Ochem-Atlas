<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" role="img"><title>Carbonyl–ene reaction: Concerted bond formation and allylic-H transfer</title><desc>H–CH2–CH=CH2 + CH2=O → HOCH2CH2CH=CH2. Alkene pi forms C–C to carbonyl carbon; C=O pi takes the allylic H; the allylic C–H pair forms the shifted C=C through a six-electron cycle.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="ene-reaction-1-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="ene-reaction-1-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Carbonyl–ene reaction · 1</text><text x="24" y="65" font-size="17">Concerted bond formation and allylic-H transfer</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">H</text><text x="38.88" y="155" font-size="24.00">–</text><text x="53.76" y="155" font-size="24.00">CH2</text><text x="98.40" y="155" font-size="24.00">–</text><text x="113.28" y="155" font-size="24.00">CH</text><text x="143.04" y="155" font-size="24.00">=</text><text x="157.92" y="155" font-size="24.00">CH2</text><text x="202.56" y="155" font-size="24.00"> + </text><text x="247.20" y="155" font-size="24.00">CH2</text><text x="291.84" y="155" font-size="24.00">=</text><text x="306.72" y="155" font-size="24.00">O</text><text x="665.00" y="155" font-size="24.00">HOCH2CH2CH=CH2</text><path data-electrons="2" d="M154.20,141.60 Q189.54,98.60 224.88,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#ene-reaction-1-pair)"/><path data-electrons="2" d="M291.84,141.60 Q232.32,203.60 172.80,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#ene-reaction-1-pair)"/><path data-electrons="2" d="M53.76,141.60 Q77.94,80.60 102.12,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#ene-reaction-1-pair)"/><text x="24" y="235" font-size="16">Alkene pi forms C–C to carbonyl carbon; C=O pi takes the allylic H; the allylic C–H pair forms the shifted</text><text x="24" y="258" font-size="16">C=C through a six-electron cycle.</text></g></svg>