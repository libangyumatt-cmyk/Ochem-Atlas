<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" role="img"><title>Michael conjugate addition: Conjugate C–C bond formation</title><desc>CH3CO–CH2− + CH2=CH–COCH3 → CH3COCH2CH2CH−COCH3. Enolate carbon attacks the enone beta carbon; the enone pi pair shifts to alpha carbon in the C-anion contributor.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="michael-addition-2-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="michael-addition-2-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Michael conjugate addition · 2</text><text x="24" y="65" font-size="17">Conjugate C–C bond formation</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">CH3CO–</text><text x="113.28" y="155" font-size="24.00">CH2−</text><text x="172.80" y="155" font-size="24.00"> + </text><text x="217.44" y="155" font-size="24.00">CH2</text><text x="262.08" y="155" font-size="24.00">=</text><text x="276.96" y="155" font-size="24.00">CH</text><text x="306.72" y="155" font-size="24.00">–COCH3</text><text x="665.00" y="155" font-size="24.00">CH3COCH2CH2CH−COCH3</text><path data-electrons="2" d="M143.04,141.60 Q191.40,98.60 239.76,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#michael-addition-2-pair)"/><path data-electrons="2" d="M265.80,141.60 Q278.82,203.60 291.84,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#michael-addition-2-pair)"/><text x="24" y="235" font-size="16">Enolate carbon attacks the enone beta carbon; the enone pi pair shifts to alpha carbon in the C-anion</text><text x="24" y="258" font-size="16">contributor.</text></g></svg>