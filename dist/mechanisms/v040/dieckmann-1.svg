<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" role="img"><title>Dieckmann cyclization: Proton transfer</title><desc>EtO2C–CH(H)–(CH2)3–CO2Et + :OEt− → Diester carbon enolate + EtOH. Base removes an alpha proton from one ester end; the remaining chain is retained.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="dieckmann-1-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="dieckmann-1-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Dieckmann cyclization · 1</text><text x="24" y="65" font-size="17">Proton transfer</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">EtO2C–</text><text x="113.28" y="155" font-size="24.00">CH</text><text x="143.04" y="155" font-size="24.00">(</text><text x="157.92" y="155" font-size="24.00">H</text><text x="172.80" y="155" font-size="24.00">)–(CH2)3–CO2Et + </text><text x="425.76" y="155" font-size="24.00">:OEt−</text><text x="665.00" y="155" font-size="24.00">Diester carbon enolate + EtOH</text><path data-electrons="2" d="M462.96,141.60 Q314.16,98.60 165.36,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#dieckmann-1-pair)"/><path data-electrons="2" d="M146.76,141.60 Q137.46,203.60 128.16,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#dieckmann-1-pair)"/><text x="24" y="235" font-size="16">Base removes an alpha proton from one ester end; the remaining chain is retained.</text></g></svg>