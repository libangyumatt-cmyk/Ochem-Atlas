<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" role="img"><title>PCC alcohol oxidation: Mechanistic boundary / grouped stage</title><desc>PhCH2OH + Cr(VI) reagent → PhCH2–O–Cr(VI) ester model. Alcohol oxygen forms a chromate ester after ligand exchange/proton transfers. The chromium speciation is grouped.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="pcc-oxidation-1-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="pcc-oxidation-1-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">PCC alcohol oxidation · 1</text><text x="24" y="65" font-size="17">Mechanistic boundary / grouped stage</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">PhCH2OH + Cr(VI) reagent</text><text x="665.00" y="155" font-size="24.00">PhCH2–O–Cr(VI) ester model</text><text x="30" y="202" font-size="16">Process model: no unique microscopic electron-arrow sequence asserted.</text><text x="24" y="235" font-size="16">Alcohol oxygen forms a chromate ester after ligand exchange/proton transfers. The chromium speciation is</text><text x="24" y="258" font-size="16">grouped.</text></g></svg>