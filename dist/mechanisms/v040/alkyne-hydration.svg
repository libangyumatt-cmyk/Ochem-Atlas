<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1800"><title>Mercury-catalyzed alkyne hydration: complete teaching sequence</title><g font-family="DejaVu Sans,sans-serif"><rect width="1200" height="350" fill="#fffefa"/><text x="25" y="32" font-size="21" fill="#203c43">Mercury-catalyzed alkyne hydration · representative molecular graphs</text><path d="M339.95,219.45 L262.88,200.71" stroke="#203c43" stroke-width="2" fill="none"/><path d="M259.75,203.50 L206.92,144.34" stroke="#203c43" stroke-width="2" fill="none"/><path d="M262.88,200.71 L210.05,141.55" stroke="#203c43" stroke-width="2" fill="none"/><path d="M266.01,197.91 L213.18,138.75" stroke="#203c43" stroke-width="2" fill="none"/><rect x="324.95" y="209.45" width="30" height="20" fill="#fffefa"/><text x="339.95" y="224.45" font-size="16" text-anchor="middle" fill="#203c43">CH3</text><rect x="257.88" y="190.71" width="10" height="20" fill="#fffefa"/><text x="262.88" y="205.71" font-size="16" text-anchor="middle" fill="#203c43">C</text><rect x="200.05" y="131.55" width="20" height="20" fill="#fffefa"/><text x="210.05" y="146.55" font-size="16" text-anchor="middle" fill="#203c43">CH</text><path d="M991.33,234.89 L915.00,206.90" stroke="#203c43" stroke-width="2" fill="none"/><path d="M916.03,209.72 L839.70,237.71" stroke="#203c43" stroke-width="2" fill="none"/><path d="M913.97,204.09 L837.64,232.08" stroke="#203c43" stroke-width="2" fill="none"/><path d="M915.00,206.90 L915.00,126.11" stroke="#203c43" stroke-width="2" fill="none"/><rect x="976.33" y="224.89" width="30" height="20" fill="#fffefa"/><text x="991.33" y="239.89" font-size="16" text-anchor="middle" fill="#203c43">CH3</text><rect x="910.00" y="196.90" width="10" height="20" fill="#fffefa"/><text x="915.00" y="211.90" font-size="16" text-anchor="middle" fill="#203c43">C</text><rect x="833.67" y="224.89" width="10" height="20" fill="#fffefa"/><text x="838.67" y="239.89" font-size="16" text-anchor="middle" fill="#203c43">O</text><rect x="900.00" y="116.11" width="30" height="20" fill="#fffefa"/><text x="915.00" y="131.11" font-size="16" text-anchor="middle" fill="#203c43">CH3</text><text x="580" y="180" font-size="32" fill="#203c43">→</text><text x="25" y="330" font-size="15" fill="#203c43">Representative substrate/product connectivity; other reagents/byproducts are in the equation. No computed geometry.</text></g><g transform="translate(0,350)"><title>Mercury-catalyzed alkyne hydration: Mechanistic boundary / grouped stage</title><desc>CH3C≡CH + Hg2+ → Pi-coordinated alkyne–Hg2+ model. Mercury activates the alkyne; free high-energy vinyl cation formation is not asserted.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="alkyne-hydration-1-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="alkyne-hydration-1-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Mercury-catalyzed alkyne hydration · 1</text><text x="24" y="65" font-size="17">Mechanistic boundary / grouped stage</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">CH3C≡CH + Hg2+</text><text x="665.00" y="155" font-size="24.00">Pi-coordinated alkyne–Hg2+ model</text><text x="30" y="202" font-size="16">Process model: no unique microscopic electron-arrow sequence asserted.</text><text x="24" y="235" font-size="16">Mercury activates the alkyne; free high-energy vinyl cation formation is not asserted.</text></g></g><g transform="translate(0,640)"><title>Mercury-catalyzed alkyne hydration: Mechanistic boundary / grouped stage</title><desc>Activated alkyne + H2O → Hydroxyvinylmercury intermediate + H+. Water addition, deprotonation and organomercury bonding are grouped; detailed speciation depends on acid and counterions.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="alkyne-hydration-2-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="alkyne-hydration-2-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Mercury-catalyzed alkyne hydration · 2</text><text x="24" y="65" font-size="17">Mechanistic boundary / grouped stage</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">Activated alkyne + H2O</text><text x="665.00" y="155" font-size="22.23">Hydroxyvinylmercury intermediate + H+</text><text x="30" y="202" font-size="16">Process model: no unique microscopic electron-arrow sequence asserted.</text><text x="24" y="235" font-size="16">Water addition, deprotonation and organomercury bonding are grouped; detailed speciation depends on acid and</text><text x="24" y="258" font-size="16">counterions.</text></g></g><g transform="translate(0,930)"><title>Mercury-catalyzed alkyne hydration: Mechanistic boundary / grouped stage</title><desc>Hydroxyvinylmercury intermediate + H+ → CH3C(OH)=CH2 + Hg2+. Protodemercuration releases the enol and regenerates mercury catalyst.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="alkyne-hydration-3-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="alkyne-hydration-3-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Mercury-catalyzed alkyne hydration · 3</text><text x="24" y="65" font-size="17">Mechanistic boundary / grouped stage</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="22.67">Hydroxyvinylmercury intermediate + H+</text><text x="665.00" y="155" font-size="24.00">CH3C(OH)=CH2 + Hg2+</text><text x="30" y="202" font-size="16">Process model: no unique microscopic electron-arrow sequence asserted.</text><text x="24" y="235" font-size="16">Protodemercuration releases the enol and regenerates mercury catalyst.</text></g></g><g transform="translate(0,1220)"><title>Mercury-catalyzed alkyne hydration: Coupled polar bond reorganization</title><desc>CH3–C(OH)=CH2 + H–OH2+ → CH3C(=OH+)CH3 + H2O. Enol pi electrons take a proton at terminal carbon while the oxygen lone pair forms C=O; this is coupled polar tautomerization, not hydride migration.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="alkyne-hydration-4-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="alkyne-hydration-4-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Mercury-catalyzed alkyne hydration · 4</text><text x="24" y="65" font-size="17">Coupled polar bond reorganization</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">CH3–</text><text x="83.52" y="155" font-size="24.00">C</text><text x="98.40" y="155" font-size="24.00">(OH)=</text><text x="172.80" y="155" font-size="24.00">CH2</text><text x="217.44" y="155" font-size="24.00"> + </text><text x="262.08" y="155" font-size="24.00">H</text><text x="276.96" y="155" font-size="24.00">–</text><text x="291.84" y="155" font-size="24.00">OH2+</text><text x="665.00" y="155" font-size="24.00">CH3C(=OH+)CH3 + H2O</text><path data-electrons="2" d="M143.04,141.60 Q206.28,98.60 269.52,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#alkyne-hydration-4-pair)"/><path data-electrons="2" d="M295.56,141.60 Q308.58,203.60 321.60,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#alkyne-hydration-4-pair)"/><text x="24" y="235" font-size="16">Enol pi electrons take a proton at terminal carbon while the oxygen lone pair forms C=O; this is coupled</text><text x="24" y="258" font-size="16">polar tautomerization, not hydride migration.</text></g></g><g transform="translate(0,1510)"><title>Mercury-catalyzed alkyne hydration: Proton transfer</title><desc>CH3C(=O+–H)CH3 + :OH2 → CH3COCH3 + H3O+. Water removes the O-bound proton, giving acetone.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="alkyne-hydration-5-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="alkyne-hydration-5-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Mercury-catalyzed alkyne hydration · 5</text><text x="24" y="65" font-size="17">Proton transfer</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">CH3C(=</text><text x="113.28" y="155" font-size="24.00">O+</text><text x="143.04" y="155" font-size="24.00">–</text><text x="157.92" y="155" font-size="24.00">H</text><text x="172.80" y="155" font-size="24.00">)CH3 + </text><text x="276.96" y="155" font-size="24.00">:OH2</text><text x="665.00" y="155" font-size="24.00">CH3COCH3 + H3O+</text><path data-electrons="2" d="M306.72,141.60 Q236.04,98.60 165.36,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#alkyne-hydration-5-pair)"/><path data-electrons="2" d="M146.76,141.60 Q137.46,203.60 128.16,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#alkyne-hydration-5-pair)"/><text x="24" y="235" font-size="16">Water removes the O-bound proton, giving acetone.</text></g></g></svg>