<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1450"><title>Mercury-catalyzed alkyne hydration: complete teaching sequence</title><g transform="translate(0,0)"><title>Mercury-catalyzed alkyne hydration: Mechanistic boundary / grouped stage</title><desc>CH3C≡CH + Hg2+ → Pi-coordinated alkyne–Hg2+ model. Mercury activates the alkyne; free high-energy vinyl cation formation is not asserted.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="alkyne-hydration-1-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="alkyne-hydration-1-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Mercury-catalyzed alkyne hydration · 1</text><text x="24" y="65" font-size="17">Mechanistic boundary / grouped stage</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">CH3C≡CH + Hg2+</text><text x="665.00" y="155" font-size="24.00">Pi-coordinated alkyne–Hg2+ model</text><text x="30" y="202" font-size="16">Process model: no unique microscopic electron-arrow sequence asserted.</text><text x="24" y="235" font-size="16">Mercury activates the alkyne; free high-energy vinyl cation formation is not asserted.</text></g></g><g transform="translate(0,290)"><title>Mercury-catalyzed alkyne hydration: Mechanistic boundary / grouped stage</title><desc>Activated alkyne + H2O → Hydroxyvinylmercury intermediate + H+. Water addition, deprotonation and organomercury bonding are grouped; detailed speciation depends on acid and counterions.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="alkyne-hydration-2-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="alkyne-hydration-2-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Mercury-catalyzed alkyne hydration · 2</text><text x="24" y="65" font-size="17">Mechanistic boundary / grouped stage</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">Activated alkyne + H2O</text><text x="665.00" y="155" font-size="22.23">Hydroxyvinylmercury intermediate + H+</text><text x="30" y="202" font-size="16">Process model: no unique microscopic electron-arrow sequence asserted.</text><text x="24" y="235" font-size="16">Water addition, deprotonation and organomercury bonding are grouped; detailed speciation depends on acid and counterions.</text></g></g><g transform="translate(0,580)"><title>Mercury-catalyzed alkyne hydration: Mechanistic boundary / grouped stage</title><desc>Hydroxyvinylmercury intermediate + H+ → CH3C(OH)=CH2 + Hg2+. Protodemercuration releases the enol and regenerates mercury catalyst.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="alkyne-hydration-3-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="alkyne-hydration-3-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Mercury-catalyzed alkyne hydration · 3</text><text x="24" y="65" font-size="17">Mechanistic boundary / grouped stage</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="22.67">Hydroxyvinylmercury intermediate + H+</text><text x="665.00" y="155" font-size="24.00">CH3C(OH)=CH2 + Hg2+</text><text x="30" y="202" font-size="16">Process model: no unique microscopic electron-arrow sequence asserted.</text><text x="24" y="235" font-size="16">Protodemercuration releases the enol and regenerates mercury catalyst.</text></g></g><g transform="translate(0,870)"><title>Mercury-catalyzed alkyne hydration: Coupled polar bond reorganization</title><desc>CH3–C(OH)=CH2 + H–OH2+ → CH3C(=OH+)CH3 + H2O. Enol pi electrons take a proton at terminal carbon while the oxygen lone pair forms C=O; this is coupled polar tautomerization, not hydride migration.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="alkyne-hydration-4-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="alkyne-hydration-4-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Mercury-catalyzed alkyne hydration · 4</text><text x="24" y="65" font-size="17">Coupled polar bond reorganization</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">CH3–</text><text x="83.52" y="155" font-size="24.00">C</text><text x="98.40" y="155" font-size="24.00">(OH)=</text><text x="172.80" y="155" font-size="24.00">CH2</text><text x="217.44" y="155" font-size="24.00"> + </text><text x="262.08" y="155" font-size="24.00">H</text><text x="276.96" y="155" font-size="24.00">–</text><text x="291.84" y="155" font-size="24.00">OH2+</text><text x="665.00" y="155" font-size="24.00">CH3C(=OH+)CH3 + H2O</text><path data-electrons="2" d="M143.04,141.60 Q206.28,98.60 269.52,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#alkyne-hydration-4-pair)"/><path data-electrons="2" d="M295.56,141.60 Q308.58,203.60 321.60,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#alkyne-hydration-4-pair)"/><text x="24" y="235" font-size="16">Enol pi electrons take a proton at terminal carbon while the oxygen lone pair forms C=O; this is coupled polar tautomerization, not</text><text x="24" y="258" font-size="16">hydride migration.</text></g></g><g transform="translate(0,1160)"><title>Mercury-catalyzed alkyne hydration: Proton transfer</title><desc>CH3C(=O+–H)CH3 + :OH2 → CH3COCH3 + H3O+. Water removes the O-bound proton, giving acetone.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="alkyne-hydration-5-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="alkyne-hydration-5-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Mercury-catalyzed alkyne hydration · 5</text><text x="24" y="65" font-size="17">Proton transfer</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">CH3C(=</text><text x="113.28" y="155" font-size="24.00">O+</text><text x="143.04" y="155" font-size="24.00">–</text><text x="157.92" y="155" font-size="24.00">H</text><text x="172.80" y="155" font-size="24.00">)CH3 + </text><text x="276.96" y="155" font-size="24.00">:OH2</text><text x="665.00" y="155" font-size="24.00">CH3COCH3 + H3O+</text><path data-electrons="2" d="M306.72,141.60 Q236.04,98.60 165.36,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#alkyne-hydration-5-pair)"/><path data-electrons="2" d="M146.76,141.60 Q137.46,203.60 128.16,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#alkyne-hydration-5-pair)"/><text x="24" y="235" font-size="16">Water removes the O-bound proton, giving acetone.</text></g></g></svg>