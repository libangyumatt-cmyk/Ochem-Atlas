<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" role="img"><title>DIBAL-H partial ester reduction: Nucleophilic carbonyl addition</title><desc>Ph–C(=O)OEt + iBu2Al–H → PhCH(O–Al species)OEt. The Al–H pair transfers to ester carbonyl carbon, forming a tetrahedral aluminum-bound intermediate.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="dibal-ester-reduction-2-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="dibal-ester-reduction-2-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">DIBAL-H partial ester reduction · 2</text><text x="24" y="65" font-size="17">Nucleophilic carbonyl addition</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">Ph–</text><text x="68.64" y="155" font-size="24.00">C</text><text x="83.52" y="155" font-size="24.00">(=</text><text x="113.28" y="155" font-size="24.00">O</text><text x="128.16" y="155" font-size="24.00">)OEt + iBu2</text><text x="291.84" y="155" font-size="24.00">Al</text><text x="321.60" y="155" font-size="24.00">–</text><text x="336.48" y="155" font-size="24.00">H</text><text x="665.00" y="155" font-size="24.00">PhCH(O–Al species)OEt</text><path data-electrons="2" d="M325.32,141.60 Q200.70,98.60 76.08,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#dibal-ester-reduction-2-pair)"/><path data-electrons="2" d="M98.40,141.60 Q109.56,203.60 120.72,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#dibal-ester-reduction-2-pair)"/><text x="24" y="235" font-size="16">The Al–H pair transfers to ester carbonyl carbon, forming a tetrahedral aluminum-bound intermediate.</text></g></svg>