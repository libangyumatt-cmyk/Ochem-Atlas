<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" role="img"><title>Hydrazone formation: Proton transfer</title><desc>Me2C=N+(NH2)–H + :OH2 → Me2C=N–NH2 + H3O+. Water removes the remaining iminium N–H proton.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="hydrazone-formation-6-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="hydrazone-formation-6-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Hydrazone formation · 6</text><text x="24" y="65" font-size="17">Proton transfer</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">Me2C=</text><text x="98.40" y="155" font-size="24.00">N+</text><text x="128.16" y="155" font-size="24.00">(NH2)–</text><text x="217.44" y="155" font-size="24.00">H</text><text x="232.32" y="155" font-size="24.00"> + </text><text x="276.96" y="155" font-size="24.00">:OH2</text><text x="665.00" y="155" font-size="24.00">Me2C=N–NH2 + H3O+</text><path data-electrons="2" d="M306.72,141.60 Q265.80,98.60 224.88,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#hydrazone-formation-6-pair)"/><path data-electrons="2" d="M169.08,141.60 Q141.18,203.60 113.28,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#hydrazone-formation-6-pair)"/><text x="24" y="235" font-size="16">Water removes the remaining iminium N–H proton.</text></g></svg>