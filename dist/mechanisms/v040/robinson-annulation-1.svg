<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" role="img"><title>Robinson annulation: Proton transfer</title><desc>Cyclohexanone alpha-CH–H + :OH− → Cyclohexanone carbon enolate + H2O. Generate the donor enolate at the ring alpha carbon.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="robinson-annulation-1-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="robinson-annulation-1-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Robinson annulation · 1</text><text x="24" y="65" font-size="17">Proton transfer</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">Cyclohexanone alpha-</text><text x="321.60" y="155" font-size="24.00">CH</text><text x="351.36" y="155" font-size="24.00">–</text><text x="366.24" y="155" font-size="24.00">H</text><text x="381.12" y="155" font-size="24.00"> + </text><text x="425.76" y="155" font-size="24.00">:OH−</text><text x="665.00" y="155" font-size="24.00">Cyclohexanone carbon enolate + H2O</text><path data-electrons="2" d="M455.52,141.60 Q414.60,98.60 373.68,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#robinson-annulation-1-pair)"/><path data-electrons="2" d="M355.08,141.60 Q345.78,203.60 336.48,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#robinson-annulation-1-pair)"/><text x="24" y="235" font-size="16">Generate the donor enolate at the ring alpha carbon.</text></g></svg>