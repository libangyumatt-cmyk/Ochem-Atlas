ll="#fffefa"/><text x="287.94" y="107.06" font-size="16" text-anchor="middle" fill="#203c43">O</text><path d="M1026.10,249.85 L945.88,241.69" stroke="#203c43" stroke-width="2" fill="none"/><path d="M945.88,241.69 L883.67,186.17" stroke="#203c43" stroke-width="2" fill="none"/><path d="M883.67,186.17 L803.90,168.13" stroke="#203c43" stroke-width="2" fill="none"/><path d="M880.89,185.03 L911.82,110.00" stroke="#203c43" stroke-width="2" fill="none"/><path d="M886.44,187.31 L917.36,112.29" stroke="#203c43" stroke-width="2" fill="none"/><rect x="1011.10" y="239.85" width="30" height="20" fill="#fffefa"/><text x="1026.10" y="254.85" font-size="16" text-anchor="middle" fill="#203c43">CH3</text><rect x="940.88" y="231.69" width="10" height="20" fill="#fffefa"/><text x="945.88" y="246.69" font-size="16" text-anchor="middle" fill="#203c43">O</text><rect x="878.67" y="176.17" width="10" height="20" fill="#fffefa"/><text x="883.67" y="191.17" font-size="16" text-anchor="middle" fill="#203c43">C</text><rect x="788.90" y="158.13" width="30" height="20" fill="#fffefa"/><text x="803.90" y="173.13" font-size="16" text-anchor="middle" fill="#203c43">CH3</text><rect x="909.59" y="101.15" width="10" height="20" fill="#fffefa"/><text x="914.59" y="116.15" font-size="16" text-anchor="middle" fill="#203c43">O</text><text x="580" y="180" font-size="32" fill="#203c43">→</text><text x="25" y="330" font-size="15" fill="#203c43">Representative substrate/product connectivity; other reagents/byproducts are in the equation. No computed geometry.</text></g><g transform="translate(0,350)"><title>Anhydride alcoholysis: Nucleophilic carbonyl addition</title><desc>CH3–C(=O)OAc + MeO:H → CH3C(O−)(OAc)(O+HMe). Methanol oxygen adds to an anhydride acyl carbon.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="anhydride-alcoholysis-1-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="anhydride-alcoholysis-1-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Anhydride alcoholysis · 1</text><text x="24" y="65" font-size="17">Nucleophilic carbonyl addition</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">CH3–</text><text x="83.52" y="155" font-size="24.00">C</text><text x="98.40" y="155" font-size="24.00">(=</text><text x="128.16" y="155" font-size="24.00">O</text><text x="143.04" y="155" font-size="24.00">)OAc + Me</text><text x="276.96" y="155" font-size="24.00">O:H</text><text x="665.00" y="155" font-size="24.00">CH3C(O−)(OAc)(O+HMe)</text><path data-electrons="2" d="M299.28,141.60 Q195.12,98.60 90.96,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#anhydride-alcoholysis-1-pair)"/><path data-electrons="2" d="M113.28,141.60 Q124.44,203.60 135.60,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#anhydride-alcoholysis-1-pair)"/><text x="24" y="235" font-size="16">Methanol oxygen adds to an anhydride acyl carbon.</text></g></g><g transform="translate(0,640)"><title>Anhydride alcoholysis: Tetrahedral intermediate collapse</title><desc>CH3–C(O−)(O+HMe)–OAc → CH3C(=O)O+HMe + AcO−. Carbonyl reformation expels resonance-stabilized acetate.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="anhydride-alcoholysis-2-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="anhydride-alcoholysis-2-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Anhydride alcoholysis · 2</text><text x="24" y="65" font-size="17">Tetrahedral intermediate collapse</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">CH3–</text><text x="83.52" y="155" font-size="24.00">C</text><text x="98.40" y="155" font-size="24.00">(</text><text x="113.28" y="155" font-size="24.00">O−</text><text x="143.04" y="155" font-size="24.00">)(O+HMe)–</text><text x="276.96" y="155" font-size="24.00">OAc</text><text x="665.00" y="155" font-size="24.00">CH3C(=O)O+HMe + AcO−</text><path data-electrons="2" d="M128.16,141.60 Q118.86,98.60 109.56,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#anhydride-alcoholysis-2-pair)"/><path data-electrons="2" d="M195.12,141.60 Q247.20,203.60 299.28,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#anhydride-alcoholysis-2-pair)"/><text x="24" y="235" font-size="16">Carbonyl reformation expels resonance-stabilized acetate.</text></g></g><g transform="translate(0,930)"><title>Anhydride alcoholysis: Proton transfer</title><desc>CH3CO–O+Me–H + :OAc− → CH3CO2Me + HOAc. Acetate removes the ester oxonium proton.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="anhydride-alcoholysis-3-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="anhydride-alcoholysis-3-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Anhydride alcoholysis · 3</text><text x="24" y="65" font-size="17">Proton transfer</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">CH3CO–</text><text x="113.28" y="155" font-size="24.00">O+Me</text><text x="172.80" y="155" font-size="24.00">–</text><text x="187.68" y="155" font-size="24.00">H</text><text x="202.56" y="155" font-size="24.00"> + </text><text x="247.20" y="155" font-size="24.00">:OAc−</text><text x="665.00" y="155" font-size="24.00">CH3CO2Me + HOAc</text><path data-electrons="2" d="M284.40,141.60 Q239.76,98.60 195.12,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#anhydride-alcoholysis-3-pair)"/><path data-electrons="2" d="M169.08,141.60 Q156.06,203.60 143.04,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#anhydride-alcoholysis-3-pair)"/><text x="24" y="235" font-size="16">Acetate removes the ester oxonium proton.</text></g></g></svg>