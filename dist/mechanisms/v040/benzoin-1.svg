<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" role="img"><title>Benzoin condensation: Nucleophilic carbonyl addition</title><desc>Ph–CH=O + :CN− → PhCH(O−)CN. Cyanide carbon adds to aldehyde carbon; C=O pi electrons move to O.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="benzoin-1-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="benzoin-1-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Benzoin condensation · 1</text><text x="24" y="65" font-size="17">Nucleophilic carbonyl addition</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">Ph–</text><text x="68.64" y="155" font-size="24.00">CH</text><text x="98.40" y="155" font-size="24.00">=</text><text x="113.28" y="155" font-size="24.00">O</text><text x="128.16" y="155" font-size="24.00"> + </text><text x="172.80" y="155" font-size="24.00">:CN−</text><text x="665.00" y="155" font-size="24.00">PhCH(O−)CN</text><path data-electrons="2" d="M202.56,141.60 Q143.04,98.60 83.52,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#benzoin-1-pair)"/><path data-electrons="2" d="M102.12,141.60 Q111.42,203.60 120.72,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#benzoin-1-pair)"/><text x="24" y="235" font-size="16">Cyanide carbon adds to aldehyde carbon; C=O pi electrons move to O.</text></g></svg>