<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" role="img"><title>Benzyne elimination–addition substitution: Coupled polar bond reorganization</title><desc>ortho-C:−–C–Br within arene → Benzyne + Br−. The aryl-anion pair forms the extra in-plane pi bond as bromide leaves.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="benzyne-substitution-2-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="benzyne-substitution-2-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Benzyne elimination–addition substitution · 2</text><text x="24" y="65" font-size="17">Coupled polar bond reorganization</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">ortho-</text><text x="113.28" y="155" font-size="24.00">C:−</text><text x="157.92" y="155" font-size="24.00">–</text><text x="172.80" y="155" font-size="24.00">C</text><text x="187.68" y="155" font-size="24.00">–</text><text x="202.56" y="155" font-size="24.00">Br</text><text x="232.32" y="155" font-size="24.00"> within arene</text><text x="665.00" y="155" font-size="24.00">Benzyne + Br−</text><path data-electrons="2" d="M135.60,141.60 Q146.76,98.60 157.92,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#benzyne-substitution-2-pair)"/><path data-electrons="2" d="M198.84,141.60 Q208.14,203.60 217.44,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#benzyne-substitution-2-pair)"/><text x="24" y="235" font-size="16">The aryl-anion pair forms the extra in-plane pi bond as bromide leaves.</text></g></svg>