<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1800"><title>5-Hexenyl radical cyclization: complete teaching sequence</title><g font-family="DejaVu Sans,sans-serif"><rect width="1200" height="350" fill="#fffefa"/><text x="25" y="32" font-size="21" fill="#203c43">5-Hexenyl radical cyclization · representative molecular graphs</text><path d="M366.90,255.30 L307.22,283.22" stroke="#203c43" stroke-width="2" fill="none"/><path d="M364.36,249.86 L304.68,277.78" stroke="#203c43" stroke-width="2" fill="none"/><path d="M305.95,280.50 L238.64,277.16" stroke="#203c43" stroke-width="2" fill="none"/><path d="M238.64,277.16 L188.49,231.89" stroke="#203c43" stroke-width="2" fill="none"/><path d="M188.49,231.89 L184.37,164.46" stroke="#203c43" stroke-width="2" fill="none"/><path d="M184.37,164.46 L223.72,109.76" stroke="#203c43" stroke-width="2" fill="none"/><path d="M223.72,109.76 L282.76,80.50" stroke="#203c43" stroke-width="2" fill="none"/><rect x="350.63" y="242.58" width="30" height="20" fill="#fffefa"/><text x="365.63" y="257.58" font-size="16" text-anchor="middle" fill="#203c43">CH2</text><rect x="295.95" y="270.50" width="20" height="20" fill="#fffefa"/><text x="305.95" y="285.50" font-size="16" text-anchor="middle" fill="#203c43">CH</text><rect x="223.64" y="267.16" width="30" height="20" fill="#fffefa"/><text x="238.64" y="282.16" font-size="16" text-anchor="middle" fill="#203c43">CH2</text><rect x="173.49" y="221.89" width="30" height="20" fill="#fffefa"/><text x="188.49" y="236.89" font-size="16" text-anchor="middle" fill="#203c43">CH2</text><rect x="169.37" y="154.46" width="30" height="20" fill="#fffefa"/><text x="184.37" y="169.46" font-size="16" text-anchor="middle" fill="#203c43">CH2</text><rect x="208.72" y="99.76" width="30" height="20" fill="#fffefa"/><text x="223.72" y="114.76" font-size="16" text-anchor="middle" fill="#203c43">CH2</text><rect x="272.76" y="70.50" width="20" height="20" fill="#fffefa"/><text x="282.76" y="85.50" font-size="16" text-anchor="middle" fill="#203c43">Br</text><path d="M1024.94,228.23 L944.09,214.08" stroke="#203c43" stroke-width="2" fill="none"/><path d="M944.09,214.08 L866.09,244.40" stroke="#203c43" stroke-width="2" fill="none"/><path d="M866.09,244.40 L805.06,189.75" stroke="#203c43" stroke-width="2" fill="none"/><path d="M805.06,189.75 L840.52,116.60" stroke="#203c43" stroke-width="2" fill="none"/><path d="M840.52,116.60 L919.98,134.71" stroke="#203c43" stroke-width="2" fill="none"/><path d="M944.09,214.08 L919.98,134.71" stroke="#203c43" stroke-width="2" fill="none"/><rect x="1009.94" y="218.23" width="30" height="20" fill="#fffefa"/><text x="1024.94" y="233.23" font-size="16" text-anchor="middle" fill="#203c43">CH3</text><rect x="934.09" y="204.08" width="20" height="20" fill="#fffefa"/><text x="944.09" y="219.08" font-size="16" text-anchor="middle" fill="#203c43">CH</text><rect x="851.09" y="234.40" width="30" height="20" fill="#fffefa"/><text x="866.09" y="249.40" font-size="16" text-anchor="middle" fill="#203c43">CH2</text><rect x="790.06" y="179.75" width="30" height="20" fill="#fffefa"/><text x="805.06" y="194.75" font-size="16" text-anchor="middle" fill="#203c43">CH2</text><rect x="825.52" y="106.60" width="30" height="20" fill="#fffefa"/><text x="840.52" y="121.60" font-size="16" text-anchor="middle" fill="#203c43">CH2</text><rect x="904.98" y="124.71" width="30" height="20" fill="#fffefa"/><text x="919.98" y="139.71" font-size="16" text-anchor="middle" fill="#203c43">CH2</text><text x="580" y="180" font-size="32" fill="#203c43">→</text><text x="25" y="330" font-size="15" fill="#203c43">Representative substrate/product connectivity; other reagents/byproducts are in the equation. No computed geometry.</text></g><g transform="translate(0,350)"><title>5-Hexenyl radical cyclization: Mechanistic boundary / grouped stage</title><desc>Initiator (e.g. AIBN) + heat → Initiator radicals + N2. Thermal initiator decomposition supplies radicals; the fragmentation is grouped and not assigned a closed-shell code.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="radical-cyclization-1-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="radical-cyclization-1-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">5-Hexenyl radical cyclization · 1</text><text x="24" y="65" font-size="17">Mechanistic boundary / grouped stage</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">Initiator (e.g. AIBN) + heat</text><text x="665.00" y="155" font-size="24.00">Initiator radicals + N2</text><text x="30" y="202" font-size="16">Process model: no unique microscopic electron-arrow sequence asserted.</text><text x="24" y="235" font-size="16">Thermal initiator decomposition supplies radicals; the fragmentation is grouped and not assigned a closed-</text><text x="24" y="258" font-size="16">shell code.</text></g></g><g transform="translate(0,640)"><title>5-Hexenyl radical cyclization: Radical atom transfer</title><desc>Initiator R• + Bu3Sn–H → RH + Bu3Sn•. A radical abstracts H from the tin hydride to generate the tin-radical chain carrier.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="radical-cyclization-2-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="radical-cyclization-2-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">5-Hexenyl radical cyclization · 2</text><text x="24" y="65" font-size="17">Radical atom transfer</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">Initiator </text><text x="172.80" y="155" font-size="24.00">R•</text><text x="202.56" y="155" font-size="24.00"> + Bu3</text><text x="291.84" y="155" font-size="24.00">Sn</text><text x="321.60" y="155" font-size="24.00">–</text><text x="336.48" y="155" font-size="24.00">H</text><text x="665.00" y="155" font-size="24.00">RH + Bu3Sn•</text><path data-electrons="1" d="M187.68,141.60 Q226.74,98.60 265.80,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#radical-cyclization-2-fish)"/><path data-electrons="1" d="M325.32,141.60 Q295.56,203.60 265.80,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#radical-cyclization-2-fish)"/><path data-electrons="1" d="M325.32,141.60 Q316.02,80.60 306.72,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#radical-cyclization-2-fish)"/><text x="24" y="235" font-size="16">A radical abstracts H from the tin hydride to generate the tin-radical chain carrier.</text></g></g><g transform="translate(0,930)"><title>5-Hexenyl radical cyclization: Radical atom transfer</title><desc>Bu3Sn• + Br–CH2(CH2)3CH=CH2 → Bu3SnBr + •CH2(CH2)3CH=CH2. Tin radical abstracts Br, generating the5-hexenyl radical.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="radical-cyclization-3-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="radical-cyclization-3-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">5-Hexenyl radical cyclization · 3</text><text x="24" y="65" font-size="17">Radical atom transfer</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">Bu3</text><text x="68.64" y="155" font-size="24.00">Sn•</text><text x="113.28" y="155" font-size="24.00"> + </text><text x="157.92" y="155" font-size="24.00">Br</text><text x="187.68" y="155" font-size="24.00">–</text><text x="202.56" y="155" font-size="24.00">CH2</text><text x="247.20" y="155" font-size="24.00">(CH2)3CH=CH2</text><text x="665.00" y="155" font-size="24.00">Bu3SnBr + •CH2(CH2)3CH=CH2</text><path data-electrons="1" d="M90.96,141.60 Q111.42,98.60 131.88,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#radical-cyclization-3-fish)"/><path data-electrons="1" d="M198.84,141.60 Q165.36,203.60 131.88,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#radical-cyclization-3-fish)"/><path data-electrons="1" d="M198.84,141.60 Q211.86,80.60 224.88,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#radical-cyclization-3-fish)"/><text x="24" y="235" font-size="16">Tin radical abstracts Br, generating the5-hexenyl radical.</text></g></g><g transform="translate(0,1220)"><title>5-Hexenyl radical cyclization: 5-exo-trig ring closure</title><desc>•CH2–(CH2)3–CH=CH2 → Cyclopentyl–CH2•. Intramolecular radical addition forms the bond from radical C1 to alkene C5; the terminal carbon becomes an exocyclic radical.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="radical-cyclization-4-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="radical-cyclization-4-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">5-Hexenyl radical cyclization · 4</text><text x="24" y="65" font-size="17">5-exo-trig ring closure</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">•CH2</text><text x="83.52" y="155" font-size="24.00">–(CH2)3–</text><text x="202.56" y="155" font-size="24.00">CH</text><text x="232.32" y="155" font-size="24.00">=</text><text x="247.20" y="155" font-size="24.00">CH2</text><text x="665.00" y="155" font-size="24.00">Cyclopentyl–CH2•</text><path data-electrons="1" d="M53.76,141.60 Q94.68,98.60 135.60,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#radical-cyclization-4-fish)"/><path data-electrons="1" d="M243.48,141.60 Q189.54,203.60 135.60,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#radical-cyclization-4-fish)"/><path data-electrons="1" d="M243.48,141.60 Q256.50,80.60 269.52,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#radical-cyclization-4-fish)"/><text x="24" y="235" font-size="16">Intramolecular radical addition forms the bond from radical C1 to alkene C5; the terminal carbon becomes an</text><text x="24" y="258" font-size="16">exocyclic radical.</text></g></g><g transform="translate(0,1510)"><title>5-Hexenyl radical cyclization: Radical atom transfer</title><desc>Cyclopentyl–CH2• + Bu3Sn–H → Methylcyclopentane + Bu3Sn•. H-atom transfer gives the methyl substituent and regenerates tin radical.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="radical-cyclization-5-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="radical-cyclization-5-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">5-Hexenyl radical cyclization · 5</text><text x="24" y="65" font-size="17">Radical atom transfer</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">Cyclopentyl–</text><text x="202.56" y="155" font-size="24.00">CH2•</text><text x="262.08" y="155" font-size="24.00"> + Bu3</text><text x="351.36" y="155" font-size="24.00">Sn</text><text x="381.12" y="155" font-size="24.00">–</text><text x="396.00" y="155" font-size="24.00">H</text><text x="665.00" y="155" font-size="24.00">Methylcyclopentane + Bu3Sn•</text><path data-electrons="1" d="M232.32,141.60 Q275.10,98.60 317.88,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#radical-cyclization-5-fish)"/><path data-electrons="1" d="M384.84,141.60 Q351.36,203.60 317.88,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#radical-cyclization-5-fish)"/><path data-electrons="1" d="M384.84,141.60 Q375.54,80.60 366.24,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#radical-cyclization-5-fish)"/><text x="24" y="235" font-size="16">H-atom transfer gives the methyl substituent and regenerates tin radical.</text></g></g></svg>