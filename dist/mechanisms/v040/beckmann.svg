<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1510"><title>Beckmann rearrangement: complete teaching sequence</title><g font-family="DejaVu Sans,sans-serif"><rect width="1200" height="350" fill="#fffefa"/><text x="25" y="32" font-size="21" fill="#203c43">Beckmann rearrangement · representative molecular graphs</text><path d="M424.59,246.43 L347.30,271.02" stroke="#203c43" stroke-width="2" fill="none"/><path d="M346.25,273.83 L266.84,244.40" stroke="#203c43" stroke-width="2" fill="none"/><path d="M348.34,268.21 L268.92,238.77" stroke="#203c43" stroke-width="2" fill="none"/><path d="M267.88,241.58 L183.07,251.82" stroke="#203c43" stroke-width="2" fill="none"/><path d="M183.07,251.82 L125.41,191.56" stroke="#203c43" stroke-width="2" fill="none"/><path d="M125.41,191.56 L145.68,111.33" stroke="#203c43" stroke-width="2" fill="none"/><path d="M145.68,111.33 L224.95,89.98" stroke="#203c43" stroke-width="2" fill="none"/><path d="M224.95,89.98 L272.72,157.26" stroke="#203c43" stroke-width="2" fill="none"/><path d="M267.88,241.58 L272.72,157.26" stroke="#203c43" stroke-width="2" fill="none"/><rect x="414.59" y="236.43" width="20" height="20" fill="#fffefa"/><text x="424.59" y="251.43" font-size="16" text-anchor="middle" fill="#203c43">OH</text><rect x="342.30" y="261.02" width="10" height="20" fill="#fffefa"/><text x="347.30" y="276.02" font-size="16" text-anchor="middle" fill="#203c43">N</text><rect x="262.88" y="231.58" width="10" height="20" fill="#fffefa"/><text x="267.88" y="246.58" font-size="16" text-anchor="middle" fill="#203c43">C</text><rect x="168.07" y="241.82" width="30" height="20" fill="#fffefa"/><text x="183.07" y="256.82" font-size="16" text-anchor="middle" fill="#203c43">CH2</text><rect x="110.41" y="181.56" width="30" height="20" fill="#fffefa"/><text x="125.41" y="196.56" font-size="16" text-anchor="middle" fill="#203c43">CH2</text><rect x="130.68" y="101.33" width="30" height="20" fill="#fffefa"/><text x="145.68" y="116.33" font-size="16" text-anchor="middle" fill="#203c43">CH2</text><rect x="209.95" y="79.98" width="30" height="20" fill="#fffefa"/><text x="224.95" y="94.98" font-size="16" text-anchor="middle" fill="#203c43">CH2</text><rect x="257.72" y="147.26" width="30" height="20" fill="#fffefa"/><text x="272.72" y="162.26" font-size="16" text-anchor="middle" fill="#203c43">CH2</text><path d="M1053.00,229.69 L970.56,224.83" stroke="#203c43" stroke-width="2" fill="none"/><path d="M1053.36,223.70 L970.91,218.84" stroke="#203c43" stroke-width="2" fill="none"/><path d="M970.73,221.84 L902.09,273.34" stroke="#203c43" stroke-width="2" fill="none"/><path d="M902.09,273.34 L818.72,262.95" stroke="#203c43" stroke-width="2" fill="none"/><path d="M818.72,262.95 L776.82,190.78" stroke="#203c43" stroke-width="2" fill="none"/><path d="M776.82,190.78 L805.31,112.51" stroke="#203c43" stroke-width="2" fill="none"/><path d="M805.31,112.51 L884.52,87.66" stroke="#203c43" stroke-width="2" fill="none"/><path d="M884.52,87.66 L949.98,139.43" stroke="#203c43" stroke-width="2" fill="none"/><path d="M970.73,221.84 L949.98,139.43" stroke="#203c43" stroke-width="2" fill="none"/><rect x="1048.18" y="216.70" width="10" height="20" fill="#fffefa"/><text x="1053.18" y="231.70" font-size="16" text-anchor="middle" fill="#203c43">O</text><rect x="965.73" y="211.84" width="10" height="20" fill="#fffefa"/><text x="970.73" y="226.84" font-size="16" text-anchor="middle" fill="#203c43">C</text><rect x="892.09" y="263.34" width="20" height="20" fill="#fffefa"/><text x="902.09" y="278.34" font-size="16" text-anchor="middle" fill="#203c43">NH</text><rect x="803.72" y="252.95" width="30" height="20" fill="#fffefa"/><text x="818.72" y="267.95" font-size="16" text-anchor="middle" fill="#203c43">CH2</text><rect x="761.82" y="180.78" width="30" height="20" fill="#fffefa"/><text x="776.82" y="195.78" font-size="16" text-anchor="middle" fill="#203c43">CH2</text><rect x="790.31" y="102.51" width="30" height="20" fill="#fffefa"/><text x="805.31" y="117.51" font-size="16" text-anchor="middle" fill="#203c43">CH2</text><rect x="869.52" y="77.66" width="30" height="20" fill="#fffefa"/><text x="884.52" y="92.66" font-size="16" text-anchor="middle" fill="#203c43">CH2</text><rect x="934.98" y="129.43" width="30" height="20" fill="#fffefa"/><text x="949.98" y="144.43" font-size="16" text-anchor="middle" fill="#203c43">CH2</text><text x="580" y="180" font-size="32" fill="#203c43">→</text><text x="25" y="330" font-size="15" fill="#203c43">Representative substrate/product connectivity; other reagents/byproducts are in the equation. No computed geometry.</text></g><g transform="translate(0,350)"><title>Beckmann rearrangement: Proton transfer</title><desc>Ring (CH2)5C=N–O:H + H–OH2+ → Ring (CH2)5C=N–OH2+ + H2O. Protonate the oxime hydroxyl.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="beckmann-1-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="beckmann-1-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Beckmann rearrangement · 1</text><text x="24" y="65" font-size="17">Proton transfer</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">Ring (CH2)5C=N–</text><text x="247.20" y="155" font-size="24.00">O:H</text><text x="291.84" y="155" font-size="24.00"> + </text><text x="336.48" y="155" font-size="24.00">H</text><text x="351.36" y="155" font-size="24.00">–</text><text x="366.24" y="155" font-size="24.00">OH2+</text><text x="665.00" y="155" font-size="24.00">Ring (CH2)5C=N–OH2+ + H2O</text><path data-electrons="2" d="M269.52,141.60 Q306.72,98.60 343.92,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#beckmann-1-pair)"/><path data-electrons="2" d="M369.96,141.60 Q382.98,203.60 396.00,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#beckmann-1-pair)"/><text x="24" y="235" font-size="16">Protonate the oxime hydroxyl.</text></g></g><g transform="translate(0,640)"><title>Beckmann rearrangement: Anti migration and water departure</title><desc>Ring (CH2)4–CH2–C=N–OH2+ → Ring C≡N+–(CH2)5–(back) + H2O. The anti C–C bond migrates to N as N–O cleavage expels water, giving a ring-expanded nitrilium model.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="beckmann-2-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="beckmann-2-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Beckmann rearrangement · 2</text><text x="24" y="65" font-size="17">Anti migration and water departure</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">Ring (CH2)4–</text><text x="202.56" y="155" font-size="24.00">CH2</text><text x="247.20" y="155" font-size="24.00">–</text><text x="262.08" y="155" font-size="24.00">C</text><text x="276.96" y="155" font-size="24.00">=</text><text x="291.84" y="155" font-size="24.00">N</text><text x="306.72" y="155" font-size="24.00">–</text><text x="321.60" y="155" font-size="24.00">OH2+</text><text x="665.00" y="155" font-size="24.00">Ring C≡N+–(CH2)5–(back) + H2O</text><path data-electrons="2" d="M247.20,141.60 Q273.24,98.60 299.28,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#beckmann-2-pair)"/><path data-electrons="2" d="M325.32,141.60 Q338.34,203.60 351.36,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#beckmann-2-pair)"/><text x="24" y="235" font-size="16">The anti C–C bond migrates to N as N–O cleavage expels water, giving a ring-expanded nitrilium model.</text></g></g><g transform="translate(0,930)"><title>Beckmann rearrangement: Mechanistic boundary / grouped stage</title><desc>Ring-expanded nitrilium + water → Ring C(OH)=N–(CH2)5–(back). Water attacks nitrilium carbon; N≡C pi electrons shift to N and deprotonation gives an imidic-acid form. These linked solvent steps are grouped.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="beckmann-3-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="beckmann-3-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Beckmann rearrangement · 3</text><text x="24" y="65" font-size="17">Mechanistic boundary / grouped stage</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">Ring-expanded nitrilium + water</text><text x="665.00" y="155" font-size="24.00">Ring C(OH)=N–(CH2)5–(back)</text><text x="30" y="202" font-size="16">Process model: no unique microscopic electron-arrow sequence asserted.</text><text x="24" y="235" font-size="16">Water attacks nitrilium carbon; N≡C pi electrons shift to N and deprotonation gives an imidic-acid form.</text><text x="24" y="258" font-size="16">These linked solvent steps are grouped.</text></g></g><g transform="translate(0,1220)"><title>Beckmann rearrangement: Mechanistic boundary / grouped stage</title><desc>Cyclic imidic acid + acid/base proton relays → Ring C(=O)–NH–(CH2)5–(back). Proton transfers and pi-bond reorganization yield caprolactam. No uncatalyzed1,3-H migration is inserted.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="beckmann-4-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="beckmann-4-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Beckmann rearrangement · 4</text><text x="24" y="65" font-size="17">Mechanistic boundary / grouped stage</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="19.06">Cyclic imidic acid + acid/base proton relays</text><text x="665.00" y="155" font-size="24.00">Ring C(=O)–NH–(CH2)5–(back)</text><text x="30" y="202" font-size="16">Process model: no unique microscopic electron-arrow sequence asserted.</text><text x="24" y="235" font-size="16">Proton transfers and pi-bond reorganization yield caprolactam. No uncatalyzed1,3-H migration is inserted.</text></g></g></svg>