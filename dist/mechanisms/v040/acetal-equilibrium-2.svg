<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" role="img"><title>Acetal formation and hydrolysis: Nucleophilic carbonyl addition</title><desc>CH3CH=OH+ + MeO:H → CH3CH(OH)(O+HMe). Methanol oxygen adds; carbonyl pi electrons move to oxygen.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="acetal-equilibrium-2-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="acetal-equilibrium-2-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Acetal formation and hydrolysis · 2</text><text x="24" y="65" font-size="17">Nucleophilic carbonyl addition</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">CH3</text><text x="68.64" y="155" font-size="24.00">CH</text><text x="98.40" y="155" font-size="24.00">=</text><text x="113.28" y="155" font-size="24.00">OH+</text><text x="157.92" y="155" font-size="24.00"> + Me</text><text x="232.32" y="155" font-size="24.00">O:H</text><text x="665.00" y="155" font-size="24.00">CH3CH(OH)(O+HMe)</text><path data-electrons="2" d="M254.64,141.60 Q169.08,98.60 83.52,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#acetal-equilibrium-2-pair)"/><path data-electrons="2" d="M109.56,141.60 Q122.58,203.60 135.60,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#acetal-equilibrium-2-pair)"/><text x="24" y="235" font-size="16">Methanol oxygen adds; carbonyl pi electrons move to oxygen.</text></g></svg>