<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" role="img"><title>Electrophilic aromatic bromination: Coupled polar bond reorganization</title><desc>ring C(H)(Br)–CH+–CH=CH–CH=CH–(back) + FeBr4− → C6H5Br + HBr + FeBr3. Counterion removes the substituted-carbon proton; the C–H pair restores aromatic pi bonding and regenerates FeBr3.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="aromatic-bromination-3-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="aromatic-bromination-3-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Electrophilic aromatic bromination · 3</text><text x="24" y="65" font-size="17">Coupled polar bond reorganization</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="18.64">ring </text><text x="81.78" y="155" font-size="18.64">C</text><text x="93.33" y="155" font-size="18.64">(</text><text x="104.89" y="155" font-size="18.64">H</text><text x="116.44" y="155" font-size="18.64">)(Br)–</text><text x="185.78" y="155" font-size="18.64">CH+</text><text x="220.44" y="155" font-size="18.64">–CH=CH–CH=CH–(back) + </text><text x="474.67" y="155" font-size="18.64">FeBr4−</text><text x="665.00" y="155" font-size="24.00">C6H5Br + HBr + FeBr3</text><path data-electrons="2" d="M509.33,143.48 Q310.00,100.48 110.67,139.48" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#aromatic-bromination-3-pair)"/><path data-electrons="2" d="M99.11,143.48 Q122.22,205.48 145.33,139.48" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#aromatic-bromination-3-pair)"/><text x="24" y="235" font-size="16">Counterion removes the substituted-carbon proton; the C–H pair restores aromatic pi bonding and regenerates FeBr3.</text></g></svg>