ll="#fffefa"/><text x="303.55" y="85.50" font-size="16" text-anchor="middle" fill="#203c43">CH2</text><path d="M1006.90,255.30 L947.22,283.22" stroke="#203c43" stroke-width="2" fill="none"/><path d="M1004.36,249.86 L944.68,277.78" stroke="#203c43" stroke-width="2" fill="none"/><path d="M945.95,280.50 L878.64,277.16" stroke="#203c43" stroke-width="2" fill="none"/><path d="M878.64,277.16 L828.49,231.89" stroke="#203c43" stroke-width="2" fill="none"/><path d="M828.49,231.89 L824.37,164.46" stroke="#203c43" stroke-width="2" fill="none"/><path d="M821.93,162.70 L861.29,108.00" stroke="#203c43" stroke-width="2" fill="none"/><path d="M826.80,166.21 L866.16,111.51" stroke="#203c43" stroke-width="2" fill="none"/><path d="M863.72,109.76 L922.76,80.50" stroke="#203c43" stroke-width="2" fill="none"/><rect x="990.63" y="242.58" width="30" height="20" fill="#fffefa"/><text x="1005.63" y="257.58" font-size="16" text-anchor="middle" fill="#203c43">CH2</text><rect x="935.95" y="270.50" width="20" height="20" fill="#fffefa"/><text x="945.95" y="285.50" font-size="16" text-anchor="middle" fill="#203c43">CH</text><rect x="863.64" y="267.16" width="30" height="20" fill="#fffefa"/><text x="878.64" y="282.16" font-size="16" text-anchor="middle" fill="#203c43">CH2</text><rect x="813.49" y="221.89" width="30" height="20" fill="#fffefa"/><text x="828.49" y="236.89" font-size="16" text-anchor="middle" fill="#203c43">CH2</text><rect x="814.37" y="154.46" width="20" height="20" fill="#fffefa"/><text x="824.37" y="169.46" font-size="16" text-anchor="middle" fill="#203c43">CH</text><rect x="853.72" y="99.76" width="20" height="20" fill="#fffefa"/><text x="863.72" y="114.76" font-size="16" text-anchor="middle" fill="#203c43">CH</text><rect x="907.76" y="70.50" width="30" height="20" fill="#fffefa"/><text x="922.76" y="85.50" font-size="16" text-anchor="middle" fill="#203c43">CH3</text><text x="580" y="180" font-size="32" fill="#203c43">→</text><text x="25" y="330" font-size="15" fill="#203c43">Representative substrate/product connectivity; other reagents/byproducts are in the equation. No computed geometry.</text></g><g transform="translate(0,350)"><title>Cope rearrangement: Thermal [3,3] carbon-skeleton rearrangement</title><desc>CH2=CH–CH(Me)–CH2–CH=CH2 → CH2=CH–CH2–CH2–CH=CH–CH3. The1,5-diene rearranges by a concerted[3,3] shift: break the central sigma bond, make a terminal C–C bond and move both pi bonds. No discrete diradical is inserted.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="cope-rearrangement-1-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="cope-rearrangement-1-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Cope rearrangement · 1</text><text x="24" y="65" font-size="17">Thermal [3,3] carbon-skeleton rearrangement</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">CH2</text><text x="68.64" y="155" font-size="24.00">=</text><text x="83.52" y="155" font-size="24.00">CH</text><text x="113.28" y="155" font-size="24.00">–</text><text x="128.16" y="155" font-size="24.00">CH</text><text x="157.92" y="155" font-size="24.00">(Me)–</text><text x="232.32" y="155" font-size="24.00">CH2</text><text x="276.96" y="155" font-size="24.00">–</text><text x="291.84" y="155" font-size="24.00">CH</text><text x="321.60" y="155" font-size="24.00">=</text><text x="336.48" y="155" font-size="24.00">CH2</text><text x="665.00" y="155" font-size="24.00">CH2=CH–CH2–CH2–CH=CH–CH3</text><path data-electrons="2" d="M72.36,141.60 Q96.54,98.60 120.72,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#cope-rearrangement-1-pair)"/><path data-electrons="2" d="M198.84,141.60 Q239.76,203.60 280.68,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#cope-rearrangement-1-pair)"/><path data-electrons="2" d="M332.76,141.60 Q267.66,80.60 202.56,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#cope-rearrangement-1-pair)"/><text x="24" y="235" font-size="16">The1,5-diene rearranges by a concerted[3,3] shift: break the central sigma bond, make a terminal C–C bond</text><text x="24" y="258" font-size="16">and move both pi bonds. No discrete diradical is inserted.</text></g></g></svg>