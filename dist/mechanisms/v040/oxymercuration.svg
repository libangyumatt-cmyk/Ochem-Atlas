<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1510"><title>Oxymercuration–demercuration: complete teaching sequence</title><g font-family="DejaVu Sans,sans-serif"><rect width="1200" height="350" fill="#fffefa"/><text x="25" y="32" font-size="21" fill="#203c43">Oxymercuration–demercuration · representative molecular graphs</text><path d="M339.95,219.45 L262.88,200.71" stroke="#203c43" stroke-width="2" fill="none"/><path d="M260.64,202.70 L207.81,143.54" stroke="#203c43" stroke-width="2" fill="none"/><path d="M265.12,198.71 L212.29,139.55" stroke="#203c43" stroke-width="2" fill="none"/><rect x="324.95" y="209.45" width="30" height="20" fill="#fffefa"/><text x="339.95" y="224.45" font-size="16" text-anchor="middle" fill="#203c43">CH3</text><rect x="252.88" y="190.71" width="20" height="20" fill="#fffefa"/><text x="262.88" y="205.71" font-size="16" text-anchor="middle" fill="#203c43">CH</text><rect x="195.05" y="131.55" width="30" height="20" fill="#fffefa"/><text x="210.05" y="146.55" font-size="16" text-anchor="middle" fill="#203c43">CH2</text><path d="M991.33,234.89 L915.00,206.90" stroke="#203c43" stroke-width="2" fill="none"/><path d="M915.00,206.90 L838.67,234.89" stroke="#203c43" stroke-width="2" fill="none"/><path d="M915.00,206.90 L915.00,126.11" stroke="#203c43" stroke-width="2" fill="none"/><rect x="976.33" y="224.89" width="30" height="20" fill="#fffefa"/><text x="991.33" y="239.89" font-size="16" text-anchor="middle" fill="#203c43">CH3</text><rect x="905.00" y="196.90" width="20" height="20" fill="#fffefa"/><text x="915.00" y="211.90" font-size="16" text-anchor="middle" fill="#203c43">CH</text><rect x="828.67" y="224.89" width="20" height="20" fill="#fffefa"/><text x="838.67" y="239.89" font-size="16" text-anchor="middle" fill="#203c43">OH</text><rect x="900.00" y="116.11" width="30" height="20" fill="#fffefa"/><text x="915.00" y="131.11" font-size="16" text-anchor="middle" fill="#203c43">CH3</text><text x="580" y="180" font-size="32" fill="#203c43">→</text><text x="25" y="330" font-size="15" fill="#203c43">Representative substrate/product connectivity; other reagents/byproducts are in the equation. No computed geometry.</text></g><g transform="translate(0,350)"><title>Oxymercuration–demercuration: Coupled polar bond reorganization</title><desc>CH3–CH=CH2 + HgOAc+ → [CH3CH–CH2 bridged by HgOAc]+. Pi donation to mercury forms the bridged cation model; acetate dissociation/speciation is grouped with activation.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="oxymercuration-1-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="oxymercuration-1-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Oxymercuration–demercuration · 1</text><text x="24" y="65" font-size="17">Coupled polar bond reorganization</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">CH3–</text><text x="83.52" y="155" font-size="24.00">CH</text><text x="113.28" y="155" font-size="24.00">=</text><text x="128.16" y="155" font-size="24.00">CH2</text><text x="172.80" y="155" font-size="24.00"> + </text><text x="217.44" y="155" font-size="24.00">HgOAc+</text><text x="665.00" y="155" font-size="24.00">[CH3CH–CH2 bridged by HgOAc]+</text><path data-electrons="2" d="M124.44,141.60 Q193.26,98.60 262.08,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#oxymercuration-1-pair)"/><text x="24" y="235" font-size="16">Pi donation to mercury forms the bridged cation model; acetate dissociation/speciation is grouped with</text><text x="24" y="258" font-size="16">activation.</text></g></g><g transform="translate(0,640)"><title>Oxymercuration–demercuration: Bond-replacing displacement</title><desc>[CH3–CH–CH2–HgOAc bridge]+ + :OH2 → CH3CH(OH2+)CH2HgOAc. Water attacks the more substituted bridge carbon from the opposite face; its C–Hg bridge bond opens.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="oxymercuration-2-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="oxymercuration-2-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Oxymercuration–demercuration · 2</text><text x="24" y="65" font-size="17">Bond-replacing displacement</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">[CH3–</text><text x="98.40" y="155" font-size="24.00">CH</text><text x="128.16" y="155" font-size="24.00">–</text><text x="143.04" y="155" font-size="24.00">CH2</text><text x="187.68" y="155" font-size="24.00">–</text><text x="202.56" y="155" font-size="24.00">HgOAc</text><text x="276.96" y="155" font-size="24.00"> bridge]+ + </text><text x="455.52" y="155" font-size="24.00">:OH2</text><text x="665.00" y="155" font-size="24.00">CH3CH(OH2+)CH2HgOAc</text><path data-electrons="2" d="M485.28,141.60 Q299.28,98.60 113.28,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#oxymercuration-2-pair)"/><path data-electrons="2" d="M176.52,141.60 Q208.14,203.60 239.76,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#oxymercuration-2-pair)"/><text x="24" y="235" font-size="16">Water attacks the more substituted bridge carbon from the opposite face; its C–Hg bridge bond opens.</text></g></g><g transform="translate(0,930)"><title>Oxymercuration–demercuration: Proton transfer</title><desc>CH3CH(O+H–H)CH2HgOAc + :OAc− → CH3CH(OH)CH2HgOAc + HOAc. Acetate removes an oxonium proton.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="oxymercuration-3-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="oxymercuration-3-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Oxymercuration–demercuration · 3</text><text x="24" y="65" font-size="17">Proton transfer</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">CH3CH(</text><text x="113.28" y="155" font-size="24.00">O+H</text><text x="157.92" y="155" font-size="24.00">–</text><text x="172.80" y="155" font-size="24.00">H</text><text x="187.68" y="155" font-size="24.00">)CH2HgOAc + </text><text x="366.24" y="155" font-size="24.00">:OAc−</text><text x="665.00" y="155" font-size="24.00">CH3CH(OH)CH2HgOAc + HOAc</text><path data-electrons="2" d="M403.44,141.60 Q291.84,98.60 180.24,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#oxymercuration-3-pair)"/><path data-electrons="2" d="M157.92,141.60 Q146.76,203.60 135.60,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#oxymercuration-3-pair)"/><text x="24" y="235" font-size="16">Acetate removes an oxonium proton.</text></g></g><g transform="translate(0,1220)"><title>Oxymercuration–demercuration: Mechanistic boundary / grouped stage</title><desc>CH3CH(OH)CH2HgOAc + NaBH4 → CH3CH(OH)CH3 + mercury/boron products. Reductive demercuration replaces C–Hg by C–H. Radical pathways can participate; this work-up is not presented as a uniquely established hydride SN2 event.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="oxymercuration-4-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="oxymercuration-4-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Oxymercuration–demercuration · 4</text><text x="24" y="65" font-size="17">Mechanistic boundary / grouped stage</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">CH3CH(OH)CH2HgOAc + NaBH4</text><text x="665.00" y="155" font-size="22.23">CH3CH(OH)CH3 + mercury/boron products</text><text x="30" y="202" font-size="16">Process model: no unique microscopic electron-arrow sequence asserted.</text><text x="24" y="235" font-size="16">Reductive demercuration replaces C–Hg by C–H. Radical pathways can participate; this work-up is not</text><text x="24" y="258" font-size="16">presented as a uniquely established hydride SN2 event.</text></g></g></svg>