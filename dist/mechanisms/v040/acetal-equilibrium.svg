<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 2380"><title>Acetal formation and hydrolysis: complete teaching sequence</title><g font-family="DejaVu Sans,sans-serif"><rect width="1200" height="350" fill="#fffefa"/><text x="25" y="32" font-size="21" fill="#203c43">Acetal formation and hydrolysis · representative molecular graphs</text><path d="M339.95,219.45 L262.88,200.71" stroke="#203c43" stroke-width="2" fill="none"/><path d="M260.64,202.70 L207.81,143.54" stroke="#203c43" stroke-width="2" fill="none"/><path d="M265.12,198.71 L212.29,139.55" stroke="#203c43" stroke-width="2" fill="none"/><rect x="324.95" y="209.45" width="30" height="20" fill="#fffefa"/><text x="339.95" y="224.45" font-size="16" text-anchor="middle" fill="#203c43">CH3</text><rect x="252.88" y="190.71" width="20" height="20" fill="#fffefa"/><text x="262.88" y="205.71" font-size="16" text-anchor="middle" fill="#203c43">CH</text><rect x="205.05" y="131.55" width="10" height="20" fill="#fffefa"/><text x="210.05" y="146.55" font-size="16" text-anchor="middle" fill="#203c43">O</text><path d="M1032.21,264.43 L952.98,242.18" stroke="#203c43" stroke-width="2" fill="none"/><path d="M952.98,242.18 L878.17,280.32" stroke="#203c43" stroke-width="2" fill="none"/><path d="M878.17,280.32 L797.79,271.78" stroke="#203c43" stroke-width="2" fill="none"/><path d="M952.98,242.18 L952.27,158.73" stroke="#203c43" stroke-width="2" fill="none"/><path d="M952.27,158.73 L971.90,80.68" stroke="#203c43" stroke-width="2" fill="none"/><rect x="1017.21" y="254.43" width="30" height="20" fill="#fffefa"/><text x="1032.21" y="269.43" font-size="16" text-anchor="middle" fill="#203c43">CH3</text><rect x="942.98" y="232.18" width="20" height="20" fill="#fffefa"/><text x="952.98" y="247.18" font-size="16" text-anchor="middle" fill="#203c43">CH</text><rect x="873.17" y="270.32" width="10" height="20" fill="#fffefa"/><text x="878.17" y="285.32" font-size="16" text-anchor="middle" fill="#203c43">O</text><rect x="782.79" y="261.78" width="30" height="20" fill="#fffefa"/><text x="797.79" y="276.78" font-size="16" text-anchor="middle" fill="#203c43">CH3</text><rect x="947.27" y="148.73" width="10" height="20" fill="#fffefa"/><text x="952.27" y="163.73" font-size="16" text-anchor="middle" fill="#203c43">O</text><rect x="956.90" y="70.68" width="30" height="20" fill="#fffefa"/><text x="971.90" y="85.68" font-size="16" text-anchor="middle" fill="#203c43">CH3</text><text x="580" y="180" font-size="32" fill="#203c43">→</text><text x="25" y="330" font-size="15" fill="#203c43">Representative substrate/product connectivity; other reagents/byproducts are in the equation. No computed geometry.</text></g><g transform="translate(0,350)"><title>Acetal formation and hydrolysis: Proton transfer</title><desc>CH3CH=O: + H–OH2+ → CH3CH=OH+ + H2O. Protonate the carbonyl oxygen.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="acetal-equilibrium-1-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="acetal-equilibrium-1-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Acetal formation and hydrolysis · 1</text><text x="24" y="65" font-size="17">Proton transfer</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">CH3CH=</text><text x="113.28" y="155" font-size="24.00">O:</text><text x="143.04" y="155" font-size="24.00"> + </text><text x="187.68" y="155" font-size="24.00">H</text><text x="202.56" y="155" font-size="24.00">–</text><text x="217.44" y="155" font-size="24.00">OH2+</text><text x="665.00" y="155" font-size="24.00">CH3CH=OH+ + H2O</text><path data-electrons="2" d="M128.16,141.60 Q161.64,98.60 195.12,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#acetal-equilibrium-1-pair)"/><path data-electrons="2" d="M221.16,141.60 Q234.18,203.60 247.20,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#acetal-equilibrium-1-pair)"/><text x="24" y="235" font-size="16">Protonate the carbonyl oxygen.</text></g></g><g transform="translate(0,640)"><title>Acetal formation and hydrolysis: Nucleophilic carbonyl addition</title><desc>CH3CH=OH+ + MeO:H → CH3CH(OH)(O+HMe). Methanol oxygen adds; carbonyl pi electrons move to oxygen.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="acetal-equilibrium-2-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="acetal-equilibrium-2-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Acetal formation and hydrolysis · 2</text><text x="24" y="65" font-size="17">Nucleophilic carbonyl addition</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">CH3</text><text x="68.64" y="155" font-size="24.00">CH</text><text x="98.40" y="155" font-size="24.00">=</text><text x="113.28" y="155" font-size="24.00">OH+</text><text x="157.92" y="155" font-size="24.00"> + Me</text><text x="232.32" y="155" font-size="24.00">O:H</text><text x="665.00" y="155" font-size="24.00">CH3CH(OH)(O+HMe)</text><path data-electrons="2" d="M254.64,141.60 Q169.08,98.60 83.52,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#acetal-equilibrium-2-pair)"/><path data-electrons="2" d="M109.56,141.60 Q122.58,203.60 135.60,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#acetal-equilibrium-2-pair)"/><text x="24" y="235" font-size="16">Methanol oxygen adds; carbonyl pi electrons move to oxygen.</text></g></g><g transform="translate(0,930)"><title>Acetal formation and hydrolysis: Proton transfer</title><desc>CH3CH(OH)(O+Me–H) + :MeOH → CH3CH(OH)(OMe) + MeOH2+. Solvent removes the incoming alcohol proton to form the hemiacetal.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="acetal-equilibrium-3-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="acetal-equilibrium-3-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Acetal formation and hydrolysis · 3</text><text x="24" y="65" font-size="17">Proton transfer</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">CH3CH(OH)(</text><text x="172.80" y="155" font-size="24.00">O+Me</text><text x="232.32" y="155" font-size="24.00">–</text><text x="247.20" y="155" font-size="24.00">H</text><text x="262.08" y="155" font-size="24.00">) + </text><text x="321.60" y="155" font-size="24.00">:MeOH</text><text x="665.00" y="155" font-size="24.00">CH3CH(OH)(OMe) + MeOH2+</text><path data-electrons="2" d="M358.80,141.60 Q306.72,98.60 254.64,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#acetal-equilibrium-3-pair)"/><path data-electrons="2" d="M228.60,141.60 Q215.58,203.60 202.56,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#acetal-equilibrium-3-pair)"/><text x="24" y="235" font-size="16">Solvent removes the incoming alcohol proton to form the hemiacetal.</text></g></g><g transform="translate(0,1220)"><title>Acetal formation and hydrolysis: Proton transfer</title><desc>CH3CH(O:H)(OMe) + H–OMeH+ → CH3CH(OH2+)(OMe) + MeOH. Protonate the hemiacetal hydroxyl group.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="acetal-equilibrium-4-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="acetal-equilibrium-4-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Acetal formation and hydrolysis · 4</text><text x="24" y="65" font-size="17">Proton transfer</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">CH3CH(</text><text x="113.28" y="155" font-size="24.00">O:H</text><text x="157.92" y="155" font-size="24.00">)(OMe) + </text><text x="291.84" y="155" font-size="24.00">H</text><text x="306.72" y="155" font-size="24.00">–</text><text x="321.60" y="155" font-size="24.00">OMeH+</text><text x="665.00" y="155" font-size="24.00">CH3CH(OH2+)(OMe) + MeOH</text><path data-electrons="2" d="M135.60,141.60 Q217.44,98.60 299.28,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#acetal-equilibrium-4-pair)"/><path data-electrons="2" d="M329.04,141.60 Q343.92,203.60 358.80,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#acetal-equilibrium-4-pair)"/><text x="24" y="235" font-size="16">Protonate the hemiacetal hydroxyl group.</text></g></g><g transform="translate(0,1510)"><title>Acetal formation and hydrolysis: Heterolytic ionization</title><desc>CH3CH(OMe)–OH2+ → [CH3CH(OMe)]+ + H2O. Water departure gives an oxygen-stabilized oxocarbenium model, not an unqualified alkyl carbocation.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="acetal-equilibrium-5-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="acetal-equilibrium-5-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Acetal formation and hydrolysis · 5</text><text x="24" y="65" font-size="17">Heterolytic ionization</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">CH3</text><text x="68.64" y="155" font-size="24.00">CH</text><text x="98.40" y="155" font-size="24.00">(OMe)–</text><text x="187.68" y="155" font-size="24.00">OH2+</text><text x="665.00" y="155" font-size="24.00">[CH3CH(OMe)]+ + H2O</text><path data-electrons="2" d="M150.48,141.60 Q183.96,98.60 217.44,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#acetal-equilibrium-5-pair)"/><text x="24" y="235" font-size="16">Water departure gives an oxygen-stabilized oxocarbenium model, not an unqualified alkyl carbocation.</text></g></g><g transform="translate(0,1800)"><title>Acetal formation and hydrolysis: Lone-pair capture</title><desc>[CH3CH(OMe)]+ + MeO:H → CH3CH(OMe)(O+HMe). A second methanol attacks the oxocarbenium carbon.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="acetal-equilibrium-6-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="acetal-equilibrium-6-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Acetal formation and hydrolysis · 6</text><text x="24" y="65" font-size="17">Lone-pair capture</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">[CH3</text><text x="83.52" y="155" font-size="24.00">CH</text><text x="113.28" y="155" font-size="24.00">(OMe)]+ + Me</text><text x="291.84" y="155" font-size="24.00">O:H</text><text x="665.00" y="155" font-size="24.00">CH3CH(OMe)(O+HMe)</text><path data-electrons="2" d="M314.16,141.60 Q206.28,98.60 98.40,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#acetal-equilibrium-6-pair)"/><text x="24" y="235" font-size="16">A second methanol attacks the oxocarbenium carbon.</text></g></g><g transform="translate(0,2090)"><title>Acetal formation and hydrolysis: Proton transfer</title><desc>CH3CH(OMe)(O+Me–H) + :MeOH → CH3CH(OMe)2 + MeOH2+. Solvent deprotonation gives the acetal and restores acid.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="acetal-equilibrium-7-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="acetal-equilibrium-7-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Acetal formation and hydrolysis · 7</text><text x="24" y="65" font-size="17">Proton transfer</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">CH3CH(OMe)(</text><text x="187.68" y="155" font-size="24.00">O+Me</text><text x="247.20" y="155" font-size="24.00">–</text><text x="262.08" y="155" font-size="24.00">H</text><text x="276.96" y="155" font-size="24.00">) + </text><text x="336.48" y="155" font-size="24.00">:MeOH</text><text x="665.00" y="155" font-size="24.00">CH3CH(OMe)2 + MeOH2+</text><path data-electrons="2" d="M373.68,141.60 Q321.60,98.60 269.52,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#acetal-equilibrium-7-pair)"/><path data-electrons="2" d="M243.48,141.60 Q230.46,203.60 217.44,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#acetal-equilibrium-7-pair)"/><text x="24" y="235" font-size="16">Solvent deprotonation gives the acetal and restores acid.</text></g></g></svg>