<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" role="img"><title>Wagner–Meerwein skeletal rearrangement: 1,2 methyl migration</title><desc>CH3–CH+–C(Me)2–Me → (Me)2CH–C+(Me)2. The adjacent C–Me sigma pair migrates to the empty p orbital, moving the cation to the donor carbon.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="wagner-meerwein-3-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="wagner-meerwein-3-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Wagner–Meerwein skeletal rearrangement · 3</text><text x="24" y="65" font-size="17">1,2 methyl migration</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">CH3–</text><text x="83.52" y="155" font-size="24.00">CH+</text><text x="128.16" y="155" font-size="24.00">–</text><text x="143.04" y="155" font-size="24.00">C</text><text x="157.92" y="155" font-size="24.00">(Me)2–</text><text x="247.20" y="155" font-size="24.00">Me</text><text x="665.00" y="155" font-size="24.00">(Me)2CH–C+(Me)2</text><path data-electrons="2" d="M206.28,141.60 Q156.06,98.60 105.84,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#wagner-meerwein-3-pair)"/><text x="24" y="235" font-size="16">The adjacent C–Me sigma pair migrates to the empty p orbital, moving the cation to the donor carbon.</text></g></svg>