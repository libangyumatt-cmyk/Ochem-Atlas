<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" role="img"><title>Alkene hydroboration–oxidation: Lone-pair capture</title><desc>R2B–Pr + :O−–OH → [R2B(Pr)(OOH)]−. Hydroperoxide anion attacks electron-deficient boron; no carbon cation is formed.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="hydroboration-oxidation-2-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="hydroboration-oxidation-2-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Alkene hydroboration–oxidation · 2</text><text x="24" y="65" font-size="17">Lone-pair capture</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">R2</text><text x="53.76" y="155" font-size="24.00">B</text><text x="68.64" y="155" font-size="24.00">–Pr + </text><text x="157.92" y="155" font-size="24.00">:O−</text><text x="202.56" y="155" font-size="24.00">–OH</text><text x="665.00" y="155" font-size="24.00">[R2B(Pr)(OOH)]−</text><path data-electrons="2" d="M180.24,141.60 Q120.72,98.60 61.20,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#hydroboration-oxidation-2-pair)"/><text x="24" y="235" font-size="16">Hydroperoxide anion attacks electron-deficient boron; no carbon cation is formed.</text></g></svg>