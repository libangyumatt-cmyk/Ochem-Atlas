<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" role="img"><title>Oxymercuration–demercuration: Bond-replacing displacement</title><desc>[CH3–CH–CH2–HgOAc bridge]+ + :OH2 → CH3CH(OH2+)CH2HgOAc. Water attacks the more substituted bridge carbon from the opposite face; its C–Hg bridge bond opens.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="oxymercuration-2-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="oxymercuration-2-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Oxymercuration–demercuration · 2</text><text x="24" y="65" font-size="17">Bond-replacing displacement</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">[CH3–</text><text x="98.40" y="155" font-size="24.00">CH</text><text x="128.16" y="155" font-size="24.00">–</text><text x="143.04" y="155" font-size="24.00">CH2</text><text x="187.68" y="155" font-size="24.00">–</text><text x="202.56" y="155" font-size="24.00">HgOAc</text><text x="276.96" y="155" font-size="24.00"> bridge]+ + </text><text x="455.52" y="155" font-size="24.00">:OH2</text><text x="665.00" y="155" font-size="24.00">CH3CH(OH2+)CH2HgOAc</text><path data-electrons="2" d="M485.28,141.60 Q299.28,98.60 113.28,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#oxymercuration-2-pair)"/><path data-electrons="2" d="M176.52,141.60 Q208.14,203.60 239.76,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#oxymercuration-2-pair)"/><text x="24" y="235" font-size="16">Water attacks the more substituted bridge carbon from the opposite face; its C–Hg bridge bond opens.</text></g></svg>