1" y="169.56" font-size="16" text-anchor="middle" fill="#203c43">CH</text><rect x="930.62" y="126.77" width="10" height="20" fill="#fffefa"/><text x="935.62" y="141.77" font-size="16" text-anchor="middle" fill="#203c43">C</text><rect x="921.48" y="92.40" width="20" height="20" fill="#fffefa"/><text x="931.48" y="107.40" font-size="16" text-anchor="middle" fill="#203c43">CH</text><rect x="947.55" y="70.50" width="20" height="20" fill="#fffefa"/><text x="957.55" y="85.50" font-size="16" text-anchor="middle" fill="#203c43">CH</text><rect x="980.79" y="77.21" width="20" height="20" fill="#fffefa"/><text x="990.79" y="92.21" font-size="16" text-anchor="middle" fill="#203c43">CH</text><rect x="990.09" y="109.31" width="20" height="20" fill="#fffefa"/><text x="1000.09" y="124.31" font-size="16" text-anchor="middle" fill="#203c43">CH</text><rect x="960.90" y="127.05" width="20" height="20" fill="#fffefa"/><text x="970.90" y="142.05" font-size="16" text-anchor="middle" fill="#203c43">CH</text><text x="580" y="180" font-size="32" fill="#203c43">→</text><text x="25" y="330" font-size="15" fill="#203c43">Representative substrate/product connectivity; other reagents/byproducts are in the equation. No computed geometry.</text><text x="680" y="60" font-size="20">E alkene · relative double-bond geometry specified</text></g><g transform="translate(0,350)"><title>Horner–Wadsworth–Emmons olefination: Proton transfer</title><desc>(EtO)2P(O)–CH(CO2Et)–H + :H− → (EtO)2P(O)–C−HCO2Et + H2. Base removes the phosphonate alpha proton; counterions are omitted consistently.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="horner-wadsworth-emmons-1-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="horner-wadsworth-emmons-1-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Horner–Wadsworth–Emmons olefination · 1</text><text x="24" y="65" font-size="17">Proton transfer</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">(EtO)2P(O)–</text><text x="187.68" y="155" font-size="24.00">CH</text><text x="217.44" y="155" font-size="24.00">(CO2Et)–</text><text x="336.48" y="155" font-size="24.00">H</text><text x="351.36" y="155" font-size="24.00"> + </text><text x="396.00" y="155" font-size="24.00">:H−</text><text x="665.00" y="155" font-size="24.00">(EtO)2P(O)–C−HCO2Et + H2</text><path data-electrons="2" d="M418.32,141.60 Q381.12,98.60 343.92,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#horner-wadsworth-emmons-1-pair)"/><path data-electrons="2" d="M273.24,141.60 Q237.90,203.60 202.56,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#horner-wadsworth-emmons-1-pair)"/><text x="24" y="235" font-size="16">Base removes the phosphonate alpha proton; counterions are omitted consistently.</text></g></g><g transform="translate(0,640)"><title>Horner–Wadsworth–Emmons olefination: Nucleophilic carbonyl addition</title><desc>(EtO)2P(O)–C−HCO2Et + Ph–CH=O → PhCH(O−)–CH[P(O)(OEt)2]CO2Et. The phosphonate-stabilized carbon anion adds to benzaldehyde.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="horner-wadsworth-emmons-2-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="horner-wadsworth-emmons-2-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Horner–Wadsworth–Emmons olefination · 2</text><text x="24" y="65" font-size="17">Nucleophilic carbonyl addition</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">(EtO)2P(O)–</text><text x="187.68" y="155" font-size="24.00">C−H</text><text x="232.32" y="155" font-size="24.00">CO2Et + Ph–</text><text x="396.00" y="155" font-size="24.00">CH</text><text x="425.76" y="155" font-size="24.00">=</text><text x="440.64" y="155" font-size="24.00">O</text><text x="665.00" y="155" font-size="24.00">PhCH(O−)–CH[P(O)(OEt)2]CO2Et</text><path data-electrons="2" d="M210.00,141.60 Q310.44,98.60 410.88,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#horner-wadsworth-emmons-2-pair)"/><path data-electrons="2" d="M429.48,141.60 Q438.78,203.60 448.08,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#horner-wadsworth-emmons-2-pair)"/><text x="24" y="235" font-size="16">The phosphonate-stabilized carbon anion adds to benzaldehyde.</text></g></g><g transform="translate(0,930)"><title>Horner–Wadsworth–Emmons olefination: Coupled polar bond reorganization</title><desc>PhCH(O−)–CH–P(O)(OEt)2 → PhCH–O–P(OEt)2–CH(CO2Et) cyclic intermediate. Oxygen bonds to phosphorus in the cyclic elimination model.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="horner-wadsworth-emmons-3-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="horner-wadsworth-emmons-3-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Horner–Wadsworth–Emmons olefination · 3</text><text x="24" y="65" font-size="17">Coupled polar bond reorganization</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">PhCH(</text><text x="98.40" y="155" font-size="24.00">O−</text><text x="128.16" y="155" font-size="24.00">)–CH–</text><text x="202.56" y="155" font-size="24.00">P</text><text x="217.44" y="155" font-size="24.00">(O)(OEt)2</text><text x="665.00" y="155" font-size="18.70">PhCH–O–P(OEt)2–CH(CO2Et) cyclic intermediate</text><path data-electrons="2" d="M113.28,141.60 Q161.64,98.60 210.00,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#horner-wadsworth-emmons-3-pair)"/><text x="24" y="235" font-size="16">Oxygen bonds to phosphorus in the cyclic elimination model.</text></g></g><g transform="translate(0,1220)"><title>Horner–Wadsworth–Emmons olefination: Phosphate elimination</title><desc>Cyclic phosphonate adduct → (E)-PhCH=CHCO2Et + phosphate anion. Coupled fragmentation gives the alkene and a phosphate leaving group; the geometry of addition/elimination controls E/Z.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="horner-wadsworth-emmons-4-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="horner-wadsworth-emmons-4-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Horner–Wadsworth–Emmons olefination · 4</text><text x="24" y="65" font-size="17">Phosphate elimination</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">Cyclic phosphonate adduct</text><text x="665.00" y="155" font-size="24.00">(E)-PhCH=CHCO2Et + phosphate anion</text><text x="30" y="202" font-size="16">Condensed structural stage; electron changes are specified below.</text><text x="24" y="235" font-size="16">Coupled fragmentation gives the alkene and a phosphate leaving group; the geometry of addition/elimination</text><text x="24" y="258" font-size="16">controls E/Z.</text></g></g></svg>