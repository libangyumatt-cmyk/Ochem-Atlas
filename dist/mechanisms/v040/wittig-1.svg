<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" role="img"><title>Wittig olefination: Proton transfer</title><desc>Ph3P+–CH2–H + :base− → Ph3P+–CH2− + H–base. Deprotonation of a methylphosphonium salt generates the ylide; P=C and P+–C− are resonance descriptions.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="wittig-1-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="wittig-1-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Wittig olefination · 1</text><text x="24" y="65" font-size="17">Proton transfer</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">Ph3P+–</text><text x="113.28" y="155" font-size="24.00">CH2</text><text x="157.92" y="155" font-size="24.00">–</text><text x="172.80" y="155" font-size="24.00">H</text><text x="187.68" y="155" font-size="24.00"> + </text><text x="232.32" y="155" font-size="24.00">:base−</text><text x="665.00" y="155" font-size="24.00">Ph3P+–CH2− + H–base</text><path data-electrons="2" d="M276.96,141.60 Q228.60,98.60 180.24,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#wittig-1-pair)"/><path data-electrons="2" d="M157.92,141.60 Q146.76,203.60 135.60,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#wittig-1-pair)"/><text x="24" y="235" font-size="16">Deprotonation of a methylphosphonium salt generates the ylide; P=C and P+–C− are resonance descriptions.</text></g></svg>