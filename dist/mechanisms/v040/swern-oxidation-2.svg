<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" role="img"><title>Swern oxidation: Bond-replacing displacement</title><desc>PhCH2–O:H + Me2S+–Cl → PhCH2O(H)–SMe2 dicationic adduct + Cl−. Alcohol oxygen attacks electrophilic sulfur and chloride departs in a sulfonium-activation description.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="swern-oxidation-2-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="swern-oxidation-2-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Swern oxidation · 2</text><text x="24" y="65" font-size="17">Bond-replacing displacement</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">PhCH2–</text><text x="113.28" y="155" font-size="24.00">O:H</text><text x="157.92" y="155" font-size="24.00"> + Me2</text><text x="247.20" y="155" font-size="24.00">S+</text><text x="276.96" y="155" font-size="24.00">–</text><text x="291.84" y="155" font-size="24.00">Cl</text><text x="665.00" y="155" font-size="21.65">PhCH2O(H)–SMe2 dicationic adduct + Cl−</text><path data-electrons="2" d="M135.60,141.60 Q198.84,98.60 262.08,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#swern-oxidation-2-pair)"/><path data-electrons="2" d="M284.40,141.60 Q295.56,203.60 306.72,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#swern-oxidation-2-pair)"/><text x="24" y="235" font-size="16">Alcohol oxygen attacks electrophilic sulfur and chloride departs in a sulfonium-activation description.</text></g></svg>