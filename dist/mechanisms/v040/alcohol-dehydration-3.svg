<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" role="img"><title>Acid-catalyzed alcohol dehydration: Coupled polar bond reorganization</title><desc>:OH2 + H–CH2–C+(CH3)2 → H3O+ + CH2=C(CH3)2. Water removes beta H; the C–H pair makes the alkene and restores the acid catalyst.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="alcohol-dehydration-3-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="alcohol-dehydration-3-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Acid-catalyzed alcohol dehydration · 3</text><text x="24" y="65" font-size="17">Coupled polar bond reorganization</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">:OH2</text><text x="83.52" y="155" font-size="24.00"> + </text><text x="128.16" y="155" font-size="24.00">H</text><text x="143.04" y="155" font-size="24.00">–</text><text x="157.92" y="155" font-size="24.00">CH2</text><text x="202.56" y="155" font-size="24.00">–</text><text x="217.44" y="155" font-size="24.00">C+</text><text x="247.20" y="155" font-size="24.00">(CH3)2</text><text x="665.00" y="155" font-size="24.00">H3O+ + CH2=C(CH3)2</text><path data-electrons="2" d="M53.76,141.60 Q94.68,98.60 135.60,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#alcohol-dehydration-3-pair)"/><path data-electrons="2" d="M157.92,141.60 Q182.10,203.60 206.28,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#alcohol-dehydration-3-pair)"/><text x="24" y="235" font-size="16">Water removes beta H; the C–H pair makes the alkene and restores the acid catalyst.</text></g></svg>