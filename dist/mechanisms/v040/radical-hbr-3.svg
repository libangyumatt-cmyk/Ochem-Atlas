<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" role="img"><title>Peroxide-initiated radical HBr addition: Radical bond formation</title><desc>Br• + CH3–CH=CH2 → CH3CH•CH2Br. Br radical adds at terminal carbon; the other pi electron remains at the more substituted carbon.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="radical-hbr-3-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="radical-hbr-3-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Peroxide-initiated radical HBr addition · 3</text><text x="24" y="65" font-size="17">Radical bond formation</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">Br•</text><text x="68.64" y="155" font-size="24.00"> + CH3–</text><text x="172.80" y="155" font-size="24.00">CH</text><text x="202.56" y="155" font-size="24.00">=</text><text x="217.44" y="155" font-size="24.00">CH2</text><text x="665.00" y="155" font-size="24.00">CH3CH•CH2Br</text><path data-electrons="1" d="M46.32,141.60 Q94.68,98.60 143.04,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#radical-hbr-3-fish)"/><path data-electrons="1" d="M213.72,141.60 Q178.38,203.60 143.04,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#radical-hbr-3-fish)"/><path data-electrons="1" d="M213.72,141.60 Q200.70,80.60 187.68,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#radical-hbr-3-fish)"/><text x="24" y="235" font-size="16">Br radical adds at terminal carbon; the other pi electron remains at the more substituted carbon.</text></g></svg>