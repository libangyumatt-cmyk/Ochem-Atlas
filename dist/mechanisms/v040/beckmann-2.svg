<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" role="img"><title>Beckmann rearrangement: Anti migration and water departure</title><desc>Ring (CH2)4–CH2–C=N–OH2+ → Ring C≡N+–(CH2)5–(back) + H2O. The anti C–C bond migrates to N as N–O cleavage expels water, giving a ring-expanded nitrilium model.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="beckmann-2-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="beckmann-2-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Beckmann rearrangement · 2</text><text x="24" y="65" font-size="17">Anti migration and water departure</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">Ring (CH2)4–</text><text x="202.56" y="155" font-size="24.00">CH2</text><text x="247.20" y="155" font-size="24.00">–</text><text x="262.08" y="155" font-size="24.00">C</text><text x="276.96" y="155" font-size="24.00">=</text><text x="291.84" y="155" font-size="24.00">N</text><text x="306.72" y="155" font-size="24.00">–</text><text x="321.60" y="155" font-size="24.00">OH2+</text><text x="665.00" y="155" font-size="24.00">Ring C≡N+–(CH2)5–(back) + H2O</text><path data-electrons="2" d="M247.20,141.60 Q273.24,98.60 299.28,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#beckmann-2-pair)"/><path data-electrons="2" d="M325.32,141.60 Q338.34,203.60 351.36,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#beckmann-2-pair)"/><text x="24" y="235" font-size="16">The anti C–C bond migrates to N as N–O cleavage expels water, giving a ring-expanded nitrilium model.</text></g></svg>