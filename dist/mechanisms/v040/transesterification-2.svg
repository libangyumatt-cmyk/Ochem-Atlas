<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" role="img"><title>Base-catalyzed transesterification: Tetrahedral intermediate collapse</title><desc>CH3–C(O−)(OMe)–OEt → CH3CO2Me + EtO−. Carbonyl reformation expels ethoxide; reverse loss of methoxide also competes.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="transesterification-2-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="transesterification-2-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Base-catalyzed transesterification · 2</text><text x="24" y="65" font-size="17">Tetrahedral intermediate collapse</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">CH3–</text><text x="83.52" y="155" font-size="24.00">C</text><text x="98.40" y="155" font-size="24.00">(</text><text x="113.28" y="155" font-size="24.00">O−</text><text x="143.04" y="155" font-size="24.00">)(OMe)–</text><text x="247.20" y="155" font-size="24.00">OEt</text><text x="665.00" y="155" font-size="24.00">CH3CO2Me + EtO−</text><path data-electrons="2" d="M128.16,141.60 Q118.86,98.60 109.56,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#transesterification-2-pair)"/><path data-electrons="2" d="M180.24,141.60 Q224.88,203.60 269.52,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#transesterification-2-pair)"/><text x="24" y="235" font-size="16">Carbonyl reformation expels ethoxide; reverse loss of methoxide also competes.</text></g></svg>