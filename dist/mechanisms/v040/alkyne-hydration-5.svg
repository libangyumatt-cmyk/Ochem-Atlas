<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" role="img"><title>Mercury-catalyzed alkyne hydration: Proton transfer</title><desc>CH3C(=O+–H)CH3 + :OH2 → CH3COCH3 + H3O+. Water removes the O-bound proton, giving acetone.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="alkyne-hydration-5-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="alkyne-hydration-5-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Mercury-catalyzed alkyne hydration · 5</text><text x="24" y="65" font-size="17">Proton transfer</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">CH3C(=</text><text x="113.28" y="155" font-size="24.00">O+</text><text x="143.04" y="155" font-size="24.00">–</text><text x="157.92" y="155" font-size="24.00">H</text><text x="172.80" y="155" font-size="24.00">)CH3 + </text><text x="276.96" y="155" font-size="24.00">:OH2</text><text x="665.00" y="155" font-size="24.00">CH3COCH3 + H3O+</text><path data-electrons="2" d="M306.72,141.60 Q236.04,98.60 165.36,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#alkyne-hydration-5-pair)"/><path data-electrons="2" d="M146.76,141.60 Q137.46,203.60 128.16,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#alkyne-hydration-5-pair)"/><text x="24" y="235" font-size="16">Water removes the O-bound proton, giving acetone.</text></g></svg>