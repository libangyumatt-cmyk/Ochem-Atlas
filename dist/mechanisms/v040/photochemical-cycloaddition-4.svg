<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" role="img"><title>Triplet-sensitized enone [2+2] cycloaddition: Spin-compatible diradical closure</title><desc>Ring alpha-C• ... tether ... •CH2 → Cyclopentanone fused across alpha/beta to a cyclobutane ring. Two spin-compatible radical electrons form the second C–C bond, closing the four-membered ring.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="photochemical-cycloaddition-4-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="photochemical-cycloaddition-4-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Triplet-sensitized enone [2+2] cycloaddition · 4</text><text x="24" y="65" font-size="17">Spin-compatible diradical closure</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">Ring alpha-</text><text x="187.68" y="155" font-size="24.00">C•</text><text x="217.44" y="155" font-size="24.00"> ... tether ... </text><text x="455.52" y="155" font-size="24.00">•CH2</text><text x="665.00" y="155" font-size="13.71">Cyclopentanone fused across alpha/beta to a cyclobutane ring</text><path data-electrons="1" d="M202.56,141.60 Q273.24,98.60 343.92,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#photochemical-cycloaddition-4-fish)"/><path data-electrons="1" d="M485.28,141.60 Q414.60,203.60 343.92,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#photochemical-cycloaddition-4-fish)"/><text x="24" y="235" font-size="16">Two spin-compatible radical electrons form the second C–C bond, closing the four-membered ring.</text></g></svg>