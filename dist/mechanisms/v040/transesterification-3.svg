<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" role="img"><title>Base-catalyzed transesterification: Proton transfer</title><desc>EtO− + MeO–H → EtOH + MeO−. Solvent proton transfer interconverts alkoxides and closes the catalyst cycle.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="transesterification-3-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="transesterification-3-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Base-catalyzed transesterification · 3</text><text x="24" y="65" font-size="17">Proton transfer</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">Et</text><text x="53.76" y="155" font-size="24.00">O−</text><text x="83.52" y="155" font-size="24.00"> + Me</text><text x="157.92" y="155" font-size="24.00">O</text><text x="172.80" y="155" font-size="24.00">–</text><text x="187.68" y="155" font-size="24.00">H</text><text x="665.00" y="155" font-size="24.00">EtOH + MeO−</text><path data-electrons="2" d="M68.64,141.60 Q131.88,98.60 195.12,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#transesterification-3-pair)"/><path data-electrons="2" d="M180.24,141.60 Q172.80,203.60 165.36,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#transesterification-3-pair)"/><text x="24" y="235" font-size="16">Solvent proton transfer interconverts alkoxides and closes the catalyst cycle.</text></g></svg>