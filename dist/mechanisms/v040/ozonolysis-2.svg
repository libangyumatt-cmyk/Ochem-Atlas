<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" role="img"><title>Reductive ozonolysis: Molozonide cycloreversion</title><desc>ring Me–CH–CH(Me)–O–O–O–(back to a) → MeCH=O + MeCH=O+–O−. Cycloreversion fragments the unstable primary ozonide into a carbonyl compound and a carbonyl oxide; no free alkene-carbon cation is proposed.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="ozonolysis-2-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="ozonolysis-2-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Reductive ozonolysis · 2</text><text x="24" y="65" font-size="17">Molozonide cycloreversion</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="23.96">ring Me–</text><text x="142.86" y="155" font-size="23.96">CH</text><text x="172.57" y="155" font-size="23.96">–</text><text x="187.43" y="155" font-size="23.96">CH</text><text x="217.14" y="155" font-size="23.96">(Me)–</text><text x="291.43" y="155" font-size="23.96">O</text><text x="306.29" y="155" font-size="23.96">–</text><text x="321.14" y="155" font-size="23.96">O</text><text x="336.00" y="155" font-size="23.96">–</text><text x="350.86" y="155" font-size="23.96">O</text><text x="365.71" y="155" font-size="23.96">–(back to a)</text><text x="665.00" y="155" font-size="24.00">MeCH=O + MeCH=O+–O−</text><path data-electrons="2" d="M180.00,141.61 Q219.00,98.61 258.00,137.61" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#ozonolysis-2-pair)"/><path data-electrons="2" d="M343.43,141.61 Q336.00,203.61 328.57,137.61" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#ozonolysis-2-pair)"/><path data-electrons="2" d="M298.86,141.61 Q274.71,80.61 250.57,137.61" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#ozonolysis-2-pair)"/><text x="24" y="235" font-size="16">Cycloreversion fragments the unstable primary ozonide into a carbonyl compound and a carbonyl oxide; no free</text><text x="24" y="258" font-size="16">alkene-carbon cation is proposed.</text></g></svg>