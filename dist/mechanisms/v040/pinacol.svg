<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1510"><title>Pinacol rearrangement: complete teaching sequence</title><g font-family="DejaVu Sans,sans-serif"><rect width="1200" height="350" fill="#fffefa"/><text x="25" y="32" font-size="21" fill="#203c43">Pinacol rearrangement · representative molecular graphs</text><path d="M351.99,217.64 L285.57,216.28" stroke="#203c43" stroke-width="2" fill="none"/><path d="M285.57,216.28 L304.57,280.50" stroke="#203c43" stroke-width="2" fill="none"/><path d="M285.57,216.28 L230.79,253.33" stroke="#203c43" stroke-width="2" fill="none"/><path d="M285.57,216.28 L263.85,146.25" stroke="#203c43" stroke-width="2" fill="none"/><path d="M263.85,146.25 L198.01,135.79" stroke="#203c43" stroke-width="2" fill="none"/><path d="M263.85,146.25 L251.89,80.50" stroke="#203c43" stroke-width="2" fill="none"/><path d="M263.85,146.25 L321.16,113.80" stroke="#203c43" stroke-width="2" fill="none"/><rect x="336.99" y="207.64" width="30" height="20" fill="#fffefa"/><text x="351.99" y="222.64" font-size="16" text-anchor="middle" fill="#203c43">CH3</text><rect x="280.57" y="206.28" width="10" height="20" fill="#fffefa"/><text x="285.57" y="221.28" font-size="16" text-anchor="middle" fill="#203c43">C</text><rect x="294.57" y="270.50" width="20" height="20" fill="#fffefa"/><text x="304.57" y="285.50" font-size="16" text-anchor="middle" fill="#203c43">OH</text><rect x="215.79" y="243.33" width="30" height="20" fill="#fffefa"/><text x="230.79" y="258.33" font-size="16" text-anchor="middle" fill="#203c43">CH3</text><rect x="258.85" y="136.25" width="10" height="20" fill="#fffefa"/><text x="263.85" y="151.25" font-size="16" text-anchor="middle" fill="#203c43">C</text><rect x="188.01" y="125.79" width="20" height="20" fill="#fffefa"/><text x="198.01" y="140.79" font-size="16" text-anchor="middle" fill="#203c43">OH</text><rect x="236.89" y="70.50" width="30" height="20" fill="#fffefa"/><text x="251.89" y="85.50" font-size="16" text-anchor="middle" fill="#203c43">CH3</text><rect x="306.16" y="103.80" width="30" height="20" fill="#fffefa"/><text x="321.16" y="118.80" font-size="16" text-anchor="middle" fill="#203c43">CH3</text><path d="M1005.80,219.57 L935.16,211.82" stroke="#203c43" stroke-width="2" fill="none"/><path d="M938.07,212.56 L920.57,281.24" stroke="#203c43" stroke-width="2" fill="none"/><path d="M932.26,211.08 L914.75,279.76" stroke="#203c43" stroke-width="2" fill="none"/><path d="M935.16,211.82 L895.19,146.92" stroke="#203c43" stroke-width="2" fill="none"/><path d="M895.19,146.92 L824.20,157.93" stroke="#203c43" stroke-width="2" fill="none"/><path d="M895.19,146.92 L868.02,80.50" stroke="#203c43" stroke-width="2" fill="none"/><path d="M895.19,146.92 L952.29,104.62" stroke="#203c43" stroke-width="2" fill="none"/><rect x="990.80" y="209.57" width="30" height="20" fill="#fffefa"/><text x="1005.80" y="224.57" font-size="16" text-anchor="middle" fill="#203c43">CH3</text><rect x="930.16" y="201.82" width="10" height="20" fill="#fffefa"/><text x="935.16" y="216.82" font-size="16" text-anchor="middle" fill="#203c43">C</text><rect x="912.66" y="270.50" width="10" height="20" fill="#fffefa"/><text x="917.66" y="285.50" font-size="16" text-anchor="middle" fill="#203c43">O</text><rect x="890.19" y="136.92" width="10" height="20" fill="#fffefa"/><text x="895.19" y="151.92" font-size="16" text-anchor="middle" fill="#203c43">C</text><rect x="809.20" y="147.93" width="30" height="20" fill="#fffefa"/><text x="824.20" y="162.93" font-size="16" text-anchor="middle" fill="#203c43">CH3</text><rect x="853.02" y="70.50" width="30" height="20" fill="#fffefa"/><text x="868.02" y="85.50" font-size="16" text-anchor="middle" fill="#203c43">CH3</text><rect x="937.29" y="94.62" width="30" height="20" fill="#fffefa"/><text x="952.29" y="109.62" font-size="16" text-anchor="middle" fill="#203c43">CH3</text><text x="580" y="180" font-size="32" fill="#203c43">→</text><text x="25" y="330" font-size="15" fill="#203c43">Representative substrate/product connectivity; other reagents/byproducts are in the equation. No computed geometry.</text></g><g transform="translate(0,350)"><title>Pinacol rearrangement: Proton transfer</title><desc>Me2C(O:H)C(OH)Me2 + H–OH2+ → Me2C(OH2+)C(OH)Me2 + H2O. Protonate one hydroxyl to make a leaving group.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="pinacol-1-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="pinacol-1-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Pinacol rearrangement · 1</text><text x="24" y="65" font-size="17">Proton transfer</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">Me2C(</text><text x="98.40" y="155" font-size="24.00">O:H</text><text x="143.04" y="155" font-size="24.00">)C(OH)Me2 + </text><text x="321.60" y="155" font-size="24.00">H</text><text x="336.48" y="155" font-size="24.00">–</text><text x="351.36" y="155" font-size="24.00">OH2+</text><text x="665.00" y="155" font-size="24.00">Me2C(OH2+)C(OH)Me2 + H2O</text><path data-electrons="2" d="M120.72,141.60 Q224.88,98.60 329.04,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#pinacol-1-pair)"/><path data-electrons="2" d="M355.08,141.60 Q368.10,203.60 381.12,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#pinacol-1-pair)"/><text x="24" y="235" font-size="16">Protonate one hydroxyl to make a leaving group.</text></g></g><g transform="translate(0,640)"><title>Pinacol rearrangement: Heterolytic ionization</title><desc>Me2C(OH2+)C(OH)Me2 → Me2C+–C(OH)Me2 + H2O. The C–O pair leaves with water in the limiting cation model.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="pinacol-2-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="pinacol-2-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Pinacol rearrangement · 2</text><text x="24" y="65" font-size="17">Heterolytic ionization</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">Me2</text><text x="68.64" y="155" font-size="24.00">C</text><text x="83.52" y="155" font-size="24.00">(</text><text x="98.40" y="155" font-size="24.00">OH2+</text><text x="157.92" y="155" font-size="24.00">)C(OH)Me2</text><text x="665.00" y="155" font-size="24.00">Me2C+–C(OH)Me2 + H2O</text><path data-electrons="2" d="M102.12,141.60 Q115.14,98.60 128.16,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#pinacol-2-pair)"/><text x="24" y="235" font-size="16">The C–O pair leaves with water in the limiting cation model.</text></g></g><g transform="translate(0,930)"><title>Pinacol rearrangement: 1,2 migration with carbonyl formation</title><desc>Me2C+–C(OH:)(Me)–Me → Me3C–C(=OH+)Me. The adjacent C–Me sigma bond migrates to the cation as O donates to form carbonyl; free methyl anion is not formed.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="pinacol-3-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="pinacol-3-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Pinacol rearrangement · 3</text><text x="24" y="65" font-size="17">1,2 migration with carbonyl formation</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">Me2</text><text x="68.64" y="155" font-size="24.00">C+</text><text x="98.40" y="155" font-size="24.00">–</text><text x="113.28" y="155" font-size="24.00">C</text><text x="128.16" y="155" font-size="24.00">(</text><text x="143.04" y="155" font-size="24.00">OH:</text><text x="187.68" y="155" font-size="24.00">)(Me)–</text><text x="276.96" y="155" font-size="24.00">Me</text><text x="665.00" y="155" font-size="24.00">Me3C–C(=OH+)Me</text><path data-electrons="2" d="M206.28,141.60 Q144.90,98.60 83.52,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#pinacol-3-pair)"/><path data-electrons="2" d="M165.36,141.60 Q154.20,203.60 143.04,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#pinacol-3-pair)"/><text x="24" y="235" font-size="16">The adjacent C–Me sigma bond migrates to the cation as O donates to form carbonyl; free methyl anion is not</text><text x="24" y="258" font-size="16">formed.</text></g></g><g transform="translate(0,1220)"><title>Pinacol rearrangement: Proton transfer</title><desc>Me3CC(=O+–H)Me + :OH2 → Me3CC(=O)Me + H3O+. Deprotonate the oxonium carbonyl to pinacolone.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="pinacol-4-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="pinacol-4-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Pinacol rearrangement · 4</text><text x="24" y="65" font-size="17">Proton transfer</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">Me3CC(=</text><text x="128.16" y="155" font-size="24.00">O+</text><text x="157.92" y="155" font-size="24.00">–</text><text x="172.80" y="155" font-size="24.00">H</text><text x="187.68" y="155" font-size="24.00">)Me + </text><text x="276.96" y="155" font-size="24.00">:OH2</text><text x="665.00" y="155" font-size="24.00">Me3CC(=O)Me + H3O+</text><path data-electrons="2" d="M306.72,141.60 Q243.48,98.60 180.24,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#pinacol-4-pair)"/><path data-electrons="2" d="M161.64,141.60 Q152.34,203.60 143.04,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#pinacol-4-pair)"/><text x="24" y="235" font-size="16">Deprotonate the oxonium carbonyl to pinacolone.</text></g></g></svg>