<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" role="img"><title>NBS allylic bromination: Radical atom transfer</title><desc>Cyclohexenyl C• + Br–Br → 3-Bromocyclohexene + Br•. The allylic radical abstracts Br from Br2, regenerating the chain carrier.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="nbs-bromination-4-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="nbs-bromination-4-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">NBS allylic bromination · 4</text><text x="24" y="65" font-size="17">Radical atom transfer</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">Cyclohexenyl </text><text x="217.44" y="155" font-size="24.00">C•</text><text x="247.20" y="155" font-size="24.00"> + </text><text x="291.84" y="155" font-size="24.00">Br</text><text x="321.60" y="155" font-size="24.00">–</text><text x="336.48" y="155" font-size="24.00">Br</text><text x="665.00" y="155" font-size="24.00">3-Bromocyclohexene + Br•</text><path data-electrons="1" d="M232.32,141.60 Q250.92,98.60 269.52,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#nbs-bromination-4-fish)"/><path data-electrons="1" d="M329.04,141.60 Q299.28,203.60 269.52,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#nbs-bromination-4-fish)"/><path data-electrons="1" d="M329.04,141.60 Q340.20,80.60 351.36,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#nbs-bromination-4-fish)"/><text x="24" y="235" font-size="16">The allylic radical abstracts Br from Br2, regenerating the chain carrier.</text></g></svg>