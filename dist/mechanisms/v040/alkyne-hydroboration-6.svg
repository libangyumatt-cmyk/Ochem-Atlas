<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" role="img"><title>Alkyne hydroboration–oxidation: Carbon protonation gives propanal</title><desc>−O–CH=CHCH3 + H–OH → O=CH–CH2CH3 + OH−. Enolate oxygen forms C=O as alpha carbon receives a proton from water; solvent relays can resolve this bookkeeping into microscopic transfers.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="alkyne-hydroboration-6-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="alkyne-hydroboration-6-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Alkyne hydroboration–oxidation · 6</text><text x="24" y="65" font-size="17">Carbon protonation gives propanal</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">−O</text><text x="53.76" y="155" font-size="24.00">–</text><text x="68.64" y="155" font-size="24.00">CH</text><text x="98.40" y="155" font-size="24.00">=</text><text x="113.28" y="155" font-size="24.00">CH</text><text x="143.04" y="155" font-size="24.00">CH3 + H–OH</text><text x="665.00" y="155" font-size="24.00">O=CH–CH2CH3 + OH−</text><path data-electrons="2" d="M38.88,141.60 Q50.04,98.60 61.20,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#alkyne-hydroboration-6-pair)"/><text x="24" y="235" font-size="16">Enolate oxygen forms C=O as alpha carbon receives a proton from water; solvent relays can resolve this</text><text x="24" y="258" font-size="16">bookkeeping into microscopic transfers.</text></g></svg>