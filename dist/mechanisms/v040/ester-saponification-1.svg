<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" role="img"><title>Ester saponification: Nucleophilic carbonyl addition</title><desc>CH3–C(=O)OEt + :OH− → CH3C(O−)(OH)OEt. Hydroxide attacks acyl carbon and C=O pi electrons move to O.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="ester-saponification-1-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="ester-saponification-1-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Ester saponification · 1</text><text x="24" y="65" font-size="17">Nucleophilic carbonyl addition</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">CH3–</text><text x="83.52" y="155" font-size="24.00">C</text><text x="98.40" y="155" font-size="24.00">(=</text><text x="128.16" y="155" font-size="24.00">O</text><text x="143.04" y="155" font-size="24.00">)OEt + </text><text x="247.20" y="155" font-size="24.00">:OH−</text><text x="665.00" y="155" font-size="24.00">CH3C(O−)(OH)OEt</text><path data-electrons="2" d="M276.96,141.60 Q183.96,98.60 90.96,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#ester-saponification-1-pair)"/><path data-electrons="2" d="M113.28,141.60 Q124.44,203.60 135.60,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#ester-saponification-1-pair)"/><text x="24" y="235" font-size="16">Hydroxide attacks acyl carbon and C=O pi electrons move to O.</text></g></svg>