<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1510"><title>Catalytic alkene hydrogenation: complete teaching sequence</title><g font-family="DejaVu Sans,sans-serif"><rect width="1200" height="350" fill="#fffefa"/><text x="25" y="32" font-size="21" fill="#203c43">Catalytic alkene hydrogenation · representative molecular graphs</text><path d="M314.05,183.50 L235.95,183.50" stroke="#203c43" stroke-width="2" fill="none"/><path d="M314.05,177.50 L235.95,177.50" stroke="#203c43" stroke-width="2" fill="none"/><rect x="299.05" y="170.50" width="30" height="20" fill="#fffefa"/><text x="314.05" y="185.50" font-size="16" text-anchor="middle" fill="#203c43">CH2</text><rect x="220.95" y="170.50" width="30" height="20" fill="#fffefa"/><text x="235.95" y="185.50" font-size="16" text-anchor="middle" fill="#203c43">CH2</text><path d="M954.05,180.50 L875.95,180.50" stroke="#203c43" stroke-width="2" fill="none"/><rect x="939.05" y="170.50" width="30" height="20" fill="#fffefa"/><text x="954.05" y="185.50" font-size="16" text-anchor="middle" fill="#203c43">CH3</text><rect x="860.95" y="170.50" width="30" height="20" fill="#fffefa"/><text x="875.95" y="185.50" font-size="16" text-anchor="middle" fill="#203c43">CH3</text><text x="580" y="180" font-size="32" fill="#203c43">→</text><text x="25" y="330" font-size="15" fill="#203c43">Representative substrate/product connectivity; other reagents/byproducts are in the equation. No computed geometry.</text></g><g transform="translate(0,350)"><title>Catalytic alkene hydrogenation: Mechanistic boundary / grouped stage</title><desc>H2 + 2* → 2 H–*. Hydrogen dissociatively adsorbs on the metal surface. Fractional surface charge is not represented as isolated hydride ions.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="catalytic-hydrogenation-1-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="catalytic-hydrogenation-1-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Catalytic alkene hydrogenation · 1</text><text x="24" y="65" font-size="17">Mechanistic boundary / grouped stage</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">H2 + 2*</text><text x="665.00" y="155" font-size="24.00">2 H–*</text><text x="30" y="202" font-size="16">Process model: no unique microscopic electron-arrow sequence asserted.</text><text x="24" y="235" font-size="16">Hydrogen dissociatively adsorbs on the metal surface. Fractional surface charge is not represented as</text><text x="24" y="258" font-size="16">isolated hydride ions.</text></g></g><g transform="translate(0,640)"><title>Catalytic alkene hydrogenation: Mechanistic boundary / grouped stage</title><desc>CH2=CH2 + * → (CH2=CH2)–*. The alkene adsorbs through its pi system; surface bonding includes donation/back-donation.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="catalytic-hydrogenation-2-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="catalytic-hydrogenation-2-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Catalytic alkene hydrogenation · 2</text><text x="24" y="65" font-size="17">Mechanistic boundary / grouped stage</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">CH2=CH2 + *</text><text x="665.00" y="155" font-size="24.00">(CH2=CH2)–*</text><text x="30" y="202" font-size="16">Process model: no unique microscopic electron-arrow sequence asserted.</text><text x="24" y="235" font-size="16">The alkene adsorbs through its pi system; surface bonding includes donation/back-donation.</text></g></g><g transform="translate(0,930)"><title>Catalytic alkene hydrogenation: Mechanistic boundary / grouped stage</title><desc>(CH2=CH2)–* + H–* → CH3CH2–* + *. One surface hydrogen transfers to an adsorbed alkene carbon, producing a surface alkyl model.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="catalytic-hydrogenation-3-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="catalytic-hydrogenation-3-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Catalytic alkene hydrogenation · 3</text><text x="24" y="65" font-size="17">Mechanistic boundary / grouped stage</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">(CH2=CH2)–* + H–*</text><text x="665.00" y="155" font-size="24.00">CH3CH2–* + *</text><text x="30" y="202" font-size="16">Process model: no unique microscopic electron-arrow sequence asserted.</text><text x="24" y="235" font-size="16">One surface hydrogen transfers to an adsorbed alkene carbon, producing a surface alkyl model.</text></g></g><g transform="translate(0,1220)"><title>Catalytic alkene hydrogenation: Mechanistic boundary / grouped stage</title><desc>CH3CH2–* + H–* → CH3CH3 + 2*. A second surface H transfer and product desorption restore sites.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="catalytic-hydrogenation-4-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="catalytic-hydrogenation-4-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Catalytic alkene hydrogenation · 4</text><text x="24" y="65" font-size="17">Mechanistic boundary / grouped stage</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">CH3CH2–* + H–*</text><text x="665.00" y="155" font-size="24.00">CH3CH3 + 2*</text><text x="30" y="202" font-size="16">Process model: no unique microscopic electron-arrow sequence asserted.</text><text x="24" y="235" font-size="16">A second surface H transfer and product desorption restore sites.</text></g></g></svg>