<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" role="img"><title>Reductive ozonolysis: Primary ozonide formation</title><desc>CH3–CH=CH–CH3 + O=O+–O− → Five-membered primary ozonide (molozonide). A concerted 1,3-dipolar addition joins ozone to both alkene carbons; ozone resonance forms are not separate species.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="ozonolysis-1-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="ozonolysis-1-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Reductive ozonolysis · 1</text><text x="24" y="65" font-size="17">Primary ozonide formation</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">CH3–</text><text x="83.52" y="155" font-size="24.00">CH</text><text x="113.28" y="155" font-size="24.00">=</text><text x="128.16" y="155" font-size="24.00">CH</text><text x="157.92" y="155" font-size="24.00">–CH3 + </text><text x="262.08" y="155" font-size="24.00">O</text><text x="276.96" y="155" font-size="24.00">=</text><text x="291.84" y="155" font-size="24.00">O+</text><text x="321.60" y="155" font-size="24.00">–</text><text x="336.48" y="155" font-size="24.00">O−</text><text x="665.00" y="155" font-size="19.59">Five-membered primary ozonide (molozonide)</text><path data-electrons="2" d="M120.72,141.60 Q152.34,98.60 183.96,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#ozonolysis-1-pair)"/><path data-electrons="2" d="M288.12,141.60 Q297.42,203.60 306.72,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#ozonolysis-1-pair)"/><path data-electrons="2" d="M351.36,141.60 Q247.20,80.60 143.04,137.60" fill="none" s