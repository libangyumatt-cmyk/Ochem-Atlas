<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" role="img"><title>Claisen ester condensation: Proton transfer</title><desc>EtO2C–CH(COCH3)–H + :OEt− → [EtO2CCHCOCH3]− + EtOH. The acidic methylene product is deprotonated, supplying the thermodynamic driving step.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="claisen-condensation-4-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="claisen-condensation-4-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Claisen ester condensation · 4</text><text x="24" y="65" font-size="17">Proton transfer</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">EtO2C–</text><text x="113.28" y="155" font-size="24.00">CH</text><text x="143.04" y="155" font-size="24.00">(COCH3)–</text><text x="262.08" y="155" font-size="24.00">H</text><text x="276.96" y="155" font-size="24.00"> + </text><text x="321.60" y="155" font-size="24.00">:OEt−</text><text x="665.00" y="155" font-size="24.00">[EtO2CCHCOCH3]− + EtOH</text><path data-electrons="2" d="M358.80,141.60 Q314.16,98.60 269.52,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#claisen-condensation-4-pair)"/><path data-electrons="2" d="M198.84,141.60 Q163.50,203.60 128.16,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#claisen-condensation-4-pair)"/><text x="24" y="235" font-size="16">The acidic methylene product is deprotonated, supplying the thermodynamic driving step.</text></g></svg>