<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" role="img"><title>Friedel–Crafts alkylation: Coupled polar bond reorganization</title><desc>ring C(H)(tBu)–CH+–CH=CH–CH=CH–(back) + AlCl4− → C6H5tBu + HCl + AlCl3. Loss of the ring proton restores aromaticity.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="friedel-crafts-alkylation-4-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="friedel-crafts-alkylation-4-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Friedel–Crafts alkylation · 4</text><text x="24" y="65" font-size="17">Coupled polar bond reorganization</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="18.23">ring </text><text x="80.52" y="155" font-size="18.23">C</text><text x="91.83" y="155" font-size="18.23">(</text><text x="103.13" y="155" font-size="18.23">H</text><text x="114.43" y="155" font-size="18.23">)(tBu)–</text><text x="193.57" y="155" font-size="18.23">CH+</text><text x="227.48" y="155" font-size="18.23">–CH=CH–CH=CH–(back) + </text><text x="476.17" y="155" font-size="18.23">AlCl4−</text><text x="665.00" y="155" font-size="24.00">C6H5tBu + HCl + AlCl3</text><path data-electrons="2" d="M510.09,143.62 Q309.43,100.62 108.78,139.62" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#friedel-crafts-alkylation-4-pair)"/><path data-electrons="2" d="M97.48,143.62 Q122.91,205.62 148.35,139.62" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#friedel-crafts-alkylation-4-pair)"/><text x="24" y="235" font-size="16">Loss of the ring proton restores aromaticity.</text></g></svg>