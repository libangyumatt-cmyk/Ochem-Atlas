<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" role="img"><title>Dieckmann cyclization: Tetrahedral intermediate collapse</title><desc>Ring C(O−)(OEt)–CH(CO2Et)–(CH2)3–(back) → Ring C(=O)–CH(CO2Et)–(CH2)3–(back) + EtO−. O reforms carbonyl and ethoxide departs.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="dieckmann-3-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="dieckmann-3-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Dieckmann cyclization · 3</text><text x="24" y="65" font-size="17">Tetrahedral intermediate collapse</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="21.51">Ring </text><text x="90.67" y="155" font-size="21.51">C</text><text x="104.00" y="155" font-size="21.51">(</text><text x="117.33" y="155" font-size="21.51">O−</text><text x="144.00" y="155" font-size="21.51">)(</text><text x="170.67" y="155" font-size="21.51">OEt</text><text x="210.67" y="155" font-size="21.51">)–CH(CO2Et)–(CH2)3–(back)</text><text x="665.00" y="155" font-size="20.06">Ring C(=O)–CH(CO2Et)–(CH2)3–(back) + EtO−</text><path data-electrons="2" d="M130.67,142.47 Q122.33,99.47 114.00,138.47" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#dieckmann-3-pair)"/><path data-electrons="2" d="M144.00,142.47 Q167.33,204.47 190.67,138.47" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#dieckmann-3-pair)"/><text x="24" y="235" font-size="16">O reforms carbonyl and ethoxide departs.</text></g></svg>