<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" role="img"><title>Horner–Wadsworth–Emmons olefination: Phosphate elimination</title><desc>Cyclic phosphonate adduct → (E)-PhCH=CHCO2Et + phosphate anion. Coupled fragmentation gives the alkene and a phosphate leaving group; the geometry of addition/elimination controls E/Z.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="horner-wadsworth-emmons-4-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="horner-wadsworth-emmons-4-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Horner–Wadsworth–Emmons olefination · 4</text><text x="24" y="65" font-size="17">Phosphate elimination</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">Cyclic phosphonate adduct</text><text x="665.00" y="155" font-size="24.00">(E)-PhCH=CHCO2Et + phosphate anion</text><text x="30" y="202" font-size="16">Condensed structural stage; electron changes are specified below.</text><text x="24" y="235" font-size="16">Coupled fragmentation gives the alkene and a phosphate leaving group; the geometry of addition/elimination</text><text x="24" y="258" font-size="16">controls E/Z.</text></g></svg>