<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" role="img"><title>Peroxide-initiated radical HBr addition: Initiator homolysis</title><desc>R–O–O–R → 2 RO•. Initiator O–O homolysis supplies radicals; each O takes one electron. RO groups are the specified initiator fragments.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="radical-hbr-1-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="radical-hbr-1-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Peroxide-initiated radical HBr addition · 1</text><text x="24" y="65" font-size="17">Initiator homolysis</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">R–</text><text x="53.76" y="155" font-size="24.00">O</text><text x="68.64" y="155" font-size="24.00">–</text><text x="83.52" y="155" font-size="24.00">O</text><text x="98.40" y="155" font-size="24.00">–R</text><text x="665.00" y="155" font-size="24.00">2 RO•</text><path data-electrons="1" d="M76.08,141.60 Q68.64,98.60 61.20,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#radical-hbr-1-fish)"/><path data-electrons="1" d="M76.08,141.60 Q83.52,203.60 90.96,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#radical-hbr-1-fish)"/><text x="24" y="235" font-size="16">Initiator O–O homolysis supplies radicals; each O takes one electron. RO groups are the specified initiator</text><text x="24" y="258" font-size="16">fragments.</text></g></svg>