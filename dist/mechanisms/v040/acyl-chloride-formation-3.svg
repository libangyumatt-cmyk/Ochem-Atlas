<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" role="img"><title>Carboxylic acid conversion to acyl chloride: Nucleophilic carbonyl addition</title><desc>CH3–C(=O)OSOCl + :Cl− → CH3C(O−)(Cl)OSOCl. Chloride attacks activated acyl carbon.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="acyl-chloride-formation-3-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="acyl-chloride-formation-3-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Carboxylic acid conversion to acyl chloride · 3</text><text x="24" y="65" font-size="17">Nucleophilic carbonyl addition</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">CH3–</text><text x="83.52" y="155" font-size="24.00">C</text><text x="98.40" y="155" font-size="24.00">(=</text><text x="128.16" y="155" font-size="24.00">O</text><text x="143.04" y="155" font-size="24.00">)OSOCl + </text><text x="276.96" y="155" font-size="24.00">:Cl−</text><text x="665.00" y="155" font-size="24.00">CH3C(O−)(Cl)OSOCl</text><path data-electrons="2" d="M306.72,141.60 Q198.84,98.60 90.96,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#acyl-chloride-formation-3-pair)"/><path data-electrons="2" d="M113.28,141.60 Q124.44,203.60 135.60,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#acyl-chloride-formation-3-pair)"/><text x="24" y="235" font-size="16">Chloride attacks activated acyl carbon.</text></g></svg>