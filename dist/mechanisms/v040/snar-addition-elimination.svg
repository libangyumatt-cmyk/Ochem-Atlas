DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Activated nucleophilic aromatic substitution · 1</text><text x="24" y="65" font-size="17">Coupled polar bond reorganization</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="19.50">ring </text><text x="84.47" y="155" font-size="19.50">C</text><text x="96.56" y="155" font-size="19.50">(F)=CH–CH=C(NO2)–CH=CH–(back) + </text><text x="483.53" y="155" font-size="19.50">:OMe−</text><text x="665.00" y="155" font-size="20.06">ring C(F)(OMe)–CH−–CH=C(NO2)–CH=CH–(back)</text><path data-electrons="2" d="M513.77,143.17 Q302.14,100.17 90.51,139.17" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#snar-addition-elimination-1-pair)"/><text x="24" y="235" font-size="16">Methoxide adds at the ipso carbon; aromatic pi electrons redistribute into the ring/nitro group in the</text><text x="24" y="258" font-size="16">Meisenheimer model.</text></g></g><g transform="translate(0,640)"><title>Activated nucleophilic aromatic substitution: Coupled polar bond reorganization</title><desc>ring C(OMe)(F)–CH−–CH=C(NO2)–CH=CH–(back) → p-NO2C6H4OMe + F−. Delocalized electron density restores aromatic bonding as the C–F pair departs to fluoride.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="snar-addition-elimination-2-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="snar-addition-elimination-2-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Activated nucleophilic aromatic substitution · 2</text><text x="24" y="65" font-size="17">Coupled polar bond reorganization</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="20.46">ring </text><text x="87.41" y="155" font-size="20.46">C</text><text x="100.10" y="155" font-size="20.46">(OMe)(</text><text x="176.20" y="155" font-size="20.46">F</text><text x="188.88" y="155" font-size="20.46">)–</text><text x="214.24" y="155" font-size="20.46">CH−</text><text x="252.29" y="155" font-size="20.46">–CH=C(NO2)–CH=CH–(back)</text><text x="665.00" y="155" font-size="24.00">p-NO2C6H4OMe + F−</text><path data-electrons="2" d="M233.27,142.84 Q198.39,99.84 163.51,138.84" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#snar-addition-elimination-2-pair)"/><path data-electrons="2" d="M138.15,142.84 Q160.34,204.84 182.54,138.84" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#snar-addition-elimination-2-pair)"/><text x="24" y="235" font-size="16">Delocalized electron density restores aromatic bonding as the C–F pair departs to fluoride.</text></g></g></svg>