<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" role="img"><title>Friedel–Crafts acylation: Heterolytic ionization</title><desc>CH3–C(=O)–Cl·AlCl3 → CH3–C+=O + AlCl4−. Acyl C–Cl cleavage gives an acylium ion model; CH3–C+=O and CH3–C≡O+ are resonance contributors.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="friedel-crafts-acylation-2-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="friedel-crafts-acylation-2-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Friedel–Crafts acylation · 2</text><text x="24" y="65" font-size="17">Heterolytic ionization</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">CH3–</text><text x="83.52" y="155" font-size="24.00">C</text><text x="98.40" y="155" font-size="24.00">(=O)–</text><text x="172.80" y="155" font-size="24.00">Cl</text><text x="202.56" y="155" font-size="24.00">·AlCl3</text><text x="665.00" y="155" font-size="24.00">CH3–C+=O + AlCl4−</text><path data-electrons="2" d="M139.32,141.60 Q163.50,98.60 187.68,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#friedel-crafts-acylation-2-pair)"/><text x="24" y="235" font-size="16">Acyl C–Cl cleavage gives an acylium ion model; CH3–C+=O and CH3–C≡O+ are resonance contributors.</text></g></svg>