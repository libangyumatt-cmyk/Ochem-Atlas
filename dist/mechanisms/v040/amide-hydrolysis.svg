" width="10" height="20" fill="#fffefa"/><text x="838.67" y="239.89" font-size="16" text-anchor="middle" fill="#203c43">O</text><rect x="905.00" y="116.11" width="20" height="20" fill="#fffefa"/><text x="915.00" y="131.11" font-size="16" text-anchor="middle" fill="#203c43">OH</text><text x="580" y="180" font-size="32" fill="#203c43">→</text><text x="25" y="330" font-size="15" fill="#203c43">Representative substrate/product connectivity; other reagents/byproducts are in the equation. No computed geometry.</text></g><g transform="translate(0,350)"><title>Acid-catalyzed amide hydrolysis: Proton transfer</title><desc>CH3C(=O:)NH2 + H–OH2+ → CH3C(=OH+)NH2 + H2O. Carbonyl O is protonated.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="amide-hydrolysis-1-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="amide-hydrolysis-1-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Acid-catalyzed amide hydrolysis · 1</text><text x="24" y="65" font-size="17">Proton transfer</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">CH3C(=</text><text x="113.28" y="155" font-size="24.00">O:</text><text x="143.04" y="155" font-size="24.00">)NH2 + </text><text x="247.20" y="155" font-size="24.00">H</text><text x="262.08" y="155" font-size="24.00">–</text><text x="276.96" y="155" font-size="24.00">OH2+</text><text x="665.00" y="155" font-size="24.00">CH3C(=OH+)NH2 + H2O</text><path data-electrons="2" d="M128.16,141.60 Q191.40,98.60 254.64,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#amide-hydrolysis-1-pair)"/><path data-electrons="2" d="M280.68,141.60 Q293.70,203.60 306.72,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#amide-hydrolysis-1-pair)"/><text x="24" y="235" font-size="16">Carbonyl O is protonated.</text></g></g><g transform="translate(0,640)"><title>Acid-catalyzed amide hydrolysis: Nucleophilic carbonyl addition</title><desc>CH3–C(=OH+)NH2 + :OH2 → CH3C(OH)(OH2+)NH2. Water adds to activated acyl carbon.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="amide-hydrolysis-2-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="amide-hydrolysis-2-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Acid-catalyzed amide hydrolysis · 2</text><text x="24" y="65" font-size="17">Nucleophilic carbonyl addition</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">CH3–</text><text x="83.52" y="155" font-size="24.00">C</text><text x="98.40" y="155" font-size="24.00">(=</text><text x="128.16" y="155" font-size="24.00">OH+</text><text x="172.80" y="155" font-size="24.00">)NH2 + </text><text x="276.96" y="155" font-size="24.00">:OH2</text><text x="665.00" y="155" font-size="24.00">CH3C(OH)(OH2+)NH2</text><path data-electrons="2" d="M306.72,141.60 Q198.84,98.60 90.96,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#amide-hydrolysis-2-pair)"/><path data-electrons="2" d="M120.72,141.60 Q135.60,203.60 150.48,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#amide-hydrolysis-2-pair)"/><text x="24" y="235" font-size="16">Water adds to activated acyl carbon.</text></g></g><g transform="translate(0,930)"><title>Acid-catalyzed amide hydrolysis: Mechanistic boundary / grouped stage</title><desc>CH3C(OH)(OH2+)NH2 + water → CH3C(OH)2NH3+. Solvent removes an O proton and transfers a proton to N. The relay is grouped; it does not create an isolated neutral amide anion.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="amide-hydrolysis-3-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="amide-hydrolysis-3-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Acid-catalyzed amide hydrolysis · 3</text><text x="24" y="65" font-size="17">Mechanistic boundary / grouped stage</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">CH3C(OH)(OH2+)NH2 + water</text><text x="665.00" y="155" font-size="24.00">CH3C(OH)2NH3+</text><text x="30" y="202" font-size="16">Process model: no unique microscopic electron-arrow sequence asserted.</text><text x="24" y="235" font-size="16">Solvent removes an O proton and transfers a proton to N. The relay is grouped; it does not create an</text><text x="24" y="258" font-size="16">isolated neutral amide anion.</text></g></g><g transform="translate(0,1220)"><title>Acid-catalyzed amide hydrolysis: Tetrahedral intermediate collapse</title><desc>CH3–C(O:H)(OH)–NH3+ → CH3C(=OH+)OH + NH3. O forms carbonyl while C–N cleavage expels ammonia.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="amide-hydrolysis-4-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="amide-hydrolysis-4-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Acid-catalyzed amide hydrolysis · 4</text><text x="24" y="65" font-size="17">Tetrahedral intermediate collapse</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">CH3–</text><text x="83.52" y="155" font-size="24.00">C</text><text x="98.40" y="155" font-size="24.00">(</text><text x="113.28" y="155" font-size="24.00">O:H</text><text x="157.92" y="155" font-size="24.00">)(OH)–</text><text x="247.20" y="155" font-size="24.00">NH3+</text><text x="665.00" y="155" font-size="24.00">CH3C(=OH+)OH + NH3</text><path data-electrons="2" d="M135.60,141.60 Q124.44,98.60 113.28,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#amide-hydrolysis-4-pair)"/><path data-electrons="2" d="M183.96,141.60 Q230.46,203.60 276.96,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#amide-hydrolysis-4-pair)"/><text x="24" y="235" font-size="16">O forms carbonyl while C–N cleavage expels ammonia.</text></g></g><g transform="translate(0,1510)"><title>Acid-catalyzed amide hydrolysis: Proton transfer</title><desc>CH3C(=O+–H)OH + :OH2 → CH3CO2H + H3O+. Water deprotonates carbonyl oxygen.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="amide-hydrolysis-5-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="amide-hydrolysis-5-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Acid-catalyzed amide hydrolysis · 5</text><text x="24" y="65" font-size="17">Proton transfer</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">CH3C(=</text><text x="113.28" y="155" font-size="24.00">O+</text><text x="143.04" y="155" font-size="24.00">–</text><text x="157.92" y="155" font-size="24.00">H</text><text x="172.80" y="155" font-size="24.00">)OH + </text><text x="262.08" y="155" font-size="24.00">:OH2</text><text x="665.00" y="155" font-size="24.00">CH3CO2H + H3O+</text><path data-electrons="2" d="M291.84,141.60 Q228.60,98.60 165.36,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#amide-hydrolysis-5-pair)"/><path data-electrons="2" d="M146.76,141.60 Q137.46,203.60 128.16,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#amide-hydrolysis-5-pair)"/><text x="24" y="235" font-size="16">Water deprotonates carbonyl oxygen.</text></g></g><g transform="translate(0,1800)"><title>Acid-catalyzed amide hydrolysis: Proton transfer</title><desc>:NH3 + H–OH2+ → NH4+ + H2O. Ammonia is protonated in the acidic reaction medium.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="amide-hydrolysis-6-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="amide-hydrolysis-6-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Acid-catalyzed amide hydrolysis · 6</text><text x="24" y="65" font-size="17">Proton transfer</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">:NH3</text><text x="83.52" y="155" font-size="24.00"> + </text><text x="128.16" y="155" font-size="24.00">H</text><text x="143.04" y="155" font-size="24.00">–</text><text x="157.92" y="155" font-size="24.00">OH2+</text><text x="665.00" y="155" font-size="24.00">NH4+ + H2O</text><path data-electrons="2" d="M53.76,141.60 Q94.68,98.60 135.60,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#amide-hydrolysis-6-pair)"/><path data-electrons="2" d="M161.64,141.60 Q174.66,203.60 187.68,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#amide-hydrolysis-6-pair)"/><text x="24" y="235" font-size="16">Ammonia is protonated in the acidic reaction medium.</text></g></g></svg>