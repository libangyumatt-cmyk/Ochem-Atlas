<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" role="img"><title>Reductive amination: Nucleophilic carbonyl addition</title><desc>Me2C=N+HMe + B–H → Me2CH–NHMe + boron-derived species. A reagent B–H bond donates hydride to iminium carbon; C=N pi electrons return to N, directly giving neutral secondary amine.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="reductive-amination-2-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="reductive-amination-2-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Reductive amination · 2</text><text x="24" y="65" font-size="17">Nucleophilic carbonyl addition</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">Me2</text><text x="68.64" y="155" font-size="24.00">C</text><text x="83.52" y="155" font-size="24.00">=</text><text x="98.40" y="155" font-size="24.00">N+HMe</text><text x="172.80" y="155" font-size="24.00"> + B–</text><text x="247.20" y="155" font-size="24.00">H</text><text x="665.00" y="155" font-size="24.00">Me2CH–NHMe + boron-derived species</text><path data-electrons="2" d="M254.64,141.60 Q165.36,98.60 76.08,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#reductive-amination-2-pair)"/><path data-electrons="2" d="M105.84,141.60 Q120.72,203.60 135.60,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#reductive-amination-2-pair)"/><text x="24" y="235" font-size="16">A reagent B–H bond donates hydride to iminium carbon; C=N pi electrons return to N, directly giving neutral</text><text x="24" y="258" font-size="16">secondary amine.</text></g></svg>