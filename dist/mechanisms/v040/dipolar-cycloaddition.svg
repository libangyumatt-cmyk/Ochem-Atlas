(Me)–O− + CH2=CH2 → Ring O–N(Me)–CH(Ph)–CH2–CH2–(back to O). Oxygen lone-pair donation forms O–C; alkene pi forms the other C–C bond; C=N pi returns to N in a concerted1,3-dipolar model.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="dipolar-cycloaddition-1-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="dipolar-cycloaddition-1-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Nitrone 1,3-dipolar cycloaddition · 1</text><text x="24" y="65" font-size="17">Concerted [3+2] cycloaddition</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">Ph–</text><text x="68.64" y="155" font-size="24.00">CH</text><text x="98.40" y="155" font-size="24.00">=</text><text x="113.28" y="155" font-size="24.00">N+</text><text x="143.04" y="155" font-size="24.00">(Me)–</text><text x="217.44" y="155" font-size="24.00">O−</text><text x="247.20" y="155" font-size="24.00"> + </text><text x="291.84" y="155" font-size="24.00">CH2</text><text x="336.48" y="155" font-size="24.00">=</text><text x="351.36" y="155" font-size="24.00">CH2</text><text x="665.00" y="155" font-size="21.09">Ring O–N(Me)–CH(Ph)–CH2–CH2–(back to O)</text><path data-electrons="2" d="M232.32,141.60 Q303.00,98.60 373.68,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#dipolar-cycloaddition-1-pair)"/><path data-electrons="2" d="M343.92,141.60 Q213.72,203.60 83.52,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#dipolar-cycloaddition-1-pair)"/><path data-electrons="2" d="M105.84,141.60 Q117.00,80.60 128.16,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#dipolar-cycloaddition-1-pair)"/>