<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" role="img"><title>Peracid epoxidation: Concerted oxygen-transfer model</title><desc>CH2=CH2 + ArC(=O)–O–O–H → (CH2CH2)O ring + ArCO2H. Coupled oxygen transfer forms both C–O bonds while O–O and O–H reorganize through a cyclic butterfly transition structure. No free carbocation or discrete intermediate is inserted.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="peracid-epoxidation-1-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="peracid-epoxidation-1-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Peracid epoxidation · 1</text><text x="24" y="65" font-size="17">Concerted oxygen-transfer model</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">CH2</text><text x="68.64" y="155" font-size="24.00">=</text><text x="83.52" y="155" font-size="24.00">CH2</text><text x="128.16" y="155" font-size="24.00"> + ArC(=O)–</text><text x="291.84" y="155" font-size="24.00">O</text><text x="306.72" y="155" font-size="24.00">–</text><text x="321.60" y="155" font-size="24.00">O</text><text x="336.48" y="155" font-size="24.00">–</text><text x="351.36" y="155" font-size="24.00">H</text><text x="665.00" y="155" font-size="24.00">(CH2CH2)O ring + ArCO2H</text><path data-electrons="2" d="M76.08,141.60 Q202.56,98.60 329.04,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#peracid-epoxidation-1-pair)"/><path data-electrons="2" d="M329.04,141.60 Q217.44,203.60 105.84,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#peracid-epoxidation-1-pair)"/><path data-electrons="2" d="M314.16,141.60 Q306.72,80.60 299.28,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#peracid-epoxidation-1-pair)"/><text x="24" y="235" font-size="16">Coupled oxygen transfer forms both C–O bonds while O–O and O–H reorganize through a cyclic butterfly transition structure. No free</text><text x="24" y="258" font-size="16">carbocation or discrete intermediate is inserted.</text></g></svg>