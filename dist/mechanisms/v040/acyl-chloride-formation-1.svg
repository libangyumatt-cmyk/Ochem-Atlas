<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" role="img"><title>Carboxylic acid conversion to acyl chloride: Bond-replacing displacement</title><desc>CH3C(=O)–O:H + S(=O)(Cl)–Cl → [CH3CO2(H)SOCl]+ + Cl−. Carboxylic OH oxygen attacks sulfur, replacing chloride in the activation model.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="acyl-chloride-formation-1-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="acyl-chloride-formation-1-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Carboxylic acid conversion to acyl chloride · 1</text><text x="24" y="65" font-size="17">Bond-replacing displacement</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">CH3C(=O)–</text><text x="157.92" y="155" font-size="24.00">O:H</text><text x="202.56" y="155" font-size="24.00"> + </text><text x="247.20" y="155" font-size="24.00">S</text><text x="262.08" y="155" font-size="24.00">(=O)(Cl)–</text><text x="396.00" y="155" font-size="24.00">Cl</text><text x="665.00" y="155" font-size="24.00">[CH3CO2(H)SOCl]+ + Cl−</text><path data-electrons="2" d="M180.24,141.60 Q217.44,98.60 254.64,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#acyl-chloride-formation-1-pair)"/><path data-electrons="2" d="M332.76,141.60 Q371.82,203.60 410.88,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#acyl-chloride-formation-1-pair)"/><text x="24" y="235" font-size="16">Carboxylic OH oxygen attacks sulfur, replacing chloride in the activation model.</text></g></svg>