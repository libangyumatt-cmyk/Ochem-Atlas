efs><marker id="friedel-crafts-alkylation-1-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="friedel-crafts-alkylation-1-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Friedel–Crafts alkylation · 1</text><text x="24" y="65" font-size="17">Lone-pair capture</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">(CH3)3C–</text><text x="143.04" y="155" font-size="24.00">Cl:</text><text x="187.68" y="155" font-size="24.00"> + </text><text x="232.32" y="155" font-size="24.00">AlCl3</text><text x="665.00" y="155" font-size="24.00">(CH3)3CCl·AlCl3</text><path data-electrons="2" d="M165.36,141.60 Q217.44,98.60 269.52,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#friedel-crafts-alkylation-1-pair)"/><text x="24" y="235" font-size="16">Chlorine coordinates to aluminum, promoting ionization.</text></g></g><g transform="translate(0,640)"><title>Friedel–Crafts alkylation: Heterolytic ionization</title><desc>(CH3)3C–Cl·AlCl3 → (CH3)3C+ + AlCl4−. The polarized C–Cl pair departs to the Lewis-acid-bound chloride in the limiting tertiary-cation model.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="friedel-crafts-alkylation-2-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="friedel-crafts-alkylation-2-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Friedel–Crafts alkylation · 2</text><text x="24" y="65" font-size="17">Heterolytic ionization</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">(CH3)3</text><text x="113.28" y="155" font-size="24.00">C</text><text x="128.16" y="155" font-size="24.00">–</text><text x="143.04" y="155" font-size="24.00">Cl</text><text x="172.80" y="155" font-size="24.00">·AlCl3</text><text x="665.00" y="155" font-size="24.00">(CH3)3C+ + AlCl4−</text><path data-electrons="2" d="M139.32,141.60 Q148.62,98.60 157.92,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#friedel-crafts-alkylation-2-pair)"/><text x="24" y="235" font-size="16">The polarized C–Cl pair departs to the Lewis-acid-bound chloride in the limiting tertiary-cation model.</text></g></g><g transform="translate(0,930)"><title>Friedel–Crafts alkylation: Coupled polar bond reorganization</title><desc>ring CH=CH–CH=CH–CH=CH–(back) + (CH3)3C+ → [C6H6–C(CH3)3]+. Arene pi donation forms the aryl–tert-butyl bond and a sigma complex.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="friedel-crafts-alkylation-3-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="friedel-crafts-alkylation-3-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Friedel–Crafts alkylation · 3</text><text x="24" y="65" font-size="17">Coupled polar bond reorganization</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="20.97">ring </text><text x="89.00" y="155" font-size="20.97">CH</text><text x="115.00" y="155" font-size="20.97">=</text><text x="128.00" y="155" font-size="20.97">CH</text><text x="154.00" y="155" font-size="20.97">–CH=CH–CH=CH–(back) + (CH3)3</text><text x="518.00" y="155" font-size="20.97">C+</text><text x="665.00" y="155" font-size="24.00">[C6H6–C(CH3)3]+</text><path data-electrons="2" d="M121.50,142.66 Q326.25,99.66 531.00,138.66" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#friedel-crafts-alkylation-3-pair)"/><text x="24" y="235" font-size="16">Arene pi donation forms the aryl–tert-butyl bond and a sigma complex.</text></g></g><g transform="translate(0,1220)"><title>Friedel–Crafts alkylation: Coupled polar bond reorganization</title><desc>ring C(H)(tBu)–CH+–CH=CH–CH=CH–(back) + AlCl4− → C6H5tBu + HCl + AlCl3. Loss of the ring proton restores aromaticity.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="friedel-crafts-alkylation-4-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="friedel-crafts-alkylation-4-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Friedel–Crafts alkylation · 4</text><text x="24" y="65" font-size="17">Coupled polar bond reorganization</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="18.23">ring </text><text x="80.52" y="155" font-size="18.23">C</text><text x="91.83" y="155" font-size="18.23">(</text><text x="103.13" y="155" font-size="18.23">H</text><text x="114.43" y="155" font-size="18.23">)(tBu)–</text><text x="193.57" y="155" font-size="18.23">CH+</text><text x="227.48" y="155" font-size="18.23">–CH=CH–CH=CH–(back) + </text><text x="476.17" y="155" font-size="18.23">AlCl4−</text><text x="665.00" y="155" font-size="24.00">C6H5tBu + HCl + AlCl3</text><path data-electrons="2" d="M510.09,143.62 Q309.43,100.62 108.78,139.62" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#friedel-crafts-alkylation-4-pair)"/><path data-electrons="2" d="M97.48,143.62 Q122.91,205.62 148.35,139.62" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#friedel-crafts-alkylation-4-pair)"/><text x="24" y="235" font-size="16">Loss of the ring proton restores aromaticity.</text></g></g></svg>