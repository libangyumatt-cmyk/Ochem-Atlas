<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" role="img"><title>Alkyne hydroboration–oxidation: Coupled polar bond reorganization</title><desc>[R2B(CH=CHCH3)–O–OH]− → R2B–O–CH=CHCH3 + OH−. Vinyl migration from boron to oxygen accompanies O–O cleavage, retaining the migrating vinyl connectivity.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="alkyne-hydroboration-3-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="alkyne-hydroboration-3-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Alkyne hydroboration–oxidation · 3</text><text x="24" y="65" font-size="17">Coupled polar bond reorganization</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">[R2</text><text x="68.64" y="155" font-size="24.00">B</text><text x="83.52" y="155" font-size="24.00">(</text><text x="98.40" y="155" font-size="24.00">CH=CHCH3</text><text x="217.44" y="155" font-size="24.00">)–</text><text x="247.20" y="155" font-size="24.00">O</text><text x="262.08" y="155" font-size="24.00">–</text><text x="276.96" y="155" font-size="24.00">OH</text><text x="306.72" y="155" font-size="24.00">]−</text><text x="665.00" y="155" font-size="24.00">R2B–O–CH=CHCH3 + OH−</text><path data-electrons="2" d="M117.00,141.60 Q185.82,98.60 254.64,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#alkyne-hydroboration-3-pair)"/><path data-electrons="2" d="M273.24,141.60 Q282.54,203.60 291.84,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#alkyne-hydroboration-3-pair)"/><text x="24" y="235" font-size="16">Vinyl migration from boron to oxygen accompanies O–O cleavage, retaining the migrating vinyl connectivity.</text></g></svg>