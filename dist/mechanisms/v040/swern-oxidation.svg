<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1450"><title>Swern oxidation: complete teaching sequence</title><g transform="translate(0,0)"><title>Swern oxidation: Mechanistic boundary / grouped stage</title><desc>Me2SO + (COCl)2 → Me2SCl+ Cl− + CO + CO2. DMSO activation proceeds through chlorosulfonium-forming fragmentation; intermediate activation steps are grouped.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="swern-oxidation-1-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="swern-oxidation-1-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Swern oxidation · 1</text><text x="24" y="65" font-size="17">Mechanistic boundary / grouped stage</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">Me2SO + (COCl)2</text><text x="665.00" y="155" font-size="24.00">Me2SCl+ Cl− + CO + CO2</text><text x="30" y="202" font-size="16">Process model: no unique microscopic electron-arrow sequence asserted.</text><text x="24" y="235" font-size="16">DMSO activation proceeds through chlorosulfonium-forming fragmentation; intermediate activation steps are grouped.</text></g></g><g transform="translate(0,290)"><title>Swern oxidation: Bond-replacing displacement</title><desc>PhCH2–O:H + Me2S+–Cl → PhCH2O(H)–SMe2 dicationic adduct + Cl−. Alcohol oxygen attacks electrophilic sulfur and chloride departs in a sulfonium-activation description.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="swern-oxidation-2-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="swern-oxidation-2-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Swern oxidation · 2</text><text x="24" y="65" font-size="17">Bond-replacing displacement</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">PhCH2–</text><text x="113.28" y="155" font-size="24.00">O:H</text><text x="157.92" y="155" font-size="24.00"> + Me2</text><text x="247.20" y="155" font-size="24.00">S+</text><text x="276.96" y="155" font-size="24.00">–</text><text x="291.84" y="155" font-size="24.00">Cl</text><text x="665.00" y="155" font-size="21.65">PhCH2O(H)–SMe2 dicationic adduct + Cl−</text><path data-electrons="2" d="M135.60,141.60 Q198.84,98.60 262.08,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#swern-oxidation-2-pair)"/><path data-electrons="2" d="M284.40,141.60 Q295.56,203.60 306.72,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#swern-oxidation-2-pair)"/><text x="24" y="235" font-size="16">Alcohol oxygen attacks electrophilic sulfur and chloride departs in a sulfonium-activation description.</text></g></g><g transform="translate(0,580)"><title>Swern oxidation: Proton transfer</title><desc>PhCH2–O+(SMe2+)–H + :NEt3 → PhCH2O–SMe2+ + Et3NH+. Base removes the O-bound proton to give alkoxysulfonium.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="swern-oxidation-3-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="swern-oxidation-3-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Swern oxidation · 3</text><text x="24" y="65" font-size="17">Proton transfer</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">PhCH2–</text><text x="113.28" y="155" font-size="24.00">O+</text><text x="143.04" y="155" font-size="24.00">(SMe2+)–</text><text x="262.08" y="155" font-size="24.00">H</text><text x="276.96" y="155" font-size="24.00"> + </text><text x="321.60" y="155" font-size="24.00">:NEt3</text><text x="665.00" y="155" font-size="24.00">PhCH2O–SMe2+ + Et3NH+</text><path data-electrons="2" d="M358.80,141.60 Q314.16,98.60 269.52,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#swern-oxidation-3-pair)"/><path data-electrons="2" d="M198.84,141.60 Q163.50,203.60 128.16,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#swern-oxidation-3-pair)"/><text x="24" y="235" font-size="16">Base removes the O-bound proton to give alkoxysulfonium.</text></g></g><g transform="translate(0,870)"><title>Swern oxidation: Proton transfer</title><desc>PhCH2O–S+(Me)–CH2–H + :NEt3 → PhCH2O–S+(Me)–CH2− + Et3NH+. Base removes a sulfur-methyl proton in the sulfur-ylide model, not a hydride from alcohol carbon.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="swern-oxidation-4-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="swern-oxidation-4-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Swern oxidation · 4</text><text x="24" y="65" font-size="17">Proton transfer</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">PhCH2O–S+(Me)–</text><text x="232.32" y="155" font-size="24.00">CH2</text><text x="276.96" y="155" font-size="24.00">–</text><text x="291.84" y="155" font-size="24.00">H</text><text x="306.72" y="155" font-size="24.00"> + </text><text x="351.36" y="155" font-size="24.00">:NEt3</text><text x="665.00" y="155" font-size="24.00">PhCH2O–S+(Me)–CH2− + Et3NH+</text><path data-electrons="2" d="M388.56,141.60 Q343.92,98.60 299.28,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#swern-oxidation-4-pair)"/><path data-electrons="2" d="M276.96,141.60 Q265.80,203.60 254.64,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#swern-oxidation-4-pair)"/><text x="24" y="235" font-size="16">Base removes a sulfur-methyl proton in the sulfur-ylide model, not a hydride from alcohol carbon.</text></g></g><g transform="translate(0,1160)"><title>Swern oxidation: Ylide-assisted carbonyl formation</title><desc>Ph–CH(O–S+(Me)–CH2−)–H → PhCHO + Me2S. The ylide carbon takes the carbinol H through a cyclic arrangement as C=O forms and O–S cleaves.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="swern-oxidation-5-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="swern-oxidation-5-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Swern oxidation · 5</text><text x="24" y="65" font-size="17">Ylide-assisted carbonyl formation</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">Ph–</text><text x="68.64" y="155" font-size="24.00">CH</text><text x="98.40" y="155" font-size="24.00">(</text><text x="113.28" y="155" font-size="24.00">O</text><text x="128.16" y="155" font-size="24.00">–</text><text x="143.04" y="155" font-size="24.00">S+</text><text x="172.80" y="155" font-size="24.00">(Me)–</text><text x="247.20" y="155" font-size="24.00">CH2−</text><text x="306.72" y="155" font-size="24.00">)–</text><text x="336.48" y="155" font-size="24.00">H</text><text x="665.00" y="155" font-size="24.00">PhCHO + Me2S</text><path data-electrons="2" d="M276.96,141.60 Q310.44,98.60 343.92,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#swern-oxidation-5-pair)"/><path data-electrons="2" d="M213.72,141.60 Q157.92,203.60 102.12,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#swern-oxidation-5-pair)"/><path data-electrons="2" d="M139.32,141.60 Q148.62,80.60 157.92,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#swern-oxidation-5-pair)"/><text x="24" y="235" font-size="16">The ylide carbon takes the carbinol H through a cyclic arrangement as C=O forms and O–S cleaves.</text></g></g></svg>