<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" role="img"><title>Benzoin condensation: Proton transfer</title><desc>Ph–C(OH)(CN)–H + :base → Ph–C−(OH)CN + H–base+. Deprotonation at the former aldehyde carbon forms the resonance-stabilized acyl-anion equivalent.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="benzoin-3-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="benzoin-3-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Benzoin condensation · 3</text><text x="24" y="65" font-size="17">Proton transfer</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">Ph–</text><text x="68.64" y="155" font-size="24.00">C</text><text x="83.52" y="155" font-size="24.00">(OH)(CN)–</text><text x="217.44" y="155" font-size="24.00">H</text><text x="232.32" y="155" font-size="24.00"> + </text><text x="276.96" y="155" font-size="24.00">:base</text><text x="665.00" y="155" font-size="24.00">Ph–C−(OH)CN + H–base+</text><path data-electrons="2" d="M314.16,141.60 Q269.52,98.60 224.88,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#benzoin-3-pair)"/><path data-electrons="2" d="M150.48,141.60 Q113.28,203.60 76.08,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#benzoin-3-pair)"/><text x="24" y="235" font-size="16">Deprotonation at the former aldehyde carbon forms the resonance-stabilized acyl-anion equivalent.</text></g></svg>