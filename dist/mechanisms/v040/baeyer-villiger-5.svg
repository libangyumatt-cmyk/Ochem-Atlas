<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" role="img"><title>Baeyer–Villiger oxidation: Proton transfer</title><desc>MeC(=O+–H)OPh + :O2CAr− → MeCO2Ph + ArCO2H. Carboxylate removes the carbonyl O proton to release phenyl acetate.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="baeyer-villiger-5-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="baeyer-villiger-5-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Baeyer–Villiger oxidation · 5</text><text x="24" y="65" font-size="17">Proton transfer</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">MeC(=</text><text x="98.40" y="155" font-size="24.00">O+</text><text x="128.16" y="155" font-size="24.00">–</text><text x="143.04" y="155" font-size="24.00">H</text><text x="157.92" y="155" font-size="24.00">)OPh + </text><text x="262.08" y="155" font-size="24.00">:O2CAr−</text><text x="665.00" y="155" font-size="24.00">MeCO2Ph + ArCO2H</text><path data-electrons="2" d="M314.16,141.60 Q232.32,98.60 150.48,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#baeyer-villiger-5-pair)"/><path data-electrons="2" d="M131.88,141.60 Q122.58,203.60 113.28,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#baeyer-villiger-5-pair)"/><text x="24" y="235" font-size="16">Carboxylate removes the carbonyl O proton to release phenyl acetate.</text></g></svg>