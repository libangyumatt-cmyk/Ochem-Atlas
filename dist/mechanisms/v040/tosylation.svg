troke-width="2" fill="none" stroke-dasharray="4 3"/><path d="M843.95,131.18 L876.15,109.48" stroke="#203c43" stroke-width="2" fill="none"/><path d="M847.30,136.15 L879.51,114.46" stroke="#203c43" stroke-width="2" fill="none" stroke-dasharray="4 3"/><path d="M877.83,111.97 L897.97,80.50" stroke="#203c43" stroke-width="2" fill="none"/><path d="M879.85,109.75 L907.67,135.09" stroke="#203c43" stroke-width="2" fill="none"/><path d="M875.81,114.19 L903.63,139.52" stroke="#203c43" stroke-width="2" fill="none" stroke-dasharray="4 3"/><path d="M908.57,137.99 L899.93,174.58" stroke="#203c43" stroke-width="2" fill="none"/><path d="M902.73,136.61 L894.09,173.20" stroke="#203c43" stroke-width="2" fill="none" stroke-dasharray="4 3"/><path d="M867.86,199.59 L894.85,171.80" stroke="#203c43" stroke-width="2" fill="none"/><path d="M872.16,203.77 L899.16,175.98" stroke="#203c43" stroke-width="2" fill="none" stroke-dasharray="4 3"/><rect x="972.36" y="199.33" width="30" height="20" fill="#fffefa"/><text x="987.36" y="214.33" font-size="16" text-anchor="middle" fill="#203c43">CH3</text><rect x="943.94" y="223.54" width="30" height="20" fill="#fffefa"/><text x="958.94" y="238.54" font-size="16" text-anchor="middle" fill="#203c43">CH2</text><rect x="916.30" y="234.56" width="10" height="20" fill="#fffefa"/><text x="921.30" y="249.56" font-size="16" text-anchor="middle" fill="#203c43">O</text><rect x="875.24" y="232.21" width="10" height="20" fill="#fffefa"/><text x="880.24" y="247.21" font-size="16" text-anchor="middle" fill="#203c43">S</text><rect x="870.01" y="270.50" width="10" height="20" fill="#fffefa"/><text x="875.01" y="285.50" font-size="16" text-anchor="middle" fill="#203c43">O</text><rect x="837.64" y="240.45" width="10" height="20" fill="#fffefa"/><text x="842.64" y="255.45" font-size="16" text-anchor="middle" fill="#203c43">O</text><rect x="865.01" y="191.68" width="10" height="20" fill="#fffefa"/><text x="870.01" y="206.68" font-size="16" text-anchor="middle" fill="#203c43">C</text><rect x="833.10" y="162.15" width="20" height="20" fill="#fffefa"/><text x="843.10" y="177.15" font-size="16" text-anchor="middle" fill="#203c43">CH</text><rect x="835.63" y="123.66" width="20" height="20" fill="#fffefa"/><text x="845.63" y="138.66" font-size="16" text-anchor="middle" fill="#203c43">CH</text><rect x="872.83" y="101.97" width="10" height="20" fill="#fffefa"/><text x="877.83" y="116.97" font-size="16" text-anchor="middle" fill="#203c43">C</text><rect x="882.97" y="70.50" width="30" height="20" fill="#fffefa"/><text x="897.97" y="85.50" font-size="16" text-anchor="middle" fill="#203c43">CH3</text><rect x="895.65" y="127.30" width="20" height="20" fill="#fffefa"/><text x="905.65" y="142.30" font-size="16" text-anchor="middle" fill="#203c43">CH</text><rect x="887.01" y="163.89" width="20" height="20" fill="#fffefa"/><text x="897.01" y="178.89" font-size="16" text-anchor="middle" fill="#203c43">CH</text><text x="580" y="180" font-size="32" fill="#203c43">→</text><text x="25" y="330" font-size="15" fill="#203c43">Representative substrate/product connectivity; other reagents/byproducts are in the equation. No computed geometry.</text></g><g transform="translate(0,350)"><title>Alcohol tosylation: Bond-replacing displacement</title><desc>Et–O:H + p-MeC6H4–S(=O)2–Cl → Et–O+(H)–SO2–C6H4Me-p + Cl−. Alcohol oxygen attacks sulfur and chloride departs. Shown as a bond-replacing stage, without asserting a stable sulfurane.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="tosylation-1-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="tosylation-1-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Alcohol tosylation · 1</text><text x="24" y="65" font-size="17">Bond-replacing displacement</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">Et–</text><text x="68.64" y="155" font-size="24.00">O:H</text><text x="113.28" y="155" font-size="24.00"> + p-MeC6H4–</text><text x="291.84" y="155" font-size="24.00">S</text><text x="306.72" y="155" font-size="24.00">(=O)2–</text><text x="396.00" y="155" font-size="24.00">Cl</text><text x="665.00" y="155" font-size="24.00">Et–O+(H)–SO2–C6H4Me-p + Cl−</text><path data-electrons="2" d="M90.96,141.60 Q195.12,98.60 299.28,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#tosylation-1-pair)"/><path data-electrons="2" d="M355.08,141.60 Q382.98,203.60 410.88,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#tosylation-1-pair)"/><text x="24" y="235" font-size="16">Alcohol oxygen attacks sulfur and chloride departs. Shown as a bond-replacing stage, without asserting a</text><text x="24" y="258" font-size="16">stable sulfurane.</text></g></g><g transform="translate(0,640)"><title>Alcohol tosylation: Proton transfer</title><desc>Et–O+(Ts)–H + :pyridine → Et–OTs + pyridinium+. Pyridine removes the O-bound proton; the O–H pair returns to oxygen.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="tosylation-2-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="tosylation-2-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Alcohol tosylation · 2</text><text x="24" y="65" font-size="17">Proton transfer</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">Et–</text><text x="68.64" y="155" font-size="24.00">O+</text><text x="98.40" y="155" font-size="24.00">(Ts)–</text><text x="172.80" y="155" font-size="24.00">H</text><text x="187.68" y="155" font-size="24.00"> + </text><text x="232.32" y="155" font-size="24.00">:pyridine</text><text x="665.00" y="155" font-size="24.00">Et–OTs + pyridinium+</text><path data-electrons="2" d="M299.28,141.60 Q239.76,98.60 180.24,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#tosylation-2-pair)"/><path data-electrons="2" d="M131.88,141.60 Q107.70,203.60 83.52,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#tosylation-2-pair)"/><text x="24" y="235" font-size="16">Pyridine removes the O-bound proton; the O–H pair returns to oxygen.</text></g></g></svg>