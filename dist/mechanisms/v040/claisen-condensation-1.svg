<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" role="img"><title>Claisen ester condensation: Proton transfer</title><desc>EtO2C–CH2–H + :OEt− → EtO2CCH2− + EtOH. Ethoxide forms a low-equilibrium-concentration ester enolate.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="claisen-condensation-1-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="claisen-condensation-1-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">Claisen ester condensation · 1</text><text x="24" y="65" font-size="17">Proton transfer</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">EtO2C–</text><text x="113.28" y="155" font-size="24.00">CH2</text><text x="157.92" y="155" font-size="24.00">–</text><text x="172.80" y="155" font-size="24.00">H</text><text x="187.68" y="155" font-size="24.00"> + </text><text x="232.32" y="155" font-size="24.00">:OEt−</text><text x="665.00" y="155" font-size="24.00">EtO2CCH2− + EtOH</text><path data-electrons="2" d="M269.52,141.60 Q224.88,98.60 180.24,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#claisen-condensation-1-pair)"/><path data-electrons="2" d="M157.92,141.60 Q146.76,203.60 135.60,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#claisen-condensation-1-pair)"/><text x="24" y="235" font-size="16">Ethoxide forms a low-equilibrium-concentration ester enolate.</text></g></svg>