<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" role="img"><title>5-Hexenyl radical cyclization: 5-exo-trig ring closure</title><desc>•CH2–(CH2)3–CH=CH2 → Cyclopentyl–CH2•. Intramolecular radical addition forms the bond from radical C1 to alkene C5; the terminal carbon becomes an exocyclic radical.</desc><rect width="1200" height="290" fill="#fffefa"/><defs><marker id="radical-cyclization-4-pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e"/></marker><marker id="radical-cyclization-4-fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e"/></marker></defs><g fill="#203c43" font-family="DejaVu Sans Mono,monospace"><text x="24" y="32" font-size="21">5-Hexenyl radical cyclization · 4</text><text x="24" y="65" font-size="17">5-exo-trig ring closure</text><text x="585" y="155" font-size="28">→</text><text x="24.00" y="155" font-size="24.00">•CH2</text><text x="83.52" y="155" font-size="24.00">–(CH2)3–</text><text x="202.56" y="155" font-size="24.00">CH</text><text x="232.32" y="155" font-size="24.00">=</text><text x="247.20" y="155" font-size="24.00">CH2</text><text x="665.00" y="155" font-size="24.00">Cyclopentyl–CH2•</text><path data-electrons="1" d="M53.76,141.60 Q94.68,98.60 135.60,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#radical-cyclization-4-fish)"/><path data-electrons="1" d="M243.48,141.60 Q189.54,203.60 135.60,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#radical-cyclization-4-fish)"/><path data-electrons="1" d="M243.48,141.60 Q256.50,80.60 269.52,137.60" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#radical-cyclization-4-fish)"/><text x="24" y="235" font-size="16">Intramolecular radical addition forms the bond from radical C1 to alkene C5; the terminal carbon becomes an</text><text x="24" y="258" font-size="16">exocyclic radical.</text></g></svg>