<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 310" role="img" aria-label="lewis"><rect width="100%" height="100%" fill="#fffefa"/><defs><marker id="pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e" stroke-width="1.5"/></marker><marker id="fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e" stroke-width="1.5"/></marker></defs><g font-family="DejaVu Sans,sans-serif" fill="#203c43"><text x="28" y="34" font-size="21">Ammonia + boron trifluoride: Lewis association</text><text x="125" y="124" font-size="24">H₃N:</text><text x="415" y="124" font-size="24">BF₃</text><path d="M194 105 C249 39 365 45 421 102" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#pair)"/><text x="237" y="205" font-size="28">⇌  H₃N⁺–BF₃⁻</text><text x="28" y="272" font-size="18">N donates its lone pair to B. The adduct is neutral overall.</text></g></svg>