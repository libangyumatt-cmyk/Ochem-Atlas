<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-label="Imine formation: acetone + methylamine · Iminium deprotonation"><title>Imine formation: acetone + methylamine · Iminium deprotonation</title><desc>Exact selected teaching stage extracted from the complete original mechanism sheet.</desc><rect width="1200" height="360" fill="#fffefa"/><defs><marker id="pair" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L10 6L1 11" fill="none" stroke="#aa6a4e" stroke-width="1.7"/></marker></defs><g font-family="DejaVu Sans,Arial,sans-serif"><text x="32" y="43" font-size="25" fill="#203c43" font-weight="bold">Imine formation: acetone + methylamine · stage 6</text><text x="32" y="77" font-size="17" fill="#203c43" font-weight="normal">Focused stage from the complete pathway; see overview for continuity.</text><g transform="translate(0,-1125)"><rect x="25" y="1240" width="1150" height="216" rx="12" fill="#faf8f2"/><text x="45" y="1271" font-size="19" fill="#203c43" font-weight="bold">06  Iminium deprotonation</text><text x="45" y="1316" font-size="19" fill="#203c43" font-weight="normal">(CH₃)₂C=N⁺(H)CH₃ + H₂O</text><text x="605" y="1316" font-size="19" fill="#203c43" font-weight="normal">→  (CH₃)₂C=NCH₃ + H₃O⁺</text><text x="45" y="1347" font-size="15" fill="#203c43" font-weight="normal">Acid is regenerated. Two identical acetone methyl groups give no E/Z isomers.</text><text x="51.0" y="1383" font-size="13" fill="#203c43" font-weight="normal">n(H₂O)</text><path d="M66.0 1393 C95.0 1404 141.0 1405 159.0 1420" fill="none" stroke="#aa6a4e" stroke-width="2.8" marker-end="url(#pair)"/><text x="139.0" y="1442" font-size="13" fill="#203c43" font-weight="normal">iminium N–H</text><text x="596.0" y="1383" font-size="13" fill="#203c43" font-weight="normal">N–H bond</text><path d="M611.0 1393 C640.0 1404 686.0 1405 704.0 1420" fill="none" stroke="#aa6a4e" stroke-width="2.8" marker-end="url(#pair)"/><text x="684.0" y="1442" font-size="13" fill="#203c43" font-weight="normal">imine N</text></g></g></svg>