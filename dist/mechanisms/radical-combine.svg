<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 325" role="img" aria-label="radical-combine"><rect width="100%" height="100%" fill="#fffefa"/><defs><marker id="pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e" stroke-width="1.5"/></marker><marker id="fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e" stroke-width="1.5"/></marker></defs><g font-family="DejaVu Sans,sans-serif" fill="#203c43"><text x="28" y="34" font-size="21">Methyl-radical recombination</text><text x="164" y="137" font-size="24">CH₃•</text><text x="478" y="137" font-size="24">•CH₃</text><path d="M223 117 C246 56 315 53 352 119" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#fish)"/><path d="M485 117 C462 56 397 53 363 119" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#fish)"/><text x="222" y="207" font-size="28">→  CH₃–CH₃</text><text x="28" y="268" font-size="18">Each fishhook carries one electron to the new C–C bond.</text><text x="28" y="293" font-size="16">A spin-compatible radical pair forms closed-shell ethane.</text></g></svg>