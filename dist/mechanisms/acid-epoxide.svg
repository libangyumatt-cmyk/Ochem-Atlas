<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 610" role="img" aria-label="acid-epoxide"><rect width="100%" height="100%" fill="#fffefa"/><defs><marker id="pair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#aa6a4e" stroke-width="1.5"/></marker><marker id="fish" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5" fill="none" stroke="#aa6a4e" stroke-width="1.5"/></marker></defs><g font-family="DejaVu Sans,sans-serif" fill="#203c43"><text x="28" y="32" font-size="21">Propylene oxide + HCl: major HCl/ether pathway</text><text x="28" y="73" font-size="18">1  Protonation</text><text x="85" y="233" font-size="24">CH₃–CH</text><text x="270" y="233" font-size="24">CH₂</text><text x="211" y="137" font-size="23">:O:</text><path d="M195 224H263" fill="none" stroke="#203c43" stroke-width="2.3"/><path d="M177 204L217 155" fill="none" stroke="#203c43" stroke-width="2.3"/><path d="M273 204L245 155" fill="none" stroke="#203c43" stroke-width="2.3"/><text x="423" y="138" font-size="24">H</text><text x="534" y="138" font-size="24">Cl</text><path d="M448 130H528" fill="none" stroke="#203c43" stroke-width="2.3"/><path d="M233 110 C288 59 377 67 426 114" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#pair)"/><path d="M486 126 C503 77 551 81 548 111" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#pair)"/><text x="636" y="174" font-size="18">Protonated epoxide</text><text x="659" y="204" font-size="23">+ Cl⁻</text><path d="M577 170H621" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#pair)"/><text x="28" y="296" font-size="18">2  Backside opening at the primary carbon</text><text x="90" y="468" font-size="24">CH₃–CH</text><text x="275" y="468" font-size="24">CH₂</text><text x="216" y="372" font-size="23">O⁺H</text><path d="M200 459H268" fill="none" stroke="#203c43" stroke-width="2.3"/><path d="M182 439L222 390" fill="none" stroke="#203c43" stroke-width="2.3"/><path d="M278 439L250 390" fill="none" stroke="#203c43" stroke-width="2.3"/><text x="449" y="456" font-size="24">:Cl⁻</text><path d="M451 435 C404 367 338 380 313 438" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#pair)"/><path d="M270 418 C315 366 284 339 251 361" fill="none" stroke="#aa6a4e" stroke-width="2.3" marker-end="url(#pair)"/><text x="520" y="501" font-size="25">→  ClCH₂CH(OH)CH₃</text><text x="28" y="548" font-size="18">C–O cleavage neutralizes oxygen directly; no third deprotonation step.</text><text x="28" y="579" font-size="16">The primary carbon is achiral. The secondary carbon retains its C–O bond.</text></g></svg>