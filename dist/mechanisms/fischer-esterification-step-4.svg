<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-label="Fischer esterification: acetic acid + ethanol · Tetrahedral collapse"><title>Fischer esterification: acetic acid + ethanol · Tetrahedral collapse</title><desc>Exact selected teaching stage extracted from the complete original mechanism sheet.</desc><rect width="1200" height="360" fill="#fffefa"/><defs><marker id="pair" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L10 6L1 11" fill="none" stroke="#aa6a4e" stroke-width="1.7"/></marker></defs><g font-family="DejaVu Sans,Arial,sans-serif"><text x="32" y="43" font-size="25" fill="#203c43" font-weight="bold">Fischer esterification: acetic acid + ethanol · stage 4</text><text x="32" y="77" font-size="17" fill="#203c43" font-weight="normal">Focused stage from the complete pathway; see overview for continuity.</text><g transform="translate(0,-675)"><rect x="25" y="790" width="1150" height="216" rx="12" fill="#faf8f2"/><text x="45" y="821" font-size="19" fill="#203c43" font-weight="bold">04  Tetrahedral collapse</text><text x="45" y="866" font-size="19" fill="#203c43" font-weight="normal">CH₃C(OH)(OH₂⁺)(OCH₂CH₃)</text><text x="605" y="866" font-size="19" fill="#203c43" font-weight="normal">→  CH₃C(=OH⁺)OCH₂CH₃ + H₂O</text><text x="45" y="897" font-size="15" fill="#203c43" font-weight="normal">Water leaves; the original carbonyl O forms the protonated ester carbonyl.</text><text x="51.0" y="933" font-size="13" fill="#203c43" font-weight="normal">n(original carbonyl OH)</text><path d="M66.0 943 C95.0 954 141.0 955 159.0 970" fill="none" stroke="#aa6a4e" stroke-width="2.8" marker-end="url(#pair)"/><text x="139.0" y="992" font-size="13" fill="#203c43" font-weight="normal">π(C=O)</text><text x="596.0" y="933" font-size="13" fill="#203c43" font-weight="normal">C–OH₂⁺ bond</text><path d="M611.0 943 C640.0 954 686.0 955 704.0 970" fill="none" stroke="#aa6a4e" stroke-width="2.8" marker-end="url(#pair)"/><text x="684.0" y="992" font-size="13" fill="#203c43" font-weight="normal">departing H₂O O</text></g></g></svg>