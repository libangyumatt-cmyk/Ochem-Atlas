<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1535" role="img" aria-label="Imine formation: acetone + methylamine"><title>Imine formation: acetone + methylamine</title><desc>Complete teaching pathway, with charges and individual electron-pair moves explicitly traced in each row.</desc><rect width="1200" height="1535" fill="#fffefa"/><defs><marker id="pair" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L10 6L1 11" fill="none" stroke="#aa6a4e" stroke-width="1.7"/></marker></defs><g font-family="DejaVu Sans,Arial,sans-serif"><text x="32" y="43" font-size="26" fill="#203c43" font-weight="bold">Imine formation: acetone + methylamine</text><text x="32" y="77" font-size="21" fill="#203c43" font-weight="normal">(CH₃)₂C=O + CH₃NH₂ ⇌ (CH₃)₂C=NCH₃ + H₂O  (mild H₃O⁺)</text><rect x="25" y="115" width="1150" height="216" rx="12" fill="#f5f5ee"/><text x="45" y="146" font-size="19" fill="#203c43" font-weight="bold">01  Carbonyl O protonation</text><text x="45" y="191" font-size="19" fill="#203c43" font-weight="normal">(CH₃)₂C=O + H₃O⁺</text><text x="605" y="191" font-size="19" fill="#203c43" font-weight="normal">→  (CH₃)₂C=OH⁺ + H₂O</text><text x="45" y="222" font-size="15" fill="#203c43" font-weight="normal">The O-protonated ketone is more electrophilic; free amine must remain available.</text><text x="51.0" y="258" font-size="13" fill="#203c43" font-weight="normal">n(carbonyl O)</text><path d="M66.0 268 C95.0 279 141.0 280 159.0 295" fill="none" stroke="#aa6a4e" stroke-width="2.8" marker-end="url(#pair)"/><text x="139.0" y="317" font-size="13" fill="#203c43" font-weight="normal">H of H₃O⁺</text><text x="596.0" y="258" font-size="13" fill="#203c43" font-weight="normal">O–H bond of H₃O⁺</text><path d="M611.0 268 C640.0 279 686.0 280 704.0 295" fill="none" stroke="#aa6a4e" stroke-width="2.8" marker-end="url(#pair)"/><text x="684.0" y="317" font-size="13" fill="#203c43" font-weight="normal">water O</text><rect x="25" y="340" width="1150" height="216" rx="12" fill="#faf8f2"/><text x="45" y="371" font-size="19" fill="#203c43" font-weight="bold">02  Methylamine addition</text><text x="45" y="416" font-size="19" fill="#203c43" font-weight="normal">(CH₃)₂C=OH⁺ + CH₃NH₂</text><text x="605" y="416" font-size="19" fill="#203c43" font-weight="normal">→  (CH₃)₂C(OH)(N⁺H₂CH₃)</text><text x="45" y="447" font-size="15" fill="#203c43" font-weight="normal">Carbinolammonium: N has four bonds and +1; O is neutral OH.</text><text x="51.0" y="483" font-size="13" fill="#203c43" font-weight="normal">n(amine N)</text><path d="M66.0 493 C95.0 504 141.0 505 159.0 520" fill="none" stroke="#aa6a4e" stroke-width="2.8" marker-end="url(#pair)"/><text x="139.0" y="542" font-size="13" fill="#203c43" font-weight="normal">carbonyl C</text><text x="596.0" y="483" font-size="13" fill="#203c43" font-weight="normal">π(C=O)</text><path d="M611.0 493 C640.0 504 686.0 505 704.0 520" fill="none" stroke="#aa6a4e" stroke-width="2.8" marker-end="url(#pair)"/><text x="684.0" y="542" font-size="13" fill="#203c43" font-weight="normal">former carbonyl O</text><rect x="25" y="565" width="1150" height="216" rx="12" fill="#f5f5ee"/><text x="45" y="596" font-size="19" fill="#203c43" font-weight="bold">03  N deprotonation</text><text x="45" y="641" font-size="19" fill="#203c43" font-weight="normal">(CH₃)₂C(OH)(N⁺H₂CH₃) + H₂O</text><text x="605" y="641" font-size="19" fill="#203c43" font-weight="normal">→  (CH₃)₂C(OH)(NHCH₃) + H₃O⁺</text><text x="45" y="672" font-size="15" fill="#203c43" font-weight="normal">Neutral carbinolamine has one N–H bond.</text><text x="51.0" y="708" font-size="13" fill="#203c43" font-weight="normal">n(H₂O)</text><path d="M66.0 718 C95.0 729 141.0 730 159.0 745" fill="none" stroke="#aa6a4e" stroke-width="2.8" marker-end="url(#pair)"/><text x="139.0" y="767" font-size="13" fill="#203c43" font-weight="normal">H of N⁺H₂</text><text x="596.0" y="708" font-size="13" fill="#203c43" font-weight="normal">N–H bond</text><path d="M611.0 718 C640.0 729 686.0 730 704.0 745" fill="none" stroke="#aa6a4e" stroke-width="2.8" marker-end="url(#pair)"/><text x="684.0" y="767" font-size="13" fill="#203c43" font-weight="normal">amine N</text><rect x="25" y="790" width="1150" height="216" rx="12" fill="#faf8f2"/><text x="45" y="821" font-size="19" fill="#203c43" font-weight="bold">04  OH activation</text><text x="45" y="866" font-size="19" fill="#203c43" font-weight="normal">(CH₃)₂C(OH)(NHCH₃) + H₃O⁺</text><text x="605" y="866" font-size="19" fill="#203c43" font-weight="normal">→  (CH₃)₂C(OH₂⁺)(NHCH₃) + H₂O</text><text x="45" y="897" font-size="15" fill="#203c43" font-weight="normal">Protonation creates the H₂O leaving group; the N lone pair remains available.</text><text x="51.0" y="933" font-size="13" fill="#203c43" font-weight="normal">n(carbinolamine O)</text><path d="M66.0 943 C95.0 954 141.0 955 159.0 970" fill="none" stroke="#aa6a4e" stroke-width="2.8" marker-end="url(#pair)"/><text x="139.0" y="992" font-size="13" fill="#203c43" font-weight="normal">H of H₃O⁺</text><text x="596.0" y="933" font-size="13" fill="#203c43" font-weight="normal">O–H bond of H₃O⁺</text><path d="M611.0 943 C640.0 954 686.0 955 704.0 970" fill="none" stroke="#aa6a4e" stroke-width="2.8" marker-end="url(#pair)"/><text x="684.0" y="992" font-size="13" fill="#203c43" font-weight="normal">water O</text><rect x="25" y="1015" width="1150" height="216" rx="12" fill="#f5f5ee"/><text x="45" y="1046" font-size="19" fill="#203c43" font-weight="bold">05  Dehydration / iminium</text><text x="45" y="1091" font-size="19" fill="#203c43" font-weight="normal">(CH₃)₂C(OH₂⁺)(NHCH₃)</text><text x="605" y="1091" font-size="19" fill="#203c43" font-weight="normal">→  (CH₃)₂C=N⁺(H)CH₃ + H₂O</text><text x="45" y="1122" font-size="15" fill="#203c43" font-weight="normal">N becomes positively charged on making the second C–N bond.</text><text x="51.0" y="1158" font-size="13" fill="#203c43" font-weight="normal">n(N)</text><path d="M66.0 1168 C95.0 1179 141.0 1180 159.0 1195" fill="none" stroke="#aa6a4e" stroke-width="2.8" marker-end="url(#pair)"/><text x="139.0" y="1217" font-size="13" fill="#203c43" font-weight="normal">π(C=N)</text><text x="596.0" y="1158" font-size="13" fill="#203c43" font-weight="normal">C–OH₂⁺ bond</text><path d="M611.0 1168 C640.0 1179 686.0 1180 704.0 1195" fill="none" stroke="#aa6a4e" stroke-width="2.8" marker-end="url(#pair)"/><text x="684.0" y="1217" font-size="13" fill="#203c43" font-weight="normal">departing H₂O O</text><rect x="25" y="1240" width="1150" height="216" rx="12" fill="#faf8f2"/><text x="45" y="1271" font-size="19" fill="#203c43" font-weight="bold">06  Iminium deprotonation</text><text x="45" y="1316" font-size="19" fill="#203c43" font-weight="normal">(CH₃)₂C=N⁺(H)CH₃ + H₂O</text><text x="605" y="1316" font-size="19" fill="#203c43" font-weight="normal">→  (CH₃)₂C=NCH₃ + H₃O⁺</text><text x="45" y="1347" font-size="15" fill="#203c43" font-weight="normal">Acid is regenerated. Two identical acetone methyl groups give no E/Z isomers.</text><text x="51.0" y="1383" font-size="13" fill="#203c43" font-weight="normal">n(H₂O)</text><path d="M66.0 1393 C95.0 1404 141.0 1405 159.0 1420" fill="none" stroke="#aa6a4e" stroke-width="2.8" marker-end="url(#pair)"/><text x="139.0" y="1442" font-size="13" fill="#203c43" font-weight="normal">iminium N–H</text><text x="596.0" y="1383" font-size="13" fill="#203c43" font-weight="normal">N–H bond</text><path d="M611.0 1393 C640.0 1404 686.0 1405 704.0 1420" fill="none" stroke="#aa6a4e" stroke-width="2.8" marker-end="url(#pair)"/><text x="684.0" y="1442" font-size="13" fill="#203c43" font-weight="normal">imine N</text><text x="39" y="1496" font-size="17" fill="#203c43" font-weight="normal">1113 for C=N formation is a provisional SORG analogy; no codebook definition is altered.</text></g></svg>