<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-label="Imine formation: acetone + methylamine · Carbonyl O protonation"><title>Imine formation: acetone + methylamine · Carbonyl O protonation</title><desc>Exact selected teaching stage extracted from the complete original mechanism sheet.</desc><rect width="1200" height="360" fill="#fffefa"/><defs><marker id="pair" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L10 6L1 11" fill="none" stroke="#aa6a4e" stroke-width="1.7"/></marker></defs><g font-family="DejaVu Sans,Arial,sans-serif"><text x="32" y="43" font-size="25" fill="#203c43" font-weight="bold">Imine formation: acetone + methylamine · stage 1</text><text x="32" y="77" font-size="17" fill="#203c43" font-weight="normal">Focused stage from the complete pathway; see overview for continuity.</text><g transform="translate(0,-0)"><rect x="25" y="115" width="1150" height="216" rx="12" fill="#f5f5ee"/><text x="45" y="146" font-size="19" fill="#203c43" font-weight="bold">01  Carbonyl O protonation</text><text x="45" y="191" font-size="19" fill="#203c43" font-weight="normal">(CH₃)₂C=O + H₃O⁺</text><text x="605" y="191" font-size="19" fill="#203c43" font-weight="normal">→  (CH₃)₂C=OH⁺ + H₂O</text><text x="45" y="222" font-size="15" fill="#203c43" font-weight="normal">The O-protonated ketone is more electrophilic; free amine must remain available.</text><text x="51.0" y="258" font-size="13" fill="#203c43" font-weight="normal">n(carbonyl O)</text><path d="M66.0 268 C95.0 279 141.0 280 159.0 295" fill="none" stroke="#aa6a4e" stroke-width="2.8" marker-end="url(#pair)"/><text x="139.0" y="317" font-size="13" fill="#203c43" font-weight="normal">H of H₃O⁺</text><text x="596.0" y="258" font-size="13" fill="#203c43" font-weight="normal">O–H bond of H₃O⁺</text><path d="M611.0 268 C640.0 279 686.0 280 704.0 295" fill="none" stroke="#aa6a4e" stroke-width="2.8" marker-end="url(#pair)"/><text x="684.0" y="317" font-size="13" fill="#203c43" font-weight="normal">water O</text></g></g></svg>