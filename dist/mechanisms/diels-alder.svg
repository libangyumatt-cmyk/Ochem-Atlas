<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-label="Exact butadiene and ethene cycloaddition"><title>Exact butadiene and ethene cycloaddition</title><desc>One six-electron concerted event. Three cyclic electron-pair arrows give cyclohexene.</desc><rect width="1200" height="520" fill="#fffefa"/><defs><marker id="pair" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L10 6L1 11" fill="none" stroke="#aa6a4e" stroke-width="1.7"/></marker></defs><g font-family="DejaVu Sans,Arial,sans-serif"><text x="35" y="45" font-size="26" fill="#203c43" font-weight="bold">Thermal [4+2]: s-cis 1,3-butadiene + ethene → cyclohexene</text><text x="45" y="96" font-size="21" fill="#203c43" font-weight="normal">Diene</text><text x="200" y="385" font-size="19" fill="#203c43" font-weight="normal">Ethene dienophile</text><text x="917" y="96" font-size="21" fill="#203c43" font-weight="normal">Product</text><path d="M122 220L205 165" stroke="#203c43" stroke-width="2.7" fill="none"/><path d="M205 165L305 165" stroke="#203c43" stroke-width="2.7" fill="none"/><path d="M305 165L388 220" stroke="#203c43" stroke-width="2.7" fill="none"/><path d="M305 310L205 310" stroke="#203c43" stroke-width="2.7" fill="none"/><path d="M132 232L215 177" stroke="#203c43" stroke-width="2" fill="none"/><path d="M295 177L378 232" stroke="#203c43" stroke-width="2" fill="none"/><path d="M305 301L205 301" stroke="#203c43" stroke-width="2" fill="none"/><text x="58" y="226" font-size="17" fill="#203c43" font-weight="normal">C1H₂</text><text x="181" y="147" font-size="17" fill="#203c43" font-weight="normal">C2H</text><text x="291" y="147" font-size="17" fill="#203c43" font-weight="normal">C3H</text><text x="396" y="226" font-size="17" fill="#203c43" font-weight="normal">C4H₂</text><text x="175" y="343" font-size="17" fill="#203c43" font-weight="normal">C6H₂</text><text x="292" y="343" font-size="17" fill="#203c43" font-weight="normal">C5H₂</text><path d="M388 220L305 310" stroke="#203c43" stroke-width="1.7" fill="none" stroke-dasharray="6 6"/><path d="M205 310L122 220" stroke="#203c43" stroke-width="1.7" fill="none" stroke-dasharray="6 6"/><path d="M158 196 C103 184 77 221 158 265" fill="none" stroke="#aa6a4e" stroke-width="2.8" marker-end="url(#pair)"/><path d="M340 194 C352 251 273 240 257 186" fill="none" stroke="#aa6a4e" stroke-width="2.8" marker-end="url(#pair)"/><path d="M257 300 C294 266 337 250 353 258" fill="none" stroke="#aa6a4e" stroke-width="2.8" marker-end="url(#pair)"/><text x="488" y="270" font-size="45" fill="#203c43" font-weight="normal">→</text><path d="M702 220L785 165" stroke="#203c43" stroke-width="2.7" fill="none"/><path d="M785 165L885 165" stroke="#203c43" stroke-width="2.7" fill="none"/><path d="M885 165L968 220" stroke="#203c43" stroke-width="2.7" fill="none"/><path d="M968 220L885 310" stroke="#203c43" stroke-width="2.7" fill="none"/><path d="M885 310L785 310" stroke="#203c43" stroke-width="2.7" fill="none"/><path d="M785 310L702 220" stroke="#203c43" stroke-width="2.7" fill="none"/><path d="M785 176L885 176" stroke="#203c43" stroke-width="2" fill="none"/><text x="667" y="212" font-size="16" fill="#203c43" font-weight="normal">C1</text><text x="772" y="145" font-size="16" fill="#203c43" font-weight="normal">C2</text><text x="887" y="145" font-size="16" fill="#203c43" font-weight="normal">C3</text><text x="979" y="212" font-size="16" fill="#203c43" font-weight="normal">C4</text><text x="896" y="335" font-size="16" fill="#203c43" font-weight="normal">C5</text><text x="752" y="335" font-size="16" fill="#203c43" font-weight="normal">C6</text><text x="48" y="423" font-size="19" fill="#203c43" font-weight="normal">Three cyclic pair arrows: C1=C2 → C1–C6; C5=C6 → C4–C5; C3=C4 → C2=C3.</text><text x="48" y="459" font-size="17" fill="#203c43" font-weight="normal">Dashes mark forming bonds, not a stepwise intermediate. This unsubstituted model has no stereocenters.</text><text x="48" y="486" font-size="17" fill="#203c43" font-weight="normal">Both components engage suprafacially; an s-cis diene arrangement brings its termini together.</text></g></svg>