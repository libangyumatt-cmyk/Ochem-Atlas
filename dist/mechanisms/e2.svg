<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 410" role="img" aria-label="Exact E2 elimination of 2-bromopropane by ethoxide"><title>Exact E2 elimination of 2-bromopropane by ethoxide</title><desc>Three concerted electron-pair arrows form propene, ethanol and bromide. Anti alignment is shown.</desc><rect width="1200" height="410" fill="#fffefa"/><defs><marker id="pair" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L10 6L1 11" fill="none" stroke="#aa6a4e" stroke-width="1.7"/></marker></defs><g font-family="DejaVu Sans,Arial,sans-serif"><text x="34" y="42" font-size="25" fill="#203c43" font-weight="bold">E2: 2-bromopropane + ethoxide → propene + ethanol + bromide</text><text x="38" y="88" font-size="20" fill="#203c43" font-weight="normal">One concerted event · anti β-H and Br · no carbocation</text><text x="279" y="184" font-size="26" fill="#203c43" font-weight="normal">CβH₂</text><text x="483" y="184" font-size="26" fill="#203c43" font-weight="normal">CαH</text><text x="680" y="184" font-size="25" fill="#203c43" font-weight="normal">CH₃</text><path d="M363 173L474 173" stroke="#203c43" stroke-width="2.7" fill="none"/><path d="M535 173L672 173" stroke="#203c43" stroke-width="2.7" fill="none"/><text x="289" y="112" font-size="25" fill="#203c43" font-weight="normal">Hβ</text><path d="M328 123L328 150" stroke="#203c43" stroke-width="2.7" fill="none"/><text x="480" y="246" font-size="25" fill="#203c43" font-weight="normal">Br</text><path d="M510 191L510 218" stroke="#203c43" stroke-width="2.7" fill="none"/><text x="35" y="293" font-size="25" fill="#203c43" font-weight="normal">:OEt⁻</text><path d="M118 270 C124 176 198 100 290 105" fill="none" stroke="#aa6a4e" stroke-width="2.8" marker-end="url(#pair)"/><path d="M327 137 C369 80 422 91 447 159" fill="none" stroke="#aa6a4e" stroke-width="2.8" marker-end="url(#pair)"/><path d="M511 198 C582 249 582 284 512 282" fill="none" stroke="#aa6a4e" stroke-width="2.8" marker-end="url(#pair)"/><text x="529" y="292" font-size="23" fill="#203c43" font-weight="normal">Br</text><text x="780" y="184" font-size="26" fill="#203c43" font-weight="normal">→  CH₂=CHCH₃</text><text x="782" y="226" font-size="24" fill="#203c43" font-weight="normal">+ EtOH + Br⁻</text><text x="35" y="343" font-size="19" fill="#203c43" font-weight="normal">Curved arrows: O lone pair → Hβ; Cβ–H pair → Cβ=Cα; Cα–Br pair → Br.</text><text x="35" y="378" font-size="18" fill="#203c43" font-weight="normal">CβH₂ plus the displayed Hβ is a methyl group; Hβ–Cβ–Cα–Br is anti-periplanar.</text></g></svg>