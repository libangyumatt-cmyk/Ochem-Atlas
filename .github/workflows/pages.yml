name: Deploy SORG to GitHub Pages
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deterministic 2D chemical depiction dependency
        run: python -m pip install rdkit==2026.9.1
      - name: Regenerate reaction data
        run: python3 build_data.py
      - name: Build reaction-system adapters
        run: python3 build_reaction_systems.py
      - name: Validate and build research evidence
        run: python3 build_research.py
      - name: Install test dependencies
        run: npm ci --ignore-scripts
      - name: Bundle Three.js core module required by the orbital viewer
        run: cp node_modules/three/build/three.core.js dist/vendor/three.core.js
      - name: Verify data and DOM interactions
        run: npm test
      - name: Package downloadable source
        run: python3 package_source.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
